api.doc.swagger.definitions.xml_ns5_ContentConstraintAttachmentType.description                                    = ContentConstraintAttachmentType defines the structure for specifying the target object(s) of a content constraint.<p>Java class for ContentConstraintAttachmentType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="ContentConstraintAttachmentType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}ConstraintAttachmentType">       &lt;choice>         &lt;element name="DataProvider" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}DataProviderReferenceType"/>         &lt;element name="DataSet" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}SetReferenceType"/>         &lt;element name="MetadataSet" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}SetReferenceType"/>         &lt;element name="SimpleDataSource" type="{http://www.w3.org/2001/XMLSchema}anyURI"/>         &lt;choice>           &lt;sequence>             &lt;element name="DataStructure" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}DataStructureReferenceType" maxOccurs="unbounded"/>             &lt;element name="QueryableDataSource" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}QueryableDataSourceType" maxOccurs="unbounded" minOccurs="0"/>           &lt;/sequence>           &lt;sequence>             &lt;element name="MetadataStructure" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}MetadataStructureReferenceType" maxOccurs="unbounded"/>             &lt;element name="QueryableDataSource" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}QueryableDataSourceType" maxOccurs="unbounded" minOccurs="0"/>           &lt;/sequence>           &lt;sequence>             &lt;element name="Dataflow" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}DataflowReferenceType" maxOccurs="unbounded"/>             &lt;element name="QueryableDataSource" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}QueryableDataSourceType" maxOccurs="unbounded" minOccurs="0"/>           &lt;/sequence>           &lt;sequence>             &lt;element name="Metadataflow" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}MetadataflowReferenceType" maxOccurs="unbounded"/>             &lt;element name="QueryableDataSource" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}QueryableDataSourceType" maxOccurs="unbounded" minOccurs="0"/>           &lt;/sequence>           &lt;sequence>             &lt;element name="ProvisionAgreement" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ProvisionAgreementReferenceType" maxOccurs="unbounded"/>             &lt;element name="QueryableDataSource" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}QueryableDataSourceType" maxOccurs="unbounded" minOccurs="0"/>           &lt;/sequence>         &lt;/choice>       &lt;/choice>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_ContentConstraintBaseType.description                                          = ContentConstraintBaseType is an abstract base type that forms the basis for the ContentConstraintType.<p>Java class for ContentConstraintBaseType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="ContentConstraintBaseType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}ConstraintType">       &lt;sequence>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Annotations" minOccurs="0"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Name" maxOccurs="unbounded"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Description" maxOccurs="unbounded" minOccurs="0"/>         &lt;element name="ConstraintAttachment" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}ContentConstraintAttachmentType" minOccurs="0"/>         &lt;choice maxOccurs="unbounded" minOccurs="0">           &lt;element name="DataKeySet" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}DataKeySetType"/>           &lt;element name="MetadataKeySet" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}MetadataKeySetType"/>           &lt;element name="CubeRegion" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}CubeRegionType"/>           &lt;element name="MetadataTargetRegion" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}MetadataTargetRegionType"/>         &lt;/choice>       &lt;/sequence>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_ContentConstraintType.description                                              = ContentConstraintType describes the details of a content constraint by defining the content regions, key sets, or release information for the constraint attachment objects. Note that if the constraint is for a data provider, then only release calendar information is relevant, as there is no reliable way of determining which key family is being used to frame constraints in terms of cube regions or key sets.<p>Java class for ContentConstraintType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="ContentConstraintType">   &lt;complexContent>     &lt;extension base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}ContentConstraintBaseType">       &lt;sequence>         &lt;element name="ReleaseCalendar" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}ReleaseCalendarType" minOccurs="0"/>         &lt;element name="ReferencePeriod" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ReferencePeriodType" minOccurs="0"/>       &lt;/sequence>       &lt;attribute name="type" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ContentConstraintTypeCodeType" default="Actual" />     &lt;/extension>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_ContentConstraintType.properties.ReferencePeriod.description                   = .
api.doc.swagger.definitions.xml_ns5_ContentConstraintType.properties.ReleaseCalendar.description                   = .
api.doc.swagger.definitions.xml_ns5_ContentConstraintType.properties.type.description                              = .
api.doc.swagger.definitions.xml_ns5_DataConsumerSchemeType.description                                             = DataConsumerSchemeType defines a type of organisation scheme which contains only data consumers. The data consumer scheme maintained by a particular maintenance agency is always provided a fixed identifier and version, and is never final. Therefore, consumers can be added or removed without have to version the scheme. This scheme has no hierarchy, meaning that no organisation may define a relationship with another organisation in the scheme.<p>Java class for DataConsumerSchemeType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="DataConsumerSchemeType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}OrganisationSchemeType">       &lt;sequence>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Annotations" minOccurs="0"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Name" maxOccurs="unbounded"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Description" maxOccurs="unbounded" minOccurs="0"/>         &lt;sequence maxOccurs="unbounded" minOccurs="0">           &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}DataConsumer"/>         &lt;/sequence>       &lt;/sequence>       &lt;attribute name="id" use="required" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}IDType" fixed="DATA_CONSUMERS" />       &lt;attribute name="version" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}VersionType" fixed="1.0" />       &lt;attribute name="isFinal" type="{http://www.w3.org/2001/XMLSchema}boolean" fixed="false" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_DataConsumerType.description                                                   = DataConsumerType defines the structure of a data consumer description. The contacts defined for the organisation are specific to the data consumer role the organisation is serving.<p>Java class for DataConsumerType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="DataConsumerType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}OrganisationType">       &lt;sequence>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Annotations" minOccurs="0"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Name" maxOccurs="unbounded"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Description" maxOccurs="unbounded" minOccurs="0"/>         &lt;element name="Contact" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}ContactType" maxOccurs="unbounded" minOccurs="0"/>       &lt;/sequence>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_DataKeySetType.description                                                     = DataKeySetType defines a collection of full or partial data keys (dimension values).<p>Java class for DataKeySetType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="DataKeySetType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}KeySetType">       &lt;sequence>         &lt;element name="Key" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}DataKeyType" maxOccurs="unbounded"/>       &lt;/sequence>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_DataProviderSchemeType.description                                             = DataProviderSchemeType defines a type of organisation scheme which contains only data providers. The data provider scheme maintained by a particular maintenance agency is always provided a fixed identifier and version, and is never final. Therefore, providers can be added or removed without have to version the scheme. This scheme has no hierarchy, meaning that no organisation may define a relationship with another organisation in the scheme<p>Java class for DataProviderSchemeType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="DataProviderSchemeType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}OrganisationSchemeType">       &lt;sequence>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Annotations" minOccurs="0"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Name" maxOccurs="unbounded"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Description" maxOccurs="unbounded" minOccurs="0"/>         &lt;sequence maxOccurs="unbounded" minOccurs="0">           &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}DataProvider"/>         &lt;/sequence>       &lt;/sequence>       &lt;attribute name="id" use="required" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}IDType" fixed="DATA_PROVIDERS" />       &lt;attribute name="version" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}VersionType" fixed="1.0" />       &lt;attribute name="isFinal" type="{http://www.w3.org/2001/XMLSchema}boolean" fixed="false" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_DataProviderType.description                                                   = DataProviderType defines the structure of a data provider description. The contacts defined for the organisation are specific to the data provider role the organisation is serving.<p>Java class for DataProviderType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="DataProviderType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}OrganisationType">       &lt;sequence>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Annotations" minOccurs="0"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Name" maxOccurs="unbounded"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Description" maxOccurs="unbounded" minOccurs="0"/>         &lt;element name="Contact" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}ContactType" maxOccurs="unbounded" minOccurs="0"/>       &lt;/sequence>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_DataSetRepresentationType.description                                          = DataSetRepresentationType defines the possible local representations of a data set reference target object. The representation is fixed to always be a data set reference.<p>Java class for DataSetRepresentationType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="DataSetRepresentationType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}RepresentationType">       &lt;sequence>         &lt;element name="TextFormat" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}DataSetTextFormatType"/>       &lt;/sequence>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_DataSetTargetType.description                                                  = DataSetTargetType defines the structure of a data set target object. The data set target object has a fixed representation and identifier.<p>Java class for DataSetTargetType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="DataSetTargetType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}TargetObject">       &lt;sequence>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Annotations" minOccurs="0"/>         &lt;element name="LocalRepresentation" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}DataSetRepresentationType"/>       &lt;/sequence>       &lt;attribute name="id" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}NCNameIDType" fixed="DATA_SET_TARGET" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_DataSetTextFormatType.description                                              = DataSetTextFormatType is a restricted version of the NonFacetedTextFormatType that specifies a fixed DataSetReference representation.<p>Java class for DataSetTextFormatType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="DataSetTextFormatType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}TargetObjectTextFormatType">       &lt;attribute name="textType" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}TargetObjectDataType" fixed="DataSetReference" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_DataStructureRepresentationType.description                                    = DataStructureRepresentationType is an abstract base type which defines the allowable representations for any data structure definition component. The enumeration must be restricted to the proper type for item scheme for a given component.<p>Java class for DataStructureRepresentationType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="DataStructureRepresentationType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}RepresentationType">       &lt;choice>         &lt;element name="TextFormat" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}SimpleComponentTextFormatType"/>         &lt;sequence>           &lt;element name="Enumeration" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ItemSchemeReferenceBaseType"/>           &lt;element name="EnumerationFormat" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}CodededTextFormatType" minOccurs="0"/>         &lt;/sequence>       &lt;/choice>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_DataStructureType.description                                                  = DataStructureType describes the structure of a data structure definition. A data structure definition is defined as a collection of metadata concepts, their structure and usage when used to collect or disseminate data.<p>Java class for DataStructureType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="DataStructureType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}StructureType">       &lt;sequence>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Annotations" minOccurs="0"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Name" maxOccurs="unbounded"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Description" maxOccurs="unbounded" minOccurs="0"/>         &lt;sequence minOccurs="0">           &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}DataStructureComponents"/>         &lt;/sequence>       &lt;/sequence>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_DataflowType.description                                                       = DataflowType describes the structure of a data flow. A data flow is defined as the structure of data that will provided for different reference periods. If this type is not referenced externally, then a reference to a key family definition must be provided.<p>Java class for DataflowType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="DataflowType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}StructureUsageType">       &lt;sequence>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Annotations" minOccurs="0"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Name" maxOccurs="unbounded"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Description" maxOccurs="unbounded" minOccurs="0"/>         &lt;element name="Structure" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}DataStructureReferenceType" minOccurs="0"/>       &lt;/sequence>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_DimensionListBaseType.description                                              = DimensionListBaseType is an abstract base type used as the basis for the DimensionListType.<p>Java class for DimensionListBaseType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="DimensionListBaseType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}ComponentListType">       &lt;sequence>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Annotations" minOccurs="0"/>       &lt;/sequence>       &lt;attribute name="id" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}IDType" fixed="DimensionDescriptor" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_DimensionListType.description                                                  = DimensionListType describes the key descriptor for a data structure definition. The order of the declaration of child dimensions is significant: it is used to describe the order in which they will appear in data formats for which key values are supplied in an ordered fashion (exclusive of the time dimension, which is not represented as a member of the ordered key). Any data structure definition which uses the time dimension should also declare a frequency dimension, conventionally the first dimension in the key (the set of ordered non-time dimensions). If is not necessary to assign a time dimension, as data can be organised in any fashion required.<p>Java class for DimensionListType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="DimensionListType">   &lt;complexContent>     &lt;extension base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}DimensionListBaseType">       &lt;choice maxOccurs="unbounded">         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}Dimension"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}MeasureDimension"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}TimeDimension"/>       &lt;/choice>     &lt;/extension>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_DimensionListType.properties.Dimension.description                             = .
api.doc.swagger.definitions.xml_ns5_DimensionListType.properties.MeasureDimension.description                      = .
api.doc.swagger.definitions.xml_ns5_DimensionListType.properties.TimeDimension.description                         = .
api.doc.swagger.definitions.xml_ns5_DimensionType.description                                                      = DimensionType describes the structure of an ordinary dimension, which is defined as a statistical concept used (most probably together with other statistical concepts) to identify a statistical series, such as a time series, e.g. a statistical concept indicating certain economic activity or a geographical reference area. The dimension takes its semantic, and in some cases it representation, from its concept identity. A dimension can be coded by referencing a code list from its coded local representation. It can also specify its text format, which is used as the representation of the dimension if a coded representation is not defined. Neither the coded or uncoded representation are necessary, since the dimension may take these from the referenced concept.<p>Java class for DimensionType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="DimensionType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}BaseDimensionType">       &lt;sequence>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Annotations" minOccurs="0"/>         &lt;element name="ConceptIdentity" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ConceptReferenceType"/>         &lt;element name="LocalRepresentation" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}SimpleDataStructureRepresentationType" minOccurs="0"/>         &lt;element name="ConceptRole" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ConceptReferenceType" maxOccurs="unbounded" minOccurs="0"/>       &lt;/sequence>       &lt;attribute name="type" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}DimensionTypeType" fixed="Dimension" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_GroupBaseType.description                                                      = GroupBaseType is an abstract base type that forms the basis for the GroupType.<p>Java class for GroupBaseType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="GroupBaseType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}ComponentListType">       &lt;sequence>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Annotations" minOccurs="0"/>       &lt;/sequence>       &lt;attribute name="id" use="required" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}IDType" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_GroupDimensionBaseType.description                                             = GroupDimensionBaseType is an abstract base type which refines the base ComponentType in order to form the basis for the GroupDimensionType.<p>Java class for GroupDimensionBaseType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="GroupDimensionBaseType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}ComponentType">     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_GroupDimensionType.description                                                 = GroupDimensionType defines a dimension component with a group key descriptor component list. Although technically a component, this is essentially a reference to a dimension defined in the key descriptor. Therefore, the identification, name, and description, concept identity and representation properties that are typically available for a component are not allowed here, as they are all inherited from the referenced dimension.<p>Java class for GroupDimensionType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="GroupDimensionType">   &lt;complexContent>     &lt;extension base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}GroupDimensionBaseType">       &lt;sequence>         &lt;element name="DimensionReference" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}LocalDimensionReferenceType"/>       &lt;/sequence>     &lt;/extension>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_GroupDimensionType.properties.DimensionReference.description                   = .
api.doc.swagger.definitions.xml_ns5_GroupType.description                                                          = GroupType describes the structure of a group descriptor in a data structure definition. A group may consist of a of partial key, or collection of distinct cube regions or key sets to which attributes may be attached. The purpose of a group is to specify attributes values which have the same value based on some common dimensionality. All groups declared in the data structure must be unique - that is, you may not have duplicate partial keys. All groups must be given unique identifiers.<p>Java class for GroupType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="GroupType">   &lt;complexContent>     &lt;extension base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}GroupBaseType">       &lt;choice>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}GroupDimension" maxOccurs="unbounded"/>         &lt;element name="AttachmentConstraint" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}AttachmentConstraintReferenceType"/>       &lt;/choice>     &lt;/extension>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_GroupType.properties.AttachmentConstraint.description                          = .
api.doc.swagger.definitions.xml_ns5_GroupType.properties.GroupDimension.description                                = .
api.doc.swagger.definitions.xml_ns5_HierarchicalCodeBaseType.description                                           = HierarchicalCodeBaseType is an abstract base type the creates the basis for the HierarchicalCodeType. It removes the urn and uri.<p>Java class for HierarchicalCodeBaseType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="HierarchicalCodeBaseType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}IdentifiableType">       &lt;sequence>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Annotations" minOccurs="0"/>       &lt;/sequence>       &lt;attribute name="id" use="required" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}IDType" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_HierarchicalCodeType.description                                               = HierarchicalCodeType describes the structure of a hierarchical code. A hierarchical code provides for a reference to a code that is referenced within the hierarchical code list via either a complete reference to a code through either a URN or full set of reference fields, or a local reference which utilizes the included codelist reference alias and the identification of a code from the list. Codes are arranged in a hierarchy by this reference. Note that it is possible to reference a single code such that it has multiple parents within the hierarchy. Further, the hierarchy may or may not be a leveled one.<p>Java class for HierarchicalCodeType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="HierarchicalCodeType">   &lt;complexContent>     &lt;extension base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}HierarchicalCodeBaseType">       &lt;sequence>         &lt;choice>           &lt;element name="Code" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}CodeReferenceType"/>           &lt;sequence>             &lt;element name="CodelistAliasRef" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}IDType"/>             &lt;element name="CodeID" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}LocalCodeReferenceType"/>           &lt;/sequence>         &lt;/choice>         &lt;element name="HierarchicalCode" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}HierarchicalCodeType" maxOccurs="unbounded" minOccurs="0"/>         &lt;element name="Level" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}LocalLevelReferenceType" minOccurs="0"/>       &lt;/sequence>       &lt;attribute name="version" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}VersionType" />       &lt;attribute name="validFrom" type="{http://www.w3.org/2001/XMLSchema}dateTime" />       &lt;attribute name="validTo" type="{http://www.w3.org/2001/XMLSchema}dateTime" />     &lt;/extension>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_HierarchicalCodeType.properties.Code.description                               = .
api.doc.swagger.definitions.xml_ns5_HierarchicalCodeType.properties.CodeID.description                             = .
api.doc.swagger.definitions.xml_ns5_HierarchicalCodeType.properties.CodelistAliasRef.description                   = .
api.doc.swagger.definitions.xml_ns5_HierarchicalCodeType.properties.HierarchicalCode.description                   = .
api.doc.swagger.definitions.xml_ns5_HierarchicalCodeType.properties.Level.description                              = .
api.doc.swagger.definitions.xml_ns5_HierarchicalCodeType.properties.validFrom.description                          = .
api.doc.swagger.definitions.xml_ns5_HierarchicalCodeType.properties.validTo.description                            = .
api.doc.swagger.definitions.xml_ns5_HierarchicalCodeType.properties.version.description                            = .
api.doc.swagger.definitions.xml_ns5_HierarchicalCodelistBaseType.description                                       = HierarchicalCodelistBaseType is an abstract base class that is the basis for the HierarchicalCodelistType. It requires that a name be supplied.<p>Java class for HierarchicalCodelistBaseType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="HierarchicalCodelistBaseType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}MaintainableType">       &lt;sequence>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Annotations" minOccurs="0"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Name" maxOccurs="unbounded"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Description" maxOccurs="unbounded" minOccurs="0"/>       &lt;/sequence>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_HierarchicalCodelistType.description                                           = HierarchicalCodelistType describes the structure of a hierarchical codelist. A hierarchical code list is defined as an organised collection of codes that may participate in many parent/child relationships with other codes in the list, as defined by one or more hierarchy of the list.<p>Java class for HierarchicalCodelistType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="HierarchicalCodelistType">   &lt;complexContent>     &lt;extension base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}HierarchicalCodelistBaseType">       &lt;sequence>         &lt;element name="IncludedCodelist" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}IncludedCodelistReferenceType" maxOccurs="unbounded" minOccurs="0"/>         &lt;element name="Hierarchy" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}HierarchyType" maxOccurs="unbounded" minOccurs="0"/>       &lt;/sequence>     &lt;/extension>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_HierarchicalCodelistType.properties.Hierarchy.description                      = .
api.doc.swagger.definitions.xml_ns5_HierarchicalCodelistType.properties.IncludedCodelist.description               = .
api.doc.swagger.definitions.xml_ns5_HierarchyBaseType.description                                                  = HierarchyBaseType is an abstract base type that serves as the basis for the HierarchyType. It requires a name and id be provided.<p>Java class for HierarchyBaseType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="HierarchyBaseType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}NameableType">       &lt;sequence>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Annotations" minOccurs="0"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Name" maxOccurs="unbounded"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Description" maxOccurs="unbounded" minOccurs="0"/>       &lt;/sequence>       &lt;attribute name="id" use="required" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}IDType" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_HierarchyType.description                                                      = The Hierarchy is an abstract type that provides for a classification structure of referenced codes arranged in levels of detail from the broadest to the most detailed level. The levels in which the code exist can be formal or informal.<p>Java class for HierarchyType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="HierarchyType">   &lt;complexContent>     &lt;extension base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}HierarchyBaseType">       &lt;sequence>         &lt;element name="HierarchicalCode" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}HierarchicalCodeType" maxOccurs="unbounded"/>         &lt;element name="Level" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}LevelType" minOccurs="0"/>       &lt;/sequence>       &lt;attribute name="leveled" type="{http://www.w3.org/2001/XMLSchema}boolean" default="false" />     &lt;/extension>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_HierarchyType.properties.HierarchicalCode.description                          = .
api.doc.swagger.definitions.xml_ns5_HierarchyType.properties.Level.description                                     = .
api.doc.swagger.definitions.xml_ns5_HierarchyType.properties.leveled.description                                   = .
api.doc.swagger.definitions.xml_ns5_HybridCodeMapType.description                                                  = CodeMapType defines the structure for associating a code from a source codelist to a code in a target codelist. Note that either of these may come from a hierarchical codelist.<p>Java class for HybridCodeMapType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="HybridCodeMapType">   &lt;complexContent>     &lt;extension base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}AnnotableType">       &lt;sequence>         &lt;element name="Source" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}AnyLocalCodeReferenceType"/>         &lt;element name="Target" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}AnyLocalCodeReferenceType"/>       &lt;/sequence>     &lt;/extension>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_HybridCodeMapType.properties.Source.description                                = .
api.doc.swagger.definitions.xml_ns5_HybridCodeMapType.properties.Target.description                                = .
api.doc.swagger.definitions.xml_ns5_HybridCodelistMapBaseType.description                                          = HybridCodelistMapBaseType is an abstract base type which forms the basis for the HybridCodelistMapType.<p>Java class for HybridCodelistMapBaseType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="HybridCodelistMapBaseType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}NameableType">       &lt;sequence>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Annotations" minOccurs="0"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Name" maxOccurs="unbounded"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Description" maxOccurs="unbounded" minOccurs="0"/>       &lt;/sequence>       &lt;attribute name="id" use="required" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}IDType" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_HybridCodelistMapType.description                                              = HybridCodelistMapType defines the structure of a map which relates codes (possibly hierarchical) from different code lists.<p>Java class for HybridCodelistMapType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="HybridCodelistMapType">   &lt;complexContent>     &lt;extension base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}HybridCodelistMapBaseType">       &lt;sequence>         &lt;element name="Source" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}AnyCodelistReferenceType"/>         &lt;element name="Target" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}AnyCodelistReferenceType"/>         &lt;element name="HybridCodeMap" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}HybridCodeMapType" maxOccurs="unbounded"/>       &lt;/sequence>     &lt;/extension>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_HybridCodelistMapType.properties.HybridCodeMap.description                     = .
api.doc.swagger.definitions.xml_ns5_HybridCodelistMapType.properties.Source.description                            = .
api.doc.swagger.definitions.xml_ns5_HybridCodelistMapType.properties.Target.description                            = .
api.doc.swagger.definitions.xml_ns5_ISOConceptReferenceType.description                                            = ISOConceptReferenceType provides a reference to and ISO 11179 concept.<p>Java class for ISOConceptReferenceType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="ISOConceptReferenceType">   &lt;complexContent>     &lt;restriction base="{http://www.w3.org/2001/XMLSchema}anyType">       &lt;sequence>         &lt;element name="ConceptAgency" type="{http://www.w3.org/2001/XMLSchema}string"/>         &lt;element name="ConceptSchemeID" type="{http://www.w3.org/2001/XMLSchema}string"/>         &lt;element name="ConceptID" type="{http://www.w3.org/2001/XMLSchema}string"/>       &lt;/sequence>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_ISOConceptReferenceType.properties.ConceptAgency.description                   = .
api.doc.swagger.definitions.xml_ns5_ISOConceptReferenceType.properties.ConceptID.description                       = .
api.doc.swagger.definitions.xml_ns5_ISOConceptReferenceType.properties.ConceptSchemeID.description                 = .
api.doc.swagger.definitions.xml_ns5_IdentifiableObjectRepresentationType.description                               = IdentifiableObjectRepresentationType defines the possible local representations of an identifiable object target object.<p>Java class for IdentifiableObjectRepresentationType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="IdentifiableObjectRepresentationType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}RepresentationType">       &lt;choice>         &lt;element name="TextFormat" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}IdentifiableObjectTextFormatType"/>         &lt;sequence>           &lt;element name="Enumeration" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ItemSchemeReferenceType"/>         &lt;/sequence>       &lt;/choice>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_IdentifiableObjectTargetBaseType.description                                   = IdentifiableObjectTargetBaseType is an abstract base type which forms the basis for the IdentifiableObjectTargetType.<p>Java class for IdentifiableObjectTargetBaseType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="IdentifiableObjectTargetBaseType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}TargetObject">       &lt;sequence>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Annotations" minOccurs="0"/>         &lt;element name="LocalRepresentation" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}IdentifiableObjectRepresentationType"/>       &lt;/sequence>       &lt;attribute name="id" use="required" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}NCNameIDType" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_IdentifiableObjectTargetType.description                                       = IdentifiableObjectTargetType defines the structure of an identifiable target object. The identifiable target object has a fixed representation of a reference and can specify a local representation of any item scheme for the purpose of restricting which items may be referenced. The identifiable object target must specify the object type which the target object is meant to reference.<p>Java class for IdentifiableObjectTargetType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="IdentifiableObjectTargetType">   &lt;complexContent>     &lt;extension base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}IdentifiableObjectTargetBaseType">       &lt;attribute name="objectType" use="required" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ObjectTypeCodelistType" />     &lt;/extension>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_IdentifiableObjectTargetType.properties.objectType.description                 = .
api.doc.swagger.definitions.xml_ns5_IdentifiableObjectTextFormatType.description                                   = IdentifiableObjectTextFormatType is a restricted version of the NonFacetedTextFormatType that specifies a fixed IdentifiableReference representation.<p>Java class for IdentifiableObjectTextFormatType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="IdentifiableObjectTextFormatType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}TargetObjectTextFormatType">       &lt;attribute name="textType" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}TargetObjectDataType" fixed="IdentifiableReference" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_IdentifiableType.description                                                   = IdentifiableType is an abstract base type for all identifiable objects.<p>Java class for IdentifiableType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="IdentifiableType">   &lt;complexContent>     &lt;extension base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}AnnotableType">       &lt;attribute name="id" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}IDType" />       &lt;attribute name="urn" type="{http://www.w3.org/2001/XMLSchema}anyURI" />       &lt;attribute name="uri" type="{http://www.w3.org/2001/XMLSchema}anyURI" />     &lt;/extension>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_IdentifiableType.properties.id.description                                     = .
api.doc.swagger.definitions.xml_ns5_IdentifiableType.properties.uri.description                                    = .
api.doc.swagger.definitions.xml_ns5_IdentifiableType.properties.urn.description                                    = .
api.doc.swagger.definitions.xml_ns5_IncludedCodelistReferenceType.description                                      = IncludedCodelistReferenceType provides the structure for a referencing a codelist and optionally providing a local alias identification for this reference.<p>Java class for IncludedCodelistReferenceType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="IncludedCodelistReferenceType">   &lt;complexContent>     &lt;extension base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}CodelistReferenceType">       &lt;attribute name="alias" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}IDType" />     &lt;/extension>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_IncludedCodelistReferenceType.properties.alias.description                     = .
api.doc.swagger.definitions.xml_ns5_InputOutputType.description                                                    = InputOutputType describes the structure of an input or output to a process step. It provides a reference to the object that is the input or output.<p>Java class for InputOutputType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="InputOutputType">   &lt;complexContent>     &lt;extension base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}AnnotableType">       &lt;sequence>         &lt;element name="ObjectReference" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ObjectReferenceType"/>       &lt;/sequence>       &lt;attribute name="localID" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}IDType" />     &lt;/extension>   &lt;/complexContent> &lt;/complexType> </pre>

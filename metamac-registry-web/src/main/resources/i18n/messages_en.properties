api.doc.swagger.definitions.xml_ns10_MetadataSetType.description                                                   = MetadataSetType describes the structure for a metadata set, which contains a collection of reported metadata against a set of values for a given full or partial target identifier, as described in a metadata structure definition. The metadata set may contain reported metadata for multiple report structures defined in a metadata structure definition.<p>Java class for MetadataSetType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="MetadataSetType">   &lt;complexContent>     &lt;extension base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}AnnotableType">       &lt;sequence>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Name" maxOccurs="unbounded" minOccurs="0"/>         &lt;element name="DataProvider" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}DataProviderReferenceType" minOccurs="0"/>         &lt;element name="Report" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/metadata/generic}ReportType" maxOccurs="unbounded"/>       &lt;/sequence>       &lt;attGroup ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}SetAttributeGroup"/>     &lt;/extension>   &lt;/complexContent> &lt;/complexType> </pre>

api.doc.swagger.definitions.xml_ns4_ReportCategoryRefType.description                                     = ReportCategoryRefType contains a set of fields for referencing a reporting category within a reporting taxonomy.<p>Java class for ReportCategoryRefType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="ReportCategoryRefType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ItemRefBaseType">       &lt;attribute name="maintainableParentID" use="required" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}IDType" />       &lt;attribute name="maintainableParentVersion" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}VersionType" default="1.0" />       &lt;attribute name="class" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ItemTypeCodelistType" fixed="ReportingCategory" />       &lt;attribute name="package" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ItemSchemePackageTypeCodelistType" fixed="categoryscheme" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>

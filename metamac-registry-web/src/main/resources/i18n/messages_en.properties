api.doc.swagger.definitions.xml_ns4_ReferencePeriodType.description                                                = Specifies the inclusive start and end times.<p>Java class for ReferencePeriodType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="ReferencePeriodType">   &lt;complexContent>     &lt;restriction base="{http://www.w3.org/2001/XMLSchema}anyType">       &lt;attribute name="startTime" use="required" type="{http://www.w3.org/2001/XMLSchema}dateTime" />       &lt;attribute name="endTime" use="required" type="{http://www.w3.org/2001/XMLSchema}dateTime" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>

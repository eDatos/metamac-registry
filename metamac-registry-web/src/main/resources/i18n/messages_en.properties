api.doc.swagger.definitions.xml_ns3_StructuresQueryType.description                                                = StructuresQueryType defines the structure of a structures query message.
api.doc.swagger.definitions.xml_ns3_StructureType.description                                                      = StructureType defines the contents of a structure message. The payload is optional since this message may be returned from a web service with only information in the footer.

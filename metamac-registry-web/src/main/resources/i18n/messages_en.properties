api.doc.swagger.definitions.xml_ns4_CubeRegionKeyType.description                                         = CubeRegionKeyType is a type for providing a set of values for a dimension for the purpose of defining a data cube region. A set of distinct value can be provided, or if this dimension is represented as time, and time range can be specified.<p>Java class for CubeRegionKeyType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="CubeRegionKeyType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ComponentValueSetType">       &lt;choice>         &lt;element name="Value" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}SimpleValueType" maxOccurs="unbounded"/>         &lt;element name="TimeRange" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}TimeRangeValueType"/>       &lt;/choice>       &lt;attribute name="id" use="required" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}SingleNCNameIDType" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns4_CubeRegionType.description                                            = CubeRegionType defines the structure of a data cube region. This is based on the abstract RegionType and simply refines the key and attribute values to conform with what is applicable for dimensions and attributes, respectively. See the documentation of the base type for more details on how a region is defined.<p>Java class for CubeRegionType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="CubeRegionType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}RegionType">       &lt;sequence>         &lt;element name="KeyValue" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}CubeRegionKeyType" maxOccurs="unbounded" minOccurs="0"/>         &lt;element name="Attribute" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}AttributeValueSetType" maxOccurs="unbounded" minOccurs="0"/>       &lt;/sequence>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>

api.doc.swagger.definitions.xml_ns5_NameableType.description                                                       = NameableType is an abstract base type for  all nameable objects.
api.doc.swagger.definitions.xml_ns5_NameableType.properties.Description.description                                =
api.doc.swagger.definitions.xml_ns5_NameableType.properties.Name.description                                       =
api.doc.swagger.definitions.xml_ns5_NonFacetedTextFormatType.description                                           = NonFacetedTextFormatType is a restricted version of the SimpleComponentTextFormatType that does not allow for any facets
api.doc.swagger.definitions.xml_ns5_OrganisationMapType.description                                                = OrganisationMapType defines the structure for mapping two organisations. A local reference is provided both the source and target organisation
api.doc.swagger.definitions.xml_ns5_OrganisationSchemeBaseType.description                                         = OrganisationSchemeBaseType is an abstract base type for any organisation scheme
api.doc.swagger.definitions.xml_ns5_OrganisationSchemeMapType.description                                          = OrganisationSchemeMapType defines the structure of a map which identifies relationships between organisations in different organisation schemes
api.doc.swagger.definitions.xml_ns5_OrganisationSchemeType.description                                             = OrganisationSchemeType describes the structure of an organisation scheme
api.doc.swagger.definitions.xml_ns5_OrganisationSchemeType.properties.Organisation.description                     =
api.doc.swagger.definitions.xml_ns5_OrganisationType.description                                                   = OrganisationType in an abstract type which describes the structure of the details of an organisation. In addition to the basic organisation identification, contact details can be provided
api.doc.swagger.definitions.xml_ns5_OrganisationType.properties.Contact.description                                =
api.doc.swagger.definitions.xml_ns5_OrganisationUnitSchemeType.description                                         = OrganisationUnitSchemeType defines a type of organisation scheme which simply defines organisations and there parent child relationships. Organisations in this scheme are assigned no particular role, and may in fact exist within the other type of organisation schemes as well
api.doc.swagger.definitions.xml_ns5_OrganisationUnitType.description                                               = OrganisationUnitType defines the structure of an organisation unit description. In addition to general identification and contact information, an organisation unit can specify a relationship with another organisation unit from the same scheme which is its parent organisation
api.doc.swagger.definitions.xml_ns5_PrimaryMeasureType.description                                                 = PrimaryMeasureType describes the structure of the primary measure. It describes the observation values for all presentations of the data. The primary measure takes its semantic, and in some cases it representation, from its concept identity (conventionally the OBS_VALUE concept). The primary measure can be coded by referencing a code list from its coded local representation. It can also specify its text format, which is used as the representation of the primary measure if a coded representation is not defined. Neither the coded or uncoded representation are necessary, since the primary measure may take these from the referenced concept. Note that if the data structure declares a measure dimension, the representation of this must be a superset of all possible measure concept representations
api.doc.swagger.definitions.xml_ns5_ProcessStepBaseType.description                                                = ProcessStepBaseType is an abstract base type used as the basis for the ProcessStepType
api.doc.swagger.definitions.xml_ns5_ProcessStepType.description                                                    = ProcessStepType describes the structure of a process step. A nested process step is automatically sub-ordinate, and followed as the next step. If the following step is conditional, it should be referenced in a transition
api.doc.swagger.definitions.xml_ns5_ProcessStepType.properties.Computation.description                             =
api.doc.swagger.definitions.xml_ns5_ProcessStepType.properties.Input.description                                   =
api.doc.swagger.definitions.xml_ns5_ProcessStepType.properties.Output.description                                  =
api.doc.swagger.definitions.xml_ns5_ProcessStepType.properties.ProcessStep.description                             =
api.doc.swagger.definitions.xml_ns5_ProcessStepType.properties.Transition.description                              =
api.doc.swagger.definitions.xml_ns5_ProcessType.description                                                        = ProcessType describes the structure of a process, which is a scheme which defines or documents the operations performed on data in order to validate data or to derive new information according to a given set of rules. Processes occur in order, and will continue in order unless a transition dictates another step should occur
api.doc.swagger.definitions.xml_ns5_ProcessType.properties.ProcessStep.description                                 =
api.doc.swagger.definitions.xml_ns5_ProvisionAgreementType.description                                             = ProvisionAgreementType describes the structure of a provision agreement. A provision agreement defines an agreement for a data provider to report data or reference metadata against a flow. Attributes which describe how the registry must behave when data or metadata is registered against this provision agreement are supplied
api.doc.swagger.definitions.xml_ns5_ProvisionAgreementType.properties.DataProvider.description                     =
api.doc.swagger.definitions.xml_ns5_ProvisionAgreementType.properties.StructureUsage.description                   =
api.doc.swagger.definitions.xml_ns5_ReleaseCalendarType.description                                                = ReleaseCalendarType describes information about the timing of releases of the constrained data. All of these values use the standard P7D - style format
api.doc.swagger.definitions.xml_ns5_ReleaseCalendarType.properties.Offset.description                              =
api.doc.swagger.definitions.xml_ns5_ReleaseCalendarType.properties.Periodicity.description                         =
api.doc.swagger.definitions.xml_ns5_ReleaseCalendarType.properties.Tolerance.description                           =
api.doc.swagger.definitions.xml_ns5_ReportingCategoryBaseType.description                                          = ReportingCategoryBaseType is an abstract base type that serves as the basis for the ReportingCategoryType.
api.doc.swagger.definitions.xml_ns5_ReportingCategoryMapType.description                                           = ReportingCategoryMapType defines the structure for mapping two reporting categories. A local reference is provided both the source and target category.
api.doc.swagger.definitions.xml_ns5_ReportingCategoryType.description                                              = ReportingCategoryType describes the structure of a reporting category, which groups structure usages into useful sub-packages. Sub ordinate reporting categories can be nested within the category definition.
api.doc.swagger.definitions.xml_ns5_ReportingCategoryType.properties.ProvisioningMetadata.description              =
api.doc.swagger.definitions.xml_ns5_ReportingCategoryType.properties.StructuralMetadata.description                =
api.doc.swagger.definitions.xml_ns5_ReportingTaxonomyMapType.description                                           = ReportingTaxonomyMapType defines the structure of a map which identifies relationships between reporting categories in different reporting taxonomies.
api.doc.swagger.definitions.xml_ns5_ReportingTaxonomyType.description                                              = ReportingTaxonomyType describes the structure of a reporting taxonomy, which is a scheme which defines the composition structure of a data report where each component can be described by an independent structure or structure usage description.
api.doc.swagger.definitions.xml_ns5_ReportingYearStartDayRepresentationType.description                            = ReportingYearStartDayRepresentationType defines the representation for the reporting year start day attribute. Enumerated values are not allowed and the text format is fixed to be a day and month in the ISO 8601 format of '--MM-DD'.
api.doc.swagger.definitions.xml_ns5_ReportingYearStartDayTextFormatType.description                                = ReportingYearStartDayTextFormatType is a restricted version of the NonFacetedTextFormatType that fixes the value of the text type to be DayMonth. This type exists solely for the purpose of fixing the representation of the reporting year start day attribute.
api.doc.swagger.definitions.xml_ns5_ReportingYearStartDayType.description                                          = ReportingYearStartDayType defines the structure of the reporting year start day attribute. The reporting year start day attribute takes its semantic from its concept identity (usually the REPORTING_YEAR_START_DAY concept), yet is always has a fixed identifier (REPORTING_YEAR_START_DAY). The reporting year start day attribute always has a fixed text format, which specifies that the format of its value is always a day and month in the ISO 8601 format of '--MM-DD'. As with any other attribute, an attribute relationship must be specified. this relationship should be carefully selected as it will determine what type of data the data structure definition will allow. For example, if an attribute relationship of none is specified, this will mean the data sets conforming to this data structure definition can only contain data with standard reporting periods where the all reporting periods have the same start day. In this case, data reported as standard reporting periods from two entities with different fiscal year start days could not be contained in the same data set.
api.doc.swagger.definitions.xml_ns5_ReportPeriodRepresentationType.description                                     = ReportPeriodRepresentationType defines the possible local representations of a report period target object. The reprentation must be a time period or a subset of this representation.
api.doc.swagger.definitions.xml_ns5_ReportPeriodTargetType.description                                             = ReportPeriodTargetType defines the structure of a report period target object. The report period target object has a fixed representation and identifier.
api.doc.swagger.definitions.xml_ns5_ReportStructureBaseType.description                                            = ReportStructureBaseType is an abstract base type that serves as the basis for the ReportStructureType.
api.doc.swagger.definitions.xml_ns5_ReportStructureType.description                                                = ReportStructureType describes the structure of a report structure. It comprises a set of metadata attributes that can be defined as a hierarchy, and identifies the potential attachment of these attributes to an object by referencing a target identifier.
api.doc.swagger.definitions.xml_ns5_ReportStructureType.properties.MetadataTarget.description                      =
api.doc.swagger.definitions.xml_ns5_RepresentationMapType.description                                              = RepresentationMapType describes the structure of the mapping of the value of a source to component to a target component. Either a reference to another map defined within the containing structure set or a description of the source and target text formats must be provided. Note that for key family components, only a reference to a codelist map is relevant, since that is the only type of coded representation allowed in a key family.
api.doc.swagger.definitions.xml_ns5_RepresentationMapType.properties.CodelistMap.description                       =
api.doc.swagger.definitions.xml_ns5_RepresentationMapType.properties.ToTextFormat.description                      =
api.doc.swagger.definitions.xml_ns5_RepresentationMapType.properties.ToValueType.description                       =
api.doc.swagger.definitions.xml_ns5_RepresentationMapType.properties.ValueMap.description                          =
api.doc.swagger.definitions.xml_ns5_RepresentationType.description                                                 = RepresentationType is an abstract type that defines a representation. Because the type of item schemes that are allowed as the an enumeration vary based on the object in which this is defined, this type is abstract to force that the enumeration reference be restricted to the proper type of item scheme reference.
api.doc.swagger.definitions.xml_ns5_RepresentationType.properties.Enumeration.description                          =
api.doc.swagger.definitions.xml_ns5_RepresentationType.properties.EnumerationFormat.description                    =
api.doc.swagger.definitions.xml_ns5_RepresentationType.properties.TextFormat.description                           =
api.doc.swagger.definitions.xml_ns5_SimpleComponentTextFormatType.description                                      = SimpleComponentTextFormatType is a restricted version of the BasicComponentTextFormatType that does not allow for multi-lingual values.
api.doc.swagger.definitions.xml_ns5_SimpleDataStructureRepresentationType.description                              = SimpleDataStructureRepresentationType defines the representation for any non-measure and non-time dimension data structure definition component.
api.doc.swagger.definitions.xml_ns5_StructureMapBaseType.description                                               = StructureMapBaseType is an abstract base type which forms the basis for the StructureMapType.
api.doc.swagger.definitions.xml_ns5_StructureMapType.description                                                   = StructureMapType defines the structure for mapping components of one structure to components of another structure. A structure may be referenced directly meaning the map applies wherever the structure is used, or it may be a reference via a structure usage meaning the map only applies within the context of that usage. Using the related structures, one can make extrapolations between maps. For example, if key families, A, B, and C, are all grouped in a related structures container, then a map from key family A to C and a map from key family B to C could be used to infer a relation between key family A to C.
api.doc.swagger.definitions.xml_ns5_StructureMapType.properties.ComponentMap.description                           =
api.doc.swagger.definitions.xml_ns5_StructureMapType.properties.isExtension.description                            =
api.doc.swagger.definitions.xml_ns5_StructureMapType.properties.Source.description                                 =
api.doc.swagger.definitions.xml_ns5_StructureMapType.properties.Target.description                                 =
api.doc.swagger.definitions.xml_ns5_StructureSetBaseType.description                                               = StructureSetBaseType is an abstract base type that forms the basis for the StructureSetType.
api.doc.swagger.definitions.xml_ns5_StructureSetType.description                                                   = StructureSetType describes the structure of a structure set. It allows components in one structure, structure usage, or item scheme to be mapped to components in another structural component of the same type.
api.doc.swagger.definitions.xml_ns5_StructureSetType.properties.CategorySchemeMap.description                      =
api.doc.swagger.definitions.xml_ns5_StructureSetType.properties.CodelistMap.description                            =

api.doc.swagger.definitions.xml_ns5_ConstraintBaseType.description                                                 = ConstraintBaseType is an abstract base type that forms the basis of the main abstract ConstraintType. It requires that a name be provided.
api.doc.swagger.definitions.xml_ns5_ConstraintContentTargetType.description                                        = ConstraintTargetType defines the structure of a constraint target object. The constraint target object has a fixed representation and identifier.
api.doc.swagger.definitions.xml_ns5_ConstraintRepresentationType.description                                       = ConstraintRepresentationType defines the possible local representations of a constraint reference target object. The representation is fixed to always be an attachment constraint reference.
api.doc.swagger.definitions.xml_ns5_ConstraintTextFormatType.description                                           = ConstraintTextFormatType is a restricted version of the NonFacetedTextFormatType that specifies a fixed AttachmentConstraintReference representation.
api.doc.swagger.definitions.xml_ns5_ConstraintType.description                                                     = ConstraintType is an abstract base type that specific types of constraints (content and attachment) restrict and extend to describe their details. The inclusion of a key or region in a constraint is determined by first processing the included key sets, and then removing those keys defined in the excluded key sets. If no included key sets are defined, then it is assumed the all possible keys or regions are included, and any excluded key or regions are removed from this complete set.

api.doc.swagger.definitions.xml_ns4_AgencyReferenceType.description                                                = AgencyReferenceType is a type for referencing an agency. It consists of a URN and/or a complete set of reference fields.
api.doc.swagger.definitions.xml_ns4_AgencyRefType.description                                                      = AgencyRefType contains a set of reference fields for referencing an agency within an agency scheme.
api.doc.swagger.definitions.xml_ns4_AgencySchemeReferenceType.description                                          = AgencySchemeReferenceType is a type for referencing an agency scheme object. It consists of a URN and/or a complete set of reference fields.
api.doc.swagger.definitions.xml_ns4_AgencySchemeRefType.description                                                = AgencySchemeRefType contains a set of reference fields for an agency scheme.
api.doc.swagger.definitions.xml_ns4_AnnotableType.description                                                      = AnnotableType is an abstract base type used for all annotable artefacts. Any type that provides for annotations should extend this type.
api.doc.swagger.definitions.xml_ns4_AnnotableType.properties.Annotations.description                               =
api.doc.swagger.definitions.xml_ns4_AnnotationsType.description                                                    = AnnotationsType provides for a list of annotations to be attached to data and structure messages.

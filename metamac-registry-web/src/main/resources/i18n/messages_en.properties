api.doc.swagger.definitions.xml_ns5_ComponentMapType.properties.Source.description                                 =
api.doc.swagger.definitions.xml_ns5_ComponentMapType.properties.Target.description                                 =
api.doc.swagger.definitions.xml_ns5_ComponentType.description                                                      = ComponentType is an abstract base type for all components. It contains information pertaining to a component, including an optional reference to a concept, an optional role played by the concept, an optional text format description, and an optional local representation.
api.doc.swagger.definitions.xml_ns5_ComponentType.properties.ConceptIdentity.description                           =

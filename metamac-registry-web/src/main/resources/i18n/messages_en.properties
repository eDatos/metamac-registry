api.doc.swagger.definitions.xml_ns10_ReferenceValueType.description                                                = ReferenceValueType defines the structure of a target object reference value. A target reference value will either be a reference to an identifiable object, a data key, a reference to a data set, or a report period.<p>Java class for ReferenceValueType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="ReferenceValueType">   &lt;complexContent>     &lt;restriction base="{http://www.w3.org/2001/XMLSchema}anyType">       &lt;choice>         &lt;element name="ObjectReference" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ObjectReferenceType"/>         &lt;element name="DataKey" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}DataKeyType"/>         &lt;element name="DataSetReference" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}SetReferenceType"/>         &lt;element name="ConstraintContentReference" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}AttachmentConstraintReferenceType"/>         &lt;element name="ReportPeriod" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ObservationalTimePeriodType"/>       &lt;/choice>       &lt;attribute name="id" use="required" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}IDType" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>

api.doc.swagger.definitions.xml_ns5_ComputationType.properties.softwarePackage.description                         =
api.doc.swagger.definitions.xml_ns5_ComputationType.properties.softwareVersion.description                         =
api.doc.swagger.definitions.xml_ns5_ConceptBaseType.description                                                    = ConceptBaseType is an abstract base type the forms the basis of the ConceptType by requiring a name and id, and restricting the content of the id.
api.doc.swagger.definitions.xml_ns5_ConceptMapType.description                                                     = ConceptMapType defines the structure for mapping two concepts. A local reference is provided both the source and target concept.
api.doc.swagger.definitions.xml_ns5_ConceptRepresentation.description                                              = ConceptRepresentation defines the core representation that are allowed for a concept. The text format allowed for a concept is that which is allowed for any non-target object component.
api.doc.swagger.definitions.xml_ns5_ConceptSchemeMapType.description                                               = ConceptSchemeMapType defines the structure of a map which identifies relationships between concepts in different concept schemes.
api.doc.swagger.definitions.xml_ns5_ConceptSchemeType.description                                                  = onceptSchemeType describes the structure of a concept scheme. A concept scheme is the descriptive information for an arrangement or division of concepts into groups based on characteristics, which the objects have in common. It contains a collection of concept definitions, that may be arranged in simple hierarchies.
api.doc.swagger.definitions.xml_ns5_ConceptType.description                                                        = ConceptType describes the details of a concept. A concept is defined as a unit of knowledge created by a unique combination of characteristics. If a concept does not specify a TextFormat or a core representation, then the representation of the concept is assumed to be represented by any set of valid characters (corresponding to the xs:string datatype of W3C XML Schema).
api.doc.swagger.definitions.xml_ns5_ConceptType.properties.CoreRepresentation.description                          =
api.doc.swagger.definitions.xml_ns5_ConceptType.properties.ISOConceptReference.description                         =
api.doc.swagger.definitions.xml_ns5_ConstraintAttachmentType.description                                           = ConstraintAttachmentType describes a collection of references to constrainable artefacts.

api.doc.swagger.definitions.xml_ns9_TargetType.description                                                         = TargetType is an abstract base type that forms the basis of a the metadata report's metadata target value. This type is restricted in the metadata structure definition specific schema so that the ReferenceValue elements conform to the targets specified in the metadata target defined in the metadata structure definition.<p>Java class for TargetType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="TargetType">   &lt;complexContent>     &lt;restriction base="{http://www.w3.org/2001/XMLSchema}anyType">       &lt;sequence>         &lt;element name="ReferenceValue" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/metadata/structurespecific}ReferenceValueType" maxOccurs="unbounded" form="unqualified"/>       &lt;/sequence>       &lt;attribute name="id" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}IDType" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>

api.doc.swagger.definitions.xml_ns9_ReportedAttributeType.description                                              = ReportedAttributeType is an abstract base type that forms the basis for a metadata structure specific metadata attribute. A value for the attribute can be supplied as either a single value, or multi-lingual text values (either structured or unstructured). An optional set of child metadata attributes is also available if the metadata attribute definition defines nested metadata attributes. The metadata structure definition specific schema will refine this type for each metadata attribute such that the content can be validation against what is defined in the metadata structure definition.<p>Java class for ReportedAttributeType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="ReportedAttributeType">   &lt;complexContent>     &lt;extension base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}AnnotableType">       &lt;sequence>         &lt;choice minOccurs="0">           &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Text" maxOccurs="unbounded"/>           &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}StructuredText" maxOccurs="unbounded"/>         &lt;/choice>         &lt;element name="AttributeSet" type="{http://www.w3.org/2001/XMLSchema}anyType" minOccurs="0" form="unqualified"/>       &lt;/sequence>       &lt;attribute name="id" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}IDType" />       &lt;attribute name="value" type="{http://www.w3.org/2001/XMLSchema}anySimpleType" />       &lt;attribute name="isMetadataAttribute" type="{http://www.w3.org/2001/XMLSchema}boolean" fixed="true" />     &lt;/extension>   &lt;/complexContent> &lt;/complexType> </pre>

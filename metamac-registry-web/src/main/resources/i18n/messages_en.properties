api.doc.swagger.definitions.xml_ns4_AnnotableType.description                                             = AnnotableType is an abstract base type used for all annotable artefacts. Any type that provides for annotations should extend this type.<p>Java class for AnnotableType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="AnnotableType">   &lt;complexContent>     &lt;restriction base="{http://www.w3.org/2001/XMLSchema}anyType">       &lt;sequence>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Annotations" minOccurs="0"/>       &lt;/sequence>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>

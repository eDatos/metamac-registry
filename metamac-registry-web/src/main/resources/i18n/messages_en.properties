api.doc.swagger.definitions.xml_ns5_StructureSetType.properties.StructureMap.description                           =
api.doc.swagger.definitions.xml_ns5_StructureType.description                                                      = StructureType is an abstract base type for all structure objects. Concrete instances of this should restrict to a concrete grouping
api.doc.swagger.definitions.xml_ns5_StructureType.properties.Grouping.description                                  =
api.doc.swagger.definitions.xml_ns5_StructureUsageType.description                                                 = StructureUsageType is an abstract base type for all structure usages. It contains a reference to a structure. Concrete instances of this type should restrict the type of structure referenced 
api.doc.swagger.definitions.xml_ns5_StructureUsageType.properties.Structure.description                            =
api.doc.swagger.definitions.xml_ns5_TargetObject.description                                                       = TargetObject is an abstract base type from which all target objects of a metadata target are derived. It is based on a component. Implementations of this will refined the local representation so that the allowed values accurately reflect the representation of the target object reference
api.doc.swagger.definitions.xml_ns5_TargetObjectTextFormatType.description                                         = TargetObjectTextFormatType is a restricted version of the TextFormatType that does not allow for any facets and only allows the text types for target objects
api.doc.swagger.definitions.xml_ns5_TextFormatType.description                                                     = TextFormatType defines the information for describing a full range of text formats and may place restrictions on the values of the other attributes, referred to as facets

api.doc.swagger.definitions.xml_ns4_PayloadStructureType.description                                      = PayloadStructureType is an abstract base type used to define the structural information for data or metadata sets. A reference to the structure is provided (either explicitly or through a reference to a structure usage).<p>Java class for PayloadStructureType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="PayloadStructureType">   &lt;complexContent>     &lt;restriction base="{http://www.w3.org/2001/XMLSchema}anyType">       &lt;sequence>         &lt;choice>           &lt;element name="ProvisionAgrement" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ProvisionAgreementReferenceType"/>           &lt;element name="StructureUsage" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}StructureUsageReferenceBaseType"/>           &lt;element name="Structure" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}StructureReferenceBaseType"/>         &lt;/choice>       &lt;/sequence>       &lt;attGroup ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ExternalReferenceAttributeGroup"/>       &lt;attribute name="structureID" use="required" type="{http://www.w3.org/2001/XMLSchema}ID" />       &lt;attribute name="schemaURL" type="{http://www.w3.org/2001/XMLSchema}anyURI" />       &lt;attribute name="namespace" type="{http://www.w3.org/2001/XMLSchema}anyURI" />       &lt;attribute name="dimensionAtObservation" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ObservationDimensionType" />       &lt;attribute name="explicitMeasures" type="{http://www.w3.org/2001/XMLSchema}boolean" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>

api.doc.swagger.definitions.xml_ns4_DataKeyType.description                                               = DataKeyType is a region which defines a distinct full or partial data key. The key consists of a set of values, each referencing a dimension and providing a single value for that dimension. The purpose of the key is to define a subset of a data set (i.e. the observed value and data attribute) which have the dimension values provided in this definition. Any dimension not stated explicitly in this key is assumed to be wild carded, thus allowing for the definition of partial data keys.<p>Java class for DataKeyType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="DataKeyType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}DistinctKeyType">       &lt;sequence>         &lt;element name="KeyValue" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}DataKeyValueType" maxOccurs="unbounded"/>       &lt;/sequence>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>

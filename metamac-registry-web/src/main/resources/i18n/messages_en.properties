api.doc.swagger.definitions.xml_ns4_AnyCodelistRefType.description                                        = AnyCodelistRefType is a type for referencing any codelist object (either a codelist or a hierarchical codelist).<p>Java class for AnyCodelistRefType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="AnyCodelistRefType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}MaintainableRefBaseType">       &lt;attribute name="class" use="required" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}CodelistTypeCodelistType" />       &lt;attribute name="package" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}PackageTypeCodelistType" fixed="codelist" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns4_AnyCodelistReferenceType.description                                  = AnyCodelistReferenceType is a specific type of a reference for referencing either a codelist or a hierarchical codelist usage. It consists of a URN and/or a complete set of reference fields; agency, id and version. If the complete set of reference fields is used, it is required that a class be provided so that the type of object referenced is clear.<p>Java class for AnyCodelistReferenceType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="AnyCodelistReferenceType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}MaintainableReferenceBaseType">       &lt;choice>         &lt;sequence>           &lt;element name="Ref" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}AnyCodelistRefType" form="unqualified"/>           &lt;element name="URN" type="{http://www.w3.org/2001/XMLSchema}anyURI" minOccurs="0" form="unqualified"/>         &lt;/sequence>         &lt;element name="URN" type="{http://www.w3.org/2001/XMLSchema}anyURI" form="unqualified"/>       &lt;/choice>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns4_AnyLocalCodeRefType.description                                       = AnyLocalCodeRefType provides a local reference to any code object.<p>Java class for AnyLocalCodeRefType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="AnyLocalCodeRefType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}RefBaseType">       &lt;attribute name="containerID" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}IDType" />       &lt;attribute name="id" use="required" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}NestedIDType" />       &lt;attribute name="local" type="{http://www.w3.org/2001/XMLSchema}boolean" fixed="true" />       &lt;attribute name="class" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}CodeTypeCodelistType" />       &lt;attribute name="package" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}PackageTypeCodelistType" fixed="codelist" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns4_AnyLocalCodeReferenceType.description                                 = AnyLocalCodeReferenceType provides a simple references to any code or hierarchical code where the identification of the codelist or hierarchical codelist which defines it is contained in another context.<p>Java class for AnyLocalCodeReferenceType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="AnyLocalCodeReferenceType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ReferenceType">       &lt;choice>         &lt;sequence>           &lt;element name="Ref" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}AnyLocalCodeRefType" form="unqualified"/>           &lt;element name="URN" type="{http://www.w3.org/2001/XMLSchema}anyURI" minOccurs="0" form="unqualified"/>         &lt;/sequence>         &lt;element name="URN" type="{http://www.w3.org/2001/XMLSchema}anyURI" form="unqualified"/>       &lt;/choice>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns4_AttachmentConstraintRefType.description                               = AttachmentConstraintRefType contains a set of reference fields for an attachment constraint.<p>Java class for AttachmentConstraintRefType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="AttachmentConstraintRefType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ConstraintRefType">       &lt;attribute name="class" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ConstraintTypeCodelistType" fixed="AttachmentConstraint" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns4_AttachmentConstraintReferenceType.description                         = AttachmentConstraintReferenceType is a type for referencing a attachment constraint object. It consists of a URN and/or a complete set of reference fields.<p>Java class for AttachmentConstraintReferenceType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="AttachmentConstraintReferenceType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ConstraintReferenceType">       &lt;choice>         &lt;sequence>           &lt;element name="Ref" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}AttachmentConstraintRefType" form="unqualified"/>           &lt;element name="URN" type="{http://www.w3.org/2001/XMLSchema}anyURI" minOccurs="0" form="unqualified"/>         &lt;/sequence>         &lt;element name="URN" type="{http://www.w3.org/2001/XMLSchema}anyURI" form="unqualified"/>       &lt;/choice>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns4_AttributeDescriptorRefType.description                                = AttributeDescriptorRefType contains a reference to the attribute descriptor within a data structure definition.<p>Java class for AttributeDescriptorRefType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="AttributeDescriptorRefType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ComponentListRefBaseType">       &lt;attribute name="id" use="required" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}IDType" fixed="ATTRIBUTE_DESCRIPTOR" />       &lt;attribute name="class" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ComponentListTypeCodelistType" fixed="AttributeDescriptor" />       &lt;attribute name="package" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}StructurePackageTypeCodelistType" fixed="datastructure" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns4_AttributeDescriptorReferenceType.description                          = AttributeDescriptorReferenceType is a type for referencing an attribute descriptor object. It consists of a URN and/or a complete set of reference fields.<p>Java class for AttributeDescriptorReferenceType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="AttributeDescriptorReferenceType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ComponentListReferenceType">       &lt;choice>         &lt;sequence>           &lt;element name="Ref" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}AttributeDescriptorRefType" form="unqualified"/>           &lt;element name="URN" type="{http://www.w3.org/2001/XMLSchema}anyURI" minOccurs="0" form="unqualified"/>         &lt;/sequence>         &lt;element name="URN" type="{http://www.w3.org/2001/XMLSchema}anyURI" form="unqualified"/>       &lt;/choice>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns4_AttributeRefType.description                                          = AttributeRefType contains a reference to an attribute within a data structure definition. Note that since there is only one attribute descriptor, the container reference fields are prohibited.<p>Java class for AttributeRefType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="AttributeRefType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ComponentRefBaseType">       &lt;attribute name="id" use="required" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}IDType" />       &lt;attribute name="class" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ComponentTypeCodelistType" fixed="Attribute" />       &lt;attribute name="package" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}StructurePackageTypeCodelistType" fixed="datastructure" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns4_AttributeReferenceType.description                                    = AttributeReferenceType is a type for referencing an attribute object. It consists of a URN and/or a complete set of reference fields.<p>Java class for AttributeReferenceType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="AttributeReferenceType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ComponentReferenceType">       &lt;choice>         &lt;sequence>           &lt;element name="Ref" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}AttributeRefType" form="unqualified"/>           &lt;element name="URN" type="{http://www.w3.org/2001/XMLSchema}anyURI" minOccurs="0" form="unqualified"/>         &lt;/sequence>         &lt;element name="URN" type="{http://www.w3.org/2001/XMLSchema}anyURI" form="unqualified"/>       &lt;/choice>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns4_AttributeValueSetType.description                                     = AttributeValueSetType defines the structure for providing values for a data attribute. If no values are provided, the attribute is implied to include/excluded from the region in which it is defined, with no regard to the value of the data attribute. Note that for metadata attributes which occur within other metadata attributes, a nested identifier can be provided. For example, a value of CONTACT.ADDRESS.STREET refers to the metadata attribute with the identifier STREET which exists in the ADDRESS metadata attribute in the CONTACT metadata attribute, which is defined at the root of the report structure.<p>Java class for AttributeValueSetType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="AttributeValueSetType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ComponentValueSetType">       &lt;choice minOccurs="0">         &lt;element name="Value" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}SimpleValueType" maxOccurs="unbounded"/>         &lt;element name="TimeRange" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}TimeRangeValueType"/>       &lt;/choice>       &lt;attribute name="id" use="required" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}SingleNCNameIDType" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns4_CategorisationRefType.description                                     = CategorisationRefType provides a reference to a categorisation via a complete set of reference fields.<p>Java class for CategorisationRefType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="CategorisationRefType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}MaintainableRefBaseType">       &lt;attribute name="class" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}MaintainableTypeCodelistType" fixed="Categorisation" />       &lt;attribute name="package" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}PackageTypeCodelistType" fixed="categoryscheme" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns4_CategorisationReferenceType.description                               = CategorisationReferenceType is a type for referencing a categorisation object. It consists of a URN and/or a complete set of reference fields.<p>Java class for CategorisationReferenceType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="CategorisationReferenceType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}MaintainableReferenceBaseType">       &lt;choice>         &lt;sequence>           &lt;element name="Ref" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}CategorisationRefType" form="unqualified"/>           &lt;element name="URN" type="{http://www.w3.org/2001/XMLSchema}anyURI" minOccurs="0" form="unqualified"/>         &lt;/sequence>         &lt;element name="URN" type="{http://www.w3.org/2001/XMLSchema}anyURI" form="unqualified"/>       &lt;/choice>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns4_CategoryRefType.description                                           = CategoryRefType references a category from within a category scheme. Reference fields are required for both the scheme and the item.<p>Java class for CategoryRefType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="CategoryRefType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ItemRefBaseType">       &lt;attribute name="maintainableParentID" use="required" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}IDType" />       &lt;attribute name="maintainableParentVersion" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}VersionType" default="1.0" />       &lt;attribute name="class" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ItemTypeCodelistType" fixed="Category" />       &lt;attribute name="package" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ItemSchemePackageTypeCodelistType" fixed="categoryscheme" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>

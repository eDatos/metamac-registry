api.doc.swagger.definitions.xml_ns6_SourceTargetType.description                                                   = <p>Java class for SourceTargetType.<p>The following schema fragment specifies the expected content contained within this class.<p><pre> &lt;simpleType name="SourceTargetType">   &lt;restriction base="{http://www.w3.org/2001/XMLSchema}string">     &lt;enumeration value="Any"/>     &lt;enumeration value="Source"/>     &lt;enumeration value="Target"/>   &lt;/restriction> &lt;/simpleType> </pre>
api.doc.swagger.definitions.xml_ns7_FooterMessageType.description                                                  = FooterMessageType defines the structure of a message that is contained in the footer of a message. It is a status message that have a severity code of Error, Information, or Warning added to it.<p>Java class for FooterMessageType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="FooterMessageType">   &lt;complexContent>     &lt;extension base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}CodedStatusMessageType">       &lt;attribute name="severity" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/message/footer}SeverityCodeType" />     &lt;/extension>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns7_FooterMessageType.properties.severity.description                              = .
api.doc.swagger.definitions.xml_ns7_FooterType.description                                                         = FooterType describes the structure of a message footer. The footer is used to convey any error, information, or warning messages. This is to be used when the message has payload, but also needs to communicate additional information. If an error occurs and no payload is generated, an Error message should be returned.<p>Java class for FooterType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="FooterType">   &lt;complexContent>     &lt;restriction base="{http://www.w3.org/2001/XMLSchema}anyType">       &lt;sequence>         &lt;element name="Message" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/message/footer}FooterMessageType" maxOccurs="unbounded"/>       &lt;/sequence>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns7_FooterType.properties.Message.description                                      = .
api.doc.swagger.definitions.xml_ns7_QueryableDataSourceType.description                                            = QueryableDataSourceType describes a queryable data source, and add a fixed attribute for ensuring only one queryable source can be provided.<p>Java class for QueryableDataSourceType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="QueryableDataSourceType">   &lt;complexContent>     &lt;extension base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}QueryableDataSourceType">       &lt;attribute name="TYPE" type="{http://www.w3.org/2001/XMLSchema}string" fixed="QUERY" />     &lt;/extension>   &lt;/complexContent> &lt;/complexType> </pre>

api.doc.swagger.definitions.xml_ns5_ValueMapType.description                                                       = ValueMapType contains a collection of value mappings, which give a source and target value.<p>Java class for ValueMapType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="ValueMapType">   &lt;complexContent>     &lt;restriction base="{http://www.w3.org/2001/XMLSchema}anyType">       &lt;sequence>         &lt;element name="ValueMapping" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}ValueMappingType" maxOccurs="unbounded"/>       &lt;/sequence>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>

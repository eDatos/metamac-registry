api.doc.swagger.definitions.xml_ns3_MessageType.description                                                        = MessageType is an abstract type which is used by all of the messages, to allow inheritance of common features. Every message consists of a mandatory header, followed by optional payload (which may occur multiple times), and finally an optional footer section for conveying error, warning, and informational messages.<p>Java class for MessageType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="MessageType">   &lt;complexContent>     &lt;restriction base="{http://www.w3.org/2001/XMLSchema}anyType">       &lt;sequence>         &lt;element name="Header" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/message}BaseHeaderType"/>         &lt;any namespace='http://www.sdmx.org/resources/sdmxml/schemas/v2_1/message' maxOccurs="unbounded" minOccurs="0"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/message/footer}Footer" minOccurs="0"/>       &lt;/sequence>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>

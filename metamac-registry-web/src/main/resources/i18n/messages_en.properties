api.doc.swagger.definitions.xml_ns1_FooterType.description                                                         = FooterType describes the structure of a message footer. The footer is used to convey any error, information, or warning messages. This is to be used when the message has payload, but also needs to communicate additional information. If an error occurs and no payload is generated, an Error message should be returned.<p>Java class for FooterType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="FooterType">   &lt;complexContent>     &lt;restriction base="{http://www.w3.org/2001/XMLSchema}anyType">       &lt;sequence>         &lt;element name="Message" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/message/footer}FooterMessageType" maxOccurs="unbounded"/>       &lt;/sequence>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns1_FooterType.properties.Message.description                                      = .
api.doc.swagger.definitions.xml_ns1_SeverityCodeType.description                                                   = <p>Java class for SeverityCodeType.<p>The following schema fragment specifies the expected content contained within this class.<p><pre> &lt;simpleType name="SeverityCodeType">   &lt;restriction base="{http://www.w3.org/2001/XMLSchema}string">     &lt;enumeration value="Error"/>     &lt;enumeration value="Warning"/>     &lt;enumeration value="Information"/>   &lt;/restriction> &lt;/simpleType> </pre>
api.doc.swagger.definitions.xml_ns3_BaseHeaderType.description                                                     = BaseHeaderType in an abstract base type that defines the basis for all message headers. Specific message formats will refine this<p>Java class for BaseHeaderType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="BaseHeaderType">   &lt;complexContent>     &lt;restriction base="{http://www.w3.org/2001/XMLSchema}anyType">       &lt;sequence>         &lt;element name="ID" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}IDType"/>         &lt;element name="Test" type="{http://www.w3.org/2001/XMLSchema}boolean"/>         &lt;element name="Prepared" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/message}HeaderTimeType"/>         &lt;element name="Sender" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/message}SenderType"/>         &lt;element name="Receiver" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/message}PartyType" maxOccurs="unbounded" minOccurs="0"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Name" maxOccurs="unbounded" minOccurs="0"/>         &lt;element name="Structure" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}PayloadStructureType" maxOccurs="unbounded" minOccurs="0"/>         &lt;element name="DataProvider" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}DataProviderReferenceType" minOccurs="0"/>         &lt;element name="DataSetAction" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ActionType" minOccurs="0"/>         &lt;element name="DataSetID" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}IDType" maxOccurs="unbounded" minOccurs="0"/>         &lt;element name="Extracted" type="{http://www.w3.org/2001/XMLSchema}dateTime" minOccurs="0"/>         &lt;element name="ReportingBegin" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ObservationalTimePeriodType" minOccurs="0"/>         &lt;element name="ReportingEnd" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ObservationalTimePeriodType" minOccurs="0"/>         &lt;element name="EmbargoDate" type="{http://www.w3.org/2001/XMLSchema}dateTime" minOccurs="0"/>         &lt;element name="Source" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}TextType" maxOccurs="unbounded" minOccurs="0"/>       &lt;/sequence>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>

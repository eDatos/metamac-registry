api.doc.swagger.definitions.xml_ns3_ObsOnlyType.description                                                        = ObsOnlyType defines the structure for an un-grouped observation. Unlike a group observation, an un-grouped must provided a full set of values for every dimension declared in the data structure definition. The observation can contain an observed value and/or a collection of attribute values.<p>Java class for ObsOnlyType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="ObsOnlyType">   &lt;complexContent>     &lt;extension base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}AnnotableType">       &lt;sequence>         &lt;element name="ObsKey" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/data/generic}ValuesType"/>         &lt;element name="ObsValue" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/data/generic}ObsValueType" minOccurs="0"/>         &lt;element name="Attributes" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/data/generic}ValuesType" minOccurs="0"/>       &lt;/sequence>     &lt;/extension>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns3_ObsOnlyType.properties.Attributes.description                                  = .
api.doc.swagger.definitions.xml_ns3_ObsOnlyType.properties.ObsKey.description                                      = .
api.doc.swagger.definitions.xml_ns3_ObsOnlyType.properties.ObsValue.description                                    = .
api.doc.swagger.definitions.xml_ns3_ObsType.description                                                            = ObsType defines the structure of a grouped observation. The observation must be provided a value for the dimension which is declared to be at the observation level for this data set. This dimension value should disambiguate the observation within the series in which it is defined (i.e. there should not be another observation with the same dimension value). The observation can contain an observed value and/or attribute values.<p>Java class for ObsType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="ObsType">   &lt;complexContent>     &lt;extension base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}AnnotableType">       &lt;sequence>         &lt;element name="ObsDimension" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/data/generic}BaseValueType"/>         &lt;element name="ObsValue" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/data/generic}ObsValueType" minOccurs="0"/>         &lt;element name="Attributes" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/data/generic}ValuesType" minOccurs="0"/>       &lt;/sequence>     &lt;/extension>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns3_ObsType.properties.Attributes.description                                      = .
api.doc.swagger.definitions.xml_ns3_ObsType.properties.ObsDimension.description                                    = .
api.doc.swagger.definitions.xml_ns3_ObsType.properties.ObsValue.description                                        = .
api.doc.swagger.definitions.xml_ns3_ObsValueType.description                                                       = ObsValueType is a derivation of the BaseValueType which is used to provide an observation value. Since an observation value is always associated with the data structure definition primary measure, and the identifier for the primary measure is fixed, the component reference for this structure is fixed. Note that this means that it is not necessary to provide a value in an instance as the fixed value will be provided in the post validation information set.<p>Java class for ObsValueType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="ObsValueType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/data/generic}BaseValueType">       &lt;attribute name="id" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}NCNameIDType" fixed="OBS_VALUE" />       &lt;attribute name="value" use="required" type="{http://www.w3.org/2001/XMLSchema}string" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns3_OrganisationSchemeQueryType.description                                        = OrganisationSchemeQueryType defines the structure of an organisation scheme query message.<p>Java class for OrganisationSchemeQueryType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="OrganisationSchemeQueryType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/message}MessageType">       &lt;sequence>         &lt;element name="Header" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/message}BasicHeaderType"/>         &lt;element name="Query" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/query}OrganisationSchemeQueryType"/>       &lt;/sequence>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns3_PartyType.description                                                          = PartyType defines the information which is sent about various parties such as senders and receivers of messages.<p>Java class for PartyType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="PartyType">   &lt;complexContent>     &lt;restriction base="{http://www.w3.org/2001/XMLSchema}anyType">       &lt;sequence>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Name" maxOccurs="unbounded" minOccurs="0"/>         &lt;element name="Contact" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/message}ContactType" maxOccurs="unbounded" minOccurs="0"/>       &lt;/sequence>       &lt;attribute name="id" use="required" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}IDType" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>

api.doc.swagger.definitions.xml_ns1_FooterMessageType.description                                                  = FooterMessageType defines the structure of a message that is contained in the footer of a message. It is a status message that have a severity code of Error, Information, or Warning added to it.<p>Java class for FooterMessageType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="FooterMessageType">   &lt;complexContent>     &lt;extension base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}CodedStatusMessageType">       &lt;attribute name="severity" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/message/footer}SeverityCodeType" />     &lt;/extension>   &lt;/complexContent> &lt;/complexType> </pre>

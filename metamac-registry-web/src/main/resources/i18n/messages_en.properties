api.doc.swagger.definitions.xml_ns5_ItemSchemeType.description                                                     = ItemSchemeType is an abstract base type for all item scheme objects. It contains a collection of items. Concrete instances of this type should restrict the actual types of items allowed within the scheme.<p>Java class for ItemSchemeType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="ItemSchemeType">   &lt;complexContent>     &lt;extension base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}MaintainableType">       &lt;sequence>         &lt;sequence maxOccurs="unbounded" minOccurs="0">           &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}Item"/>         &lt;/sequence>       &lt;/sequence>       &lt;attribute name="isPartial" type="{http://www.w3.org/2001/XMLSchema}boolean" default="false" />     &lt;/extension>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_ItemSchemeType.properties.Item.description                                     = .
api.doc.swagger.definitions.xml_ns5_ItemSchemeType.properties.isPartial.description                                = .
api.doc.swagger.definitions.xml_ns5_ItemType.description                                                           = ItemType is an abstract base type for all items with in an item scheme. Concrete instances of this type may or may not utilize the nested item, but if so should restrict the actual types of item allowed.<p>Java class for ItemType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="ItemType">   &lt;complexContent>     &lt;extension base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}ItemBaseType">       &lt;choice minOccurs="0">         &lt;element name="Parent" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}LocalItemReferenceType"/>         &lt;sequence maxOccurs="unbounded">           &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}Item"/>         &lt;/sequence>       &lt;/choice>     &lt;/extension>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_ItemType.properties.Item.description                                           = .
api.doc.swagger.definitions.xml_ns5_ItemType.properties.Parent.description                                         = .
api.doc.swagger.definitions.xml_ns5_KeyDescriptorValuesRepresentationType.description                              = KeyDescriptorValuesRepresentationType defines the possible local representations of a key descriptor values target object. The representation is fixed to always be a data key (KeyValues).<p>Java class for KeyDescriptorValuesRepresentationType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="KeyDescriptorValuesRepresentationType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}RepresentationType">       &lt;sequence>         &lt;element name="TextFormat" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}KeyDescriptorValuesTextFormatType"/>       &lt;/sequence>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_KeyDescriptorValuesTargetType.description                                      = KeyDescriptorValuesTargetType defines the structure of a key descriptor values target object. The key descriptor values target object has a fixed representation and identifier.<p>Java class for KeyDescriptorValuesTargetType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="KeyDescriptorValuesTargetType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}TargetObject">       &lt;sequence>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Annotations" minOccurs="0"/>         &lt;element name="LocalRepresentation" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}KeyDescriptorValuesRepresentationType"/>       &lt;/sequence>       &lt;attribute name="id" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}NCNameIDType" fixed="DIMENSION_DESCRIPTOR_VALUES_TARGET" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_KeyDescriptorValuesTextFormatType.description                                  = KeyDescriptorValuesTextFormatType is a restricted version of the NonFacetedTextFormatType that specifies a fixed KeyValues representation.<p>Java class for KeyDescriptorValuesTextFormatType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="KeyDescriptorValuesTextFormatType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}TargetObjectTextFormatType">       &lt;attribute name="textType" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}TargetObjectDataType" fixed="KeyValues" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_KeySetType.description                                                         = KeySetType is an abstract base type for defining a collection of keys.<p>Java class for KeySetType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="KeySetType">   &lt;complexContent>     &lt;restriction base="{http://www.w3.org/2001/XMLSchema}anyType">       &lt;sequence>         &lt;element name="Key" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}DistinctKeyType" maxOccurs="unbounded"/>       &lt;/sequence>       &lt;attribute name="isIncluded" use="required" type="{http://www.w3.org/2001/XMLSchema}boolean" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_KeySetType.properties.Key.description                                          = .
api.doc.swagger.definitions.xml_ns5_KeySetType.properties.isIncluded.description                                   = .
api.doc.swagger.definitions.xml_ns5_LevelBaseType.description                                                      = LevelBaseType is an abstract base type that makes up the basis for the LevelType. It requires a name and id.<p>Java class for LevelBaseType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="LevelBaseType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}NameableType">       &lt;sequence>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Annotations" minOccurs="0"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Name" maxOccurs="unbounded"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Description" maxOccurs="unbounded" minOccurs="0"/>       &lt;/sequence>       &lt;attribute name="id" use="required" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}IDType" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_LevelType.description                                                          = LevelType describes a level in a hierarchical codelist. Where level is defined as a group where codes can be characterised by homogeneous coding, and where the parent of each code in the group is at the same higher level of the hierarchy.<p>Java class for LevelType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="LevelType">   &lt;complexContent>     &lt;extension base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}LevelBaseType">       &lt;sequence>         &lt;element name="CodingFormat" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}CodingTextFormatType" minOccurs="0"/>         &lt;element name="Level" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}LevelType" minOccurs="0"/>       &lt;/sequence>     &lt;/extension>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_LevelType.properties.CodingFormat.description                                  = .
api.doc.swagger.definitions.xml_ns5_LevelType.properties.Level.description                                         = .
api.doc.swagger.definitions.xml_ns5_MaintainableBaseType.description                                               = MaintainableBaseType is an abstract type that only serves the purpose of forming the base for the actual MaintainableType. The purpose of this type is to restrict the VersionableType to require the id attribute.<p>Java class for MaintainableBaseType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="MaintainableBaseType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}VersionableType">       &lt;sequence>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Annotations" minOccurs="0"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Name" maxOccurs="unbounded"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Description" maxOccurs="unbounded" minOccurs="0"/>       &lt;/sequence>       &lt;attribute name="id" use="required" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}IDType" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_MaintainableType.description                                                   = MaintainableType is an abstract base type for all maintainable objects.<p>Java class for MaintainableType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="MaintainableType">   &lt;complexContent>     &lt;extension base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}MaintainableBaseType">       &lt;attGroup ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ExternalReferenceAttributeGroup"/>       &lt;attribute name="agencyID" use="required" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}NestedNCNameIDType" />       &lt;attribute name="isFinal" type="{http://www.w3.org/2001/XMLSchema}boolean" default="false" />       &lt;attribute name="isExternalReference" type="{http://www.w3.org/2001/XMLSchema}boolean" default="false" />     &lt;/extension>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_MaintainableType.properties.agencyID.description                               = .

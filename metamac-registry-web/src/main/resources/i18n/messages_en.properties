api.doc.swagger.definitions.xml_ns4_TimeDimensionRefType.description                                               = TimeDimensionRefType contains a reference to the time dimension within a data structure definition. Note that since there is only one key descriptor, the container reference fields are prohibited.<p>Java class for TimeDimensionRefType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="TimeDimensionRefType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ComponentRefBaseType">       &lt;attribute name="id" use="required" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}IDType" fixed="TIME_PERIOD" />       &lt;attribute name="class" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}DimensionTypeCodelistType" fixed="TimeDimension" />       &lt;attribute name="package" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}StructurePackageTypeCodelistType" fixed="datastructure" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>

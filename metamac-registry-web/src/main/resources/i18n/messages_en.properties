api.doc.swagger.definitions.xml_ns4_TransitionRefType.description                                                  = TransitionRefType provides for a reference to a transition definition in process step through its id.<p>Java class for TransitionRefType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="TransitionRefType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ContainerChildObjectRefBaseType">       &lt;attribute name="containerID" use="required" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}NestedIDType" />       &lt;attribute name="class" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ObjectTypeCodelistType" fixed="Transition" />       &lt;attribute name="package" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}PackageTypeCodelistType" fixed="process" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns4_TransitionReferenceType.description                                            = TransiationReferenceType is a type for referencing a process step object. It consists of a URN and/or a complete set of reference fields.<p>Java class for TransitionReferenceType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="TransitionReferenceType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ContainerChildObjectReferenceType">       &lt;choice>         &lt;sequence>           &lt;element name="Ref" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}TransitionRefType" form="unqualified"/>           &lt;element name="URN" type="{http://www.w3.org/2001/XMLSchema}anyURI" minOccurs="0" form="unqualified"/>         &lt;/sequence>         &lt;element name="URN" type="{http://www.w3.org/2001/XMLSchema}anyURI" form="unqualified"/>       &lt;/choice>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns4_URNReferenceType.description                                                   = URNReferenceType is a type referencing any object via its URN. The exact type of object is not specified, although it can be determined from the URN value.<p>Java class for URNReferenceType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="URNReferenceType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ReferenceType">       &lt;sequence>         &lt;element name="URN" type="{http://www.w3.org/2001/XMLSchema}anyURI" form="unqualified"/>       &lt;/sequence>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns4_XHTMLType.description                                                          = XHTMLType allows for mixed content of text and XHTML tags. When using this type, one will have to provide a reference to the XHTML schema, since the processing of the tags within this type is strict, meaning that they are validated against the XHTML schema provided.<p>Java class for XHTMLType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="XHTMLType">   &lt;complexContent>     &lt;restriction base="{http://www.w3.org/2001/XMLSchema}anyType">       &lt;sequence maxOccurs="unbounded" minOccurs="0">         &lt;any namespace='http://www.w3.org/1999/xhtml'/>       &lt;/sequence>       &lt;attribute ref="{http://www.w3.org/XML/1998/namespace}lang default="en""/>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns4_XHTMLType.properties.lang.description                                          = .
api.doc.swagger.definitions.xml_ns5_AgencySchemeType.description                                                   = AgencySchemeType defines a specific type of organisation scheme which contains only maintenance agencies. The agency scheme maintained by a particular maintenance agency is always provided a fixed identifier and version, and is never final. Therefore, agencies can be added or removed without have to version the scheme. Agencies schemes have no hierarchy, meaning that no agency may define a relationship with another agency in the scheme. In fact, the actual parent agency for an agency in a scheme is the agency which defines the scheme.<p>Java class for AgencySchemeType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="AgencySchemeType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}OrganisationSchemeType">       &lt;sequence>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Annotations" minOccurs="0"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Name" maxOccurs="unbounded"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Description" maxOccurs="unbounded" minOccurs="0"/>         &lt;sequence maxOccurs="unbounded" minOccurs="0">           &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}Agency"/>         &lt;/sequence>       &lt;/sequence>       &lt;attribute name="id" use="required" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}IDType" fixed="AGENCIES" />       &lt;attribute name="version" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}VersionType" fixed="1.0" />       &lt;attribute name="isFinal" type="{http://www.w3.org/2001/XMLSchema}boolean" fixed="false" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_AgencyType.description                                                         = AgencyType defines the structure of an agency description. The contacts defined for the organisation are specific to the agency role the organisation is serving.<p>Java class for AgencyType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="AgencyType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}OrganisationType">       &lt;sequence>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Annotations" minOccurs="0"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Name" maxOccurs="unbounded"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Description" maxOccurs="unbounded" minOccurs="0"/>         &lt;element name="Contact" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}ContactType" maxOccurs="unbounded" minOccurs="0"/>       &lt;/sequence>       &lt;attribute name="id" use="required" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}NCNameIDType" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_AttachmentConstraintAttachmentType.description                                 = AttachmentConstraintAttachmentType defines the structure for specifying the object to which an attachment constraints applies.<p>Java class for AttachmentConstraintAttachmentType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="AttachmentConstraintAttachmentType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}ConstraintAttachmentType">       &lt;choice>         &lt;element name="DataSet" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}SetReferenceType" maxOccurs="unbounded"/>         &lt;element name="MetadataSet" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}SetReferenceType" maxOccurs="unbounded"/>         &lt;element name="SimpleDataSource" type="{http://www.w3.org/2001/XMLSchema}anyURI" maxOccurs="unbounded"/>         &lt;choice>           &lt;element name="DataStructure" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}DataStructureReferenceType" maxOccurs="unbounded"/>           &lt;element name="MetadataStructure" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}MetadataStructureReferenceType" maxOccurs="unbounded"/>           &lt;element name="Dataflow" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}DataflowReferenceType" maxOccurs="unbounded"/>           &lt;element name="Metadataflow" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}MetadataflowReferenceType" maxOccurs="unbounded"/>           &lt;element name="ProvisionAgreement" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ProvisionAgreementReferenceType" maxOccurs="unbounded"/>         &lt;/choice>       &lt;/choice>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_AttachmentConstraintType.description                                           = AttachmentConstraintType describes the details of an attachment constraint by defining the data or metadata key sets or component regions that attributes or reference metadata may be attached in the constraint attachment objects.<p>Java class for AttachmentConstraintType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="AttachmentConstraintType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}ConstraintType">       &lt;sequence>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Annotations" minOccurs="0"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Name" maxOccurs="unbounded"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Description" maxOccurs="unbounded" minOccurs="0"/>         &lt;element name="ConstraintAttachment" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}AttachmentConstraintAttachmentType" minOccurs="0"/>         &lt;choice maxOccurs="unbounded" minOccurs="0">           &lt;element name="DataKeySet" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}DataKeySetType"/>           &lt;element name="MetadataKeySet" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}MetadataKeySetType"/>         &lt;/choice>       &lt;/sequence>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_AttributeBaseType.description                                                  = AttributeBaseType is an abstract base type that serves as the basis for the AttributeType. It restricts the text format base to a text format valid  for data components (that does not allow for XHTML representation). The local representation is restricted to the values defined in codelist. The concept role is restricted to the values valid for a data attribute.<p>Java class for AttributeBaseType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="AttributeBaseType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}ComponentType">       &lt;sequence>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Annotations" minOccurs="0"/>         &lt;element name="ConceptIdentity" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ConceptReferenceType"/>         &lt;element name="LocalRepresentation" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}SimpleDataStructureRepresentationType" minOccurs="0"/>       &lt;/sequence>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_AttributeListBaseType.description                                              = AttributeListBaseType is an abstract base type used as the basis for the AttributeListType.<p>Java class for AttributeListBaseType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="AttributeListBaseType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}ComponentListType">       &lt;sequence>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Annotations" minOccurs="0"/>       &lt;/sequence>       &lt;attribute name="id" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}IDType" fixed="AttributeDescriptor" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_AttributeListType.description                                                  = AttributeListType describes the attribute descriptor for the data structure definition.<p>Java class for AttributeListType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="AttributeListType">   &lt;complexContent>     &lt;extension base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}AttributeListBaseType">       &lt;choice maxOccurs="unbounded">         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}Attribute"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}ReportingYearStartDay"/>       &lt;/choice>     &lt;/extension>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_AttributeListType.properties.ReportingYearStartDay.description                 = .
api.doc.swagger.definitions.xml_ns5_AttributeRelationshipType.description                                          = AttributeRelationshipType defines the structure for stating the relationship between an attribute and other data structure definition components.<p>Java class for AttributeRelationshipType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="AttributeRelationshipType">   &lt;complexContent>     &lt;restriction base="{http://www.w3.org/2001/XMLSchema}anyType">       &lt;choice>         &lt;element name="None" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}EmptyType"/>         &lt;sequence>           &lt;element name="Dimension" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}LocalDimensionReferenceType" maxOccurs="unbounded"/>           &lt;element name="AttachmentGroup" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}LocalGroupKeyDescriptorReferenceType" maxOccurs="unbounded" minOccurs="0"/>         &lt;/sequence>         &lt;element name="Group" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}LocalGroupKeyDescriptorReferenceType"/>         &lt;element name="PrimaryMeasure" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}LocalPrimaryMeasureReferenceType"/>       &lt;/choice>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>

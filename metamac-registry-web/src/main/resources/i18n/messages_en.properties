api.doc.swagger.definitions.xml_ns3_StructureHeaderType.description                                                = StructureHeaderType defines the structure for structural metadata messages.
api.doc.swagger.definitions.xml_ns3_StructureSetQueryType.description                                              = StructureSetQueryType defines the structure of a structure set query message.
api.doc.swagger.definitions.xml_ns3_StructureSpecificDataHeaderType.description                                    = StructureSpecificDataHeaderType defines the header structure for a structure specific data message.
api.doc.swagger.definitions.xml_ns3_StructureSpecificDataType.description                                          = StructureSpecificDataType defines the structure of the structure specific data message. Note that the data set payload type is abstract, and therefore it will have to be assigned a type in an instance. This type must be derived from the base type referenced. This base type defines a general structure which can be followed to allow for generic processing of the data even if the exact details of the data structure specific format are not known.
api.doc.swagger.definitions.xml_ns3_StructureSpecificMetadataHeaderType.description                                = StructureSpecificMetadataHeaderType defines the header format for metadata structure definition specific reference metadata messages.
api.doc.swagger.definitions.xml_ns3_StructureSpecificMetadataType.description                                      = StructureSpecificMetadataType defines the structure of a structure specific metadata message. Note that the metadata set payload type is abstract, and therefore it will have to be assigned a type in an instance. This type must be derived from the base type referenced. This base type defines a general structure which can be followed to allow for generic processing of the data even if the exact details of the data structure specific format are not known.
api.doc.swagger.definitions.xml_ns3_StructureSpecificTimeSeriesDataHeaderType.description                          = StructureSpecificTimeSeriesDataHeaderType defines the header structure for a time series only structure specific data message.
api.doc.swagger.definitions.xml_ns3_StructureSpecificTimeSeriesDataQueryType.description                           = StructureSpecificTimeSeriesDataQueryType defines the structure of a time series generic data query message.

api.doc.swagger.definitions.xml_ns4_LocalReportStructureRefType.description                               = LocalReportStructureRefType contains a local reference to a report structure object.<p>Java class for LocalReportStructureRefType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="LocalReportStructureRefType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}LocalComponentListRefBaseType">       &lt;attribute name="class" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ComponentListTypeCodelistType" fixed="ReportStructure" />       &lt;attribute name="package" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}StructurePackageTypeCodelistType" fixed="metadatastructure" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns4_LocalReportStructureReferenceType.description                         = LocalReportStructureReferenceType is a type for referencing a report structure locally, where the reference to the metadata structure definition which defines it is provided in another context (for example the metadata structure definition in which the reference occurs).<p>Java class for LocalReportStructureReferenceType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="LocalReportStructureReferenceType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}LocalComponentListReferenceType">       &lt;sequence>         &lt;element name="Ref" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}LocalReportStructureRefType" form="unqualified"/>       &lt;/sequence>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns4_LocalReportingCategoryRefType.description                             = LocalReportingCategoryRefType references a reporting category locally where the references to the reporting taxonomy which defines it is provided elsewhere.<p>Java class for LocalReportingCategoryRefType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="LocalReportingCategoryRefType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}LocalItemRefBaseType">       &lt;attribute name="class" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ItemTypeCodelistType" fixed="ReportingCategory" />       &lt;attribute name="package" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ItemSchemePackageTypeCodelistType" fixed="categoryscheme" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns4_LocalReportingCategoryReferenceType.description                       = LocalReportingCategoryReferenceType provides a simple references to a reporting category where the identification of the reporting taxonomy which defines it is contained in another context.<p>Java class for LocalReportingCategoryReferenceType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="LocalReportingCategoryReferenceType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}LocalItemReferenceType">       &lt;sequence>         &lt;element name="Ref" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}LocalReportingCategoryRefType" form="unqualified"/>       &lt;/sequence>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns4_LocalTargetObjectRefType.description                                  = LocalTargetObjectRefType contains the reference fields for referencing a target object locally.<p>Java class for LocalTargetObjectRefType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="LocalTargetObjectRefType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}LocalComponentRefBaseType">       &lt;attribute name="class" use="required" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}TargetObjectTypeCodelistType" />       &lt;attribute name="package" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}StructurePackageTypeCodelistType" fixed="metadatastructure" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns4_LocalTargetObjectReferenceType.description                            = LocalTargetObjectReferenceType is a type for referencing any type of target object within a metadata target locally, where the references to the metadata target and the  metadata structure definition which defines the target reference are provided in another context.<p>Java class for LocalTargetObjectReferenceType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="LocalTargetObjectReferenceType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}LocalComponentReferenceBaseType">       &lt;sequence>         &lt;element name="Ref" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}LocalTargetObjectRefType" form="unqualified"/>       &lt;/sequence>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns4_MaintainableRefBaseType.description                                   = MaintainableRefBaseType is an abstract base type for referencing a maintainable object.<p>Java class for MaintainableRefBaseType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="MaintainableRefBaseType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}RefBaseType">       &lt;attribute name="agencyID" use="required" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}NestedNCNameIDType" />       &lt;attribute name="id" use="required" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}IDType" />       &lt;attribute name="version" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}VersionType" default="1.0" />       &lt;attribute name="local" type="{http://www.w3.org/2001/XMLSchema}boolean" fixed="false" />       &lt;attribute name="class" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}MaintainableTypeCodelistType" />       &lt;attribute name="package" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}PackageTypeCodelistType" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns4_MaintainableRefType.description                                       = MaintainableRefType contains a complete set of reference fields for referencing any maintainable object.<p>Java class for MaintainableRefType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="MaintainableRefType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}MaintainableRefBaseType">       &lt;attribute name="class" use="required" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ConcreteMaintainableTypeCodelistType" />       &lt;attribute name="package" use="required" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}PackageTypeCodelistType" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns4_MaintainableReferenceBaseType.description                             = MaintainableReferenceBaseType is an abstract base type for referencing a maintainable object. It consists of a URN and/or a complete set of reference fields; agency, id, and version.<p>Java class for MaintainableReferenceBaseType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="MaintainableReferenceBaseType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ReferenceType">       &lt;choice>         &lt;sequence>           &lt;element name="Ref" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}MaintainableRefBaseType" form="unqualified"/>           &lt;element name="URN" type="{http://www.w3.org/2001/XMLSchema}anyURI" minOccurs="0" form="unqualified"/>         &lt;/sequence>         &lt;element name="URN" type="{http://www.w3.org/2001/XMLSchema}anyURI" form="unqualified"/>       &lt;/choice>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns4_MaintainableReferenceType.description                                 = MaintainableReferenceType is a type for referencing any maintainable object. It consists of a URN and/or a complete set of reference fields; agency, id, and version.<p>Java class for MaintainableReferenceType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="MaintainableReferenceType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}MaintainableReferenceBaseType">       &lt;choice>         &lt;sequence>           &lt;element name="Ref" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}MaintainableRefType" form="unqualified"/>           &lt;element name="URN" type="{http://www.w3.org/2001/XMLSchema}anyURI" minOccurs="0" form="unqualified"/>         &lt;/sequence>         &lt;element name="URN" type="{http://www.w3.org/2001/XMLSchema}anyURI" form="unqualified"/>       &lt;/choice>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns4_MeasureDescriptorRefType.description                                  = MeasureDescriptorRefType contains a reference to the measure descriptor within a data structure definition.<p>Java class for MeasureDescriptorRefType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="MeasureDescriptorRefType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ComponentListRefBaseType">       &lt;attribute name="id" use="required" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}IDType" fixed="MEASURE_DESCRIPTOR" />       &lt;attribute name="class" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ComponentListTypeCodelistType" fixed="MeasureDescriptor" />       &lt;attribute name="package" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}StructurePackageTypeCodelistType" fixed="datastructure" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns4_MeasureDescriptorReferenceType.description                            = MeasureDescriptorReferenceType is a type for referencing a measure descriptor object. It consists of a URN and/or a complete set of reference fields.<p>Java class for MeasureDescriptorReferenceType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="MeasureDescriptorReferenceType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ComponentListReferenceType">       &lt;choice>         &lt;sequence>           &lt;element name="Ref" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}MeasureDescriptorRefType" form="unqualified"/>           &lt;element name="URN" type="{http://www.w3.org/2001/XMLSchema}anyURI" minOccurs="0" form="unqualified"/>         &lt;/sequence>         &lt;element name="URN" type="{http://www.w3.org/2001/XMLSchema}anyURI" form="unqualified"/>       &lt;/choice>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns4_MeasureDimensionRefType.description                                   = MeasureDimensionRefType contains a reference to the measure dimension within a data structure definition. Note that since there is only one key descriptor, the container reference fields are prohibited.<p>Java class for MeasureDimensionRefType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="MeasureDimensionRefType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ComponentRefBaseType">       &lt;attribute name="id" use="required" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}IDType" />       &lt;attribute name="class" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}DimensionTypeCodelistType" fixed="MeasureDimension" />       &lt;attribute name="package" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}StructurePackageTypeCodelistType" fixed="datastructure" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns4_MeasureDimensionReferenceType.description                             = MeasureDimensionReferenceType is a type for referencing a measure dimension object. It consists of a URN and/or a complete set of reference fields.<p>Java class for MeasureDimensionReferenceType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="MeasureDimensionReferenceType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ComponentReferenceType">       &lt;choice>         &lt;sequence>           &lt;element name="Ref" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}MeasureDimensionRefType" form="unqualified"/>           &lt;element name="URN" type="{http://www.w3.org/2001/XMLSchema}anyURI" minOccurs="0" form="unqualified"/>         &lt;/sequence>         &lt;element name="URN" type="{http://www.w3.org/2001/XMLSchema}anyURI" form="unqualified"/>       &lt;/choice>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns4_MetadataAttributeRefType.description                                  = MetadataAttributeRefType contains a reference to a metadata attribute within a report structure in a metadata structure definition.<p>Java class for MetadataAttributeRefType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="MetadataAttributeRefType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ComponentRefBaseType">       &lt;attribute name="containerID" use="required" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}IDType" />       &lt;attribute name="id" use="required" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}NestedIDType" />       &lt;attribute name="class" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ComponentTypeCodelistType" fixed="MetadataAttribute" />       &lt;attribute name="package" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}StructurePackageTypeCodelistType" fixed="metadatastructure" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns4_MetadataAttributeReferenceType.description                            = MetadataAttributeReferenceType is a type for referencing a metadata attribute object. It consists of a URN and/or a complete set of reference fields.<p>Java class for MetadataAttributeReferenceType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="MetadataAttributeReferenceType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ComponentReferenceType">       &lt;choice>         &lt;sequence>           &lt;element name="Ref" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}MetadataAttributeRefType" form="unqualified"/>           &lt;element name="URN" type="{http://www.w3.org/2001/XMLSchema}anyURI" minOccurs="0" form="unqualified"/>         &lt;/sequence>         &lt;element name="URN" type="{http://www.w3.org/2001/XMLSchema}anyURI" form="unqualified"/>       &lt;/choice>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns4_MetadataAttributeValueSetType.description                             = MetadataAttributeValueSetType defines the structure for providing values for a metadata attribute. If no values are provided, the attribute is implied to include/excluded from the region in which it is defined, with no regard to the value of the metadata attribute.<p>Java class for MetadataAttributeValueSetType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="MetadataAttributeValueSetType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ComponentValueSetType">       &lt;choice minOccurs="0">         &lt;element name="Value" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}SimpleValueType" maxOccurs="unbounded"/>         &lt;element name="TimeRange" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}TimeRangeValueType"/>       &lt;/choice>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns4_MetadataKeyType.description                                           = MetadataKeyType is a region which defines a distinct full or partial metadata key. The key consists of a set of values, each referencing a target object for the metadata target referenced in the metadataTarget attribute, which must be defined in the report structure referenced in the report attribute. Each target object can be assigned a single value. If an target object from the reference metadata target is not included in this key, the value of that is assumed to be all known objects for a reference target object, all possible keys for a key descriptor values target object, or all dates for report period target object. The purpose of this key reference a metadata conforming to a particular report structure for given object or set of objects.<p>Java class for MetadataKeyType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="MetadataKeyType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}DistinctKeyType">       &lt;sequence>         &lt;element name="KeyValue" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}MetadataKeyValueType" maxOccurs="unbounded"/>       &lt;/sequence>       &lt;attribute name="report" use="required" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}IDType" />       &lt;attribute name="metadataTarget" use="required" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}IDType" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns4_MetadataKeyValueType.description                                      = MetadataKeyValueType is a type for providing a target object value for the purpose of defining a distinct metadata key. Only a single value can be provided for the target object.<p>Java class for MetadataKeyValueType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="MetadataKeyValueType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}DinstinctKeyValueType">       &lt;choice>         &lt;element name="Value" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}SimpleKeyValueType"/>         &lt;element name="DataSet" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}SetReferenceType"/>         &lt;element name="DataKey" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}DataKeyType"/>         &lt;element name="Object" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ObjectReferenceType"/>       &lt;/choice>       &lt;attribute name="id" use="required" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}SingleNCNameIDType" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns4_MetadataStructureRefType.description                                  = MetadataStructureRefType contains a set of reference fields for a metadata structure definition.<p>Java class for MetadataStructureRefType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="MetadataStructureRefType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}StructureRefBaseType">       &lt;attribute name="class" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}StructureTypeCodelistType" fixed="MetadataStructure" />       &lt;attribute name="package" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}StructurePackageTypeCodelistType" fixed="metadatastructure" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns4_MetadataStructureReferenceType.description                            = MetadataStructureReferenceType is a type for referencing a metadata structure definition object. It consists of a URN and/or a complete set of reference fields.<p>Java class for MetadataStructureReferenceType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="MetadataStructureReferenceType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}StructureReferenceBaseType">       &lt;choice>         &lt;sequence>           &lt;element name="Ref" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}MetadataStructureRefType" form="unqualified"/>           &lt;element name="URN" type="{http://www.w3.org/2001/XMLSchema}anyURI" minOccurs="0" form="unqualified"/>         &lt;/sequence>         &lt;element name="URN" type="{http://www.w3.org/2001/XMLSchema}anyURI" form="unqualified"/>       &lt;/choice>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns4_MetadataTargetRefType.description                                     = MetadataTargetRefType contains a reference to a metadata target within a metadata structure definition.<p>Java class for MetadataTargetRefType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="MetadataTargetRefType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ComponentListRefBaseType">       &lt;attribute name="id" use="required" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}IDType" />       &lt;attribute name="class" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ComponentListTypeCodelistType" fixed="MetadataTarget" />       &lt;attribute name="package" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}StructurePackageTypeCodelistType" fixed="metadatastructure" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns4_MetadataTargetReferenceType.description                               = MetadataTargetReferenceType is a type for referencing a metadata target object. It consists of a URN and/or a complete set of reference fields.<p>Java class for MetadataTargetReferenceType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="MetadataTargetReferenceType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ComponentListReferenceType">       &lt;choice>         &lt;sequence>           &lt;element name="Ref" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}MetadataTargetRefType" form="unqualified"/>           &lt;element name="URN" type="{http://www.w3.org/2001/XMLSchema}anyURI" minOccurs="0" form="unqualified"/>         &lt;/sequence>         &lt;element name="URN" type="{http://www.w3.org/2001/XMLSchema}anyURI" form="unqualified"/>       &lt;/choice>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns4_MetadataTargetRegionKeyType.description                               = MetadataTargetRegionKeyType is a type for providing a set of values for a target object in a metadata target of a re fence metadata report. A set of values or a time range can be provided for a report period target object. A collection of the respective types of references can be provided for data set reference and identifiable object reference target objects. For a key descriptor values target object, a collection of data keys can be provided.<p>Java class for MetadataTargetRegionKeyType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="MetadataTargetRegionKeyType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ComponentValueSetType">       &lt;choice>         &lt;element name="Value" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}SimpleKeyValueType" maxOccurs="unbounded"/>         &lt;element name="DataSet" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}SetReferenceType" maxOccurs="unbounded"/>         &lt;element name="DataKey" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}DataKeyType" maxOccurs="unbounded"/>         &lt;element name="Object" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ObjectReferenceType" maxOccurs="unbounded"/>         &lt;element name="TimeRange" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}TimeRangeValueType"/>       &lt;/choice>       &lt;attribute name="id" use="required" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}SingleNCNameIDType" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns4_MetadataTargetRegionType.description                                  = MetadataTargetRegionType defines the structure of a metadata target region. A metadata target region must define the report structure and the metadata target from that structure on which the region is based. This type is based on the abstract RegionType and simply refines the key and attribute values to conform with what is applicable for target objects and metadata attributes, respectively. See the documentation of the base type for more details on how a region is defined.<p>Java class for MetadataTargetRegionType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="MetadataTargetRegionType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}RegionType">       &lt;sequence>         &lt;element name="KeyValue" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}MetadataTargetRegionKeyType" maxOccurs="unbounded" minOccurs="0"/>         &lt;element name="Attribute" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}MetadataAttributeValueSetType" maxOccurs="unbounded" minOccurs="0"/>       &lt;/sequence>       &lt;attribute name="report" use="required" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}IDType" />       &lt;attribute name="metadataTarget" use="required" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}IDType" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns4_MetadataflowRefType.description                                       = MetadataflowRefType contains a set of reference fields for a metadata flow.<p>Java class for MetadataflowRefType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="MetadataflowRefType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}StructureUsageRefBaseType">       &lt;attribute name="class" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}StructureUsageTypeCodelistType" fixed="Metadataflow" />       &lt;attribute name="package" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}StructurePackageTypeCodelistType" fixed="metadatastructure" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns4_MetadataflowReferenceType.description                                 = MetadataflowReferenceType is a type for referencing a metadata flow object. It consists of a URN and/or a complete set of reference fields.<p>Java class for MetadataflowReferenceType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="MetadataflowReferenceType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}StructureUsageReferenceBaseType">       &lt;choice>         &lt;sequence>           &lt;element name="Ref" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}MetadataflowRefType" form="unqualified"/>           &lt;element name="URN" type="{http://www.w3.org/2001/XMLSchema}anyURI" minOccurs="0" form="unqualified"/>         &lt;/sequence>         &lt;element name="URN" type="{http://www.w3.org/2001/XMLSchema}anyURI" form="unqualified"/>       &lt;/choice>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns4_ObjectRefType.description                                             = ObjectRefType contains a set of reference fields for the purpose of referencing any object. This cannot be a local reference, therefore the agency identifier is required. It is also required that the class and package be supplied for the referenced object such that a complete URN reference can be built from the values provided. Note that this is not capable of fully validating that all necessary fields are supplied for a given object type.<p>Java class for ObjectRefType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="ObjectRefType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}RefBaseType">       &lt;attribute name="agencyID" use="required" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}NestedNCNameIDType" />       &lt;attribute name="local" type="{http://www.w3.org/2001/XMLSchema}boolean" fixed="false" />       &lt;attribute name="class" use="required" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ObjectTypeCodelistType" />       &lt;attribute name="package" use="required" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}PackageTypeCodelistType" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns4_ObjectReferenceType.description                                       = ObjectReferenceType is a generic reference which allows for any object to be referenced. The type of object actually referenced can be determined from the URN or from the class attribute of the full set of reference fields.<p>Java class for ObjectReferenceType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="ObjectReferenceType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ReferenceType">       &lt;choice>         &lt;sequence>           &lt;element name="Ref" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ObjectRefType" form="unqualified"/>           &lt;element name="URN" type="{http://www.w3.org/2001/XMLSchema}anyURI" minOccurs="0" form="unqualified"/>         &lt;/sequence>         &lt;element name="URN" type="{http://www.w3.org/2001/XMLSchema}anyURI" form="unqualified"/>       &lt;/choice>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns4_ObjectTypeCodelistType.description                                    = <p>Java class for ObjectTypeCodelistType.<p>The following schema fragment specifies the expected content contained within this class.<p><pre> &lt;simpleType name="ObjectTypeCodelistType">   &lt;restriction base="{http://www.w3.org/2001/XMLSchema}string">     &lt;enumeration value="Any"/>     &lt;enumeration value="Agency"/>     &lt;enumeration value="AgencyScheme"/>     &lt;enumeration value="AttachmentConstraint"/>     &lt;enumeration value="Attribute"/>     &lt;enumeration value="AttributeDescriptor"/>     &lt;enumeration value="Categorisation"/>     &lt;enumeration value="Category"/>     &lt;enumeration value="CategorySchemeMap"/>     &lt;enumeration value="CategoryScheme"/>     &lt;enumeration value="Code"/>     &lt;enumeration value="CodeMap"/>     &lt;enumeration value="Codelist"/>     &lt;enumeration value="CodelistMap"/>     &lt;enumeration value="ComponentMap"/>     &lt;enumeration value="Concept"/>     &lt;enumeration value="ConceptMap"/>     &lt;enumeration value="ConceptScheme"/>     &lt;enumeration value="ConceptSchemeMap"/>     &lt;enumeration value="Constraint"/>     &lt;enumeration value="ConstraintTarget"/>     &lt;enumeration value="ContentConstraint"/>     &lt;enumeration value="Dataflow"/>     &lt;enumeration value="DataConsumer"/>     &lt;enumeration value="DataConsumerScheme"/>     &lt;enumeration value="DataProvider"/>     &lt;enumeration value="DataProviderScheme"/>     &lt;enumeration value="DataSetTarget"/>     &lt;enumeration value="DataStructure"/>     &lt;enumeration value="Dimension"/>     &lt;enumeration value="DimensionDescriptor"/>     &lt;enumeration value="DimensionDescriptorValuesTarget"/>     &lt;enumeration value="GroupDimensionDescriptor"/>     &lt;enumeration value="HierarchicalCode"/>     &lt;enumeration value="HierarchicalCodelist"/>     &lt;enumeration value="Hierarchy"/>     &lt;enumeration value="HybridCodelistMap"/
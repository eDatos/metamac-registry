api.doc.swagger.definitions.xml_ns5_MetadataKeySetType.description                                                 = MetadataKeySetType defines a collection of metadata keys (identifier component values).<p>Java class for MetadataKeySetType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="MetadataKeySetType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}KeySetType">       &lt;sequence>         &lt;element name="Key" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}MetadataKeyType" maxOccurs="unbounded"/>       &lt;/sequence>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_MetadataStructureType.description                                              = MetadataStructureType is used to describe a metadata structure definition, which is defined as a collection of metadata concepts, their structure and usage when used to collect or disseminate reference metadata.<p>Java class for MetadataStructureType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="MetadataStructureType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}StructureType">       &lt;sequence>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Annotations" minOccurs="0"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Name" maxOccurs="unbounded"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Description" maxOccurs="unbounded" minOccurs="0"/>         &lt;sequence minOccurs="0">           &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}MetadataStructureComponents"/>         &lt;/sequence>       &lt;/sequence>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_MetadataTargetBaseType.description                                             = MetadataTargetBaseType is an abstract base type which forms the basis for the MetadataTargetType.<p>Java class for MetadataTargetBaseType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="MetadataTargetBaseType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}ComponentListType">       &lt;sequence>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Annotations" minOccurs="0"/>       &lt;/sequence>       &lt;attribute name="id" use="required" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}IDType" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_MetadataTargetType.description                                                 = <p>Java class for MetadataTargetType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="MetadataTargetType">   &lt;complexContent>     &lt;extension base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}MetadataTargetBaseType">       &lt;choice maxOccurs="unbounded">         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}KeyDescriptorValuesTarget"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}DataSetTarget"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}ConstraintContentTarget"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}ReportPeriodTarget"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}IdentifiableObjectTarget"/>       &lt;/choice>     &lt;/extension>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_MetadataTargetType.properties.ConstraintContentTarget.description              = .

api.doc.swagger.definitions.xml_ns3_ComponentValueType.description                                                 = ComponentValueType is a derivation of the BaseValueType which requires that the component reference be provided. This is used when the identification of the component cannot be inferred from another context.<p>Java class for ComponentValueType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="ComponentValueType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/data/generic}BaseValueType">       &lt;attribute name="id" use="required" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}NCNameIDType" />       &lt;attribute name="value" use="required" type="{http://www.w3.org/2001/XMLSchema}string" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>

api.doc.swagger.definitions.xml_ns4_AgencySchemeRefType.description                                       = AgencySchemeRefType contains a set of reference fields for an agency scheme.<p>Java class for AgencySchemeRefType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="AgencySchemeRefType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}OrganisationSchemeRefBaseType">       &lt;attribute name="class" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}OrganisationSchemeTypeCodelistType" fixed="AgencyScheme" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>

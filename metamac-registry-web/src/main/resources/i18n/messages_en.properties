api.doc.swagger.definitions.xml_ns5_ItemAssociationType.description                                                = ItemAssociationType is an abstract type which defines the relationship between two items from the source and target item schemes of an item scheme map.<p>Java class for ItemAssociationType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="ItemAssociationType">   &lt;complexContent>     &lt;extension base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}AnnotableType">       &lt;sequence>         &lt;element name="Source" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}LocalItemReferenceType"/>         &lt;element name="Target" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}LocalItemReferenceType"/>       &lt;/sequence>     &lt;/extension>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_ItemAssociationType.properties.Source.description                              = .
api.doc.swagger.definitions.xml_ns5_ItemAssociationType.properties.Target.description                              = .
api.doc.swagger.definitions.xml_ns5_ItemBaseType.description                                                       = ItemBaseType is an abstract base type that forms the basis for the ItemType. It requires that at least an id be supplied for an item.<p>Java class for ItemBaseType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="ItemBaseType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}NameableType">       &lt;sequence>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Annotations" minOccurs="0"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Name" maxOccurs="unbounded"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Description" maxOccurs="unbounded" minOccurs="0"/>       &lt;/sequence>       &lt;attribute name="id" use="required" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}IDType" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_ItemSchemeMapBaseType.description                                              = ItemSchemeMapBaseType is an abstract base type which forms the basis for the ItemSchemeMapType.<p>Java class for ItemSchemeMapBaseType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="ItemSchemeMapBaseType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}NameableType">       &lt;sequence>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Annotations" minOccurs="0"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Name" maxOccurs="unbounded"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Description" maxOccurs="unbounded" minOccurs="0"/>       &lt;/sequence>       &lt;attribute name="id" use="required" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}IDType" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_ItemSchemeMapType.description                                                  = ItemSchemeMapType is an abstract base type which forms the basis for mapping items between item schemes of the same type.<p>Java class for ItemSchemeMapType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="ItemSchemeMapType">   &lt;complexContent>     &lt;extension base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}ItemSchemeMapBaseType">       &lt;sequence>         &lt;element name="Source" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ItemSchemeReferenceBaseType"/>         &lt;element name="Target" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ItemSchemeReferenceBaseType"/>         &lt;sequence maxOccurs="unbounded">           &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}ItemAssociation"/>         &lt;/sequence>       &lt;/sequence>     &lt;/extension>   &lt;/complexContent> &lt;/complexType> </pre>

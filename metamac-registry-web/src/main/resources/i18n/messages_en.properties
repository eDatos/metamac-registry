api.doc.swagger.definitions.xml_ns6_MappedObjectReferenceType.description                                          = MappedObjectReferenceType is a type for referencing any mappable object. It consists of a URN and/or a complete set of reference fields; agency, id, and version.
api.doc.swagger.definitions.xml_ns6_MappedObjectRefType.description                                                = MappedObjectRefType defines a set of reference fields for any type of mappable object.
api.doc.swagger.definitions.xml_ns6_MappedObjectType.description                                                   = MappedObjectType defines a structure for referencing an object and indicating whether it is the source, target, or either for the purposes of query for structure set containing the referenced object in one of the maps it defines.

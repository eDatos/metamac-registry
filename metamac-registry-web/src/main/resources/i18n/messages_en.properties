api.doc.swagger.definitions.xml_ns3_BaseValueType.description                                                      = BaseValueType is a general structure which contains a reference to a data structure definition component and a value for that component. In this structure the reference to the component is optional to allow for usages where the actual reference might be provided in another context.<p>Java class for BaseValueType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="BaseValueType">   &lt;complexContent>     &lt;restriction base="{http://www.w3.org/2001/XMLSchema}anyType">       &lt;attribute name="id" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}NCNameIDType" />       &lt;attribute name="value" use="required" type="{http://www.w3.org/2001/XMLSchema}anySimpleType" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>

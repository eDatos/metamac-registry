api.doc.swagger.definitions.xml_ns4_TimeRangeValueType.description                                                 = TimeRangeValueType allows a time period value to be expressed as a range. It can be expressed as the period before a period, after a period, or between two periods. Each of these properties can specify their inclusion in regards to the range.<p>Java class for TimeRangeValueType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="TimeRangeValueType">   &lt;complexContent>     &lt;restriction base="{http://www.w3.org/2001/XMLSchema}anyType">       &lt;choice>         &lt;element name="BeforePeriod" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}TimePeriodRangeType"/>         &lt;element name="AfterPeriod" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}TimePeriodRangeType"/>         &lt;sequence>           &lt;element name="StartPeriod" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}TimePeriodRangeType"/>           &lt;element name="EndPeriod" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}TimePeriodRangeType"/>         &lt;/sequence>       &lt;/choice>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>

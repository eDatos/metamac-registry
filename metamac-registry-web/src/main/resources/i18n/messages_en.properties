api.doc.swagger.definitions.xml_ns4_PayloadStructureType.properties.structureURL.description                       =
api.doc.swagger.definitions.xml_ns4_PayloadStructureType.properties.StructureUsage.description                     =
api.doc.swagger.definitions.xml_ns4_PrimaryMeasureReferenceType.description                                        = PrimaryMeasureReferenceType is a type for referencing a primary measure object. It consists of a URN and/or a complete set of reference fields.
api.doc.swagger.definitions.xml_ns4_PrimaryMeasureRefType.description                                              = PrimaryMeasureRefType contains a reference to the primary measure within a data structure definition. Note that since there is only one key descriptor, the container reference fields are prohibited.
api.doc.swagger.definitions.xml_ns4_ProcessReferenceType.description                                               = ProcessReferenceType is a type for referencing a process object. It consists of a URN and/or a complete set of reference fields.
api.doc.swagger.definitions.xml_ns4_ProcessRefType.description                                                     = ProcessRefType contains a set of reference fields for a process.
api.doc.swagger.definitions.xml_ns4_ProcessStepReferenceType.description                                           = ProcessStepReferenceType is a type for referencing a process step object. It consists of a URN and/or a complete set of reference fields.
api.doc.swagger.definitions.xml_ns4_ProcessStepRefType.description                                                 = ProcessStepRefType provides for a reference to a process step through its id. Support for referencing nested process steps is provided through a nested identifier.
api.doc.swagger.definitions.xml_ns4_ProvisionAgreementReferenceType.description                                    = ProvisionAgreementReferenceType is a type for referencing a provision agreement. It consists of a URN and/or a complete set of reference fields.
api.doc.swagger.definitions.xml_ns4_ProvisionAgreementRefType.description                                          = ProvisionAgreementRefType contains a set of reference fields for a provision agreement.
api.doc.swagger.definitions.xml_ns4_QueryableDataSourceType.description                                            = QueryableDataSourceType describes a data source which is accepts an standard SDMX Query message and responds appropriately.
api.doc.swagger.definitions.xml_ns4_QueryableDataSourceType.properties.DataURL.description                         =
api.doc.swagger.definitions.xml_ns4_QueryableDataSourceType.properties.isRESTDatasource.description                =
api.doc.swagger.definitions.xml_ns4_QueryableDataSourceType.properties.isWebServiceDatasource.description          =
api.doc.swagger.definitions.xml_ns4_QueryableDataSourceType.properties.WADLURL.description                         =
api.doc.swagger.definitions.xml_ns4_QueryableDataSourceType.properties.WSDLURL.description                         =
api.doc.swagger.definitions.xml_ns4_RefBaseType.description                                                        = RefBaseType is an abstract base type the defines the basis for any set of complete reference fields. This should be refined by derived types so that only the necessary fields are available and required as necessary. This can be used for both full and local references (when some of the values are implied from another context). A local reference is indicated with the local attribute. The values in this type correspond directly to the components of the URN structure, and thus can be used to compose a URN when the local attribute value is false. As this is the case, any reference components which are not part of the URN structure should not be present in the derived types.
api.doc.swagger.definitions.xml_ns4_RefBaseType.properties.agencyID.description                                    =
api.doc.swagger.definitions.xml_ns4_RefBaseType.properties.class.description                                       =
api.doc.swagger.definitions.xml_ns4_RefBaseType.properties.containerID.description                                 =
api.doc.swagger.definitions.xml_ns4_RefBaseType.properties.id.description                                          =
api.doc.swagger.definitions.xml_ns4_RefBaseType.properties.local.description                                       =
api.doc.swagger.definitions.xml_ns4_RefBaseType.properties.maintainableParentID.description                        =
api.doc.swagger.definitions.xml_ns4_RefBaseType.properties.maintainableParentVersion.description                   =
api.doc.swagger.definitions.xml_ns4_RefBaseType.properties.package.description                                     =
api.doc.swagger.definitions.xml_ns4_RefBaseType.properties.version.description                                     =
api.doc.swagger.definitions.xml_ns4_ReferencePeriodType.description                                                = Specifies the inclusive start and end times.
api.doc.swagger.definitions.xml_ns4_ReferencePeriodType.properties.endTime.description                             =
api.doc.swagger.definitions.xml_ns4_ReferencePeriodType.properties.startTime.description                           =
api.doc.swagger.definitions.xml_ns4_ReferenceType.description                                                      = ReferenceType is an abstract base type. It is used as the basis for all references, to all for a top level generic object reference that can be substituted with an explicit reference to any object. Any reference can consist of a Ref (which contains all required reference fields separately) and/or a URN. These must result in the identification of the same object. Note that the Ref and URN elements are local and unqualified in order to allow for refinement of this structure outside of the namespace. This allows any reference to further refined by a different namespace. For example, a metadata structure definition specific metadata set might wish to restrict the URN to only allow for a value from an enumerated list. 
api.doc.swagger.definitions.xml_ns4_ReferenceType.properties.Ref.description                                       =
api.doc.swagger.definitions.xml_ns4_ReferenceType.properties.URN.description                                       =
api.doc.swagger.definitions.xml_ns4_RegionType.description                                                         = RegionType is an abstract type which defines a generic constraint region. This type can be refined to define regions for data or metadata sets. A region is defined by a collection of key values - each of which a collection of values for a component which disambiguates data or metadata (i.e. dimensions or the target objects of a metadata target). For each region, as collection of attribute values can be provided. Taken together, the key values and attributes serve to identify or describe a subset of a data or metadata set. Finally, the region can flagged as being included or excluded, although this flag only makes sense when the region is used in a particular context.
api.doc.swagger.definitions.xml_ns4_RegionType.properties.Attribute.description                                    =
api.doc.swagger.definitions.xml_ns4_RegionType.properties.include.description                                      =
api.doc.swagger.definitions.xml_ns4_RegionType.properties.KeyValue.description                                     =
api.doc.swagger.definitions.xml_ns4_ReportCategoryRefType.description                                              = ReportCategoryRefType contains a set of fields for referencing a reporting category within a reporting taxonomy.
api.doc.swagger.definitions.xml_ns4_ReportingCategoryReferenceType.description                                     = ReportingCategoryReferenceType is a type for referencing a reporting category object. It consists of a URN and/or a complete set of reference fields.
api.doc.swagger.definitions.xml_ns4_ReportingTaxonomyReferenceType.description                                     = ReportingTaxonomyReferenceType is a type for referencing a reporting taxonomy object. It consists of a URN and/or a complete set of reference fields.
api.doc.swagger.definitions.xml_ns4_ReportingTaxonomyRefType.description                                           = ReportingTaxonomyRefType provides a reference to a reporting taxonomy via a complete set of reference fields.
api.doc.swagger.definitions.xml_ns4_ReportPeriodTargetReferenceType.description                                    = ReportPeriodTargetReferenceType is a type for referencing a report period target object. It consists of a URN and/or a complete set of reference fields.
api.doc.swagger.definitions.xml_ns4_ReportPeriodTargetRefType.description                                          = ReportPeriodTargetRefType contains a reference to a report period target within a metadata target of a data structure definition.
api.doc.swagger.definitions.xml_ns4_ReportStructureReferenceType.description                                       = ReportStructureReferenceType is a type for referencing a report structure object. It consists of a URN and/or a complete set of reference fields.
api.doc.swagger.definitions.xml_ns4_ReportStructureRefType.description                                             = ReportStructureRefType contains a reference to a report structure within a metadata structure definition.
api.doc.swagger.definitions.xml_ns4_SetReferenceType.description                                                   = SetReferenceType defines the structure of a reference to a data/metadata set. A full reference to a data provider and the identifier for the data set must be provided. Note that this is not derived from the base reference structure since data/metadata sets are not technically identifiable.
api.doc.swagger.definitions.xml_ns4_SetReferenceType.properties.DataProvider.description                           =
api.doc.swagger.definitions.xml_ns4_SetReferenceType.properties.ID.description                                     =
api.doc.swagger.definitions.xml_ns4_SimpleKeyValueType.description                                                 = SimpleKeyValueType derives from the SimpleValueType, but does not allow for the cascading of value in the hierarchy, as keys are meant to describe a distinct full or partial key.
api.doc.swagger.definitions.xml_ns4_SimpleValueType.description                                                    = SimpleValueType contains a simple value for a component, and if that value is from a code list, the ability to indicate that child codes in a simple hierarchy are part of the value set of the component for the region.
api.doc.swagger.definitions.xml_ns4_SimpleValueType.properties.cascadeValues.description                           =
api.doc.swagger.definitions.xml_ns4_SimpleValueType.properties.value.description                                   =
api.doc.swagger.definitions.xml_ns4_StructureMapReferenceType.description                                          = StructureMapReferenceType is a type for referencing a structure map object. It consists of a URN and/or a complete set of reference fields.
api.doc.swagger.definitions.xml_ns4_StructureMapRefType.description                                                = StructureMapRefType contains fields for referencing a structure map within a structure set.
api.doc.swagger.definitions.xml_ns4_StructureOrUsageRefBaseType.description                                        = StructureOrUsageRefBaseType is an abstract base type for referencing a structure or structure usage.
api.doc.swagger.definitions.xml_ns4_StructureOrUsageReferenceType.description                                      = StructureOrUsageReferenceType is a specific type of a reference for referencing either a structure or a structure usage. It consists of a URN and/or a complete set of reference fields; agency, id and version. If the complete set of reference fields is used, it is required that a class and package be provided so that the type of object referenced is clear.
api.doc.swagger.definitions.xml_ns4_StructureOrUsageRefType.description                                            = StructureOrUsageRefType is a type for referencing a structure or structure usage.
api.doc.swagger.definitions.xml_ns4_StructureRefBaseType.description                                               = StructureRefBaseType is an abstract base type for referencing a structure.
api.doc.swagger.definitions.xml_ns4_StructureReferenceBaseType.description                                         = StructureReferneceBaseType is a specific type of MaintainableReference that is used for referencing structure definitions. It consists of a URN and/or a complete set of reference fields; agency, id, and version.
api.doc.swagger.definitions.xml_ns4_StructureReferenceType.description                                             = StructureReferenceType is a specific type of MaintainableReference that is used for referencing any structure. It consists of a URN and/or a complete set of reference fields; agency, id, and version.
api.doc.swagger.definitions.xml_ns4_StructureRefType.description                                                   = StructureRefType contains a set of reference fields for referencing any structure.
api.doc.swagger.definitions.xml_ns4_StructureSetReferenceType.description                                          = StructureSetReferenceType is a type for referencing a structure set object. It consists of a URN and/or a complete set of reference fields.
api.doc.swagger.definitions.xml_ns4_StructureSetRefType.description                                                = StructureSetRefType contains a set of reference fields for a structure set.
api.doc.swagger.definitions.xml_ns4_StructureUsageRefBaseType.description                                          = StructureUsageRefBaseType is an abstract base type for referencing a structure usage.
api.doc.swagger.definitions.xml_ns4_StructureUsageReferenceBaseType.description                                    = StructureUsageReferenceBaseType is a specific type of MaintainableReference that is used for referencing structure usages. It consists of a URN and/or a complete set of reference fields; agency, id, and version.
api.doc.swagger.definitions.xml_ns4_StructureUsageReferenceType.description                                        = StructureUsageReferenceType is a specific type of MaintainableReference that is used for referencing any structure usages. It consists of a URN and/or a complete set of reference fields; agency, id, and version.
api.doc.swagger.definitions.xml_ns4_StructureUsageRefType.description                                              = StructureUsageRefType contains a set of reference fields for referencing any structure usage.
api.doc.swagger.definitions.xml_ns4_TextType.description                                                           = TextType provides for a set of language-specific alternates to be provided for any human-readable constructs in the instance.
api.doc.swagger.definitions.xml_ns4_TextType.properties.lang.description                                           =
api.doc.swagger.definitions.xml_ns4_TextType.properties.value.description                                          =
api.doc.swagger.definitions.xml_ns4_TimeDimensionReferenceType.description                                         = TimeDimensionReferenceType is a type for referencing a time dimension object. It consists of a URN and/or a complete set of reference fields.
api.doc.swagger.definitions.xml_ns4_TimeDimensionRefType.description                                               = TimeDimensionRefType contains a reference to the time dimension within a data structure definition. Note that since there is only one key descriptor, the container reference fields are prohibited.
api.doc.swagger.definitions.xml_ns4_TimePeriodRangeType.description                                                = TimePeriodRangeType defines a time period, and indicates whether it is inclusive in a range.
api.doc.swagger.definitions.xml_ns4_TimePeriodRangeType.properties.isInclusive.description                         =
api.doc.swagger.definitions.xml_ns4_TimePeriodRangeType.properties.value.description                               =
api.doc.swagger.definitions.xml_ns4_TimeRangeValueType.description                                                 = TimeRangeValueType allows a time period value to be expressed as a range. It can be expressed as the period before a period, after a period, or between two periods. Each of these properties can specify their inclusion in regards to the range.
api.doc.swagger.definitions.xml_ns4_TimeRangeValueType.properties.AfterPeriod.description                          =
api.doc.swagger.definitions.xml_ns4_TimeRangeValueType.properties.BeforePeriod.description                         =
api.doc.swagger.definitions.xml_ns4_TimeRangeValueType.properties.EndPeriod.description                            =
api.doc.swagger.definitions.xml_ns4_TimeRangeValueType.properties.StartPeriod.description                          =
api.doc.swagger.definitions.xml_ns4_TransitionReferenceType.description                                            = TransiationReferenceType is a type for referencing a process step object. It consists of a URN and/or a complete set of reference fields.
api.doc.swagger.definitions.xml_ns4_TransitionRefType.description                                                  = TransitionRefType provides for a reference to a transition definition in process step through its id.
api.doc.swagger.definitions.xml_ns4_URNReferenceType.description                                                   = URNReferenceType is a type referencing any object via its URN. The exact type of object is not specified, although it can be determined from the URN value.
api.doc.swagger.definitions.xml_ns4_XHTMLType.description                                                          = XHTMLType allows for mixed content of text and XHTML tags. When using this type, one will have to provide a reference to the XHTML schema, since the processing of the tags within this type is strict, meaning that they are validated against the XHTML schema provided.
api.doc.swagger.definitions.xml_ns4_XHTMLType.properties.lang.description                                          =
api.doc.swagger.definitions.xml_ns5_AgencySchemeType.description                                                   = AgencySchemeType defines a specific type of organisation scheme which contains only maintenance agencies. The agency scheme maintained by a particular maintenance agency is always provided a fixed identifier and version, and is never final. Therefore, agencies can be added or removed without have to version the scheme. Agencies schemes have no hierarchy, meaning that no agency may define a relationship with another agency in the scheme. In fact, the actual parent agency for an agency in a scheme is the agency which defines the scheme.
api.doc.swagger.definitions.xml_ns5_AgencyType.description                                                         = AgencyType defines the structure of an agency description. The contacts defined for the organisation are specific to the agency role the organisation is serving.
api.doc.swagger.definitions.xml_ns5_AttachmentConstraintAttachmentType.description                                 = AttachmentConstraintAttachmentType defines the structure for specifying the object to which an attachment constraints applies.
api.doc.swagger.definitions.xml_ns5_AttachmentConstraintType.description                                           = AttachmentConstraintType describes the details of an attachment constraint by defining the data or metadata key sets or component regions that attributes or reference metadata may be attached in the constraint attachment objects.
api.doc.swagger.definitions.xml_ns5_AttributeBaseType.description                                                  = AttributeBaseType is an abstract base type that serves as the basis for the AttributeType. It restricts the text format base to a text format valid  for data components (that does not allow for XHTML representation). The local representation is restricted to the values defined in codelist. The concept role is restricted to the values valid for a data attribute.
api.doc.swagger.definitions.xml_ns5_AttributeListBaseType.description                                              = AttributeListBaseType is an abstract base type used as the basis for the AttributeListType.
api.doc.swagger.definitions.xml_ns5_AttributeListType.description                                                  = AttributeListType describes the attribute descriptor for the data structure definition.
api.doc.swagger.definitions.xml_ns5_AttributeListType.properties.ReportingYearStartDay.description                 =
api.doc.swagger.definitions.xml_ns5_AttributeRelationshipType.description                                          = AttributeRelationshipType defines the structure for stating the relationship between an attribute and other data structure definition components.
api.doc.swagger.definitions.xml_ns5_AttributeRelationshipType.properties.AttachmentGroup.description               =
api.doc.swagger.definitions.xml_ns5_AttributeRelationshipType.properties.Dimension.description                     =
api.doc.swagger.definitions.xml_ns5_AttributeRelationshipType.properties.Group.description                         =
api.doc.swagger.definitions.xml_ns5_AttributeRelationshipType.properties.None.description                          =
api.doc.swagger.definitions.xml_ns5_AttributeRelationshipType.properties.PrimaryMeasure.description                =
api.doc.swagger.definitions.xml_ns5_AttributeType.description                                                      = AttributeType describes the structure of a data attribute, which is defined as a characteristic of an object or entity. The attribute takes its semantic, and in some cases it representation, from its concept identity. An attribute can be coded by referencing a code list from its coded local representation. It can also specify its text format, which is used as the representation of the attribute if a coded representation is not defined. Neither the coded or uncoded representation are necessary, since the attribute may take these from the referenced concept. An attribute specifies its relationship with other data structure components and is given an assignment status. These two properties dictate where in a data message the attribute will be attached, and whether or not the attribute will be required to be given a value. A set of roles defined in concept scheme can be assigned to the attribute.
api.doc.swagger.definitions.xml_ns5_AttributeType.properties.assignmentStatus.description                          =
api.doc.swagger.definitions.xml_ns5_AttributeType.properties.AttributeRelationship.description                     =
api.doc.swagger.definitions.xml_ns5_AttributeType.properties.ConceptRole.description                               =
api.doc.swagger.definitions.xml_ns5_BaseDimensionBaseType.description                                              = BaseDimensionBaseType is an abstract base type that serves as the basis for any dimension. It restricts the text format base to a text format valid  for data components (that does not allow for XHTML representation).
api.doc.swagger.definitions.xml_ns5_BaseDimensionType.description                                                  = BaseDimensionType is an abstract base type which defines the basic structure of all dimensions.
api.doc.swagger.definitions.xml_ns5_BaseDimensionType.properties.ConceptRole.description                           =
api.doc.swagger.definitions.xml_ns5_BaseDimensionType.properties.position.description                              =
api.doc.swagger.definitions.xml_ns5_BaseDimensionType.properties.type.description                                  =
api.doc.swagger.definitions.xml_ns5_BaseOrganisationType.description                                               = BaseOrganisationType is an abstract base type the forms the basis for the OrganisationType.
api.doc.swagger.definitions.xml_ns5_BasicComponentTextFormatType.description                                       = BasicComponentTextFormatType is a restricted version of the TextFormatType that restricts the text type to the representations allowed for all components except for target objects.
api.doc.swagger.definitions.xml_ns5_CategorisationType.description                                                 = CategorisationType is defines the structure for a categorisation. A source object is referenced via an object reference and the target category is referenced via the target category.
api.doc.swagger.definitions.xml_ns5_CategorisationType.properties.Source.description                               =
api.doc.swagger.definitions.xml_ns5_CategorisationType.properties.Target.description                               =
api.doc.swagger.definitions.xml_ns5_CategoryMapType.description                                                    = CategoryMapType defines the structure for mapping two categories. A local reference is provided both the source and target category.
api.doc.swagger.definitions.xml_ns5_CategorySchemeMapType.description                                              = CategorySchemeMapType defines the structure of a map which identifies relationships between categories in different category schemes.
api.doc.swagger.definitions.xml_ns5_CategorySchemeType.description                                                 = CategorySchemeType describes the structure of a category scheme. A category scheme is the descriptive information for an arrangement or division of categories into groups based on characteristics, which the objects have in common. This provides for a simple, leveled hierarchy or categories.
api.doc.swagger.definitions.xml_ns5_CategoryType.description                                                       = CategoryType describes the details of a category. A category is defined as an item at any level in a classification. The Category element represents a set of nested categories which are child categories.
api.doc.swagger.definitions.xml_ns5_CodededTextFormatType.description                                              = CodededTextFormatType is a restricted version of the SimpleComponentTextFormatType that only allows factets and text types applicable to codes. Although the time facets permit any value, an actual code identifier does not support the necessary characters for time. Therefore these facets should not contain time in their values.
api.doc.swagger.definitions.xml_ns5_CodelistMapType.description                                                    = CodelistMapType defines the structure of a map which identifies relationships between codes in different codelists.
api.doc.swagger.definitions.xml_ns5_CodelistType.description                                                       = CodelistType defines the structure of a codelist. A codelist is defined as a list from which some statistical concepts (coded concepts) take their values.
api.doc.swagger.definitions.xml_ns5_CodeMapType.description                                                        = CodeMapType defines the structure for mapping two codes. A local reference is provided both the source and target code.
api.doc.swagger.definitions.xml_ns5_CodeType.description                                                           = CodeType describes the structure of a code. A code is defined as a language independent set of letters, numbers or symbols that represent a concept whose meaning is described in a natural language. Presentational information not present may be added through the use of annotations.
api.doc.swagger.definitions.xml_ns5_CodingTextFormatType.description                                               = 
api.doc.swagger.definitions.xml_ns5_ComponentBaseType.description                                                  = ComponentBaseType is an abstract type that only serves the purpose of forming the base for the actual ComponentType. It only restricts the format of the id attribute to the NCNameIDType.
api.doc.swagger.definitions.xml_ns5_ComponentListType.description                                                  = ComponentListType is an abstract base type for all component lists. It contains a collection of components. Concrete types should restrict this to specific concrete components.
api.doc.swagger.definitions.xml_ns5_ComponentListType.properties.Component.description                             =
api.doc.swagger.definitions.xml_ns5_ComponentMapType.description                                                   = ComponentMapType defines the structure for relating a component in a source structure to a component in a target structure.

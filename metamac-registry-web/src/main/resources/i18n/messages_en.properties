api.doc.swagger.definitions.xml_ns5_AttributeType.description                                                      = AttributeType describes the structure of a data attribute, which is defined as a characteristic of an object or entity. The attribute takes its semantic, and in some cases it representation, from its concept identity. An attribute can be coded by referencing a code list from its coded local representation. It can also specify its text format, which is used as the representation of the attribute if a coded representation is not defined. Neither the coded or uncoded representation are necessary, since the attribute may take these from the referenced concept. An attribute specifies its relationship with other data structure components and is given an assignment status. These two properties dictate where in a data message the attribute will be attached, and whether or not the attribute will be required to be given a value. A set of roles defined in concept scheme can be assigned to the attribute.<p>Java class for AttributeType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="AttributeType">   &lt;complexContent>     &lt;extension base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}AttributeBaseType">       &lt;sequence>         &lt;element name="ConceptRole" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ConceptReferenceType" maxOccurs="unbounded" minOccurs="0"/>         &lt;element name="AttributeRelationship" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}AttributeRelationshipType"/>       &lt;/sequence>       &lt;attribute name="assignmentStatus" use="required" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}UsageStatusType" />     &lt;/extension>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_AttributeType.properties.AttributeRelationship.description                     = .
api.doc.swagger.definitions.xml_ns5_AttributeType.properties.ConceptRole.description                               = .
api.doc.swagger.definitions.xml_ns5_AttributeType.properties.assignmentStatus.description                          = .
api.doc.swagger.definitions.xml_ns5_BaseDimensionBaseType.description                                              = BaseDimensionBaseType is an abstract base type that serves as the basis for any dimension. It restricts the text format base to a text format valid  for data components (that does not allow for XHTML representation).<p>Java class for BaseDimensionBaseType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="BaseDimensionBaseType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}ComponentType">       &lt;sequence>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Annotations" minOccurs="0"/>         &lt;element name="ConceptIdentity" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ConceptReferenceType"/>         &lt;element name="LocalRepresentation" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}DataStructureRepresentationType" minOccurs="0"/>       &lt;/sequence>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_BaseDimensionType.description                                                  = BaseDimensionType is an abstract base type which defines the basic structure of all dimensions.<p>Java class for BaseDimensionType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="BaseDimensionType">   &lt;complexContent>     &lt;extension base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}BaseDimensionBaseType">       &lt;sequence>         &lt;element name="ConceptRole" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ConceptReferenceType" maxOccurs="unbounded" minOccurs="0"/>       &lt;/sequence>       &lt;attribute name="position" type="{http://www.w3.org/2001/XMLSchema}int" />       &lt;attribute name="type" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}DimensionTypeType" />     &lt;/extension>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_BaseDimensionType.properties.ConceptRole.description                           = .
api.doc.swagger.definitions.xml_ns5_BaseDimensionType.properties.position.description                              = .
api.doc.swagger.definitions.xml_ns5_BaseDimensionType.properties.type.description                                  = .
api.doc.swagger.definitions.xml_ns5_BaseOrganisationType.description                                               = BaseOrganisationType is an abstract base type the forms the basis for the OrganisationType.<p>Java class for BaseOrganisationType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="BaseOrganisationType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}ItemType">       &lt;sequence>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Annotations" minOccurs="0"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Name" maxOccurs="unbounded"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Description" maxOccurs="unbounded" minOccurs="0"/>         &lt;choice minOccurs="0">           &lt;element name="Parent" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}LocalOrganisationReferenceBaseType"/>         &lt;/choice>       &lt;/sequence>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_BasicComponentTextFormatType.description                                       = BasicComponentTextFormatType is a restricted version of the TextFormatType that restricts the text type to the representations allowed for all components except for target objects.<p>Java class for BasicComponentTextFormatType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="BasicComponentTextFormatType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}TextFormatType">       &lt;attribute name="textType" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}BasicComponentDataType" default="String" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_CategorisationType.description                                                 = CategorisationType is defines the structure for a categorisation. A source object is referenced via an object reference and the target category is referenced via the target category.<p>Java class for CategorisationType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="CategorisationType">   &lt;complexContent>     &lt;extension base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}MaintainableType">       &lt;sequence minOccurs="0">         &lt;element name="Source" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ObjectReferenceType"/>         &lt;element name="Target" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}CategoryReferenceType"/>       &lt;/sequence>     &lt;/extension>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_CategorisationType.properties.Source.description                               = .
api.doc.swagger.definitions.xml_ns5_CategorisationType.properties.Target.description                               = .
api.doc.swagger.definitions.xml_ns5_CategoryMapType.description                                                    = CategoryMapType defines the structure for mapping two categories. A local reference is provided both the source and target category.<p>Java class for CategoryMapType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="CategoryMapType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}ItemAssociationType">       &lt;sequence>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Annotations" minOccurs="0"/>         &lt;element name="Source" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}LocalCategoryReferenceType"/>         &lt;element name="Target" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}LocalCategoryReferenceType"/>       &lt;/sequence>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_CategorySchemeMapType.description                                              = CategorySchemeMapType defines the structure of a map which identifies relationships between categories in different category schemes.<p>Java class for CategorySchemeMapType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="CategorySchemeMapType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}ItemSchemeMapType">       &lt;sequence>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Annotations" minOccurs="0"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Name" maxOccurs="unbounded"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Description" maxOccurs="unbounded" minOccurs="0"/>         &lt;element name="Source" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}CategorySchemeReferenceType"/>         &lt;element name="Target" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}CategorySchemeReferenceType"/>         &lt;sequence maxOccurs="unbounded">           &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}CategoryMap"/>         &lt;/sequence>       &lt;/sequence>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_CategorySchemeType.description                                                 = CategorySchemeType describes the structure of a category scheme. A category scheme is the descriptive information for an arrangement or division of categories into groups based on characteristics, which the objects have in common. This provides for a simple, leveled hierarchy or categories.<p>Java class for CategorySchemeType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="CategorySchemeType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}ItemSchemeType">       &lt;sequence>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Annotations" minOccurs="0"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Name" maxOccurs="unbounded"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Description" maxOccurs="unbounded" minOccurs="0"/>         &lt;sequence maxOccurs="unbounded" minOccurs="0">           &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}Category"/>         &lt;/sequence>       &lt;/sequence>       &lt;attribute name="id" use="required" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}NCNameIDType" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_CategoryType.description                                                       = CategoryType describes the details of a category. A category is defined as an item at any level in a classification. The Category element represents a set of nested categories which are child categories.<p>Java class for CategoryType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="CategoryType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}ItemType">       &lt;sequence>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Annotations" minOccurs="0"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Name" maxOccurs="unbounded"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Description" maxOccurs="unbounded" minOccurs="0"/>         &lt;choice minOccurs="0">           &lt;sequence maxOccurs="unbounded">             &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}Category"/>           &lt;/sequence>         &lt;/choice>       &lt;/sequence>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_CodeMapType.description                                                        = CodeMapType defines the structure for mapping two codes. A local reference is provided both the source and target code.<p>Java class for CodeMapType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="CodeMapType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}ItemAssociationType">       &lt;sequence>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Annotations" minOccurs="0"/>         &lt;element name="Source" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}LocalCodeReferenceType"/>         &lt;element name="Target" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}LocalCodeReferenceType"/>       &lt;/sequence>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_CodeType.description                                                           = CodeType describes the structure of a code. A code is defined as a language independent set of letters, numbers or symbols that represent a concept whose meaning is described in a natural language. Presentational information not present may be added through the use of annotations.<p>Java class for CodeType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="CodeType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}ItemType">       &lt;sequence>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Annotations" minOccurs="0"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Name" maxOccurs="unbounded"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Description" maxOccurs="unbounded" minOccurs="0"/>         &lt;choice minOccurs="0">           &lt;element name="Parent" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}LocalCodeReferenceType"/>         &lt;/choice>       &lt;/sequence>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_CodededTextFormatType.description                                              = CodededTextFormatType is a restricted version of the SimpleComponentTextFormatType that only allows factets and text types applicable to codes. Although the time facets permit any value, an actual code identifier does not support the necessary characters for time. Therefore these facets should not contain time in their values.<p>Java class for CodededTextFormatType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="CodededTextFormatType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}SimpleComponentTextFormatType">       &lt;attribute name="textType" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}CodeDataType" />       &lt;attribute name="isSequence" type="{http://www.w3.org/2001/XMLSchema}boolean" />       &lt;attribute name="interval" type="{http://www.w3.org/2001/XMLSchema}integer" />       &lt;attribute name="startValue" type="{http://www.w3.org/2001/XMLSchema}integer" />       &lt;attribute name="endValue" type="{http://www.w3.org/2001/XMLSchema}integer" />       &lt;attribute name="timeInterval" type="{http://www.w3.org/2001/XMLSchema}duration" />       &lt;attribute name="startTime" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}StandardTimePeriodType" />       &lt;attribute name="endTime" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}StandardTimePeriodType" />       &lt;attribute name="minLength" type="{http://www.w3.org/2001/XMLSchema}positiveInteger" />       &lt;attribute name="maxLength" type="{http://www.w3.org/2001/XMLSchema}positiveInteger" />       &lt;attribute name="minValue" type="{http://www.w3.org/2001/XMLSchema}integer" />       &lt;attribute name="maxValue" type="{http://www.w3.org/2001/XMLSchema}integer" />       &lt;attribute name="pattern" type="{http://www.w3.org/2001/XMLSchema}string" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_CodelistMapType.description                                                    = CodelistMapType defines the structure of a map which identifies relationships between codes in different codelists.<p>Java class for CodelistMapType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="CodelistMapType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}ItemSchemeMapType">       &lt;sequence>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Annotations" minOccurs="0"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Name" maxOccurs="unbounded"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Description" maxOccurs="unbounded" minOccurs="0"/>         &lt;element name="Source" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}CodelistReferenceType"/>         &lt;element name="Target" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}CodelistReferenceType"/>         &lt;sequence maxOccurs="unbounded">           &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}CodeMap"/>         &lt;/sequence>       &lt;/sequence>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_CodelistType.description                                                       = CodelistType defines the structure of a codelist. A codelist is defined as a list from which some statistical concepts (coded concepts) take their values.<p>Java class for CodelistType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="CodelistType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}ItemSchemeType">       &lt;sequence>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Annotations" minOccurs="0"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Name" maxOccurs="unbounded"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Description" maxOccurs="unbounded" minOccurs="0"/>         &lt;sequence maxOccurs="unbounded" minOccurs="0">           &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}Code"/>         &lt;/sequence>       &lt;/sequence>       &lt;attribute name="id" use="required" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}NCNameIDType" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_CodingTextFormatType.description                                               = <p>Java class for CodingTextFormatType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="CodingTextFormatType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}SimpleComponentTextFormatType">       &lt;attribute name="textType" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}SimpleCodeDataType" />       &lt;attribute name="isSequence" type="{http://www.w3.org/2001/XMLSchema}boolean" />       &lt;attribute name="interval" type="{http://www.w3.org/2001/XMLSchema}integer" />       &lt;attribute name="startValue" type="{http://www.w3.org/2001/XMLSchema}positiveInteger" />       &lt;attribute name="endValue" type="{http://www.w3.org/2001/XMLSchema}positiveInteger" />       &lt;attribute name="minLength" type="{http://www.w3.org/2001/XMLSchema}positiveInteger" />       &lt;attribute name="maxLength" type="{http://www.w3.org/2001/XMLSchema}positiveInteger" />       &lt;attribute name="minValue" type="{http://www.w3.org/2001/XMLSchema}positiveInteger" />       &lt;attribute name="maxValue" type="{http://www.w3.org/2001/XMLSchema}positiveInteger" />       &lt;attribute name="pattern" type="{http://www.w3.org/2001/XMLSchema}string" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_ComponentBaseType.description                                                  = ComponentBaseType is an abstract type that only serves the purpose of forming the base for the actual ComponentType. It only restricts the format of the id attribute to the NCNameIDType.<p>Java class for ComponentBaseType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="ComponentBaseType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}IdentifiableType">       &lt;sequence>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Annotations" minOccurs="0"/>       &lt;/sequence>       &lt;attribute name="id" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}NCNameIDType" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_ComponentListType.description                                                  = ComponentListType is an abstract base type for all component lists. It contains a collection of components. Concrete types should restrict this to specific concrete components.<p>Java class for ComponentListType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="ComponentListType">   &lt;complexContent>     &lt;extension base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}IdentifiableType">       &lt;sequence>         &lt;sequence maxOccurs="unbounded" minOccurs="0">           &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}Component"/>         &lt;/sequence>       &lt;/sequence>     &lt;/extension>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_ComponentListType.properties.Component.description                             = .
api.doc.swagger.definitions.xml_ns5_ComponentMapType.description                                                   = ComponentMapType defines the structure for relating a component in a source structure to a component in a target structure.<p>Java class for ComponentMapType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="ComponentMapType">   &lt;complexContent>     &lt;extension base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}AnnotableType">       &lt;sequence>         &lt;element name="Source" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}LocalComponentListComponentReferenceType"/>         &lt;element name="Target" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}LocalComponentListComponentReferenceType"/>         &lt;element name="RepresentationMapping" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}RepresentationMapType" minOccurs="0"/>       &lt;/sequence>     &lt;/extension>   &lt;/complexContent> &lt;/complexType> </pre>

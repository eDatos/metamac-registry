api.doc.swagger.definitions.xml_ns4_AnnotationType.description                                                     = AnnotationType provides for non-documentation notes and annotations to be embedded in data and structure messages. It provides optional fields for providing a title, a type description, a URI, and the text of the annotation.
api.doc.swagger.definitions.xml_ns4_AnnotationType.properties.AnnotationText.description                           =

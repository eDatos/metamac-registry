api.doc.swagger.definitions.xml_ns5_ConceptBaseType.description                                                    = ConceptBaseType is an abstract base type the forms the basis of the ConceptType by requiring a name and id, and restricting the content of the id.<p>Java class for ConceptBaseType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="ConceptBaseType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}ItemType">       &lt;sequence>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Annotations" minOccurs="0"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Name" maxOccurs="unbounded"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Description" maxOccurs="unbounded" minOccurs="0"/>         &lt;choice minOccurs="0">           &lt;element name="Parent" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}LocalConceptReferenceType"/>         &lt;/choice>       &lt;/sequence>       &lt;attribute name="id" use="required" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}NCNameIDType" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_ConceptMapType.description                                                     = ConceptMapType defines the structure for mapping two concepts. A local reference is provided both the source and target concept.<p>Java class for ConceptMapType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="ConceptMapType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}ItemAssociationType">       &lt;sequence>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Annotations" minOccurs="0"/>         &lt;element name="Source" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}LocalConceptReferenceType"/>         &lt;element name="Target" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}LocalConceptReferenceType"/>       &lt;/sequence>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_ConceptRepresentation.description                                              = ConceptRepresentation defines the core representation that are allowed for a concept. The text format allowed for a concept is that which is allowed for any non-target object component.<p>Java class for ConceptRepresentation complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="ConceptRepresentation">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}RepresentationType">       &lt;choice>         &lt;element name="TextFormat" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}BasicComponentTextFormatType"/>         &lt;sequence>           &lt;element name="Enumeration" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}CodelistReferenceType"/>           &lt;element name="EnumerationFormat" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}CodededTextFormatType" minOccurs="0"/>         &lt;/sequence>       &lt;/choice>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_ConceptSchemeMapType.description                                               = ConceptSchemeMapType defines the structure of a map which identifies relationships between concepts in different concept schemes.<p>Java class for ConceptSchemeMapType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="ConceptSchemeMapType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}ItemSchemeMapType">       &lt;sequence>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Annotations" minOccurs="0"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Name" maxOccurs="unbounded"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Description" maxOccurs="unbounded" minOccurs="0"/>         &lt;element name="Source" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ConceptSchemeReferenceType"/>         &lt;element name="Target" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ConceptSchemeReferenceType"/>         &lt;sequence maxOccurs="unbounded">           &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}ConceptMap"/>         &lt;/sequence>       &lt;/sequence>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_ConceptSchemeType.description                                                  = onceptSchemeType describes the structure of a concept scheme. A concept scheme is the descriptive information for an arrangement or division of concepts into groups based on characteristics, which the objects have in common. It contains a collection of concept definitions, that may be arranged in simple hierarchies.<p>Java class for ConceptSchemeType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="ConceptSchemeType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}ItemSchemeType">       &lt;sequence>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Annotations" minOccurs="0"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Name" maxOccurs="unbounded"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Description" maxOccurs="unbounded" minOccurs="0"/>         &lt;sequence maxOccurs="unbounded" minOccurs="0">           &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}Concept"/>         &lt;/sequence>       &lt;/sequence>       &lt;attribute name="id" use="required" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}NCNameIDType" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_ConceptType.description                                                        = ConceptType describes the details of a concept. A concept is defined as a unit of knowledge created by a unique combination of characteristics. If a concept does not specify a TextFormat or a core representation, then the representation of the concept is assumed to be represented by any set of valid characters (corresponding to the xs:string datatype of W3C XML Schema).<p>Java class for ConceptType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="ConceptType">   &lt;complexContent>     &lt;extension base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}ConceptBaseType">       &lt;sequence>         &lt;element name="CoreRepresentation" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}ConceptRepresentation" minOccurs="0"/>         &lt;element name="ISOConceptReference" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}ISOConceptReferenceType" minOccurs="0"/>       &lt;/sequence>     &lt;/extension>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_ConceptType.properties.CoreRepresentation.description                          = .
api.doc.swagger.definitions.xml_ns5_ConceptType.properties.ISOConceptReference.description                         = .
api.doc.swagger.definitions.xml_ns5_ConstraintAttachmentType.description                                           = ConstraintAttachmentType describes a collection of references to constrainable artefacts.<p>Java class for ConstraintAttachmentType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="ConstraintAttachmentType">   &lt;complexContent>     &lt;restriction base="{http://www.w3.org/2001/XMLSchema}anyType">       &lt;choice>         &lt;element name="DataProvider" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}DataProviderReferenceType"/>         &lt;element name="DataSet" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}SetReferenceType" maxOccurs="unbounded"/>         &lt;element name="MetadataSet" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}SetReferenceType" maxOccurs="unbounded"/>         &lt;element name="SimpleDataSource" type="{http://www.w3.org/2001/XMLSchema}anyURI" maxOccurs="unbounded"/>         &lt;choice>           &lt;sequence>             &lt;element name="DataStructure" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}DataStructureReferenceType" maxOccurs="unbounded"/>             &lt;element name="QueryableDataSource" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}QueryableDataSourceType" maxOccurs="unbounded" minOccurs="0"/>           &lt;/sequence>           &lt;sequence>             &lt;element name="MetadataStructure" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}MetadataStructureReferenceType" maxOccurs="unbounded"/>             &lt;element name="QueryableDataSource" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}QueryableDataSourceType" maxOccurs="unbounded" minOccurs="0"/>           &lt;/sequence>           &lt;sequence>             &lt;element name="Dataflow" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}DataflowReferenceType" maxOccurs="unbounded"/>             &lt;element name="QueryableDataSource" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}QueryableDataSourceType" maxOccurs="unbounded" minOccurs="0"/>           &lt;/sequence>           &lt;sequence>             &lt;element name="Metadataflow" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}MetadataflowReferenceType" maxOccurs="unbounded"/>             &lt;element name="QueryableDataSource" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}QueryableDataSourceType" maxOccurs="unbounded" minOccurs="0"/>           &lt;/sequence>           &lt;sequence>             &lt;element name="ProvisionAgreement" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ProvisionAgreementReferenceType" maxOccurs="unbounded"/>             &lt;element name="QueryableDataSource" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}QueryableDataSourceType" maxOccurs="unbounded" minOccurs="0"/>           &lt;/sequence>         &lt;/choice>       &lt;/choice>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>

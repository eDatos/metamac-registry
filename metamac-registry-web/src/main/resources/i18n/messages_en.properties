api.doc.swagger.definitions.xml_ns4_AnyCodelistReferenceType.description                                           = AnyCodelistReferenceType is a specific type of a reference for referencing either a codelist or a hierarchical codelist usage. It consists of a URN and/or a complete set of reference fields; agency, id and version. If the complete set of reference fields is used, it is required that a class be provided so that the type of object referenced is clear.
api.doc.swagger.definitions.xml_ns4_AnyCodelistRefType.description                                                 = AnyCodelistRefType is a type for referencing any codelist object (either a codelist or a hierarchical codelist).
api.doc.swagger.definitions.xml_ns4_AnyLocalCodeReferenceType.description                                          = AnyLocalCodeReferenceType provides a simple references to any code or hierarchical code where the identification of the codelist or hierarchical codelist which defines it is contained in another context.
api.doc.swagger.definitions.xml_ns4_AnyLocalCodeRefType.description                                                = AnyLocalCodeRefType provides a local reference to any code object.
api.doc.swagger.definitions.xml_ns4_AttachmentConstraintReferenceType.description                                  = AttachmentConstraintReferenceType is a type for referencing a attachment constraint object. It consists of a URN and/or a complete set of reference fields.
api.doc.swagger.definitions.xml_ns4_AttributeDescriptorReferenceType.description                                   = AttributeDescriptorReferenceType is a type for referencing an attribute descriptor object. It consists of a URN and/or a complete set of reference fields.
api.doc.swagger.definitions.xml_ns4_AttributeDescriptorRefType.description                                         = AttributeDescriptorRefType contains a reference to the attribute descriptor within a data structure definition.
api.doc.swagger.definitions.xml_ns4_AttributeReferenceType.description                                             = AttributeReferenceType is a type for referencing an attribute object. It consists of a URN and/or a complete set of reference fields.
api.doc.swagger.definitions.xml_ns4_AttributeRefType.description                                                   = AttributeRefType contains a reference to an attribute within a data structure definition. Note that since there is only one attribute descriptor, the container reference fields are prohibited.
api.doc.swagger.definitions.xml_ns4_AttributeValueSetType.description                                              = AttributeValueSetType defines the structure for providing values for a data attribute. If no values are provided, the attribute is implied to include/excluded from the region in which it is defined, with no regard to the value of the data attribute. Note that for metadata attributes which occur within other metadata attributes, a nested identifier can be provided. For example, a value of CONTACT.ADDRESS.STREET refers to the metadata attribute with the identifier STREET which exists in the ADDRESS metadata attribute in the CONTACT metadata attribute, which is defined at the root of the report structure.
api.doc.swagger.definitions.xml_ns4_CategorisationReferenceType.description                                        = CategorisationReferenceType is a type for referencing a categorisation object. It consists of a URN and/or a complete set of reference fields.
api.doc.swagger.definitions.xml_ns4_CategorisationRefType.description                                              = CategorisationRefType provides a reference to a categorisation via a complete set of reference fields.
api.doc.swagger.definitions.xml_ns4_CategoryReferenceType.description                                              = CategoryReferenceType is a type for referencing a category object. It consists of a URN and/or a complete set of reference fields.
api.doc.swagger.definitions.xml_ns4_CategoryRefType.description                                                    = CategoryRefType references a category from within a category scheme. Reference fields are required for both the scheme and the item.
api.doc.swagger.definitions.xml_ns4_CategorySchemeMapReferenceType.description                                     = CategorySchemeMapReferenceType is a type for referencing a category scheme map object. It consists of a URN and/or a complete set of reference fields.
api.doc.swagger.definitions.xml_ns4_CategorySchemeMapRefType.description                                           = CategorySchemeMapRefType contains a set of reference fields for a category scheme map.
api.doc.swagger.definitions.xml_ns4_CategorySchemeReferenceType.description                                        = CategorySchemeReferenceType is a type for referencing a category scheme object. It consists of a URN and/or a complete set of reference fields.
api.doc.swagger.definitions.xml_ns4_CategorySchemeRefType.description                                              = CategorySchemeRefType provides a reference to a category scheme via a complete set of reference fields.
api.doc.swagger.definitions.xml_ns4_ChildObjectRefBaseType.description                                             = ChildObjectRefBaseType is an abstract base type for referencing any child object defined directly within a maintainable object.
api.doc.swagger.definitions.xml_ns4_ChildObjectReferenceType.description                                           = ChildObjectReferenceType is an abstract base type used for referencing a particular object defined directly within a maintainable object. It consists of a URN and/or a complete set of reference fields; agency, maintainable id (maintainableParentID), maintainable version (maintainableParentVersion), the object id (which can be nested), and optionally the object version (if applicable).
api.doc.swagger.definitions.xml_ns4_CodelistMapReferenceType.description                                           = CodelistMapReferenceType is a type for referencing a codelist map object. It consists of a URN and/or a complete set of reference fields.
api.doc.swagger.definitions.xml_ns4_CodelistMapRefType.description                                                 = CodelistMapRefType contains a set of reference fields for a codelist map.
api.doc.swagger.definitions.xml_ns4_CodelistReferenceType.description                                              = CodelistReferenceType is a type for referencing a codelist object. It consists of a URN and/or a complete set of reference fields.
api.doc.swagger.definitions.xml_ns4_CodelistRefType.description                                                    = CodelistRefType provides a reference to a codelist via a complete set of reference fields.
api.doc.swagger.definitions.xml_ns4_CodeReferenceType.description                                                  = CodeReferenceType is a type for referencing a code object. It consists of a URN and/or a complete set of reference fields.
api.doc.swagger.definitions.xml_ns4_CodeRefType.description                                                        = CodeRefType references a code from within a codelist. Reference fields are required for both the scheme and the item.
api.doc.swagger.definitions.xml_ns4_ComponentListRefBaseType.description                                           = ComponentListRefBaseType is an abstract base type for referencing a component list within a structure.
api.doc.swagger.definitions.xml_ns4_ComponentListReferenceType.description                                         = ComponentListReferenceType is an abstract base type used for referencing component lists within a structure. It consists of a URN and/or a complete set of reference fields (structure agency, structure id, structure version, and component list id).
api.doc.swagger.definitions.xml_ns4_ComponentRefBaseType.description                                               = ComponentRefBaseType is an abstract base type for referencing a component contained in a component list within a structure.
api.doc.swagger.definitions.xml_ns4_ComponentReferenceType.description                                             = ComponentReferenceType is an abstract base type used for referencing components within a structure definition. It consists of a URN and/or a complete set of reference fields (structure agency, structure id, structure version, component list id, and component id).
api.doc.swagger.definitions.xml_ns4_ComponentValueSetType.description                                              = ComponentValueSetType is an abstract base type which is used to provide a set of value for a referenced component. Implementations of this type will be based on a particular component type and refine the allowed values to reflect the types of values that are possible for that type of component.
api.doc.swagger.definitions.xml_ns4_ComponentValueSetType.properties.DataKey.description                           =
api.doc.swagger.definitions.xml_ns4_ComponentValueSetType.properties.DataSet.description                           =
api.doc.swagger.definitions.xml_ns4_ComponentValueSetType.properties.id.description                                =
api.doc.swagger.definitions.xml_ns4_ComponentValueSetType.properties.include.description                           =

api.doc.swagger.definitions.xml_ns5_TimeDimensionRepresentationType.description                                    = TimeDimensionRepresentationType defines the representation for the time dimension. Enumerated values are not allowed.<p>Java class for TimeDimensionRepresentationType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="TimeDimensionRepresentationType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}SimpleDataStructureRepresentationType">       &lt;sequence>         &lt;element name="TextFormat" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}TimeTextFormatType"/>       &lt;/sequence>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_TimeDimensionType.description                                                  = TimeDimensionType describes the structure of a time dimension. The time dimension takes its semantic from its concept identity (usually the TIME_PERIOD concept), yet is always has a fixed identifier (TIME_PERIOD). The time dimension always has a fixed text format, which specifies that its format is always the in the value set of the observational time period (see common:ObservationalTimePeriodType). It is possible that the format may be a sub-set of the observational time period value set. For example, it is possible to state that the representation might always be a calendar year. See the enumerations of the textType attribute in the LocalRepresentation/TextFormat for more details of the possible sub-sets. It is also possible to facet this representation with start and end dates. The purpose of such facts is to restrict the value of the time dimension to occur within the specified range. If the time dimension is expected to allow for the standard reporting periods (see common:ReportingTimePeriodType) to be used, then it is strongly recommended that the reporting year start day attribute also be included in the data structure definition. When the reporting year start day attribute is used, any standard reporting period values will be assumed to be based on the start day contained in this attribute. If the reporting year start day attribute is not included and standard reporting periods are used, these values will be assumed to be based on a reporting year which begins January 1.<p>Java class for TimeDimensionType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="TimeDimensionType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}BaseDimensionType">       &lt;sequence>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Annotations" minOccurs="0"/>         &lt;element name="ConceptIdentity" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ConceptReferenceType"/>         &lt;element name="LocalRepresentation" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}TimeDimensionRepresentationType"/>       &lt;/sequence>       &lt;attribute name="id" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}NCNameIDType" fixed="TIME_PERIOD" />       &lt;attribute name="type" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}DimensionTypeType" fixed="TimeDimension" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_TimeTextFormatType.description                                                 = TimeTextFormat is a restricted version of the SimpleComponentTextFormatType that only allows time based format and specifies a default ObservationalTimePeriod representation and facets of a start and end time.<p>Java class for TimeTextFormatType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="TimeTextFormatType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}SimpleComponentTextFormatType">       &lt;attribute name="textType" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}TimeDataType" default="ObservationalTimePeriod" />       &lt;attribute name="startTime" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}StandardTimePeriodType" />       &lt;attribute name="endTime" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}StandardTimePeriodType" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_ToValueTypeType.description                                                    = <p>Java class for ToValueTypeType.<p>The following schema fragment specifies the expected content contained within this class.<p><pre> &lt;simpleType name="ToValueTypeType">   &lt;restriction base="{http://www.w3.org/2001/XMLSchema}NMTOKEN">     &lt;enumeration value="Value"/>     &lt;enumeration value="Name"/>     &lt;enumeration value="Description"/>   &lt;/restriction> &lt;/simpleType> </pre>
api.doc.swagger.definitions.xml_ns5_TransitionType.description                                                     = TransitionType describes the details of a transition, which is an expression in a textual or formalised way of the transformation of data between two specific operations performed on the data.<p>Java class for TransitionType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="TransitionType">   &lt;complexContent>     &lt;extension base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}IdentifiableType">       &lt;sequence>         &lt;element name="TargetStep" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}LocalProcessStepReferenceType"/>         &lt;element name="Condition" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}TextType" maxOccurs="unbounded"/>       &lt;/sequence>       &lt;attribute name="localID" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}IDType" />     &lt;/extension>   &lt;/complexContent> &lt;/complexType> </pre>

api.doc.swagger.definitions.xml_ns5_MetadataflowType.description                                                   = MetadataflowType describes the structure of a metadata flow. A dataflow is defined as the structure of reference metadata that will be provided for different reference periods. If this type is not referenced externally, then a reference to a metadata structure definition must be provided<p>Java class for MetadataflowType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="MetadataflowType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}StructureUsageType">       &lt;sequence>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Annotations" minOccurs="0"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Name" maxOccurs="unbounded"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Description" maxOccurs="unbounded" minOccurs="0"/>         &lt;element name="Structure" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}MetadataStructureReferenceType" minOccurs="0"/>       &lt;/sequence>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_NameableType.description                                                       = NameableType is an abstract base type for  all nameable objects.<p>Java class for NameableType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="NameableType">   &lt;complexContent>     &lt;extension base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}IdentifiableType">       &lt;sequence>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Name" maxOccurs="unbounded"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Description" maxOccurs="unbounded" minOccurs="0"/>       &lt;/sequence>     &lt;/extension>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_NameableType.properties.Description.description                                = .
api.doc.swagger.definitions.xml_ns5_NameableType.properties.Name.description                                       = .
api.doc.swagger.definitions.xml_ns5_NonFacetedTextFormatType.description                                           = NonFacetedTextFormatType is a restricted version of the SimpleComponentTextFormatType that does not allow for any facets.<p>Java class for NonFacetedTextFormatType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="NonFacetedTextFormatType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}SimpleComponentTextFormatType">       &lt;attribute name="textType" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}SimpleDataType" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_OrganisationMapType.description                                                = OrganisationMapType defines the structure for mapping two organisations. A local reference is provided both the source and target organisation.<p>Java class for OrganisationMapType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="OrganisationMapType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}ItemAssociationType">       &lt;sequence>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Annotations" minOccurs="0"/>         &lt;element name="Source" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}LocalOrganisationReferenceType"/>         &lt;element name="Target" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}LocalOrganisationReferenceType"/>       &lt;/sequence>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_OrganisationSchemeBaseType.description                                         = OrganisationSchemeBaseType is an abstract base type for any organisation scheme.<p>Java class for OrganisationSchemeBaseType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="OrganisationSchemeBaseType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}ItemSchemeType">       &lt;sequence>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Annotations" minOccurs="0"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Name" maxOccurs="unbounded"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Description" maxOccurs="unbounded" minOccurs="0"/>       &lt;/sequence>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_OrganisationSchemeMapType.description                                          = OrganisationSchemeMapType defines the structure of a map which identifies relationships between organisations in different organisation schemes.<p>Java class for OrganisationSchemeMapType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="OrganisationSchemeMapType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}ItemSchemeMapType">       &lt;sequence>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Annotations" minOccurs="0"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Name" maxOccurs="unbounded"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Description" maxOccurs="unbounded" minOccurs="0"/>         &lt;element name="Source" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}OrganisationSchemeReferenceType"/>         &lt;element name="Target" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}OrganisationSchemeReferenceType"/>         &lt;sequence maxOccurs="unbounded">           &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}OrganisationMap"/>         &lt;/sequence>       &lt;/sequence>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_OrganisationSchemeType.description                                             = OrganisationSchemeType describes the structure of an organisation scheme.<p>Java class for OrganisationSchemeType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="OrganisationSchemeType">   &lt;complexContent>     &lt;extension base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}OrganisationSchemeBaseType">       &lt;sequence maxOccurs="unbounded" minOccurs="0">         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}Organisation"/>       &lt;/sequence>     &lt;/extension>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_OrganisationSchemeType.properties.Organisation.description                     = .
api.doc.swagger.definitions.xml_ns5_OrganisationType.description                                                   = OrganisationType in an abstract type which describes the structure of the details of an organisation. In addition to the basic organisation identification, contact details can be provided.<p>Java class for OrganisationType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="OrganisationType">   &lt;complexContent>     &lt;extension base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}BaseOrganisationType">       &lt;sequence>         &lt;element name="Contact" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}ContactType" maxOccurs="unbounded" minOccurs="0"/>       &lt;/sequence>     &lt;/extension>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_OrganisationType.properties.Contact.description                                = .
api.doc.swagger.definitions.xml_ns5_OrganisationUnitSchemeType.description                                         = OrganisationUnitSchemeType defines a type of organisation scheme which simply defines organisations and there parent child relationships. Organisations in this scheme are assigned no particular role, and may in fact exist within the other type of organisation schemes as well.<p>Java class for OrganisationUnitSchemeType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="OrganisationUnitSchemeType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}OrganisationSchemeType">       &lt;sequence>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Annotations" minOccurs="0"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Name" maxOccurs="unbounded"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Description" maxOccurs="unbounded" minOccurs="0"/>         &lt;sequence maxOccurs="unbounded" minOccurs="0">           &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}OrganisationUnit"/>         &lt;/sequence>       &lt;/sequence>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_OrganisationUnitType.description                                               = OrganisationUnitType defines the structure of an organisation unit description. In addition to general identification and contact information, an organisation unit can specify a relationship with another organisation unit from the same scheme which is its parent organisation.<p>Java class for OrganisationUnitType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="OrganisationUnitType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}OrganisationType">       &lt;sequence>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Annotations" minOccurs="0"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Name" maxOccurs="unbounded"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Description" maxOccurs="unbounded" minOccurs="0"/>         &lt;choice minOccurs="0">           &lt;element name="Parent" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}LocalOrganisationUnitReferenceType"/>         &lt;/choice>         &lt;element name="Contact" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}ContactType" maxOccurs="unbounded" minOccurs="0"/>       &lt;/sequence>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_PrimaryMeasureType.description                                                 = PrimaryMeasureType describes the structure of the primary measure. It describes the observation values for all presentations of the data. The primary measure takes its semantic, and in some cases it representation, from its concept identity (conventionally the OBS_VALUE concept). The primary measure can be coded by referencing a code list from its coded local representation. It can also specify its text format, which is used as the representation of the primary measure if a coded representation is not defined. Neither the coded or uncoded representation are necessary, since the primary measure may take these from the referenced concept. Note that if the data structure declares a measure dimension, the representation of this must be a superset of all possible measure concept representations.<p>Java class for PrimaryMeasureType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="PrimaryMeasureType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}ComponentType">       &lt;sequence>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Annotations" minOccurs="0"/>         &lt;element name="ConceptIdentity" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ConceptReferenceType"/>         &lt;element name="LocalRepresentation" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}SimpleDataStructureRepresentationType" minOccurs="0"/>       &lt;/sequence>       &lt;attribute name="id" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}NCNameIDType" fixed="OBS_VALUE" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_ProcessStepBaseType.description                                                = ProcessStepBaseType is an abstract base type used as the basis for the ProcessStepType.<p>Java class for ProcessStepBaseType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="ProcessStepBaseType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}NameableType">       &lt;sequence>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Annotations" minOccurs="0"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Name" maxOccurs="unbounded"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Description" maxOccurs="unbounded" minOccurs="0"/>       &lt;/sequence>       &lt;attribute name="id" use="required" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}IDType" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_ProcessStepType.description                                                    = ProcessStepType describes the structure of a process step. A nested process step is automatically sub-ordinate, and followed as the next step. If the following step is conditional, it should be referenced in a transition.<p>Java class for ProcessStepType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="ProcessStepType">   &lt;complexContent>     &lt;extension base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}ProcessStepBaseType">       &lt;sequence>         &lt;element name="Input" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}InputOutputType" maxOccurs="unbounded" minOccurs="0"/>         &lt;element name="Output" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}InputOutputType" maxOccurs="unbounded" minOccurs="0"/>         &lt;element name="Computation" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}ComputationType" minOccurs="0"/>         &lt;element name="Transition" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}TransitionType" maxOccurs="unbounded" minOccurs="0"/>         &lt;element name="ProcessStep" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}ProcessStepType" maxOccurs="unbounded" minOccurs="0"/>       &lt;/sequence>     &lt;/extension>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_ProcessStepType.properties.Computation.description                             = .
api.doc.swagger.definitions.xml_ns5_ProcessStepType.properties.Input.description                                   = .
api.doc.swagger.definitions.xml_ns5_ProcessStepType.properties.Output.description                                  = .
api.doc.swagger.definitions.xml_ns5_ProcessStepType.properties.ProcessStep.description                             = .
api.doc.swagger.definitions.xml_ns5_ProcessStepType.properties.Transition.description                              = .
api.doc.swagger.definitions.xml_ns5_ProcessType.description                                                        = ProcessType describes the structure of a process, which is a scheme which defines or documents the operations performed on data in order to validate data or to derive new information according to a given set of rules. Processes occur in order, and will continue in order unless a transition dictates another step should occur.<p>Java class for ProcessType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="ProcessType">   &lt;complexContent>     &lt;extension base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}MaintainableType">       &lt;sequence>         &lt;element name="ProcessStep" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}ProcessStepType" maxOccurs="unbounded" minOccurs="0"/>       &lt;/sequence>     &lt;/extension>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_ProcessType.properties.ProcessStep.description                                 = .
api.doc.swagger.definitions.xml_ns5_ProvisionAgreementType.description                                             = ProvisionAgreementType describes the structure of a provision agreement. A provision agreement defines an agreement for a data provider to report data or reference metadata against a flow. Attributes which describe how the registry must behave when data or metadata is registered against this provision agreement are supplied.<p>Java class for ProvisionAgreementType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="ProvisionAgreementType">   &lt;complexContent>     &lt;extension base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}MaintainableType">       &lt;sequence>         &lt;element name="StructureUsage" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}StructureUsageReferenceType"/>         &lt;element name="DataProvider" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}DataProviderReferenceType"/>       &lt;/sequence>     &lt;/extension>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_ProvisionAgreementType.properties.DataProvider.description                     = .
api.doc.swagger.definitions.xml_ns5_ProvisionAgreementType.properties.StructureUsage.description                   = .
api.doc.swagger.definitions.xml_ns5_ReleaseCalendarType.description                                                = ReleaseCalendarType describes information about the timing of releases of the constrained data. All of these values use the standard "P7D" - style format.<p>Java class for ReleaseCalendarType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="ReleaseCalendarType">   &lt;complexContent>     &lt;restriction base="{http://www.w3.org/2001/XMLSchema}anyType">       &lt;sequence>         &lt;element name="Periodicity" type="{http://www.w3.org/2001/XMLSchema}string"/>         &lt;element name="Offset" type="{http://www.w3.org/2001/XMLSchema}string"/>         &lt;element name="Tolerance" type="{http://www.w3.org/2001/XMLSchema}string"/>       &lt;/sequence>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_ReleaseCalendarType.properties.Offset.description                              = .
api.doc.swagger.definitions.xml_ns5_ReleaseCalendarType.properties.Periodicity.description                         = .
api.doc.swagger.definitions.xml_ns5_ReleaseCalendarType.properties.Tolerance.description                           = .
api.doc.swagger.definitions.xml_ns5_ReportPeriodRepresentationType.description                                     = ReportPeriodRepresentationType defines the possible local representations of a report period target object. The reprentation must be a time period or a subset of this representation.<p>Java class for ReportPeriodRepresentationType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="ReportPeriodRepresentationType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}RepresentationType">       &lt;sequence>         &lt;element name="TextFormat" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}TimeTextFormatType"/>       &lt;/sequence>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_ReportPeriodTargetType.description                                             = ReportPeriodTargetType defines the structure of a report period target object. The report period target object has a fixed representation and identifier.<p>Java class for ReportPeriodTargetType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="ReportPeriodTargetType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}TargetObject">       &lt;sequence>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Annotations" minOccurs="0"/>         &lt;element name="LocalRepresentation" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}ReportPeriodRepresentationType"/>       &lt;/sequence>       &lt;attribute name="id" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}NCNameIDType" fixed="REPORT_PERIOD_TARGET" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_ReportStructureBaseType.description                                            = ReportStructureBaseType is an abstract base type that serves as the basis for the ReportStructureType.<p>Java class for ReportStructureBaseType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="ReportStructureBaseType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}ComponentListType">       &lt;sequence>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Annotations" minOccurs="0"/>         &lt;sequence maxOccurs="unbounded">           &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}MetadataAttribute"/>         &lt;/sequence>       &lt;/sequence>       &lt;attribute name="id" use="required" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}IDType" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_ReportStructureType.description                                                = ReportStructureType describes the structure of a report structure. It comprises a set of metadata attributes that can be defined as a hierarchy, and identifies the potential attachment of these attributes to an object by referencing a target identifier.<p>Java class for ReportStructureType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="ReportStructureType">   &lt;complexContent>     &lt;extension base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}ReportStructureBaseType">       &lt;sequence>         &lt;element name="MetadataTarget" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}LocalMetadataTargetReferenceType" maxOccurs="unbounded"/>       &lt;/sequence>     &lt;/extension>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_ReportStructureType.properties.MetadataTarget.description                      = .
api.doc.swagger.definitions.xml_ns5_ReportingCategoryBaseType.description                                          = ReportingCategoryBaseType is an abstract base type that serves as the basis for the ReportingCategoryType.<p>Java class for ReportingCategoryBaseType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="ReportingCategoryBaseType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}ItemType">       &lt;sequence>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Annotations" minOccurs="0"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Name" maxOccurs="unbounded"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Description" maxOccurs="unbounded" minOccurs="0"/>         &lt;choice minOccurs="0">           &lt;sequence maxOccurs="unbounded">             &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}ReportingCategory"/>           &lt;/sequence>         &lt;/choice>       &lt;/sequence>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_ReportingCategoryMapType.description                                           = ReportingCategoryMapType defines the structure for mapping two reporting categories. A local reference is provided both the source and target category.<p>Java class for ReportingCategoryMapType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="ReportingCategoryMapType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}ItemAssociationType">       &lt;sequence>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Annotations" minOccurs="0"/>         &lt;element name="Source" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}LocalReportingCategoryReferenceType"/>         &lt;element name="Target" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}LocalReportingCategoryReferenceType"/>       &lt;/sequence>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_ReportingCategoryType.description                                              = ReportingCategoryType describes the structure of a reporting category, which groups structure usages into useful sub-packages. Sub ordinate reporting categories can be nested within the category definition.<p>Java class for ReportingCategoryType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="ReportingCategoryType">   &lt;complexContent>     &lt;extension base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}ReportingCategoryBaseType">       &lt;choice>         &lt;element name="StructuralMetadata" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}StructureReferenceType" maxOccurs="unbounded" minOccurs="0"/>         &lt;element name="ProvisioningMetadata" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}StructureUsageReferenceType" maxOccurs="unbounded" minOccurs="0"/>       &lt;/choice>     &lt;/extension>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_ReportingCategoryType.properties.ProvisioningMetadata.description              = .
api.doc.swagger.definitions.xml_ns5_ReportingCategoryType.properties.StructuralMetadata.description                = .
api.doc.swagger.definitions.xml_ns5_ReportingTaxonomyMapType.description                                           = ReportingTaxonomyMapType defines the structure of a map which identifies relationships between reporting categories in different reporting taxonomies.<p>Java class for ReportingTaxonomyMapType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="ReportingTaxonomyMapType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}ItemSchemeMapType">       &lt;sequence>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Annotations" minOccurs="0"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Name" maxOccurs="unbounded"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Description" maxOccurs="unbounded" minOccurs="0"/>         &lt;element name="Source" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ReportingTaxonomyReferenceType"/>         &lt;element name="Target" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ReportingTaxonomyReferenceType"/>         &lt;sequence maxOccurs="unbounded">           &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}ReportingCategoryMap"/>         &lt;/sequence>       &lt;/sequence>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_ReportingTaxonomyType.description                                              = ReportingTaxonomyType describes the structure of a reporting taxonomy, which is a scheme which defines the composition structure of a data report where each component can be described by an independent structure or structure usage description.<p>Java class for ReportingTaxonomyType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="ReportingTaxonomyType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}ItemSchemeType">       &lt;sequence>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Annotations" minOccurs="0"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Name" maxOccurs="unbounded"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Description" maxOccurs="unbounded" minOccurs="0"/>         &lt;sequence maxOccurs="unbounded" minOccurs="0">           &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}ReportingCategory"/>         &lt;/sequence>       &lt;/sequence>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_ReportingYearStartDayRepresentationType.description                            = ReportingYearStartDayRepresentationType defines the representation for the reporting year start day attribute. Enumerated values are not allowed and the text format is fixed to be a day and month in the ISO 8601 format of '--MM-DD'.<p>Java class for ReportingYearStartDayRepresentationType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="ReportingYearStartDayRepresentationType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}SimpleDataStructureRepresentationType">       &lt;sequence>         &lt;element name="TextFormat" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}ReportingYearStartDayTextFormatType"/>       &lt;/sequence>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_ReportingYearStartDayTextFormatType.description                                = ReportingYearStartDayTextFormatType is a restricted version of the NonFacetedTextFormatType that fixes the value of the text type to be DayMonth. This type exists solely for the purpose of fixing the representation of the reporting year start day attribute.<p>Java class for ReportingYearStartDayTextFormatType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="ReportingYearStartDayTextFormatType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}NonFacetedTextFormatType">       &lt;attribute name="textType" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}SimpleDataType" fixed="MonthDay" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_ReportingYearStartDayType.description                                          = ReportingYearStartDayType defines the structure of the reporting year start day attribute. The reporting year start day attribute takes its semantic from its concept identity (usually the REPORTING_YEAR_START_DAY concept), yet is always has a fixed identifier (REPORTING_YEAR_START_DAY). The reporting year start day attribute always has a fixed text format, which specifies that the format of its value is always a day and month in the ISO 8601 format of '--MM-DD'. As with any other attribute, an attribute relationship must be specified. this relationship should be carefully selected as it will determin what type of data the data structure definition will allow. For example, if an attribute relationship of none is specified, this will mean the data sets conforming to this data structure definition can only contain data with standard reporting periods where the all reporting periods have the same start day. In this case, data reported as standard reporting periods from two entities with different fiscal year start days could not be contained in the same data set.<p>Java class for ReportingYearStartDayType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="ReportingYearStartDayType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}AttributeType">       &lt;sequence>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Annotations" minOccurs="0"/>         &lt;element name="ConceptIdentity" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ConceptReferenceType"/>         &lt;element name="LocalRepresentation" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}ReportingYearStartDayRepresentationType"/>         &lt;element name="AttributeRelationship" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}AttributeRelationshipType"/>       &lt;/sequence>       &lt;attribute name="id" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}NCNameIDType" fixed="REPORTING_YEAR_START_DAY" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_RepresentationMapType.description                                              = RepresentationMapType describes the structure of the mapping of the value of a source to component to a target component. Either a reference to another map defined within the containing structure set or a description of the source and target text formats must be provided. Note that for key family components, only a reference to a codelist map is relevant, since that is the only type of coded representation allowed in a key family.<p>Java class for RepresentationMapType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="RepresentationMapType">   &lt;complexContent>     &lt;restriction base="{http://www.w3.org/2001/XMLSchema}anyType">       &lt;choice>         &lt;element name="CodelistMap" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}LocalCodelistMapReferenceType"/>         &lt;sequence>           &lt;element name="ToTextFormat" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}TextFormatType"/>           &lt;element name="ToValueType" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}ToValueTypeType"/>         &lt;/sequence>         &lt;element name="ValueMap" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}ValueMapType"/>       &lt;/choice>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_RepresentationMapType.properties.CodelistMap.description                       = .
api.doc.swagger.definitions.xml_ns5_RepresentationMapType.properties.ToTextFormat.description                      = .
api.doc.swagger.definitions.xml_ns5_RepresentationMapType.properties.ToValueType.description                       = .
api.doc.swagger.definitions.xml_ns5_RepresentationMapType.properties.ValueMap.description                          = .
api.doc.swagger.definitions.xml_ns5_RepresentationType.description                                                 = RepresentationType is an abstract type that defines a representation. Because the type of item schemes that are allowed as the an enumeration vary based on the object in which this is defined, this type is abstract to force that the enumeration reference be restricted to the proper type of item scheme reference.<p>Java class for RepresentationType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="RepresentationType">   &lt;complexContent>     &lt;restriction base="{http://www.w3.org/2001/XMLSchema}anyType">       &lt;choice>         &lt;element name="TextFormat" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}TextFormatType"/>         &lt;sequence>           &lt;element name="Enumeration" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ItemSchemeReferenceBaseType"/>           &lt;element name="EnumerationFormat" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}CodededTextFormatType" minOccurs="0"/>         &lt;/sequence>       &lt;/choice>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_RepresentationType.properties.Enumeration.description                          = .
api.doc.swagger.definitions.xml_ns5_RepresentationType.properties.EnumerationFormat.description                    = .
api.doc.swagger.definitions.xml_ns5_RepresentationType.properties.TextFormat.description                           = .
api.doc.swagger.definitions.xml_ns5_SimpleComponentTextFormatType.description                                      = SimpleComponentTextFormatType is a restricted version of the BasicComponentTextFormatType that does not allow for multi-lingual values.<p>Java class for SimpleComponentTextFormatType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="SimpleComponentTextFormatType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}BasicComponentTextFormatType">       &lt;attribute name="textType" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}SimpleDataType" default="String" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_SimpleDataStructureRepresentationType.description                              = SimpleDataStructureRepresentationType defines the representation for any non-measure and non-time dimension data structure definition component.<p>Java class for SimpleDataStructureRepresentationType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="SimpleDataStructureRepresentationType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}DataStructureRepresentationType">       &lt;choice>         &lt;element name="TextFormat" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}SimpleComponentTextFormatType"/>         &lt;sequence>           &lt;element name="Enumeration" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}CodelistReferenceType"/>           &lt;element name="EnumerationFormat" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}CodededTextFormatType" minOccurs="0"/>         &lt;/sequence>       &lt;/choice>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_StructureMapBaseType.description                                               = StructureMapBaseType is an abstract base type which forms the basis for the StructureMapType.<p>Java class for StructureMapBaseType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="StructureMapBaseType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}NameableType">       &lt;sequence>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Annotations" minOccurs="0"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Name" maxOccurs="unbounded"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Description" maxOccurs="unbounded" minOccurs="0"/>       &lt;/sequence>       &lt;attribute name="id" use="required" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}IDType" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_StructureMapType.description                                                   = StructureMapType defines the structure for mapping components of one structure to components of another structure. A structure may be referenced directly meaning the map applies wherever the structure is used, or it may be a reference via a structure usage meaning the map only applies within the context of that usage. Using the related structures, one can make extrapolations between maps. For example, if key families, A, B, and C, are all grouped in a related structures container, then a map from key family A to C and a map from key family B to C could be used to infer a relation between key family A to C.<p>Java class for StructureMapType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="StructureMapType">   &lt;complexContent>     &lt;extension base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}StructureMapBaseType">       &lt;sequence>         &lt;element name="Source" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}StructureOrUsageReferenceType"/>         &lt;element name="Target" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}StructureOrUsageReferenceType"/>         &lt;element name="ComponentMap" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}ComponentMapType" maxOccurs="unbounded"/>       &lt;/sequence>       &lt;attribute name="isExtension" type="{http://www.w3.org/2001/XMLSchema}boolean" default="false" />     &lt;/extension>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_StructureMapType.properties.ComponentMap.description                           = .
api.doc.swagger.definitions.xml_ns5_StructureMapType.properties.Source.description                                 = .
api.doc.swagger.definitions.xml_ns5_StructureMapType.properties.Target.description                                 = .
api.doc.swagger.definitions.xml_ns5_StructureMapType.properties.isExtension.description                            = .
api.doc.swagger.definitions.xml_ns5_StructureSetBaseType.description                                               = StructureSetBaseType is an abstract base type that forms the basis for the StructureSetType.<p>Java class for StructureSetBaseType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="StructureSetBaseType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}MaintainableType">       &lt;sequence>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Annotations" minOccurs="0"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Name" maxOccurs="unbounded"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Description" maxOccurs="unbounded" minOccurs="0"/>       &lt;/sequence>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_StructureSetType.description                                                   = StructureSetType describes the structure of a structure set. It allows components in one structure, structure usage, or item scheme to be mapped to components in another structural component of the same type.<p>Java class for StructureSetType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="StructureSetType">   &lt;complexContent>     &lt;extension base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}StructureSetBaseType">       &lt;sequence>         &lt;element name="RelatedStructure" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}StructureOrUsageReferenceType" maxOccurs="unbounded" minOccurs="0"/>         &lt;choice maxOccurs="unbounded" minOccurs="0">           &lt;element name="OrganisationSchemeMap" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}OrganisationSchemeMapType"/>           &lt;element name="CategorySchemeMap" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}CategorySchemeMapType"/>           &lt;element name="CodelistMap" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}CodelistMapType"/>           &lt;element name="ConceptSchemeMap" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}ConceptSchemeMapType"/>           &lt;element name="ReportingTaxonomyMap" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}ReportingTaxonomyMapType"/>           &lt;element name="HybridCodelistMap" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}HybridCodelistMapType"/>           &lt;element name="StructureMap" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}StructureMapType"/>         &lt;/choice>       &lt;/sequence>     &lt;/extension>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_StructureSetType.properties.CategorySchemeMap.description                      = .
api.doc.swagger.definitions.xml_ns5_StructureSetType.properties.CodelistMap.description                            = .
api.doc.swagger.definitions.xml_ns5_StructureSetType.properties.ConceptSchemeMap.description                       = .
api.doc.swagger.definitions.xml_ns5_StructureSetType.properties.HybridCodelistMap.description                      = .
api.doc.swagger.definitions.xml_ns5_StructureSetType.properties.OrganisationSchemeMap.description                  = .
api.doc.swagger.definitions.xml_ns5_StructureSetType.properties.RelatedStructure.description                       = .
api.doc.swagger.definitions.xml_ns5_StructureSetType.properties.ReportingTaxonomyMap.description                   = .
api.doc.swagger.definitions.xml_ns5_StructureSetType.properties.StructureMap.description                           = .
api.doc.swagger.definitions.xml_ns5_StructureType.description                                                      = StructureType is an abstract base type for all structure objects. Concrete instances of this should restrict to a concrete grouping.<p>Java class for StructureType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="StructureType">   &lt;complexContent>     &lt;extension base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}MaintainableType">       &lt;sequence>         &lt;sequence minOccurs="0">           &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}Grouping"/>         &lt;/sequence>       &lt;/sequence>     &lt;/extension>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_StructureType.properties.Grouping.description                                  = .
api.doc.swagger.definitions.xml_ns5_StructureUsageType.description                                                 = StructureUsageType is an abstract base type for all structure usages. It contains a reference to a structure. Concrete instances of this type should restrict the type of structure referenced.<p>Java class for StructureUsageType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="StructureUsageType">   &lt;complexContent>     &lt;extension base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}MaintainableType">       &lt;sequence>         &lt;element name="Structure" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}StructureReferenceBaseType" minOccurs="0"/>       &lt;/sequence>     &lt;/extension>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_StructureUsageType.properties.Structure.description                            = .
api.doc.swagger.definitions.xml_ns5_TargetObject.description                                                       = TargetObject is an abstract base type from which all target objects of a metadata target are derived. It is based on a component. Implementations of this will refined the local representation so that the allowed values accurately reflect the representation of the target object reference.<p>Java class for TargetObject complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="TargetObject">   &lt;complexContent>     &lt;extension base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}ComponentType">     &lt;/extension>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_TargetObjectTextFormatType.description                                         = TargetObjectTextFormatType is a restricted version of the TextFormatType that does not allow for any facets and only allows the text types for target objects.<p>Java class for TargetObjectTextFormatType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="TargetObjectTextFormatType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}TextFormatType">       &lt;attribute name="textType" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}TargetObjectDataType" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_TextFormatType.description                                                     = TextFormatType defines the information for describing a full range of text formats and may place restrictions on the values of the other attributes, referred to as "facets".<p>Java class for TextFormatType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="TextFormatType">   &lt;complexContent>     &lt;restriction base="{http://www.w3.org/2001/XMLSchema}anyType">       &lt;attribute name="textType" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}DataType" default="String" />       &lt;attribute name="isSequence" type="{http://www.w3.org/2001/XMLSchema}boolean" />       &lt;attribute name="interval" type="{http://www.w3.org/2001/XMLSchema}decimal" />       &lt;attribute name="startValue" type="{http://www.w3.org/2001/XMLSchema}decimal" />       &lt;attribute name="endValue" type="{http://www.w3.org/2001/XMLSchema}decimal" />       &lt;attribute name="timeInterval" type="{http://www.w3.org/2001/XMLSchema}duration" />       &lt;attribute name="startTime" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}StandardTimePeriodType" />       &lt;attribute name="endTime" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}StandardTimePeriodType" />       &lt;attribute name="minLength" type="{http://www.w3.org/2001/XMLSchema}positiveInteger" />       &lt;attribute name="maxLength" type="{http://www.w3.org/2001/XMLSchema}positiveInteger" />       &lt;attribute name="minValue" type="{http://www.w3.org/2001/XMLSchema}decimal" />       &lt;attribute name="maxValue" type="{http://www.w3.org/2001/XMLSchema}decimal" />       &lt;attribute name="decimals" type="{http://www.w3.org/2001/XMLSchema}positiveInteger" />       &lt;attribute name="pattern" type="{http://www.w3.org/2001/XMLSchema}string" />       &lt;attribute name="isMultiLingual" type="{http://www.w3.org/2001/XMLSchema}boolean" default="true" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>

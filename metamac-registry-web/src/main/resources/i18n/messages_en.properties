api.doc.swagger.definitions.xml_ns3_BasicHeaderType.description                                                    = BasicHeaderType defines the most basic header information used in simple message exchanges.<p>Java class for BasicHeaderType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="BasicHeaderType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/message}BaseHeaderType">       &lt;sequence>         &lt;element name="ID" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}IDType"/>         &lt;element name="Test" type="{http://www.w3.org/2001/XMLSchema}boolean"/>         &lt;element name="Prepared" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/message}HeaderTimeType"/>         &lt;element name="Sender" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/message}SenderType"/>         &lt;element name="Receiver" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/message}PartyType"/>       &lt;/sequence>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>

api.doc.swagger.definitions.xml_ns6_MappedObjectRefType.description                                                = MappedObjectRefType defines a set of reference fields for any type of mappable object.<p>Java class for MappedObjectRefType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="MappedObjectRefType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}MaintainableRefType">       &lt;attribute name="class" use="required" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/query}MappedObjectTypeCodelistType" />       &lt;attribute name="package" use="required" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}PackageTypeCodelistType" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns6_MappedObjectReferenceType.description                                          = MappedObjectReferenceType is a type for referencing any mappable object. It consists of a URN and/or a complete set of reference fields; agency, id, and version.<p>Java class for MappedObjectReferenceType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="MappedObjectReferenceType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}MaintainableReferenceType">       &lt;choice>         &lt;sequence>           &lt;element name="Ref" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/query}MappedObjectRefType" form="unqualified"/>           &lt;element name="URN" type="{http://www.w3.org/2001/XMLSchema}anyURI" minOccurs="0" form="unqualified"/>         &lt;/sequence>         &lt;element name="URN" type="{http://www.w3.org/2001/XMLSchema}anyURI" form="unqualified"/>       &lt;/choice>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns6_MappedObjectType.description                                                   = MappedObjectType defines a structure for referencing an object and indicating whether it is the source, target, or either for the purposes of query for structure set containing the referenced object in one of the maps it defines.<p>Java class for MappedObjectType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="MappedObjectType">   &lt;complexContent>     &lt;extension base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/query}MappedObjectReferenceType">       &lt;attribute name="type" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/query}SourceTargetType" default="Any" />     &lt;/extension>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns6_MappedObjectType.properties.type.description                                   = .
api.doc.swagger.definitions.xml_ns6_QueryTextType.description                                                      = QueryTextType describes the structure of a textual query value. A language must be specified if parallel multi-lingual values are available, otherwise it is ignored.<p>Java class for QueryTextType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="QueryTextType">   &lt;simpleContent>     &lt;extension base="&lt;http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common>TextType">       &lt;attribute name="operator" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}TextOperatorType" default="equal" />     &lt;/extension>   &lt;/simpleContent> &lt;/complexType> </pre>

api.doc.swagger.info.description                                                                                   = The SDMX Registry API implements the registry specifications of said international standard. Through this API you can obtain all the SDMX artifacts that the Institute has available in its systems. This service is based on the premise of centralizing the location of statistical metadata data resources in such a way that it can be reused by any third party.

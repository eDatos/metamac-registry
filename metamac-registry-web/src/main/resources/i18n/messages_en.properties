api.doc.swagger.definitions.xml_ns5_ContactType.properties.X400.description                                        =
api.doc.swagger.definitions.xml_ns5_ContentConstraintAttachmentType.description                                    = ContentConstraintAttachmentType defines the structure for specifying the target object(s) of a content constraint.
api.doc.swagger.definitions.xml_ns5_ContentConstraintBaseType.description                                          = ContentConstraintBaseType is an abstract base type that forms the basis for the ContentConstraintType.
api.doc.swagger.definitions.xml_ns5_ContentConstraintType.description                                              = ContentConstraintType describes the details of a content constraint by defining the content regions, key sets, or release information for the constraint attachment objects. Note that if the constraint is for a data provider, then only release calendar information is relevant, as there is no reliable way of determining which key family is being used to frame constraints in terms of cube regions or key sets.
api.doc.swagger.definitions.xml_ns5_ContentConstraintType.properties.ReferencePeriod.description                   =
api.doc.swagger.definitions.xml_ns5_ContentConstraintType.properties.ReleaseCalendar.description                   =
api.doc.swagger.definitions.xml_ns5_ContentConstraintType.properties.type.description                              =
api.doc.swagger.definitions.xml_ns5_DataConsumerSchemeType.description                                             = DataConsumerSchemeType defines a type of organisation scheme which contains only data consumers. The data consumer scheme maintained by a particular maintenance agency is always provided a fixed identifier and version, and is never final. Therefore, consumers can be added or removed without have to version the scheme. This scheme has no hierarchy, meaning that no organisation may define a relationship with another organisation in the scheme.
api.doc.swagger.definitions.xml_ns5_DataConsumerType.description                                                   = DataConsumerType defines the structure of a data consumer description. The contacts defined for the organisation are specific to the data consumer role the organisation is serving.
api.doc.swagger.definitions.xml_ns5_DataflowType.description                                                       = DataflowType describes the structure of a data flow. A data flow is defined as the structure of data that will provided for different reference periods. If this type is not referenced externally, then a reference to a key family definition must be provided.
api.doc.swagger.definitions.xml_ns5_DataKeySetType.description                                                     = DataKeySetType defines a collection of full or partial data keys (dimension values).
api.doc.swagger.definitions.xml_ns5_DataProviderSchemeType.description                                             = DataProviderSchemeType defines a type of organisation scheme which contains only data providers. The data provider scheme maintained by a particular maintenance agency is always provided a fixed identifier and version, and is never final. Therefore, providers can be added or removed without have to version the scheme. This scheme has no hierarchy, meaning that no organisation may define a relationship with another organisation in the scheme
api.doc.swagger.definitions.xml_ns5_DataProviderType.description                                                   = DataProviderType defines the structure of a data provider description. The contacts defined for the organisation are specific to the data provider role the organisation is serving.
api.doc.swagger.definitions.xml_ns5_DataSetRepresentationType.description                                          = DataSetRepresentationType defines the possible local representations of a data set reference target object. The representation is fixed to always be a data set reference.
api.doc.swagger.definitions.xml_ns5_DataSetTargetType.description                                                  = DataSetTargetType defines the structure of a data set target object. The data set target object has a fixed representation and identifier.
api.doc.swagger.definitions.xml_ns5_DataSetTextFormatType.description                                              = DataSetTextFormatType is a restricted version of the NonFacetedTextFormatType that specifies a fixed DataSetReference representation.
api.doc.swagger.definitions.xml_ns5_DataStructureRepresentationType.description                                    = DataStructureRepresentationType is an abstract base type which defines the allowable representations for any data structure definition component. The enumeration must be restricted to the proper type for item scheme for a given component.
api.doc.swagger.definitions.xml_ns5_DataStructureType.description                                                  = DataStructureType describes the structure of a data structure definition. A data structure definition is defined as a collection of metadata concepts, their structure and usage when used to collect or disseminate data.
api.doc.swagger.definitions.xml_ns5_DimensionListBaseType.description                                              = DimensionListBaseType is an abstract base type used as the basis for the DimensionListType.
api.doc.swagger.definitions.xml_ns5_DimensionListType.description                                                  = DimensionListType describes the key descriptor for a data structure definition. The order of the declaration of child dimensions is significant: it is used to describe the order in which they will appear in data formats for which key values are supplied in an ordered fashion (exclusive of the time dimension, which is not represented as a member of the ordered key). Any data structure definition which uses the time dimension should also declare a frequency dimension, conventionally the first dimension in the key (the set of ordered non-time dimensions). If is not necessary to assign a time dimension, as data can be organised in any fashion required.
api.doc.swagger.definitions.xml_ns5_DimensionListType.properties.Dimension.description                             =
api.doc.swagger.definitions.xml_ns5_DimensionListType.properties.MeasureDimension.description                      =
api.doc.swagger.definitions.xml_ns5_DimensionListType.properties.TimeDimension.description                         =
api.doc.swagger.definitions.xml_ns5_DimensionType.description                                                      = DimensionType describes the structure of an ordinary dimension, which is defined as a statistical concept used (most probably together with other statistical concepts) to identify a statistical series, such as a time series, e.g. a statistical concept indicating certain economic activity or a geographical reference area. The dimension takes its semantic, and in some cases it representation, from its concept identity. A dimension can be coded by referencing a code list from its coded local representation. It can also specify its text format, which is used as the representation of the dimension if a coded representation is not defined. Neither the coded or uncoded representation are necessary, since the dimension may take these from the referenced concept.
api.doc.swagger.definitions.xml_ns5_GroupBaseType.description                                                      = GroupBaseType is an abstract base type that forms the basis for the GroupType.
api.doc.swagger.definitions.xml_ns5_GroupDimensionBaseType.description                                             = GroupDimensionBaseType is an abstract base type which refines the base ComponentType in order to form the basis for the GroupDimensionType.
api.doc.swagger.definitions.xml_ns5_GroupDimensionType.description                                                 = GroupDimensionType defines a dimension component with a group key descriptor component list. Although technically a component, this is essentially a reference to a dimension defined in the key descriptor. Therefore, the identification, name, and description, concept identity and representation properties that are typically available for a component are not allowed here, as they are all inherited from the referenced dimension.
api.doc.swagger.definitions.xml_ns5_GroupDimensionType.properties.DimensionReference.description                   =
api.doc.swagger.definitions.xml_ns5_GroupType.description                                                          = GroupType describes the structure of a group descriptor in a data structure definition. A group may consist of a of partial key, or collection of distinct cube regions or key sets to which attributes may be attached. The purpose of a group is to specify attributes values which have the same value based on some common dimensionality. All groups declared in the data structure must be unique - that is, you may not have duplicate partial keys. All groups must be given unique identifiers.
api.doc.swagger.definitions.xml_ns5_GroupType.properties.AttachmentConstraint.description                          =
api.doc.swagger.definitions.xml_ns5_GroupType.properties.GroupDimension.description                                =
api.doc.swagger.definitions.xml_ns5_HierarchicalCodeBaseType.description                                           = HierarchicalCodeBaseType is an abstract base type the creates the basis for the HierarchicalCodeType. It removes the urn and uri.
api.doc.swagger.definitions.xml_ns5_HierarchicalCodelistBaseType.description                                       = HierarchicalCodelistBaseType is an abstract base class that is the basis for the HierarchicalCodelistType. It requires that a name be supplied.
api.doc.swagger.definitions.xml_ns5_HierarchicalCodelistType.description                                           = HierarchicalCodelistType describes the structure of a hierarchical codelist. A hierarchical code list is defined as an organised collection of codes that may participate in many parent/child relationships with other codes in the list, as defined by one or more hierarchy of the list.
api.doc.swagger.definitions.xml_ns5_HierarchicalCodelistType.properties.Hierarchy.description                      =
api.doc.swagger.definitions.xml_ns5_HierarchicalCodelistType.properties.IncludedCodelist.description               =
api.doc.swagger.definitions.xml_ns5_HierarchicalCodeType.description                                               = HierarchicalCodeType describes the structure of a hierarchical code. A hierarchical code provides for a reference to a code that is referenced within the hierarchical code list via either a complete reference to a code through either a URN or full set of reference fields, or a local reference which utilizes the included codelist reference alias and the identification of a code from the list. Codes are arranged in a hierarchy by this reference. Note that it is possible to reference a single code such that it has multiple parents within the hierarchy. Further, the hierarchy may or may not be a leveled one.
api.doc.swagger.definitions.xml_ns5_HierarchicalCodeType.properties.Code.description                               =
api.doc.swagger.definitions.xml_ns5_HierarchicalCodeType.properties.CodeID.description                             =
api.doc.swagger.definitions.xml_ns5_HierarchicalCodeType.properties.CodelistAliasRef.description                   =
api.doc.swagger.definitions.xml_ns5_HierarchicalCodeType.properties.HierarchicalCode.description                   =
api.doc.swagger.definitions.xml_ns5_HierarchicalCodeType.properties.Level.description                              =
api.doc.swagger.definitions.xml_ns5_HierarchicalCodeType.properties.validFrom.description                          =
api.doc.swagger.definitions.xml_ns5_HierarchicalCodeType.properties.validTo.description                            =
api.doc.swagger.definitions.xml_ns5_HierarchicalCodeType.properties.version.description                            =
api.doc.swagger.definitions.xml_ns5_HierarchyBaseType.description                                                  = HierarchyBaseType is an abstract base type that serves as the basis for the HierarchyType. It requires a name and id be provided.
api.doc.swagger.definitions.xml_ns5_HierarchyType.description                                                      = The Hierarchy is an abstract type that provides for a classification structure of referenced codes arranged in levels of detail from the broadest to the most detailed level. The levels in which the code exist can be formal or informal.
api.doc.swagger.definitions.xml_ns5_HierarchyType.properties.HierarchicalCode.description                          =
api.doc.swagger.definitions.xml_ns5_HierarchyType.properties.Level.description                                     =
api.doc.swagger.definitions.xml_ns5_HierarchyType.properties.leveled.description                                   =
api.doc.swagger.definitions.xml_ns5_HybridCodelistMapBaseType.description                                          = HybridCodelistMapBaseType is an abstract base type which forms the basis for the HybridCodelistMapType.
api.doc.swagger.definitions.xml_ns5_HybridCodelistMapType.description                                              = HybridCodelistMapType defines the structure of a map which relates codes (possibly hierarchical) from different code lists.
api.doc.swagger.definitions.xml_ns5_HybridCodelistMapType.properties.HybridCodeMap.description                     =
api.doc.swagger.definitions.xml_ns5_HybridCodelistMapType.properties.Source.description                            =
api.doc.swagger.definitions.xml_ns5_HybridCodelistMapType.properties.Target.description                            =
api.doc.swagger.definitions.xml_ns5_HybridCodeMapType.description                                                  = CodeMapType defines the structure for associating a code from a source codelist to a code in a target codelist. Note that either of these may come from a hierarchical codelist.
api.doc.swagger.definitions.xml_ns5_HybridCodeMapType.properties.Source.description                                =
api.doc.swagger.definitions.xml_ns5_HybridCodeMapType.properties.Target.description                                =
api.doc.swagger.definitions.xml_ns5_IdentifiableObjectRepresentationType.description                               = IdentifiableObjectRepresentationType defines the possible local representations of an identifiable object target object.
api.doc.swagger.definitions.xml_ns5_IdentifiableObjectTargetBaseType.description                                   = IdentifiableObjectTargetBaseType is an abstract base type which forms the basis for the IdentifiableObjectTargetType.
api.doc.swagger.definitions.xml_ns5_IdentifiableObjectTargetType.description                                       = IdentifiableObjectTargetType defines the structure of an identifiable target object. The identifiable target object has a fixed representation of a reference and can specify a local representation of any item scheme for the purpose of restricting which items may be referenced. The identifiable object target must specify the object type which the target object is meant to reference.
api.doc.swagger.definitions.xml_ns5_IdentifiableObjectTargetType.properties.objectType.description                 =
api.doc.swagger.definitions.xml_ns5_IdentifiableObjectTextFormatType.description                                   = IdentifiableObjectTextFormatType is a restricted version of the NonFacetedTextFormatType that specifies a fixed IdentifiableReference representation.
api.doc.swagger.definitions.xml_ns5_IdentifiableType.description                                                   = IdentifiableType is an abstract base type for all identifiable objects.
api.doc.swagger.definitions.xml_ns5_IdentifiableType.properties.id.description                                     =
api.doc.swagger.definitions.xml_ns5_IdentifiableType.properties.uri.description                                    =
api.doc.swagger.definitions.xml_ns5_IdentifiableType.properties.urn.description                                    =
api.doc.swagger.definitions.xml_ns5_IncludedCodelistReferenceType.description                                      = IncludedCodelistReferenceType provides the structure for a referencing a codelist and optionally providing a local alias identification for this reference.
api.doc.swagger.definitions.xml_ns5_IncludedCodelistReferenceType.properties.alias.description                     =
api.doc.swagger.definitions.xml_ns5_InputOutputType.description                                                    = InputOutputType describes the structure of an input or output to a process step. It provides a reference to the object that is the input or output.
api.doc.swagger.definitions.xml_ns5_InputOutputType.properties.localID.description                                 =
api.doc.swagger.definitions.xml_ns5_InputOutputType.properties.ObjectReference.description                         =
api.doc.swagger.definitions.xml_ns5_ISOConceptReferenceType.description                                            = ISOConceptReferenceType provides a reference to and ISO 11179 concept.
api.doc.swagger.definitions.xml_ns5_ISOConceptReferenceType.properties.ConceptAgency.description                   =
api.doc.swagger.definitions.xml_ns5_ISOConceptReferenceType.properties.ConceptID.description                       =
api.doc.swagger.definitions.xml_ns5_ISOConceptReferenceType.properties.ConceptSchemeID.description                 =
api.doc.swagger.definitions.xml_ns5_ItemAssociationType.description                                                = ItemAssociationType is an abstract type which defines the relationship between two items from the source and target item schemes of an item scheme map.
api.doc.swagger.definitions.xml_ns5_ItemAssociationType.properties.Source.description                              =
api.doc.swagger.definitions.xml_ns5_ItemAssociationType.properties.Target.description                              =
api.doc.swagger.definitions.xml_ns5_ItemBaseType.description                                                       = ItemBaseType is an abstract base type that forms the basis for the ItemType. It requires that at least an id be supplied for an item.
api.doc.swagger.definitions.xml_ns5_ItemSchemeMapBaseType.description                                              = ItemSchemeMapBaseType is an abstract base type which forms the basis for the ItemSchemeMapType.
api.doc.swagger.definitions.xml_ns5_ItemSchemeMapType.description                                                  = ItemSchemeMapType is an abstract base type which forms the basis for mapping items between item schemes of the same type.
api.doc.swagger.definitions.xml_ns5_ItemSchemeMapType.properties.ItemAssociation.description                       =
api.doc.swagger.definitions.xml_ns5_ItemSchemeMapType.properties.Source.description                                =
api.doc.swagger.definitions.xml_ns5_ItemSchemeMapType.properties.Target.description                                =
api.doc.swagger.definitions.xml_ns5_ItemSchemeType.description                                                     = ItemSchemeType is an abstract base type for all item scheme objects. It contains a collection of items. Concrete instances of this type should restrict the actual types of items allowed within the scheme.
api.doc.swagger.definitions.xml_ns5_ItemSchemeType.properties.isPartial.description                                =
api.doc.swagger.definitions.xml_ns5_ItemSchemeType.properties.Item.description                                     =
api.doc.swagger.definitions.xml_ns5_ItemType.description                                                           = ItemType is an abstract base type for all items with in an item scheme. Concrete instances of this type may or may not utilize the nested item, but if so should restrict the actual types of item allowed.
api.doc.swagger.definitions.xml_ns5_ItemType.properties.Item.description                                           =
api.doc.swagger.definitions.xml_ns5_ItemType.properties.Parent.description                                         =
api.doc.swagger.definitions.xml_ns5_KeyDescriptorValuesRepresentationType.description                              = KeyDescriptorValuesRepresentationType defines the possible local representations of a key descriptor values target object. The representation is fixed to always be a data key (KeyValues).
api.doc.swagger.definitions.xml_ns5_KeyDescriptorValuesTargetType.description                                      = KeyDescriptorValuesTargetType defines the structure of a key descriptor values target object. The key descriptor values target object has a fixed representation and identifier.
api.doc.swagger.definitions.xml_ns5_KeyDescriptorValuesTextFormatType.description                                  = KeyDescriptorValuesTextFormatType is a restricted version of the NonFacetedTextFormatType that specifies a fixed KeyValues representation.
api.doc.swagger.definitions.xml_ns5_KeySetType.description                                                         = KeySetType is an abstract base type for defining a collection of keys.
api.doc.swagger.definitions.xml_ns5_KeySetType.properties.isIncluded.description                                   =
api.doc.swagger.definitions.xml_ns5_KeySetType.properties.Key.description                                          =
api.doc.swagger.definitions.xml_ns5_LevelBaseType.description                                                      = LevelBaseType is an abstract base type that makes up the basis for the LevelType. It requires a name and id.
api.doc.swagger.definitions.xml_ns5_LevelType.description                                                          = LevelType describes a level in a hierarchical codelist. Where level is defined as a group where codes can be characterised by homogeneous coding, and where the parent of each code in the group is at the same higher level of the hierarchy.
api.doc.swagger.definitions.xml_ns5_LevelType.properties.CodingFormat.description                                  =
api.doc.swagger.definitions.xml_ns5_LevelType.properties.Level.description                                         =
api.doc.swagger.definitions.xml_ns5_MaintainableBaseType.description                                               = MaintainableBaseType is an abstract type that only serves the purpose of forming the base for the actual MaintainableType. The purpose of this type is to restrict the VersionableType to require the id attribute.
api.doc.swagger.definitions.xml_ns5_MaintainableType.description                                                   = MaintainableType is an abstract base type for all maintainable objects.
api.doc.swagger.definitions.xml_ns5_MaintainableType.properties.agencyID.description                               =
api.doc.swagger.definitions.xml_ns5_MaintainableType.properties.isExternalReference.description                    =
api.doc.swagger.definitions.xml_ns5_MaintainableType.properties.isFinal.description                                =
api.doc.swagger.definitions.xml_ns5_MaintainableType.properties.serviceURL.description                             =
api.doc.swagger.definitions.xml_ns5_MaintainableType.properties.structureURL.description                           =
api.doc.swagger.definitions.xml_ns5_MeasureDimensionRepresentationType.description                                 = BaseDimensionRepresentationType is an abstract base which defines the representation for a measure dimension.
api.doc.swagger.definitions.xml_ns5_MeasureDimensionType.description                                               = MeasureDimensionType defines the structure of the measure dimension. It is derived from the base dimension structure, but requires that a coded representation taken from a concept scheme is given.
api.doc.swagger.definitions.xml_ns5_MeasureListType.description                                                    = MeasureListType describes the structure of the measure descriptor for a data structure definition. Only a primary may be defined.
api.doc.swagger.definitions.xml_ns5_MetadataAttributeBaseType.description                                          = MetadataAttributeBaseType is an abstract base type the serves as the basis for the MetadataAttributeType.
api.doc.swagger.definitions.xml_ns5_MetadataAttributeRepresentationType.description                                = MetadataAttributeRepresentationType defines the possible local representations of a metadata attribute.
api.doc.swagger.definitions.xml_ns5_MetadataAttributeType.description                                              = MetadataAttributeType describes the structure of a metadata attribute. The metadata attribute takes its semantic, and in some cases it representation, from its concept identity. A metadata attribute may be coded (via the local representation), uncoded (via the text format), or take no value. In addition to this value, the metadata attribute may also specify subordinate metadata attributes. If a metadata attribute only serves the purpose of containing subordinate metadata attributes, then the isPresentational attribute should be used. Otherwise, it is assumed to also take a value. If the metadata attribute does take a value, and a representation is not defined, it will be inherited from the concept it takes its semantic from. The optional id on the metadata attribute uniquely identifies it within the metadata structured definition. If this id is not supplied, its value is assumed to be that of the concept referenced from the concept identity. Note that a metadata attribute (as identified by the id attribute) definition  must be unique across the entire metadata structure definition (including target identifier, identifier component, and report structure ids). A metadata attribute may be used in multiple report structures and at different levels, but the content (value and/or child metadata attributes and their cardinality) of the metadata attribute cannot change.
api.doc.swagger.definitions.xml_ns5_MetadataAttributeType.properties.isPresentational.description                  =
api.doc.swagger.definitions.xml_ns5_MetadataAttributeType.properties.maxOccurs.description                         =
api.doc.swagger.definitions.xml_ns5_MetadataAttributeType.properties.MetadataAttribute.description                 =
api.doc.swagger.definitions.xml_ns5_MetadataAttributeType.properties.minOccurs.description                         =
api.doc.swagger.definitions.xml_ns5_MetadataflowType.description                                                   = MetadataflowType describes the structure of a metadata flow. A dataflow is defined as the structure of reference metadata that will be provided for different reference periods. If this type is not referenced externally, then a reference to a metadata structure definition must be provided
api.doc.swagger.definitions.xml_ns5_MetadataKeySetType.description                                                 = MetadataKeySetType defines a collection of metadata keys (identifier component values).
api.doc.swagger.definitions.xml_ns5_MetadataStructureType.description                                              = MetadataStructureType is used to describe a metadata structure definition, which is defined as a collection of metadata concepts, their structure and usage when used to collect or disseminate reference metadata.
api.doc.swagger.definitions.xml_ns5_MetadataTargetBaseType.description                                             = MetadataTargetBaseType is an abstract base type which forms the basis for the MetadataTargetType.

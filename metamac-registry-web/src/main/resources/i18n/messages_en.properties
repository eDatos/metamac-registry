api.doc.swagger.definitions.xml_ns4_ComponentValueSetType.properties.TimeRange.description                         =
api.doc.swagger.definitions.xml_ns4_ComponentValueSetType.properties.Value.description                             =
api.doc.swagger.definitions.xml_ns4_ConceptReferenceType.description                                               = ConceptReferenceType is a type for referencing a concept object. It consists of a URN and/or a complete set of reference fields.
api.doc.swagger.definitions.xml_ns4_ConceptRefType.description                                                     = ConceptRefType references a concept from within a concept scheme. Reference fields are required for both the scheme and the item.
api.doc.swagger.definitions.xml_ns4_ConceptSchemeMapReferenceType.description                                      = ConceptSchemeMapReferenceType is a type for referencing a concept scheme map object. It consists of a URN and/or a complete set of reference fields.
api.doc.swagger.definitions.xml_ns4_ConceptSchemeMapRefType.description                                            = ConceptSchemeMapRefType contains a set of reference fields for a concept scheme map.
api.doc.swagger.definitions.xml_ns4_ConceptSchemeReferenceType.description                                         = ConceptSchemeReferenceType is a type for referencing a concept scheme object. It consists of a URN and/or a complete set of reference fields.
api.doc.swagger.definitions.xml_ns4_ConstraintReferenceType.description                                            = ConstraintReferenceType is a type for referencing a constraint object. It consists of a URN and/or a complete set of reference fields.
api.doc.swagger.definitions.xml_ns4_ConstraintRefType.description                                                  = ConstraintRefType contains a set of reference fields for a constraint.
api.doc.swagger.definitions.xml_ns4_ConstraintTargetReferenceType.description                                      = ConstraintTargetReferenceType is a type for referencing a constraint target object. It consists of a URN and/or a complete set of reference fields.
api.doc.swagger.definitions.xml_ns4_ConstraintTargetRefType.description                                            = ConstraintTargetRefType contains a reference to a constraint target within a metadata target of a data structure definition.
api.doc.swagger.definitions.xml_ns4_ContainerChildObjectRefBaseType.description                                    = ContainerChildObjectRefBaseType is an abstract base type for referencing any child object within container defined in a maintainable object.
api.doc.swagger.definitions.xml_ns4_ContainerChildObjectReferenceType.description                                  = ContainerChildObjectReferenceType is an abstract base type used for referencing a particular object defined in a container object within a maintainable object. It consists of a URN and/or a complete set of reference fields; agency, maintainable id (maintainableParentID), maintainable version (maintainableParentVersion), container id (which is optional in order to allow for containers with fixed values to be omitted), container version (if applicable), the object id (which can be nested), and optionally the object version (if applicable).
api.doc.swagger.definitions.xml_ns4_ContentConstraintReferenceType.description                                     = ContentConstraintReferenceType is a type for referencing a content constraint object. It consists of a URN and/or a complete set of reference fields.
api.doc.swagger.definitions.xml_ns4_ContentConstraintRefType.description                                           = ContentConstraintRefType contains a set of reference fields for a content constraint.
api.doc.swagger.definitions.xml_ns4_ContentConstraintTypeCodeType.description                                      = 
api.doc.swagger.definitions.xml_ns4_CubeRegionKeyType.description                                                  = CubeRegionKeyType is a type for providing a set of values for a dimension for the purpose of defining a data cube region. A set of distinct value can be provided, or if this dimension is represented as time, and time range can be specified.
api.doc.swagger.definitions.xml_ns4_CubeRegionType.description                                                     = CubeRegionType defines the structure of a data cube region. This is based on the abstract RegionType and simply refines the key and attribute values to conform with what is applicable for dimensions and attributes, respectively. See the documentation of the base type for more details on how a region is defined.
api.doc.swagger.definitions.xml_ns4_DataConsumerReferenceType.description                                          = DataConsumerReferenceType is a type for referencing a data consumer. It consists of a URN and/or a complete set of reference fields.
api.doc.swagger.definitions.xml_ns4_DataConsumerRefType.description                                                = DataConsumerRefType contains a set of reference fields for referencing a data consumer within a data consumer scheme.
api.doc.swagger.definitions.xml_ns4_DataConsumerSchemeReferenceType.description                                    = DataConsumerSchemeReferenceType is a type for referencing a data consumer scheme object. It consists of a URN and/or a complete set of reference fields.
api.doc.swagger.definitions.xml_ns4_DataConsumerSchemeRefType.description                                          = DataConsumerSchemeRefType contains a set of reference fields for a data consumer scheme.
api.doc.swagger.definitions.xml_ns4_DataflowReferenceType.description                                              = DataflowReferenceType is a type for referencing a dataflow object. It consists of a URN and/or a complete set of reference fields.
api.doc.swagger.definitions.xml_ns4_DataflowRefType.description                                                    = DataflowRefType contains a set of reference fields for a data flow.
api.doc.swagger.definitions.xml_ns4_DataKeyType.description                                                        = DataKeyType is a region which defines a distinct full or partial data key. The key consists of a set of values, each referencing a dimension and providing a single value for that dimension. The purpose of the key is to define a subset of a data set (i.e. the observed value and data attribute) which have the dimension values provided in this definition. Any dimension not stated explicitly in this key is assumed to be wild carded, thus allowing for the definition of partial data keys.
api.doc.swagger.definitions.xml_ns4_DataKeyValueType.description                                                   = DataKeyValueType is a type for providing a dimension value for the purpose of defining a distinct data key. Only a single value can be provided for the dimension.
api.doc.swagger.definitions.xml_ns4_DataProviderReferenceType.description                                          = DataProviderReferenceType is a type for referencing a data provider. It consists of a URN and/or a complete set of reference fields.
api.doc.swagger.definitions.xml_ns4_DataProviderRefType.description                                                = DataProviderRefType contains a set of reference fields for referencing a data provider within a data provider scheme.
api.doc.swagger.definitions.xml_ns4_DataProviderSchemeReferenceType.description                                    = DataProviderSchemeReferenceType is a type for referencing a data provider scheme object. It consists of a URN and/or a complete set of reference fields.
api.doc.swagger.definitions.xml_ns4_DataProviderSchemeRefType.description                                          = DataProviderSchemeRefType contains a set of reference fields for a data provider scheme.
api.doc.swagger.definitions.xml_ns4_DataSetTargetReferenceType.description                                         = DataSetTargetReferenceType is a type for referencing a data set target object. It consists of a URN and/or a complete set of reference fields.
api.doc.swagger.definitions.xml_ns4_DataSetTargetRefType.description                                               = DataSetTargetRefType contains a reference to a data set target within a metadata target of a data structure definition.
api.doc.swagger.definitions.xml_ns4_DataStructureEnumerationSchemeReferenceType.description                        = DataStructureEnumerationSchemeReferenceType is a type for referencing any type of item scheme that is allowable as the enumeration of the representation of a data structure definition component. It consists of a URN and/or a complete set of reference fields.
api.doc.swagger.definitions.xml_ns4_DataStructureEnumerationSchemeRefType.description                              = DataStructureEnumerationSchemeRefType contains the reference fields for referencing any item scheme that is allowable as the enumeration of the representation of a data structure definition component.
api.doc.swagger.definitions.xml_ns4_DataStructureReferenceType.description                                         = DataStructureReferenceType is a type for referencing a data structure definition object. It consists of a URN and/or a complete set of reference fields.
api.doc.swagger.definitions.xml_ns4_DataStructureRefType.description                                               = DataStructureRefType contains a set of reference fields for a data structure definition.
api.doc.swagger.definitions.xml_ns4_DataType.description                                                           = 
api.doc.swagger.definitions.xml_ns4_DimensionReferenceType.description                                             = DimensionReferenceType is a type for referencing a dimension object. It consists of a URN and/or a complete set of reference fields.
api.doc.swagger.definitions.xml_ns4_DimensionRefType.description                                                   = DimensionRefType contains a reference to a dimension within a data structure definition. Note that since there is only one key descriptor, the container reference fields are prohibited.
api.doc.swagger.definitions.xml_ns4_DimensionTypeType.description                                                  = 
api.doc.swagger.definitions.xml_ns4_DinstinctKeyValueType.description                                              = DinstinctKeyValueType is an abstract base type which defines a singular, required value for a key component.
api.doc.swagger.definitions.xml_ns4_DistinctKeyType.description                                                    = DistinctKeyType is an abstract base type which is a special type of region that only defines a distinct region of data or metadata. For each component defined in the region, only a single values is provided. However, the same rules that apply to the general region about unstated components being wild carded apply here as well. Thus, this type can define a distinct full or partial key for data or metadata.
api.doc.swagger.definitions.xml_ns4_EmptyType.description                                                          = EmptyType is an empty complex type for elements where the presence of the tag indicates all that is necessary.
api.doc.swagger.definitions.xml_ns4_GroupKeyDescriptorReferenceType.description                                    = GroupKeyDescriptorReferenceType is a type for referencing a group key descriptor object. It consists of a URN and/or a complete set of reference fields.
api.doc.swagger.definitions.xml_ns4_GroupKeyDescriptorRefType.description                                          = GroupKeyDescriptorRefType contains a reference to a group key descriptor within a data structure definition.
api.doc.swagger.definitions.xml_ns4_HierarchicalCodelistReferenceType.description                                  = HierarchicalCodelistReferenceType is a type for referencing a hierarchical codelist object. It consists of a URN and/or a complete set of reference fields.
api.doc.swagger.definitions.xml_ns4_HierarchicalCodelistRefType.description                                        = HierarchicalCodelistRefType contains a set of reference fields for a hierarchical codelist.
api.doc.swagger.definitions.xml_ns4_HierarchicalCodeReferenceType.description                                      = HierarchicalCodeReferenceType is a type for referencing a hierarchical code object. It consists of a URN and/or a complete set of reference fields.
api.doc.swagger.definitions.xml_ns4_HierarchicalCodeRefType.description                                            = HierarchicalCodeRefType references a code from within a hierarchical codelist. Reference fields are required for both the code and the codelist.
api.doc.swagger.definitions.xml_ns4_HierarchyReferenceType.description                                             = HierarchyReferenceType is a type for referencing a hierarchy within a hierarchical codelist.
api.doc.swagger.definitions.xml_ns4_HierarchyRefType.description                                                   = HierarchyRefType is type which references a hierarchy from within a hierarchical codelist. Reference fields are required for both the hierarchy and the codelist.
api.doc.swagger.definitions.xml_ns4_IdentifiableObjectTargetReferenceType.description                              = IdentifiableObjectTargetReferenceType is a type for referencing an identifiable object target object. It consists of a URN and/or a complete set of reference fields.
api.doc.swagger.definitions.xml_ns4_IdentifiableObjectTargetRefType.description                                    = IdentifiableObjectTargetRefType contains a reference to an identifiable object target within a metadata target of a data structure definition.
api.doc.swagger.definitions.xml_ns4_ItemRefBaseType.description                                                    = ItemRefBaseType is an abstract base type for referencing an item within an item scheme.
api.doc.swagger.definitions.xml_ns4_ItemReferenceType.description                                                  = ItemReferenceType is an abstract base type used for referencing a particular item within an item scheme. Note that this reference also has the ability to reference items contained within other items inside of the item scheme. It consists of a URN and/or a complete set of reference fields; agency, scheme id (maintainableParentID), scheme version (maintainableParentVersion), and item id (which can be nested).
api.doc.swagger.definitions.xml_ns4_ItemSchemeRefBaseType.description                                              = ItemSchemeRefBaseType is an abstract base type for referencing an item scheme.
api.doc.swagger.definitions.xml_ns4_ItemSchemeReferenceBaseType.description                                        = ItemSchemeReferenceBaseType is a specific type of MaintainableReference that is used for referencing item schemes. It consists of a URN and/or a complete set of reference fields; agency, id, and version.
api.doc.swagger.definitions.xml_ns4_ItemSchemeReferenceType.description                                            = ItemSchemeReferenceType is a reference that is used for referencing any type of item scheme. It consists of a URN and/or a complete set of reference fields; agency, id, and version.
api.doc.swagger.definitions.xml_ns4_ItemSchemeRefType.description                                                  = ItemSchemeRefType contains a complete set of reference fields for referencing any item scheme. The class and package a required so that the reference is explicit as to the exact object being referenced.
api.doc.swagger.definitions.xml_ns4_KeyDescriptorReferenceType.description                                         = KeyDescriptorReferenceType is a type for referencing a key descriptor object. It consists of a URN and/or a complete set of reference fields.
api.doc.swagger.definitions.xml_ns4_KeyDescriptorRefType.description                                               = KeyDescriptorRefType contains a reference to the key descriptor within a data structure definition.
api.doc.swagger.definitions.xml_ns4_KeyDescriptorValuesTargetReferenceType.description                             = KeyDescriptorValuesTargetType is a type for referencing a key descriptor values target object. It consists of a URN and/or a complete set of reference fields.
api.doc.swagger.definitions.xml_ns4_KeyDescriptorValuesTargetRefType.description                                   = KeyDescriptorValuesTargetRefType contains a reference to a key descriptor values target within a metadata target of a data structure definition.
api.doc.swagger.definitions.xml_ns4_LevelReferenceType.description                                                 = LevelReferenceType is a type for referencing a level object. It consists of a URN and/or a complete set of reference fields.
api.doc.swagger.definitions.xml_ns4_LevelRefType.description                                                       = LevelRefType references a level from within a hierarchical codelist. Reference fields are required for both the level and the codelist.
api.doc.swagger.definitions.xml_ns4_LocalAgencyReferenceType.description                                           = LocalAgencyReferenceType provides a simple reference to an agency, where the reference to the agency scheme which defines it is provided in another context.
api.doc.swagger.definitions.xml_ns4_LocalAgencyRefType.description                                                 = LocalAgencyRefType references an agency locally where the reference to the agency scheme which defines it is provided elsewhere.
api.doc.swagger.definitions.xml_ns4_LocalCategoryReferenceType.description                                         = LocalCategoryReferenceType provides a simple references to a category where the identification of the category scheme which defines it is contained in another context.
api.doc.swagger.definitions.xml_ns4_LocalCategoryRefType.description                                               = LocalCategoryRefType references a category locally where the references to the category scheme which defines it is provided elsewhere.
api.doc.swagger.definitions.xml_ns4_LocalCodelistMapReferenceType.description                                      = LocalCodelistMapReferenceType is a type for referencing a codelist map object where the reference to the structure set which defines it is provided in another context (e.g. the structure set in which this reference occurs).
api.doc.swagger.definitions.xml_ns4_LocalCodelistMapRefType.description                                            = LocalCodelistMapRefType contains a set of reference fields for a codelist map locally.
api.doc.swagger.definitions.xml_ns4_LocalCodeReferenceType.description                                             = LocalCodeReferenceType provides a simple references to a code where the identification of the codelist which defines it is contained in another context.
api.doc.swagger.definitions.xml_ns4_LocalCodeRefType.description                                                   = LocalCodeRefType references a code locally where the references to the codelist which defines it is provided elsewhere.
api.doc.swagger.definitions.xml_ns4_LocalComponentListComponentRefBaseType.description                             = LocalComponentRefBaseType is an abstract base type which provides a local reference to a component object.
api.doc.swagger.definitions.xml_ns4_LocalComponentListComponentReferenceBaseType.description                       = LocalComponentListComponentReferenceBaseType is an abstract base type which provides a simple reference to any type of component in a specific component list where the reference to the structure which defines it are provided in another context, and the component list may or may not be defined in another context.
api.doc.swagger.definitions.xml_ns4_LocalComponentListComponentReferenceType.description                           = LocalComponentListComponentReferenceType provides a simple reference to any type of component in a specific component list where the reference to the structure which defines it are provided in another context.
api.doc.swagger.definitions.xml_ns4_LocalComponentListComponentRefType.description                                 = LocalComponentListComponentRefType provides a local reference to any component object within a specific component list. References for both of these are required as well as an indication of which type of type of component is being referenced via the class attribute.
api.doc.swagger.definitions.xml_ns4_LocalComponentListRefBaseType.description                                      = LocalComponentListRefBaseType is an abstract base type which provides a local reference to a component list object.
api.doc.swagger.definitions.xml_ns4_LocalComponentListReferenceType.description                                    = LocalComponentListReferenceType is an abstract base type which provides a simple reference to a component list where the reference to the structure which defines it is provided in another context.
api.doc.swagger.definitions.xml_ns4_LocalComponentRefBaseType.description                                          = LocalComponentRefBaseType is an abstract base type which provides a local reference to a component object.
api.doc.swagger.definitions.xml_ns4_LocalComponentReferenceBaseType.description                                    = LocalComponentReferenceBaseType is an abstract base type which provides a simple reference to a component where the references to the component list which contains it and the structure which defines it are provided in another context.
api.doc.swagger.definitions.xml_ns4_LocalComponentReferenceType.description                                        = LocalComponentReferenceType provides a simple reference to any type of component in a component list where the references to the component list and the structure which defines them are provided in another context.
api.doc.swagger.definitions.xml_ns4_LocalComponentRefType.description                                              = LocalComponentRefType provides a local reference to any type component object.
api.doc.swagger.definitions.xml_ns4_LocalConceptReferenceType.description                                          = LocalConceptReferenceType provides a simple references to a concept where the identification of the concept scheme which defines it is contained in another context.
api.doc.swagger.definitions.xml_ns4_LocalConceptRefType.description                                                = LocalConceptRefType references a concept locally where the references to the concept scheme which defines it is provided elsewhere.
api.doc.swagger.definitions.xml_ns4_LocalDataConsumerReferenceType.description                                     = LocalDataConsumerReferenceType provides a simple reference to a data consumer, where the reference to the data consumer scheme which defines it is provided in another context.
api.doc.swagger.definitions.xml_ns4_LocalDataConsumerRefType.description                                           = LocalDataConsumerRefType references a data consumer locally where the reference to the data consumer scheme which defines it is provided elsewhere.
api.doc.swagger.definitions.xml_ns4_LocalDataProviderReferenceType.description                                     = LocalDataProviderReferenceType provides a simple reference to a data provider, where the reference to the data provider scheme which defines it is provided in another context.
api.doc.swagger.definitions.xml_ns4_LocalDataProviderRefType.description                                           = LocalDataProviderRefType references a data provider locally where the reference to the data provider scheme which defines it is provided elsewhere.
api.doc.swagger.definitions.xml_ns4_LocalDataStructureComponentReferenceType.description                           = LocalDataStructureComponentReferenceType is a type for referencing any type of data structure component locally, where the reference for the data structure definition which defines the components is available in another context.
api.doc.swagger.definitions.xml_ns4_LocalDataStructureComponentRefType.description                                 = LocalDataStructureComponentRefType contains the reference fields for referencing any data structure component locally. This reference must specify the class of the component being referenced.
api.doc.swagger.definitions.xml_ns4_LocalDimensionReferenceType.description                                        = LocalDimensionReferenceType is a type for referencing any type of dimension locally, where the reference to the data structure definition which defines the dimension is provided in another context (for example the data structure definition in which the reference occurs).
api.doc.swagger.definitions.xml_ns4_LocalDimensionRefType.description                                              = LocalDimensionRefType contains the reference fields for referencing a dimension locally.
api.doc.swagger.definitions.xml_ns4_LocalGroupKeyDescriptorReferenceType.description                               = LocalGroupKeyDescriptorReferenceType is a type for referencing a group key descriptor locally, where the reference to the data structure definition which defines it is provided in another context (for example the data structure definition in which the reference occurs).
api.doc.swagger.definitions.xml_ns4_LocalGroupKeyDescriptorRefType.description                                     = LocalGroupKeyDescriptorRefType contains a local reference to a group key descriptor.
api.doc.swagger.definitions.xml_ns4_LocalIdentifiableRefBaseType.description                                       = LocalIdentifiableRefBaseType is an abstract base type which provides a local reference to any identifiable object.
api.doc.swagger.definitions.xml_ns4_LocalIdentifiableReferenceType.description                                     = LocalIdentifiableReferenceType is an abstract base type for referencing an identifiable object locally, where the maintainable object in which it is defined is referenced in another context..
api.doc.swagger.definitions.xml_ns4_LocalItemRefBaseType.description                                               = LocalItemRefBaseType is an abstract base type which provides a local reference to a item object.
api.doc.swagger.definitions.xml_ns4_LocalItemReferenceType.description                                             = LocalItemReferenceType is an abstract base type which provides a simple reference to an item where the reference to the item scheme which defines it are provided in another context.
api.doc.swagger.definitions.xml_ns4_LocalLevelReferenceType.description                                            = LocalLevelReferenceType is a type for referencing a level object where the reference to the hierarchical codelist and the hierarchy in which it is defined is provided in another context (e.g. is inferred from the hierarchy in which the reference is defined).
api.doc.swagger.definitions.xml_ns4_LocalLevelRefType.description                                                  = LocalLevelRefType references a level object where the reference to the hierarchy in which it is contained and the hierarchical codelist which define it are provided in another context.
api.doc.swagger.definitions.xml_ns4_LocalMetadataStructureComponentReferenceType.description                       = LocalMetadataStructureComponentReferenceType is a type for referencing any type of metadata structure component locally, where the reference for the metadata structure definition which defines the components is available in another context.
api.doc.swagger.definitions.xml_ns4_LocalMetadataStructureComponentRefType.description                             = LocalMetadataStructureComponentRefType contains the reference fields for referencing any metadata structure component locally. This reference must specify the class of the component being referenced.
api.doc.swagger.definitions.xml_ns4_LocalMetadataTargetReferenceType.description                                   = LocalMetadataTargetReferenceType is a type for referencing a metadata target locally, where the reference to the metadata structure definition which defines it is provided in another context (for example the metadata structure definition in which the reference occurs).
api.doc.swagger.definitions.xml_ns4_LocalMetadataTargetRefType.description                                         = LocalMetadataTargetRefType contains a local reference to a metadata target object.
api.doc.swagger.definitions.xml_ns4_LocalOrganisationRefBaseType.description                                       = LocalOrganisationRefBaseType is an abstract base type that references an organisation locally where the reference to the organisation scheme which defines it is provided elsewhere.
api.doc.swagger.definitions.xml_ns4_LocalOrganisationReferenceBaseType.description                                 = LocalOrganisationReferenceBaseType is an abstract base type which provides a simple references to an organisation, regardless of type, where the identification of the organisation scheme which defines it is contained in another context.
api.doc.swagger.definitions.xml_ns4_LocalOrganisationReferenceType.description                                     = LocalOrganisationReferenceType provides a simple reference to an organisation, regardless of type, where the identification of the organisation scheme which defines it is contained in another context.
api.doc.swagger.definitions.xml_ns4_LocalOrganisationRefType.description                                           = LocalOrganisationRefType references an organisation locally where the reference to the organisation scheme which defines it is provided elsewhere. The reference requires that the class (i.e. the type) or the organisation being reference be provided.
api.doc.swagger.definitions.xml_ns4_LocalOrganisationUnitReferenceType.description                                 = LocalOrganisationUnitReferenceType provides a simple reference to an organisation unit, where the reference to the organisation unit scheme which defines it is provided in another context.
api.doc.swagger.definitions.xml_ns4_LocalOrganisationUnitRefType.description                                       = LocalOrganisationUnitRefType references an organisation unit locally where the reference to the organisation unit scheme which defines it is provided elsewhere.
api.doc.swagger.definitions.xml_ns4_LocalPrimaryMeasureReferenceType.description                                   = LocalPrimaryMeasureReferenceType is a type for referencing a primary measure locally, where the reference to the data structure definition which defines the primary measure is provided in another context (for example the data structure definition in which the reference occurs).
api.doc.swagger.definitions.xml_ns4_LocalPrimaryMeasureRefType.description                                         = LocalPrimaryMeasureRefType contains the reference fields for referencing a primary measure locally.
api.doc.swagger.definitions.xml_ns4_LocalProcessStepReferenceType.description                                      = LocalProcessStepReferenceType is a type for referencing a process step locally, where the reference to the process which defines it is provided in another context (for example the metadata structure definition in which the reference occurs).
api.doc.swagger.definitions.xml_ns4_LocalProcessStepRefType.description                                            = LocalProcessStepRefType contains a local reference to a process step object.
api.doc.swagger.definitions.xml_ns4_LocalReportingCategoryReferenceType.description                                = LocalReportingCategoryReferenceType provides a simple references to a reporting category where the identification of the reporting taxonomy which defines it is contained in another context.
api.doc.swagger.definitions.xml_ns4_LocalReportingCategoryRefType.description                                      = LocalReportingCategoryRefType references a reporting category locally where the references to the reporting taxonomy which defines it is provided elsewhere.
api.doc.swagger.definitions.xml_ns4_LocalReportStructureReferenceType.description                                  = LocalReportStructureReferenceType is a type for referencing a report structure locally, where the reference to the metadata structure definition which defines it is provided in another context (for example the metadata structure definition in which the reference occurs).
api.doc.swagger.definitions.xml_ns4_LocalReportStructureRefType.description                                        = LocalReportStructureRefType contains a local reference to a report structure object.
api.doc.swagger.definitions.xml_ns4_LocalTargetObjectReferenceType.description                                     = LocalTargetObjectReferenceType is a type for referencing any type of target object within a metadata target locally, where the references to the metadata target and the  metadata structure definition which defines the target reference are provided in another context.
api.doc.swagger.definitions.xml_ns4_LocalTargetObjectRefType.description                                           = LocalTargetObjectRefType contains the reference fields for referencing a target object locally.
api.doc.swagger.definitions.xml_ns4_MaintainableRefBaseType.description                                            = MaintainableRefBaseType is an abstract base type for referencing a maintainable object.
api.doc.swagger.definitions.xml_ns4_MaintainableReferenceBaseType.description                                      = MaintainableReferenceBaseType is an abstract base type for referencing a maintainable object. It consists of a URN and/or a complete set of reference fields; agency, id, and version.
api.doc.swagger.definitions.xml_ns4_MaintainableReferenceType.description                                          = MaintainableReferenceType is a type for referencing any maintainable object. It consists of a URN and/or a complete set of reference fields; agency, id, and version.
api.doc.swagger.definitions.xml_ns4_MaintainableRefType.description                                                = MaintainableRefType contains a complete set of reference fields for referencing any maintainable object.
api.doc.swagger.definitions.xml_ns4_MeasureDescriptorReferenceType.description                                     = MeasureDescriptorReferenceType is a type for referencing a measure descriptor object. It consists of a URN and/or a complete set of reference fields.
api.doc.swagger.definitions.xml_ns4_MeasureDescriptorRefType.description                                           = MeasureDescriptorRefType contains a reference to the measure descriptor within a data structure definition.
api.doc.swagger.definitions.xml_ns4_MeasureDimensionReferenceType.description                                      = MeasureDimensionReferenceType is a type for referencing a measure dimension object. It consists of a URN and/or a complete set of reference fields.
api.doc.swagger.definitions.xml_ns4_MeasureDimensionRefType.description                                            = MeasureDimensionRefType contains a reference to the measure dimension within a data structure definition. Note that since there is only one key descriptor, the container reference fields are prohibited.
api.doc.swagger.definitions.xml_ns4_MetadataAttributeReferenceType.description                                     = MetadataAttributeReferenceType is a type for referencing a metadata attribute object. It consists of a URN and/or a complete set of reference fields.
api.doc.swagger.definitions.xml_ns4_MetadataAttributeRefType.description                                           = MetadataAttributeRefType contains a reference to a metadata attribute within a report structure in a metadata structure definition.
api.doc.swagger.definitions.xml_ns4_MetadataAttributeValueSetType.description                                      = MetadataAttributeValueSetType defines the structure for providing values for a metadata attribute. If no values are provided, the attribute is implied to include/excluded from the region in which it is defined, with no regard to the value of the metadata attribute.
api.doc.swagger.definitions.xml_ns4_MetadataflowReferenceType.description                                          = MetadataflowReferenceType is a type for referencing a metadata flow object. It consists of a URN and/or a complete set of reference fields.
api.doc.swagger.definitions.xml_ns4_MetadataflowRefType.description                                                = MetadataflowRefType contains a set of reference fields for a metadata flow.
api.doc.swagger.definitions.xml_ns4_MetadataKeyType.description                                                    = MetadataKeyType is a region which defines a distinct full or partial metadata key. The key consists of a set of values, each referencing a target object for the metadata target referenced in the metadataTarget attribute, which must be defined in the report structure referenced in the report attribute. Each target object can be assigned a single value. If an target object from the reference metadata target is not included in this key, the value of that is assumed to be all known objects for a reference target object, all possible keys for a key descriptor values target object, or all dates for report period target object. The purpose of this key reference a metadata conforming to a particular report structure for given object or set of objects.
api.doc.swagger.definitions.xml_ns4_MetadataKeyValueType.description                                               = MetadataKeyValueType is a type for providing a target object value for the purpose of defining a distinct metadata key. Only a single value can be provided for the target object.
api.doc.swagger.definitions.xml_ns4_MetadataStructureReferenceType.description                                     = MetadataStructureReferenceType is a type for referencing a metadata structure definition object. It consists of a URN and/or a complete set of reference fields.
api.doc.swagger.definitions.xml_ns4_MetadataStructureRefType.description                                           = MetadataStructureRefType contains a set of reference fields for a metadata structure definition.
api.doc.swagger.definitions.xml_ns4_MetadataTargetReferenceType.description                                        = MetadataTargetReferenceType is a type for referencing a metadata target object. It consists of a URN and/or a complete set of reference fields.
api.doc.swagger.definitions.xml_ns4_MetadataTargetRefType.description                                              = MetadataTargetRefType contains a reference to a metadata target within a metadata structure definition.
api.doc.swagger.definitions.xml_ns4_MetadataTargetRegionKeyType.description                                        = MetadataTargetRegionKeyType is a type for providing a set of values for a target object in a metadata target of a re fence metadata report. A set of values or a time range can be provided for a report period target object. A collection of the respective types of references can be provided for data set reference and identifiable object reference target objects. For a key descriptor values target object, a collection of data keys can be provided.
api.doc.swagger.definitions.xml_ns4_MetadataTargetRegionType.description                                           = MetadataTargetRegionType defines the structure of a metadata target region. A metadata target region must define the report structure and the metadata target from that structure on which the region is based. This type is based on the abstract RegionType and simply refines the key and attribute values to conform with what is applicable for target objects and metadata attributes, respectively. See the documentation of the base type for more details on how a region is defined.
api.doc.swagger.definitions.xml_ns4_ObjectReferenceType.description                                                = ObjectReferenceType is a generic reference which allows for any object to be referenced. The type of object actually referenced can be determined from the URN or from the class attribute of the full set of reference fields.
api.doc.swagger.definitions.xml_ns4_ObjectRefType.description                                                      = ObjectRefType contains a set of reference fields for the purpose of referencing any object. This cannot be a local reference, therefore the agency identifier is required. It is also required that the class and package be supplied for the referenced object such that a complete URN reference can be built from the values provided. Note that this is not capable of fully validating that all necessary fields are supplied for a given object type.
api.doc.swagger.definitions.xml_ns4_ObjectTypeCodelistType.description                                             = 
api.doc.swagger.definitions.xml_ns4_OrganisationRefBaseType.description                                            = OrganisationRefBaseType is an abstract base type which references an organisation from within a organisation scheme. Reference fields are required for both the scheme and the organisation.
api.doc.swagger.definitions.xml_ns4_OrganisationReferenceBaseType.description                                      = OrganisationReferenceBaseType is a type for referencing any organisation object, regardless of its type. It consists of a URN and/or a complete set of reference fields.
api.doc.swagger.definitions.xml_ns4_OrganisationReferenceType.description                                          = OrganisationReferenceType references an organisation regardless of the specific type. It consists of a URN and/or a complete set of reference fields.
api.doc.swagger.definitions.xml_ns4_OrganisationRefType.description                                                = OrganisationRefType provides a reference to any organisation via a complete set of reference fields. It is required that the class (i.e. the type) of organisation being referenced be specified.
api.doc.swagger.definitions.xml_ns4_OrganisationSchemeMapReferenceType.description                                 = OrganisationSchemeMapReferenceType is a type for referencing a organisation scheme map object. It consists of a URN and/or a complete set of reference fields.
api.doc.swagger.definitions.xml_ns4_OrganisationSchemeMapRefType.description                                       = OrganisationSchemeMapRefType contains a set of reference fields for an organisation scheme map.
api.doc.swagger.definitions.xml_ns4_OrganisationSchemeRefBaseType.description                                      = OrganisationSchemeRefBaseType contains a set of reference fields for an organisation scheme.
api.doc.swagger.definitions.xml_ns4_OrganisationSchemeReferenceBaseType.description                                = OrganisationSchemeReferenceBaseType is a type for referencing a organisation scheme object. It consists of a URN and/or a complete set of reference fields.
api.doc.swagger.definitions.xml_ns4_OrganisationSchemeReferenceType.description                                    = OrganisationSchemeReferenceType references an organisation scheme regardless of the specific type. It consists of a URN and/or a complete set of reference fields.
api.doc.swagger.definitions.xml_ns4_OrganisationSchemeRefType.description                                          = OrganisationSchemeRefType provides a reference to an organisation scheme via a complete set of reference fields. It is required that the class (i.e. the type) of organisation scheme being referenced be specified.
api.doc.swagger.definitions.xml_ns4_OrganisationUnitReferenceType.description                                      = OrganisationUnitReferenceType is a type for referencing an organisation unit. It consists of a URN and/or a complete set of reference fields.
api.doc.swagger.definitions.xml_ns4_OrganisationUnitRefType.description                                            = OrganisationUnitRefType contains a set of reference fields for referencing an organisation unit within an organisation unit scheme.
api.doc.swagger.definitions.xml_ns4_OrganisationUnitSchemeReferenceType.description                                = OrganisationUnitSchemeReferenceType is a type for referencing an organisation unit scheme object. It consists of a URN and/or a complete set of reference fields.
api.doc.swagger.definitions.xml_ns4_OrganisationUnitSchemeRefType.description                                      = OrganisationUnitSchemeRefType contains a set of reference fields for an organisation unit scheme.
api.doc.swagger.definitions.xml_ns4_PackageTypeCodelistType.description                                            = 
api.doc.swagger.definitions.xml_ns4_PayloadStructureType.description                                               = PayloadStructureType is an abstract base type used to define the structural information for data or metadata sets. A reference to the structure is provided (either explicitly or through a reference to a structure usage).
api.doc.swagger.definitions.xml_ns4_PayloadStructureType.properties.dimensionAtObservation.description             =
api.doc.swagger.definitions.xml_ns4_PayloadStructureType.properties.explicitMeasures.description                   =
api.doc.swagger.definitions.xml_ns4_PayloadStructureType.properties.namespace.description                          =
api.doc.swagger.definitions.xml_ns4_PayloadStructureType.properties.ProvisionAgrement.description                  =
api.doc.swagger.definitions.xml_ns4_PayloadStructureType.properties.schemaURL.description                          =
api.doc.swagger.definitions.xml_ns4_PayloadStructureType.properties.serviceURL.description                         =
api.doc.swagger.definitions.xml_ns4_PayloadStructureType.properties.Structure.description                          =

api.doc.swagger.definitions.xml_ns5_ComponentType.description                                                      = ComponentType is an abstract base type for all components. It contains information pertaining to a component, including an optional reference to a concept, an optional role played by the concept, an optional text format description, and an optional local representation.<p>Java class for ComponentType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="ComponentType">   &lt;complexContent>     &lt;extension base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}ComponentBaseType">       &lt;sequence>         &lt;element name="ConceptIdentity" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ConceptReferenceType" minOccurs="0"/>         &lt;element name="LocalRepresentation" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}RepresentationType" minOccurs="0"/>       &lt;/sequence>     &lt;/extension>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_ComponentType.properties.ConceptIdentity.description                           = .
api.doc.swagger.definitions.xml_ns5_ComponentType.properties.LocalRepresentation.description                       = .
api.doc.swagger.definitions.xml_ns5_ComputationType.description                                                    = ComputationType describes a computation in a process.<p>Java class for ComputationType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="ComputationType">   &lt;complexContent>     &lt;extension base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}AnnotableType">       &lt;sequence>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Description" maxOccurs="unbounded"/>       &lt;/sequence>       &lt;attribute name="localID" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}IDType" />       &lt;attribute name="softwarePackage" type="{http://www.w3.org/2001/XMLSchema}string" />       &lt;attribute name="softwareLanguage" type="{http://www.w3.org/2001/XMLSchema}string" />       &lt;attribute name="softwareVersion" type="{http://www.w3.org/2001/XMLSchema}string" />     &lt;/extension>   &lt;/complexContent> &lt;/complexType> </pre>

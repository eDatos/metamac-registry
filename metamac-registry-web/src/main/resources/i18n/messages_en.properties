api.doc.swagger.definitions.xml_ns4_TimePeriodRangeType.description                                                = TimePeriodRangeType defines a time period, and indicates whether it is inclusive in a range.<p>Java class for TimePeriodRangeType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="TimePeriodRangeType">   &lt;simpleContent>     &lt;extension base="&lt;http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common>ObservationalTimePeriodType">       &lt;attribute name="isInclusive" type="{http://www.w3.org/2001/XMLSchema}boolean" default="true" />     &lt;/extension>   &lt;/simpleContent> &lt;/complexType> </pre>

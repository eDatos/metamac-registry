api.doc.swagger.definitions.xml_ns3_SubmitStructureRequestType.description                                         = SubmitStructureRequestType defines the structure of a registry submit structure request document.
api.doc.swagger.definitions.xml_ns3_SubmitStructureResponseType.description                                        = SubmitStructureResponseType defines the structure of a registry submit registration response document.
api.doc.swagger.definitions.xml_ns3_SubmitSubscriptionsRequestType.description                                     = SubmitSubscriptionsRequestType defines the structure of a registry submit subscription request document.
api.doc.swagger.definitions.xml_ns3_SubmitSubscriptionsResponseType.description                                    = SubmitSubscriptionsResponseType defines the structure of a registry submit subscription response document.
api.doc.swagger.definitions.xml_ns3_TimeSeriesDataSetType.description                                              = TimeSeriesDataSetType is a derivation of the base DataSetType of the generic format the restricts the data set to only allow for grouped observations where the dimension at the observation level is the time dimension of the data structure definition. This means that unlike the base data set structure, there can be no un-grouped observations. Because this derivation is achieved using restriction, data sets conforming to this type will inherently conform to the base data set structure as well. In fact, data structured here will be identical to data in the base data set when the time dimension is the observation dimension. This means that the data contained in this structure can be processed in exactly the same manner as the base structure.
api.doc.swagger.definitions.xml_ns3_TimeSeriesObsType.description                                                  = TimeSeriesObsType defines the structure of a time series observation. The observation must be provided a value for the time dimension. This time value should disambiguate the observation within the series in which it is defined (i.e. there should not be another observation with the same time value). The observation can contain an observed value and/or attribute values.
api.doc.swagger.definitions.xml_ns3_TimeSeriesType.description                                                     = TimeSeriesType defines a structure which is used to group a collection of observations which have a key in common, organised by time. The key for a series is every dimension defined in the data structure definition, save the time dimension. In addition to observations, values can be provided for attributes which are associated with the dimensions which make up this series key (so long as the attributes do not specify a group attachment or also have an relationship with the time dimension). It is possible for the series to contain only observations or only attribute values, or both.
api.doc.swagger.definitions.xml_ns3_TimeValueType.description                                                      = TimeValueType is a derivation of the BaseValueType which is used to provide a value for the time dimension. Since the identifier for the time dimension is fixed, the component reference for this structure is fixed. Note that this means that it is not necessary to provide a value in an instance as the fixed value will be provided in the post validation information set.
api.doc.swagger.definitions.xml_ns3_ValuesType.description                                                         = ValuesType is a general structure which contains a collection of data structure definition component values. This type is used to provide both key and attribute collection values.
api.doc.swagger.definitions.xml_ns3_ValuesType.properties.Value.description                                        =

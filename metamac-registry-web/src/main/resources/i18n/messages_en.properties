api.doc.swagger.definitions.xml_ns9_ReferenceValueType.description                                                 = ReferenceValueType is an abstract base type that forms the basis of a target reference value. A target reference value will either be a reference to an identifiable object, a data key, a reference to a data set, or a report period. The choice of these options will be refined to only one according to the definition of the target in the metadata structure definition.<p>Java class for ReferenceValueType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="ReferenceValueType">   &lt;complexContent>     &lt;restriction base="{http://www.w3.org/2001/XMLSchema}anyType">       &lt;choice>         &lt;element name="ObjectReference" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ReferenceType" form="unqualified"/>         &lt;element name="DataKey" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}DataKeyType" form="unqualified"/>         &lt;element name="DataSetReference" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}SetReferenceType" form="unqualified"/>         &lt;element name="ConstraintContentReference" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}AttachmentConstraintReferenceType" form="unqualified"/>         &lt;element name="ReportPeriod" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ObservationalTimePeriodType" form="unqualified"/>       &lt;/choice>       &lt;attribute name="id" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}IDType" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>

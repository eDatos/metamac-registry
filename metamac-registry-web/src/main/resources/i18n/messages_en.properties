api.doc.swagger.definitions.xml_ns3_ProcessQueryType.description                                                   = CategorizationQueryType defines the structure of a categorization query message.<p>Java class for ProcessQueryType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="ProcessQueryType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/message}MessageType">       &lt;sequence>         &lt;element name="Header" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/message}BasicHeaderType"/>         &lt;element name="Query" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/query}ProcessQueryType"/>       &lt;/sequence>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns3_ProvisionAgreementQueryType.description                                        = ProvisionAgreementQueryType defines the structure of a provision agreement query message.<p>Java class for ProvisionAgreementQueryType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="ProvisionAgreementQueryType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/message}MessageType">       &lt;sequence>         &lt;element name="Header" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/message}BasicHeaderType"/>         &lt;element name="Query" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/query}ProvisionAgreementQueryType"/>       &lt;/sequence>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns3_QueryRegistrationRequestType.description                                       = QueryRegistrationRequestType defines the structure of a registry query registration request document.<p>Java class for QueryRegistrationRequestType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="QueryRegistrationRequestType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/message}RegistryInterfaceType">       &lt;sequence>         &lt;element name="Header" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/message}BasicHeaderType"/>         &lt;element name="QueryRegistrationRequest" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/registry}QueryRegistrationRequestType"/>       &lt;/sequence>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns3_QueryRegistrationResponseType.description                                      = SubmitRegistrationRequestType defines the structure of a registry submit registration response document.<p>Java class for QueryRegistrationResponseType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="QueryRegistrationResponseType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/message}RegistryInterfaceType">       &lt;sequence>         &lt;element name="Header" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/message}BasicHeaderType"/>         &lt;element name="QueryRegistrationResponse" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/registry}QueryRegistrationResponseType"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/message/footer}Footer" minOccurs="0"/>       &lt;/sequence>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns3_QuerySubscriptionRequestType.description                                       = QuerySubscriptionRequestType defines the structure of a registry query subscription request document.<p>Java class for QuerySubscriptionRequestType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="QuerySubscriptionRequestType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/message}RegistryInterfaceType">       &lt;sequence>         &lt;element name="Header" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/message}BasicHeaderType"/>         &lt;element name="QuerySubscriptionRequest" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/registry}QuerySubscriptionRequestType"/>       &lt;/sequence>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns3_QuerySubscriptionResponseType.description                                      = QuerySubscriptionResponseType defines the structure of a registry query subscription response document.<p>Java class for QuerySubscriptionResponseType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="QuerySubscriptionResponseType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/message}RegistryInterfaceType">       &lt;sequence>         &lt;element name="Header" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/message}BasicHeaderType"/>         &lt;element name="QuerySubscriptionResponse" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/registry}QuerySubscriptionResponseType"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/message/footer}Footer" minOccurs="0"/>       &lt;/sequence>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns3_RegistryInterfaceType.description                                              = This is a type which describes a structure for holding all of the various dedicated registry interface message types.<p>Java class for RegistryInterfaceType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="RegistryInterfaceType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/message}MessageType">       &lt;sequence>         &lt;element name="Header" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/message}BasicHeaderType"/>         &lt;choice minOccurs="0">           &lt;element name="SubmitRegistrationsRequest" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/registry}SubmitRegistrationsRequestType"/>           &lt;element name="SubmitRegistrationsResponse" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/registry}SubmitRegistrationsResponseType"/>           &lt;element name="QueryRegistrationRequest" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/registry}QueryRegistrationRequestType"/>           &lt;element name="QueryRegistrationResponse" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/registry}QueryRegistrationResponseType"/>           &lt;element name="SubmitStructureRequest" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/registry}SubmitStructureRequestType"/>           &lt;element name="SubmitStructureResponse" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/registry}SubmitStructureResponseType"/>           &lt;element name="SubmitSubscriptionsRequest" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/registry}SubmitSubscriptionsRequestType"/>           &lt;element name="SubmitSubscriptionsResponse" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/registry}SubmitSubscriptionsResponseType"/>           &lt;element name="QuerySubscriptionRequest" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/registry}QuerySubscriptionRequestType"/>           &lt;element name="QuerySubscriptionResponse" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/registry}QuerySubscriptionResponseType"/>           &lt;element name="NotifyRegistryEvent" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/registry}NotifyRegistryEventType"/>         &lt;/choice>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/message/footer}Footer" minOccurs="0"/>       &lt;/sequence>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns3_ReportingTaxonomyQueryType.description                                         = ReportingTaxonomyQueryType defines the structure of a reporting taxonomy query message.<p>Java class for ReportingTaxonomyQueryType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="ReportingTaxonomyQueryType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/message}MessageType">       &lt;sequence>         &lt;element name="Header" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/message}BasicHeaderType"/>         &lt;element name="Query" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/query}ReportingTaxonomyQueryType"/>       &lt;/sequence>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns3_SenderType.description                                                         = SenderType extends the basic party structure to add an optional time zone declaration.<p>Java class for SenderType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="SenderType">   &lt;complexContent>     &lt;extension base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/message}PartyType">       &lt;sequence>         &lt;element name="Timezone" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}TimezoneType" minOccurs="0"/>       &lt;/sequence>     &lt;/extension>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns3_SenderType.properties.Timezone.description                                     = .
api.doc.swagger.definitions.xml_ns3_SeriesType.description                                                         = SeriesType defines a structure which is used to group a collection of observations which have a key in common. The key for a series is every dimension defined in the data structure definition, save the dimension declared to be at the observation level for this data set. In addition to observations, values can be provided for attributes which are associated with the dimensions which make up this series key (so long as the attributes do not specify a group attachment or also have an relationship with the observation dimension). It is possible for the series to contain only observations or only attribute values, or both.<p>Java class for SeriesType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="SeriesType">   &lt;complexContent>     &lt;extension base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}AnnotableType">       &lt;sequence>         &lt;element name="SeriesKey" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/data/generic}ValuesType"/>         &lt;element name="Attributes" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/data/generic}ValuesType" minOccurs="0"/>         &lt;element name="Obs" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/data/generic}ObsType" maxOccurs="unbounded" minOccurs="0"/>       &lt;/sequence>     &lt;/extension>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns3_SeriesType.properties.Attributes.description                                   = .
api.doc.swagger.definitions.xml_ns3_SeriesType.properties.Obs.description                                          = .
api.doc.swagger.definitions.xml_ns3_SeriesType.properties.SeriesKey.description                                    = .
api.doc.swagger.definitions.xml_ns3_StructureHeaderType.description                                                = StructureHeaderType defines the structure for structural metadata messages.<p>Java class for StructureHeaderType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="StructureHeaderType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/message}BaseHeaderType">       &lt;sequence>         &lt;element name="ID" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}IDType"/>         &lt;element name="Test" type="{http://www.w3.org/2001/XMLSchema}boolean"/>         &lt;element name="Prepared" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/message}HeaderTimeType"/>         &lt;element name="Sender" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/message}SenderType"/>         &lt;element name="Receiver" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/message}PartyType" maxOccurs="unbounded" minOccurs="0"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Name" maxOccurs="unbounded" minOccurs="0"/>         &lt;element name="Source" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}TextType" maxOccurs="unbounded" minOccurs="0"/>       &lt;/sequence>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns3_StructureSetQueryType.description                                              = StructureSetQueryType defines the structure of a structure set query message.<p>Java class for StructureSetQueryType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="StructureSetQueryType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/message}MessageType">       &lt;sequence>         &lt;element name="Header" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/message}BasicHeaderType"/>         &lt;element name="Query" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/query}StructureSetQueryType"/>       &lt;/sequence>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns3_StructureSpecificDataHeaderType.description                                    = StructureSpecificDataHeaderType defines the header structure for a structure specific data message.<p>Java class for StructureSpecificDataHeaderType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="StructureSpecificDataHeaderType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/message}BaseHeaderType">       &lt;sequence>         &lt;element name="ID" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}IDType"/>         &lt;element name="Test" type="{http://www.w3.org/2001/XMLSchema}boolean"/>         &lt;element name="Prepared" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/message}HeaderTimeType"/>         &lt;element name="Sender" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/message}SenderType"/>         &lt;element name="Receiver" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/message}PartyType" maxOccurs="unbounded" minOccurs="0"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Name" maxOccurs="unbounded" minOccurs="0"/>         &lt;element name="Structure" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}StructureSpecificDataStructureType" maxOccurs="unbounded"/>         &lt;element name="DataProvider" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}DataProviderReferenceType" minOccurs="0"/>         &lt;element name="DataSetAction" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ActionType" minOccurs="0"/>         &lt;element name="DataSetID" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}IDType" maxOccurs="unbounded" minOccurs="0"/>         &lt;element name="Extracted" type="{http://www.w3.org/2001/XMLSchema}dateTime" minOccurs="0"/>         &lt;element name="ReportingBegin" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ObservationalTimePeriodType" minOccurs="0"/>         &lt;element name="ReportingEnd" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ObservationalTimePeriodType" minOccurs="0"/>         &lt;element name="EmbargoDate" type="{http://www.w3.org/2001/XMLSchema}dateTime" minOccurs="0"/>         &lt;element name="Source" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}TextType" maxOccurs="unbounded" minOccurs="0"/>       &lt;/sequence>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns3_StructureSpecificDataType.description                                          = StructureSpecificDataType defines the structure of the structure specific data message. Note that the data set payload type is abstract, and therefore it will have to be assigned a type in an instance. This type must be derived from the base type referenced. This base type defines a general structure which can be followed to allow for generic processing of the data even if the exact details of the data structure specific format are not known.<p>Java class for StructureSpecificDataType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="StructureSpecificDataType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/message}MessageType">       &lt;sequence>         &lt;element name="Header" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/message}StructureSpecificDataHeaderType"/>         &lt;element name="DataSet" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/data/structurespecific}DataSetType" maxOccurs="unbounded" minOccurs="0"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/message/footer}Footer" minOccurs="0"/>       &lt;/sequence>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns3_StructureSpecificMetadataHeaderType.description                                = StructureSpecificMetadataHeaderType defines the header format for metadata structure definition specific reference metadata messages.<p>Java class for StructureSpecificMetadataHeaderType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="StructureSpecificMetadataHeaderType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/message}BaseHeaderType">       &lt;sequence>         &lt;element name="ID" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}IDType"/>         &lt;element name="Test" type="{http://www.w3.org/2001/XMLSchema}boolean"/>         &lt;element name="Prepared" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/message}HeaderTimeType"/>         &lt;element name="Sender" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/message}SenderType"/>         &lt;element name="Receiver" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/message}PartyType" maxOccurs="unbounded" minOccurs="0"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Name" maxOccurs="unbounded" minOccurs="0"/>         &lt;element name="Structure" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}StructureSpecificMetadataStructureType" maxOccurs="unbounded"/>         &lt;element name="DataProvider" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}DataProviderReferenceType" minOccurs="0"/>         &lt;element name="DataSetAction" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ActionType" minOccurs="0"/>         &lt;element name="DataSetID" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}IDType" maxOccurs="unbounded" minOccurs="0"/>         &lt;element name="Extracted" type="{http://www.w3.org/2001/XMLSchema}dateTime" minOccurs="0"/>         &lt;element name="Source" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}TextType" maxOccurs="unbounded" minOccurs="0"/>       &lt;/sequence>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns3_StructureSpecificMetadataType.description                                      = StructureSpecificMetadataType defines the structure of a structure specific metadata message. Note that the metadata set payload type is abstract, and therefore it will have to be assigned a type in an instance. This type must be derived from the base type referenced. This base type defines a general structure which can be followed to allow for generic processing of the data even if the exact details of the data structure specific format are not known.<p>Java class for StructureSpecificMetadataType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="StructureSpecificMetadataType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/message}MessageType">       &lt;sequence>         &lt;element name="Header" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/message}StructureSpecificMetadataHeaderType"/>         &lt;element name="MetadataSet" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/metadata/structurespecific}MetadataSetType" maxOccurs="unbounded" minOccurs="0"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/message/footer}Footer" minOccurs="0"/>       &lt;/sequence>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns3_StructureSpecificTimeSeriesDataHeaderType.description                          = StructureSpecificTimeSeriesDataHeaderType defines the header structure for a time series only structure specific data message.<p>Java class for StructureSpecificTimeSeriesDataHeaderType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="StructureSpecificTimeSeriesDataHeaderType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/message}StructureSpecificDataHeaderType">       &lt;sequence>         &lt;element name="ID" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}IDType"/>         &lt;element name="Test" type="{http://www.w3.org/2001/XMLSchema}boolean"/>         &lt;element name="Prepared" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/message}HeaderTimeType"/>         &lt;element name="Sender" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/message}SenderType"/>         &lt;element name="Receiver" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/message}PartyType" maxOccurs="unbounded" minOccurs="0"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Name" maxOccurs="unbounded" minOccurs="0"/>         &lt;element name="Structure" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}StructureSpecificDataTimeSeriesStructureType" maxOccurs="unbounded"/>         &lt;element name="DataProvider" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}DataProviderReferenceType" minOccurs="0"/>         &lt;element name="DataSetAction" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ActionType" minOccurs="0"/>         &lt;element name="DataSetID" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}IDType" maxOccurs="unbounded" minOccurs="0"/>         &lt;element name="Extracted" type="{http://www.w3.org/2001/XMLSchema}dateTime" minOccurs="0"/>         &lt;element name="ReportingBegin" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ObservationalTimePeriodType" minOccurs="0"/>         &lt;element name="ReportingEnd" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ObservationalTimePeriodType" minOccurs="0"/>         &lt;element name="EmbargoDate" type="{http://www.w3.org/2001/XMLSchema}dateTime" minOccurs="0"/>         &lt;element name="Source" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}TextType" maxOccurs="unbounded" minOccurs="0"/>       &lt;/sequence>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns3_StructureSpecificTimeSeriesDataQueryType.description                           = StructureSpecificTimeSeriesDataQueryType defines the structure of a time series generic data query message.<p>Java class for StructureSpecificTimeSeriesDataQueryType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="StructureSpecificTimeSeriesDataQueryType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/message}DataQueryType">       &lt;sequence>         &lt;element name="Header" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/message}BasicHeaderType"/>         &lt;element name="Query" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/query}TimeSeriesDataQueryType"/>       &lt;/sequence>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns3_StructureSpecificTimeSeriesDataType.description                                = StructureSpecificTimeSeriesDataType defines the structure of the structure specific time series data message.<p>Java class for StructureSpecificTimeSeriesDataType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="StructureSpecificTimeSeriesDataType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/message}StructureSpecificDataType">       &lt;sequence>         &lt;element name="Header" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/message}StructureSpecificTimeSeriesDataHeaderType"/>         &lt;element name="DataSet" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/data/structurespecific}TimeSeriesDataSetType" maxOccurs="unbounded" minOccurs="0"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/message/footer}Footer" minOccurs="0"/>       &lt;/sequence>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns3_StructureType.description                                                      = StructureType defines the contents of a structure message. The payload is optional since this message may be returned from a web service with only information in the footer.<p>Java class for StructureType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="StructureType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/message}MessageType">       &lt;sequence>         &lt;element name="Header" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/message}StructureHeaderType"/>         &lt;element name="Structures" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}StructuresType" minOccurs="0"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/message/footer}Footer" minOccurs="0"/>       &lt;/sequence>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns3_StructuresQueryType.description                                                = StructuresQueryType defines the structure of a structures query message.<p>Java class for StructuresQueryType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="StructuresQueryType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/message}MessageType">       &lt;sequence>         &lt;element name="Header" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/message}BasicHeaderType"/>         &lt;element name="Query" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/query}StructuresQueryType"/>       &lt;/sequence>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns3_SubmitRegistrationsRequestType.description                                     = SubmitRegistrationsRequestType defines the structure of a registry submit registration requests document.<p>Java class for SubmitRegistrationsRequestType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="SubmitRegistrationsRequestType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/message}RegistryInterfaceType">       &lt;sequence>         &lt;element name="Header" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/message}BasicHeaderType"/>         &lt;element name="SubmitRegistrationsRequest" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/registry}SubmitRegistrationsRequestType"/>       &lt;/sequence>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns3_SubmitRegistrationsResponseType.description                                    = SubmitRegistrationsResponseType defines the structure of a registry submit registration response document.<p>Java class for SubmitRegistrationsResponseType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="SubmitRegistrationsResponseType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/message}RegistryInterfaceType">       &lt;sequence>         &lt;element name="Header" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/message}BasicHeaderType"/>         &lt;element name="SubmitRegistrationsResponse" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/registry}SubmitRegistrationsResponseType"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/message/footer}Footer" minOccurs="0"/>       &lt;/sequence>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns3_SubmitStructureRequestType.description                                         = SubmitStructureRequestType defines the structure of a registry submit structure request document.<p>Java class for SubmitStructureRequestType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="SubmitStructureRequestType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/message}RegistryInterfaceType">       &lt;sequence>         &lt;element name="Header" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/message}BasicHeaderType"/>         &lt;element name="SubmitStructureRequest" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/registry}SubmitStructureRequestType"/>       &lt;/sequence>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns3_SubmitStructureResponseType.description                                        = SubmitStructureResponseType defines the structure of a registry submit registration response document.<p>Java class for SubmitStructureResponseType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="SubmitStructureResponseType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/message}RegistryInterfaceType">       &lt;sequence>         &lt;element name="Header" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/message}BasicHeaderType"/>         &lt;element name="SubmitStructureResponse" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/registry}SubmitStructureResponseType"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/message/footer}Footer" minOccurs="0"/>       &lt;/sequence>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns3_SubmitSubscriptionsRequestType.description                                     = SubmitSubscriptionsRequestType defines the structure of a registry submit subscription request document.<p>Java class for SubmitSubscriptionsRequestType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="SubmitSubscriptionsRequestType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/message}RegistryInterfaceType">       &lt;sequence>         &lt;element name="Header" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/message}BasicHeaderType"/>         &lt;element name="SubmitSubscriptionsRequest" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/registry}SubmitSubscriptionsRequestType"/>       &lt;/sequence>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns3_SubmitSubscriptionsResponseType.description                                    = SubmitSubscriptionsResponseType defines the structure of a registry submit subscription response document.<p>Java class for SubmitSubscriptionsResponseType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="SubmitSubscriptionsResponseType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/message}RegistryInterfaceType">       &lt;sequence>         &lt;element name="Header" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/message}BasicHeaderType"/>         &lt;element name="SubmitSubscriptionsResponse" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/registry}SubmitSubscriptionsResponseType"/>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/message/footer}Footer" minOccurs="0"/>       &lt;/sequence>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns3_TimeSeriesDataSetType.description                                              = TimeSeriesDataSetType is a derivation of the base DataSetType of the generic format the restricts the data set to only allow for grouped observations where the dimension at the observation level is the time dimension of the data structure definition. This means that unlike the base data set structure, there can be no un-grouped observations. Because this derivation is achieved using restriction, data sets conforming to this type will inherently conform to the base data set structure as well. In fact, data structured here will be identical to data in the base data set when the time dimension is the observation dimension. This means that the data contained in this structure can be processed in exactly the same manner as the base structure.<p>Java class for TimeSeriesDataSetType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="TimeSeriesDataSetType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/data/generic}DataSetType">       &lt;sequence>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Annotations" minOccurs="0"/>         &lt;element name="DataProvider" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}DataProviderReferenceType" minOccurs="0"/>         &lt;element name="Attributes" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/data/generic}ValuesType" minOccurs="0"/>         &lt;element name="Group" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/data/generic}GroupType" maxOccurs="unbounded" minOccurs="0"/>         &lt;choice minOccurs="0">           &lt;element name="Series" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/data/generic}TimeSeriesType" maxOccurs="unbounded"/>         &lt;/choice>       &lt;/sequence>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns3_TimeSeriesObsType.description                                                  = TimeSeriesObsType defines the structure of a time series observation. The observation must be provided a value for the time dimension. This time value should disambiguate the observation within the series in which it is defined (i.e. there should not be another observation with the same time value). The observation can contain an observed value and/or attribute values.<p>Java class for TimeSeriesObsType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="TimeSeriesObsType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/data/generic}ObsType">       &lt;sequence>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Annotations" minOccurs="0"/>         &lt;element name="ObsDimension" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/data/generic}TimeValueType"/>         &lt;element name="ObsValue" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/data/generic}ObsValueType" minOccurs="0"/>         &lt;element name="Attributes" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/data/generic}ValuesType" minOccurs="0"/>       &lt;/sequence>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns3_TimeSeriesType.description                                                     = TimeSeriesType defines a structure which is used to group a collection of observations which have a key in common, organised by time. The key for a series is every dimension defined in the data structure definition, save the time dimension. In addition to observations, values can be provided for attributes which are associated with the dimensions which make up this series key (so long as the attributes do not specify a group attachment or also have an relationship with the time dimension). It is possible for the series to contain only observations or only attribute values, or both.<p>Java class for TimeSeriesType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="TimeSeriesType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/data/generic}SeriesType">       &lt;sequence>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Annotations" minOccurs="0"/>         &lt;element name="SeriesKey" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/data/generic}ValuesType"/>         &lt;element name="Attributes" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/data/generic}ValuesType" minOccurs="0"/>         &lt;element name="Obs" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/data/generic}TimeSeriesObsType" maxOccurs="unbounded" minOccurs="0"/>       &lt;/sequence>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns3_TimeValueType.description                                                      = TimeValueType is a derivation of the BaseValueType which is used to provide a value for the time dimension. Since the identifier for the time dimension is fixed, the component reference for this structure is fixed. Note that this means that it is not necessary to provide a value in an instance as the fixed value will be provided in the post validation information set.<p>Java class for TimeValueType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="TimeValueType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/data/generic}BaseValueType">       &lt;attribute name="id" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}NCNameIDType" fixed="TIME_PERIOD" />       &lt;attribute name="value" use="required" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ObservationalTimePeriodType" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns3_ValuesType.description                                                         = ValuesType is a general structure which contains a collection of data structure definition component values. This type is used to provide both key and attribute collection values.<p>Java class for ValuesType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="ValuesType">   &lt;complexContent>     &lt;restriction base="{http://www.w3.org/2001/XMLSchema}anyType">       &lt;sequence>         &lt;element name="Value" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/data/generic}ComponentValueType" maxOccurs="unbounded"/>       &lt;/sequence>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns3_ValuesType.properties.Value.description                                        = .
api.doc.swagger.definitions.xml_ns4_ActionType.description                                                         = <p>Java class for ActionType.<p>The following schema fragment specifies the expected content contained within this class.<p><pre> &lt;simpleType name="ActionType">   &lt;restriction base="{http://www.w3.org/2001/XMLSchema}NMTOKEN">     &lt;enumeration value="Append"/>     &lt;enumeration value="Replace"/>     &lt;enumeration value="Delete"/>     &lt;enumeration value="Information"/>   &lt;/restriction> &lt;/simpleType> </pre>
api.doc.swagger.definitions.xml_ns4_AgencyRefType.description                                                      = AgencyRefType contains a set of reference fields for referencing an agency within an agency scheme.<p>Java class for AgencyRefType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="AgencyRefType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}OrganisationRefBaseType">       &lt;attribute name="class" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}OrganisationTypeCodelistType" fixed="Agency" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns4_AgencyReferenceType.description                                                = AgencyReferenceType is a type for referencing an agency. It consists of a URN and/or a complete set of reference fields.<p>Java class for AgencyReferenceType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="AgencyReferenceType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}OrganisationReferenceBaseType">       &lt;choice>         &lt;sequence>           &lt;element name="Ref" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}AgencyRefType" form="unqualified"/>           &lt;element name="URN" type="{http://www.w3.org/2001/XMLSchema}anyURI" minOccurs="0" form="unqualified"/>         &lt;/sequence>         &lt;element name="URN" type="{http://www.w3.org/2001/XMLSchema}anyURI" form="unqualified"/>       &lt;/choice>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns4_AgencySchemeRefType.description                                                = AgencySchemeRefType contains a set of reference fields for an agency scheme.<p>Java class for AgencySchemeRefType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="AgencySchemeRefType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}OrganisationSchemeRefBaseType">       &lt;attribute name="class" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}OrganisationSchemeTypeCodelistType" fixed="AgencyScheme" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns4_AgencySchemeReferenceType.description                                          = AgencySchemeReferenceType is a type for referencing an agency scheme object. It consists of a URN and/or a complete set of reference fields.<p>Java class for AgencySchemeReferenceType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="AgencySchemeReferenceType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}OrganisationSchemeReferenceBaseType">       &lt;choice>         &lt;sequence>           &lt;element name="Ref" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}AgencySchemeRefType" form="unqualified"/>           &lt;element name="URN" type="{http://www.w3.org/2001/XMLSchema}anyURI" minOccurs="0" form="unqualified"/>         &lt;/sequence>         &lt;element name="URN" type="{http://www.w3.org/2001/XMLSchema}anyURI" form="unqualified"/>       &lt;/choice>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns4_AnnotableType.description                                                      = AnnotableType is an abstract base type used for all annotable artefacts. Any type that provides for annotations should extend this type.<p>Java class for AnnotableType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="AnnotableType">   &lt;complexContent>     &lt;restriction base="{http://www.w3.org/2001/XMLSchema}anyType">       &lt;sequence>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Annotations" minOccurs="0"/>       &lt;/sequence>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns4_AnnotableType.properties.Annotations.description                               = .
api.doc.swagger.definitions.xml_ns4_AnnotationType.description                                                     = AnnotationType provides for non-documentation notes and annotations to be embedded in data and structure messages. It provides optional fields for providing a title, a type description, a URI, and the text of the annotation.<p>Java class for AnnotationType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="AnnotationType">   &lt;complexContent>     &lt;restriction base="{http://www.w3.org/2001/XMLSchema}anyType">       &lt;sequence>         &lt;element name="AnnotationTitle" type="{http://www.w3.org/2001/XMLSchema}string" minOccurs="0"/>         &lt;element name="AnnotationType" type="{http://www.w3.org/2001/XMLSchema}string" minOccurs="0"/>         &lt;element name="AnnotationURL" type="{http://www.w3.org/2001/XMLSchema}anyURI" minOccurs="0"/>         &lt;element name="AnnotationText" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}TextType" maxOccurs="unbounded" minOccurs="0"/>       &lt;/sequence>       &lt;attribute name="id" type="{http://www.w3.org/2001/XMLSchema}string" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns4_AnnotationType.properties.AnnotationText.description                           = .
api.doc.swagger.definitions.xml_ns4_AnnotationType.properties.AnnotationTitle.description                          = .
api.doc.swagger.definitions.xml_ns4_AnnotationType.properties.AnnotationType.description                           = .
api.doc.swagger.definitions.xml_ns4_AnnotationType.properties.AnnotationURL.description                            = .
api.doc.swagger.definitions.xml_ns4_AnnotationType.properties.id.description                                       = .
api.doc.swagger.definitions.xml_ns4_AnnotationsType.description                                                    = AnnotationsType provides for a list of annotations to be attached to data and structure messages.<p>Java class for AnnotationsType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="AnnotationsType">   &lt;complexContent>     &lt;restriction base="{http://www.w3.org/2001/XMLSchema}anyType">       &lt;sequence>         &lt;element name="Annotation" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}AnnotationType" maxOccurs="unbounded"/>       &lt;/sequence>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns4_AnnotationsType.properties.Annotation.description                              = .
api.doc.swagger.definitions.xml_ns4_AnyCodelistRefType.description                                                 = AnyCodelistRefType is a type for referencing any codelist object (either a codelist or a hierarchical codelist).<p>Java class for AnyCodelistRefType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="AnyCodelistRefType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}MaintainableRefBaseType">       &lt;attribute name="class" use="required" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}CodelistTypeCodelistType" />       &lt;attribute name="package" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}PackageTypeCodelistType" fixed="codelist" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns4_AnyCodelistReferenceType.description                                           = AnyCodelistReferenceType is a specific type of a reference for referencing either a codelist or a hierarchical codelist usage. It consists of a URN and/or a complete set of reference fields; agency, id and version. If the complete set of reference fields is used, it is required that a class be provided so that the type of object referenced is clear.<p>Java class for AnyCodelistReferenceType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="AnyCodelistReferenceType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}MaintainableReferenceBaseType">       &lt;choice>         &lt;sequence>           &lt;element name="Ref" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}AnyCodelistRefType" form="unqualified"/>           &lt;element name="URN" type="{http://www.w3.org/2001/XMLSchema}anyURI" minOccurs="0" form="unqualified"/>         &lt;/sequence>         &lt;element name="URN" type="{http://www.w3.org/2001/XMLSchema}anyURI" form="unqualified"/>       &lt;/choice>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns4_AnyLocalCodeRefType.description                                                = AnyLocalCodeRefType provides a local reference to any code object.<p>Java class for AnyLocalCodeRefType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="AnyLocalCodeRefType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}RefBaseType">       &lt;attribute name="containerID" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}IDType" />       &lt;attribute name="id" use="required" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}NestedIDType" />       &lt;attribute name="local" type="{http://www.w3.org/2001/XMLSchema}boolean" fixed="true" />       &lt;attribute name="class" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}CodeTypeCodelistType" />       &lt;attribute name="package" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}PackageTypeCodelistType" fixed="codelist" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns4_AnyLocalCodeReferenceType.description                                          = AnyLocalCodeReferenceType provides a simple references to any code or hierarchical code where the identification of the codelist or hierarchical codelist which defines it is contained in another context.<p>Java class for AnyLocalCodeReferenceType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="AnyLocalCodeReferenceType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ReferenceType">       &lt;choice>         &lt;sequence>           &lt;element name="Ref" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}AnyLocalCodeRefType" form="unqualified"/>           &lt;element name="URN" type="{http://www.w3.org/2001/XMLSchema}anyURI" minOccurs="0" form="unqualified"/>         &lt;/sequence>         &lt;element name="URN" type="{http://www.w3.org/2001/XMLSchema}anyURI" form="unqualified"/>       &lt;/choice>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns4_AttachmentConstraintRefType.description                                        = AttachmentConstraintRefType contains a set of reference fields for an attachment constraint.<p>Java class for AttachmentConstraintRefType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="AttachmentConstraintRefType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ConstraintRefType">       &lt;attribute name="class" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ConstraintTypeCodelistType" fixed="AttachmentConstraint" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns4_AttachmentConstraintReferenceType.description                                  = AttachmentConstraintReferenceType is a type for referencing a attachment constraint object. It consists of a URN and/or a complete set of reference fields.<p>Java class for AttachmentConstraintReferenceType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="AttachmentConstraintReferenceType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ConstraintReferenceType">       &lt;choice>         &lt;sequence>           &lt;element name="Ref" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}AttachmentConstraintRefType" form="unqualified"/>           &lt;element name="URN" type="{http://www.w3.org/2001/XMLSchema}anyURI" minOccurs="0" form="unqualified"/>         &lt;/sequence>         &lt;element name="URN" type="{http://www.w3.org/2001/XMLSchema}anyURI" form="unqualified"/>       &lt;/choice>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns4_AttributeDescriptorRefType.description                                         = AttributeDescriptorRefType contains a reference to the attribute descriptor within a data structure definition.<p>Java class for AttributeDescriptorRefType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="AttributeDescriptorRefType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ComponentListRefBaseType">       &lt;attribute name="id" use="required" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}IDType" fixed="ATTRIBUTE_DESCRIPTOR" />       &lt;attribute name="class" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ComponentListTypeCodelistType" fixed="AttributeDescriptor" />       &lt;attribute name="package" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}StructurePackageTypeCodelistType" fixed="datastructure" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns4_AttributeDescriptorReferenceType.description                                   = AttributeDescriptorReferenceType is a type for referencing an attribute descriptor object. It consists of a URN and/or a complete set of reference fields.<p>Java class for AttributeDescriptorReferenceType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="AttributeDescriptorReferenceType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ComponentListReferenceType">       &lt;choice>         &lt;sequence>           &lt;element name="Ref" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}AttributeDescriptorRefType" form="unqualified"/>           &lt;element name="URN" type="{http://www.w3.org/2001/XMLSchema}anyURI" minOccurs="0" form="unqualified"/>         &lt;/sequence>         &lt;element name="URN" type="{http://www.w3.org/2001/XMLSchema}anyURI" form="unqualified"/>       &lt;/choice>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns4_AttributeRefType.description                                                   = AttributeRefType contains a reference to an attribute within a data structure definition. Note that since there is only one attribute descriptor, the container reference fields are prohibited.<p>Java class for AttributeRefType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="AttributeRefType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ComponentRefBaseType">       &lt;attribute name="id" use="required" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}IDType" />       &lt;attribute name="class" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ComponentTypeCodelistType" fixed="Attribute" />       &lt;attribute name="package" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}StructurePackageTypeCodelistType" fixed="datastructure" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns4_AttributeReferenceType.description                                             = AttributeReferenceType is a type for referencing an attribute object. It consists of a URN and/or a complete set of reference fields.<p>Java class for AttributeReferenceType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="AttributeReferenceType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ComponentReferenceType">       &lt;choice>         &lt;sequence>           &lt;element name="Ref" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}AttributeRefType" form="unqualified"/>           &lt;element name="URN" type="{http://www.w3.org/2001/XMLSchema}anyURI" minOccurs="0" form="unqualified"/>         &lt;/sequence>         &lt;element name="URN" type="{http://www.w3.org/2001/XMLSchema}anyURI" form="unqualified"/>       &lt;/choice>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns4_AttributeValueSetType.description                                              = AttributeValueSetType defines the structure for providing values for a data attribute. If no values are provided, the attribute is implied to include/excluded from the region in which it is defined, with no regard to the value of the data attribute. Note that for metadata attributes which occur within other metadata attributes, a nested identifier can be provided. For example, a value of CONTACT.ADDRESS.STREET refers to the metadata attribute with the identifier STREET which exists in the ADDRESS metadata attribute in the CONTACT metadata attribute, which is defined at the root of the report structure.<p>Java class for AttributeValueSetType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="AttributeValueSetType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ComponentValueSetType">       &lt;choice minOccurs="0">         &lt;element name="Value" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}SimpleValueType" maxOccurs="unbounded"/>         &lt;element name="TimeRange" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}TimeRangeValueType"/>       &lt;/choice>       &lt;attribute name="id" use="required" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}SingleNCNameIDType" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns4_CategorisationRefType.description                                              = CategorisationRefType provides a reference to a categorisation via a complete set of reference fields.<p>Java class for CategorisationRefType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="CategorisationRefType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}MaintainableRefBaseType">       &lt;attribute name="class" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}MaintainableTypeCodelistType" fixed="Categorisation" />       &lt;attribute name="package" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}PackageTypeCodelistType" fixed="categoryscheme" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns4_CategorisationReferenceType.description                                        = CategorisationReferenceType is a type for referencing a categorisation object. It consists of a URN and/or a complete set of reference fields.<p>Java class for CategorisationReferenceType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="CategorisationReferenceType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}MaintainableReferenceBaseType">       &lt;choice>         &lt;sequence>           &lt;element name="Ref" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}CategorisationRefType" form="unqualified"/>           &lt;element name="URN" type="{http://www.w3.org/2001/XMLSchema}anyURI" minOccurs="0" form="unqualified"/>         &lt;/sequence>         &lt;element name="URN" type="{http://www.w3.org/2001/XMLSchema}anyURI" form="unqualified"/>       &lt;/choice>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns4_CategoryRefType.description                                                    = CategoryRefType references a category from within a category scheme. Reference fields are required for both the scheme and the item.<p>Java class for CategoryRefType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="CategoryRefType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ItemRefBaseType">       &lt;attribute name="maintainableParentID" use="required" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}IDType" />       &lt;attribute name="maintainableParentVersion" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}VersionType" default="1.0" />       &lt;attribute name="class" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ItemTypeCodelistType" fixed="Category" />       &lt;attribute name="package" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ItemSchemePackageTypeCodelistType" fixed="categoryscheme" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns4_CategoryReferenceType.description                                              = CategoryReferenceType is a type for referencing a category object. It consists of a URN and/or a complete set of reference fields.<p>Java class for CategoryReferenceType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="CategoryReferenceType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ItemReferenceType">       &lt;choice>         &lt;sequence>           &lt;element name="Ref" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}CategoryRefType" form="unqualified"/>           &lt;element name="URN" type="{http://www.w3.org/2001/XMLSchema}anyURI" minOccurs="0" form="unqualified"/>         &lt;/sequence>         &lt;element name="URN" type="{http://www.w3.org/2001/XMLSchema}anyURI" form="unqualified"/>       &lt;/choice>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns4_CategorySchemeMapRefType.description                                           = CategorySchemeMapRefType contains a set of reference fields for a category scheme map.<p>Java class for CategorySchemeMapRefType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="CategorySchemeMapRefType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ChildObjectRefBaseType">       &lt;attribute name="id" use="required" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}IDType" />       &lt;attribute name="class" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ObjectTypeCodelistType" fixed="CategorySchemeMap" />       &lt;attribute name="package" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}PackageTypeCodelistType" fixed="mapping" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns4_CategorySchemeMapReferenceType.description                                     = CategorySchemeMapReferenceType is a type for referencing a category scheme map object. It consists of a URN and/or a complete set of reference fields.<p>Java class for CategorySchemeMapReferenceType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="CategorySchemeMapReferenceType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ChildObjectReferenceType">       &lt;choice>         &lt;sequence>           &lt;element name="Ref" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}CategorySchemeMapRefType" form="unqualified"/>           &lt;element name="URN" type="{http://www.w3.org/2001/XMLSchema}anyURI" minOccurs="0" form="unqualified"/>         &lt;/sequence>         &lt;element name="URN" type="{http://www.w3.org/2001/XMLSchema}anyURI" form="unqualified"/>       &lt;/choice>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns4_CategorySchemeRefType.description                                              = CategorySchemeRefType provides a reference to a category scheme via a complete set of reference fields.<p>Java class for CategorySchemeRefType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="CategorySchemeRefType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ItemSchemeRefBaseType">       &lt;attribute name="class" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ItemSchemeTypeCodelistType" fixed="CategoryScheme" />       &lt;attribute name="package" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ItemSchemePackageTypeCodelistType" fixed="categoryscheme" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns4_CategorySchemeReferenceType.description                                        = CategorySchemeReferenceType is a type for referencing a category scheme object. It consists of a URN and/or a complete set of reference fields.<p>Java class for CategorySchemeReferenceType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="CategorySchemeReferenceType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ItemSchemeReferenceBaseType">       &lt;choice>         &lt;sequence>           &lt;element name="Ref" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}CategorySchemeRefType" form="unqualified"/>           &lt;element name="URN" type="{http://www.w3.org/2001/XMLSchema}anyURI" minOccurs="0" form="unqualified"/>         &lt;/sequence>         &lt;element name="URN" type="{http://www.w3.org/2001/XMLSchema}anyURI" form="unqualified"/>       &lt;/choice>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns4_ChildObjectRefBaseType.description                                             = ChildObjectRefBaseType is an abstract base type for referencing any child object defined directly within a maintainable object.<p>Java class for ChildObjectRefBaseType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="ChildObjectRefBaseType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}RefBaseType">       &lt;attribute name="agencyID" use="required" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}NestedNCNameIDType" />       &lt;attribute name="maintainableParentID" use="required" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}IDType" />       &lt;attribute name="maintainableParentVersion" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}VersionType" default="1.0" />       &lt;attribute name="id" use="required" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}NestedIDType" />       &lt;attribute name="local" type="{http://www.w3.org/2001/XMLSchema}boolean" fixed="false" />       &lt;attribute name="class" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ObjectTypeCodelistType" />       &lt;attribute name="package" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}PackageTypeCodelistType" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns4_ChildObjectReferenceType.description                                           = ChildObjectReferenceType is an abstract base type used for referencing a particular object defined directly within a maintainable object. It consists of a URN and/or a complete set of reference fields; agency, maintainable id (maintainableParentID), maintainable version (maintainableParentVersion), the object id (which can be nested), and optionally the object version (if applicable).<p>Java class for ChildObjectReferenceType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="ChildObjectReferenceType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ReferenceType">       &lt;choice>         &lt;sequence>           &lt;element name="Ref" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ChildObjectRefBaseType" form="unqualified"/>           &lt;element name="URN" type="{http://www.w3.org/2001/XMLSchema}anyURI" minOccurs="0" form="unqualified"/>         &lt;/sequence>         &lt;element name="URN" type="{http://www.w3.org/2001/XMLSchema}anyURI" form="unqualified"/>       &lt;/choice>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns4_CodeRefType.description                                                        = CodeRefType references a code from within a codelist. Reference fields are required for both the scheme and the item.<p>Java class for CodeRefType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="CodeRefType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ItemRefBaseType">       &lt;attribute name="maintainableParentID" use="required" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}IDType" />       &lt;attribute name="maintainableParentVersion" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}VersionType" default="1.0" />       &lt;attribute name="id" use="required" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}IDType" />       &lt;attribute name="class" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ItemTypeCodelistType" fixed="Code" />       &lt;attribute name="package" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ItemSchemePackageTypeCodelistType" fixed="codelist" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>

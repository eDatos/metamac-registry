api.doc.swagger.definitions.xml_ns9_ReportType.description                                                         = ReportType is an abstract base type the forms the basis for a metadata structure definition specific report, based on the defined report structures. This type is restricted in the metadata structure definition specific schema so that the Target and AttributeSet conform to the prescribed report structure.<p>Java class for ReportType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="ReportType">   &lt;complexContent>     &lt;extension base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}AnnotableType">       &lt;sequence>         &lt;element name="Target" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/metadata/structurespecific}TargetType" form="unqualified"/>         &lt;element name="AttributeSet" type="{http://www.w3.org/2001/XMLSchema}anyType" form="unqualified"/>       &lt;/sequence>       &lt;attribute name="id" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}IDType" />     &lt;/extension>   &lt;/complexContent> &lt;/complexType> </pre>

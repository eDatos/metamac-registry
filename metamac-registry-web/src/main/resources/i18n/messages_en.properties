api.doc.swagger.definitions.xml_ns5_ValueMappingType.description                                                   = ValueMappingType specifies the relationship between two values as a source and target.<p>Java class for ValueMappingType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="ValueMappingType">   &lt;complexContent>     &lt;restriction base="{http://www.w3.org/2001/XMLSchema}anyType">       &lt;attribute name="source" use="required" type="{http://www.w3.org/2001/XMLSchema}string" />       &lt;attribute name="target" use="required" type="{http://www.w3.org/2001/XMLSchema}string" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns5_ValueMappingType.properties.source.description                                 = .
api.doc.swagger.definitions.xml_ns5_ValueMappingType.properties.target.description                                 = .
api.doc.swagger.definitions.xml_ns5_VersionableType.description                                                    = VersionableType is an abstract base type for all versionable objects.<p>Java class for VersionableType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="VersionableType">   &lt;complexContent>     &lt;extension base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/structure}NameableType">       &lt;attribute name="version" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}VersionType" default="1.0" />       &lt;attribute name="validFrom" type="{http://www.w3.org/2001/XMLSchema}dateTime" />       &lt;attribute name="validTo" type="{http://www.w3.org/2001/XMLSchema}dateTime" />     &lt;/extension>   &lt;/complexContent> &lt;/complexType> </pre>

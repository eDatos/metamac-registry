api.doc.swagger.definitions.xml_ns3_DataSetType.description                                                        = DataSetType defines the structure of the generic data set. Data is organised into either a collection of series (grouped observations) or a collection of un-grouped observations. The organisation used is dependent on the structure specification in the header of the data message (which is referenced via the structureRef attribute). The structure specification states which data occurs at the observation level. If this dimension is "AllDimensions" then the data set must consist of a collection of un-grouped observations; otherwise the data set will contain a collection of series with the observations in the series disambiguated by the specified dimension at the observation level. This data set is capable of containing data (observed values) and/or documentation (attribute values). It is assumed that each series or un-grouped observation will be distinct in its purpose. For example, if series contains both data and documentation, it assumed that each series will have a unique key. If the series contains only data or only documentation, then it is possible that another series with the same key might exist, but with not with the same purpose (i.e. to provide data or documentation) as the first series.<p>Java class for DataSetType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="DataSetType">   &lt;complexContent>     &lt;extension base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}AnnotableType">       &lt;sequence>         &lt;element name="DataProvider" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}DataProviderReferenceType" minOccurs="0"/>         &lt;element name="Attributes" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/data/generic}ValuesType" minOccurs="0"/>         &lt;element name="Group" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/data/generic}GroupType" maxOccurs="unbounded" minOccurs="0"/>         &lt;choice minOccurs="0">           &lt;element name="Series" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/data/generic}SeriesType" maxOccurs="unbounded"/>           &lt;element name="Obs" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/data/generic}ObsOnlyType" maxOccurs="unbounded"/>         &lt;/choice>       &lt;/sequence>       &lt;attGroup ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}SetAttributeGroup"/>     &lt;/extension>   &lt;/complexContent> &lt;/complexType> </pre>

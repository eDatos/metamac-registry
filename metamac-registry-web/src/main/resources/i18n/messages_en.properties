api.doc.swagger.definitions.xml_ns4_ActionType.description                                                = <p>Java class for ActionType.<p>The following schema fragment specifies the expected content contained within this class.<p><pre> &lt;simpleType name="ActionType">   &lt;restriction base="{http://www.w3.org/2001/XMLSchema}NMTOKEN">     &lt;enumeration value="Append"/>     &lt;enumeration value="Replace"/>     &lt;enumeration value="Delete"/>     &lt;enumeration value="Information"/>   &lt;/restriction> &lt;/simpleType> </pre>
api.doc.swagger.definitions.xml_ns4_AgencyRefType.description                                             = AgencyRefType contains a set of reference fields for referencing an agency within an agency scheme.<p>Java class for AgencyRefType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="AgencyRefType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}OrganisationRefBaseType">       &lt;attribute name="class" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}OrganisationTypeCodelistType" fixed="Agency" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>

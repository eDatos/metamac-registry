e="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ObservationalTimePeriodType" minOccurs="0"/>         &lt;element name="ReportingEnd" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ObservationalTimePeriodType" minOccurs="0"/>         &lt;element name="EmbargoDate" type="{http://www.w3.org/2001/XMLSchema}dateTime" minOccurs="0"/>         &lt;element name="Source" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}TextType" maxOccurs="unbounded" minOccurs="0"/>       &lt;/sequence>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>

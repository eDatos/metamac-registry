api.doc.swagger.definitions.xml_ns7_FooterType.description                                                         = FooterType describes the structure of a message footer. The footer is used to convey any error, information, or warning messages. This is to be used when the message has payload, but also needs to communicate additional information. If an error occurs and no payload is generated, an Error message should be returned.
api.doc.swagger.definitions.xml_ns7_FooterType.properties.Message.description                                      =
api.doc.swagger.definitions.xml_ns7_QueryableDataSourceType.description                                            = QueryableDataSourceType describes a queryable data source, and add a fixed attribute for ensuring only one queryable source can be provided.

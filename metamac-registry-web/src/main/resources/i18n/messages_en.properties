api.doc.swagger.definitions.xml_ns3_ObsOnlyType.description                                                        = ObsOnlyType defines the structure for an un-grouped observation. Unlike a group observation, an un-grouped must provided a full set of values for every dimension declared in the data structure definition. The observation can contain an observed value and/or a collection of attribute values.

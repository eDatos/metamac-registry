api.doc.swagger.definitions.xml_ns5_ContactType.description                                                        = ContactType describes the structure of a contact's details.<p>Java class for ContactType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="ContactType">   &lt;complexContent>     &lt;restriction base="{http://www.w3.org/2001/XMLSchema}anyType">       &lt;sequence>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Name" maxOccurs="unbounded" minOccurs="0"/>         &lt;element name="Department" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}TextType" maxOccurs="unbounded" minOccurs="0"/>         &lt;element name="Role" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}TextType" maxOccurs="unbounded" minOccurs="0"/>         &lt;choice maxOccurs="unbounded" minOccurs="0">           &lt;element name="Telephone" type="{http://www.w3.org/2001/XMLSchema}string"/>           &lt;element name="Fax" type="{http://www.w3.org/2001/XMLSchema}string"/>           &lt;element name="X400" type="{http://www.w3.org/2001/XMLSchema}string"/>           &lt;element name="URI" type="{http://www.w3.org/2001/XMLSchema}anyURI"/>           &lt;element name="Email" type="{http://www.w3.org/2001/XMLSchema}string"/>         &lt;/choice>       &lt;/sequence>       &lt;attribute name="id" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}IDType" />     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>

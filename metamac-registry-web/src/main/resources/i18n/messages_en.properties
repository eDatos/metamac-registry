api.doc.swagger.definitions.xml_ns8_TimeSeriesDataSetType.description                                              = TimeSeriesDataSetType is the abstract type which defines the base structure for any data structure definition specific time series based data set. A derived data set type will be created that is specific to a data structure definition. Unlike the base format, only one variation of this is allowed for a data structure definition. This variation is the time dimension as the observation dimension. Data is organised into a collection of time series. Because this derivation is achieved using restriction, data sets conforming to this type will inherently conform to the base data set structure as well. In fact, data structure specific here will be identical to data in the base data set when the time dimension is the observation dimension, even for the derived data set types. This means that the data contained in this structure can be processed in exactly the same manner as the base structure. The same rules for derivation as the base data set type apply to this specialized data set.<p>Java class for TimeSeriesDataSetType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="TimeSeriesDataSetType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/data/structurespecific}DataSetType">       &lt;sequence>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Annotations" minOccurs="0"/>         &lt;element name="DataProvider" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}DataProviderReferenceType" minOccurs="0" form="unqualified"/>         &lt;element name="Group" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/data/structurespecific}GroupType" maxOccurs="unbounded" minOccurs="0" form="unqualified"/>         &lt;choice minOccurs="0">           &lt;element name="Series" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/data/structurespecific}TimeSeriesType" maxOccurs="unbounded" form="unqualified"/>         &lt;/choice>       &lt;/sequence>       &lt;attGroup ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/data/structurespecific}SetAttributeGroup"/>       &lt;anyAttribute namespace=''/>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns8_TimeSeriesObsType.description                                                  = TimeSeriesObsType defines the abstract structure of a time series observation. The observation must be provided a value for the time dimension. This time value should disambiguate the observation within the series in which it is defined (i.e. there should not be another observation with the same time value). The observation can contain an observed value and/or attribute values. The same rules for derivation as the base observation type apply to this specialized observation.<p>Java class for TimeSeriesObsType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="TimeSeriesObsType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/data/structurespecific}ObsType">       &lt;sequence>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Annotations" minOccurs="0"/>       &lt;/sequence>       &lt;attribute name="TIME_PERIOD" use="required" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ObservationalTimePeriodType" />       &lt;attribute name="OBS_VALUE" type="{http://www.w3.org/2001/XMLSchema}anySimpleType" />       &lt;anyAttribute namespace=''/>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns8_TimeSeriesType.description                                                     = TimeSeriesType defines an abstract structure which is used to group a collection of observations which have a key in common, organised by time. The key for a series is every dimension defined in the data structure definition, save the time dimension. In addition to observations, values can be provided for attributes which are associated with the dimensions which make up this series key (so long as the attributes do not specify a group attachment or also have an relationship with the time dimension). It is possible for the series to contain only observations or only attribute values, or both. The same rules for derivation as the base series type apply to this specialized series.<p>Java class for TimeSeriesType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="TimeSeriesType">   &lt;complexContent>     &lt;restriction base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/data/structurespecific}SeriesType">       &lt;sequence>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Annotations" minOccurs="0"/>         &lt;element name="Obs" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/data/structurespecific}TimeSeriesObsType" maxOccurs="unbounded" minOccurs="0" form="unqualified"/>       &lt;/sequence>       &lt;anyAttribute namespace=''/>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>
api.doc.swagger.definitions.xml_ns9_MetadataSetType.description                                                    = MetadataSetType is an abstract base type the forms the basis for a metadata structure specific metadata set. It is restricted by the metadata structure definition specific schema to meet its needs.<p>Java class for MetadataSetType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="MetadataSetType">   &lt;complexContent>     &lt;extension base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}AnnotableType">       &lt;sequence>         &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Name" maxOccurs="unbounded" minOccurs="0"/>         &lt;element name="DataProvider" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}DataProviderReferenceType" minOccurs="0" form="unqualified"/>         &lt;element name="Report" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/metadata/structurespecific}ReportType" maxOccurs="unbounded" form="unqualified"/>       &lt;/sequence>       &lt;attGroup ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/metadata/structurespecific}SetAttributeGroup"/>     &lt;/extension>   &lt;/complexContent> &lt;/complexType> </pre>

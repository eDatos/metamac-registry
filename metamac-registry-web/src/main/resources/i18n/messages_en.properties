api.doc.swagger.definitions.xml_ns10_ReportedAttributeType.description                                             = ReportedAttributeType defines the structure for a reported metadata attribute. A value for the attribute can be supplied as either a single value, or multi-lingual text values (either structured or unstructured). An optional set of child metadata attributes is also available if the metadata attribute definition defines nested metadata attributes.<p>Java class for ReportedAttributeType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="ReportedAttributeType">   &lt;complexContent>     &lt;extension base="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}AnnotableType">       &lt;sequence>         &lt;choice minOccurs="0">           &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}Text" maxOccurs="unbounded"/>           &lt;element ref="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}StructuredText" maxOccurs="unbounded"/>         &lt;/choice>         &lt;element name="AttributeSet" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/metadata/generic}AttributeSetType" minOccurs="0"/>       &lt;/sequence>       &lt;attribute name="id" use="required" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}IDType" />       &lt;attribute name="value" type="{http://www.w3.org/2001/XMLSchema}string" />     &lt;/extension>   &lt;/complexContent> &lt;/complexType> </pre>

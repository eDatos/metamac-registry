api.doc.swagger.definitions.xml_ns4_RegionType.description                                                = RegionType is an abstract type which defines a generic constraint region. This type can be refined to define regions for data or metadata sets. A region is defined by a collection of key values - each of which a collection of values for a component which disambiguates data or metadata (i.e. dimensions or the target objects of a metadata target). For each region, as collection of attribute values can be provided. Taken together, the key values and attributes serve to identify or describe a subset of a data or metadata set. Finally, the region can flagged as being included or excluded, although this flag only makes sense when the region is used in a particular context.<p>Java class for RegionType complex type.<p>The following schema fragment specifies the expected content contained within this class.<pre> &lt;complexType name="RegionType">   &lt;complexContent>     &lt;restriction base="{http://www.w3.org/2001/XMLSchema}anyType">       &lt;sequence>         &lt;element name="KeyValue" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ComponentValueSetType" maxOccurs="unbounded" minOccurs="0"/>         &lt;element name="Attribute" type="{http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common}ComponentValueSetType" maxOccurs="unbounded" minOccurs="0"/>       &lt;/sequence>       &lt;attribute name="include" type="{http://www.w3.org/2001/XMLSchema}boolean" default="true" />       &lt;anyAttribute namespace=''/>     &lt;/restriction>   &lt;/complexContent> &lt;/complexType> </pre>

api.doc.swagger.definitions.xml_ns4_OrganisationSchemeRefBaseType.description                                      = OrganisationSchemeRefBaseType cont\u00e9 un conjunt de camps de refer\u00e8ncia per a un esquema d'organitzaci\u00f3.
api.doc.swagger.definitions.xml_ns4_OrganisationSchemeReferenceBaseType.description                                = OrganisationSchemeReferenceBaseType \u00e9s un tipus per a referenciar un objecte d'esquema d'organitzaci\u00f3. Consisteix en un URN i/o un conjunt complet de camps de refer\u00e8ncia.
api.doc.swagger.definitions.xml_ns4_OrganisationSchemeReferenceType.description                                    = OrganisationSchemeReferenceType fa refer\u00e8ncia a un esquema d'organitzaci\u00f3 independentment del tipus espec\u00edfic. Consisteix en un URN i/o un conjunt complet de camps de refer\u00e8ncia.
api.doc.swagger.definitions.xml_ns4_OrganisationSchemeRefType.description                                          = OrganisationSchemeRefType proporciona una refer\u00e8ncia a un esquema d'organitzaci\u00f3 a trav\u00e9s d'un conjunt complet de camps de refer\u00e8ncia. Es requereix que s'especifiqui la classe (\u00e9s a dir, el tipus) de l'esquema d'organitzaci\u00f3 al qual es fa refer\u00e8ncia.
api.doc.swagger.definitions.xml_ns4_OrganisationUnitReferenceType.description                                      = OrganisationUnitReferenceType \u00e9s un tipus per a referenciar una unitat d'organitzaci\u00f3. Consisteix en un URN i/o un conjunt complet de camps de refer\u00e8ncia.
api.doc.swagger.definitions.xml_ns4_OrganisationUnitRefType.description                                            = OrganisationUnitRefType cont\u00e9 un conjunt de camps de refer\u00e8ncia per a referenciar una unitat d'organitzaci\u00f3 dins d'un esquema d'unitats d'organitzaci\u00f3.
api.doc.swagger.definitions.xml_ns4_OrganisationUnitSchemeReferenceType.description                                = OrganisationUnitSchemeReferenceType \u00e9s un tipus per a referenciar un objecte d'esquema d'unitat organitzativa. Consisteix en un URN i/o un conjunt complet de camps de refer\u00e8ncia.
api.doc.swagger.definitions.xml_ns4_OrganisationUnitSchemeRefType.description                                      = OrganisationUnitSchemeRefType cont\u00e9 un conjunt de camps de refer\u00e8ncia per a un esquema d'unitat d'organitzaci\u00f3.

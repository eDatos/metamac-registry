api.doc.swagger.definitions.xml_ns5_CategoryMapType.description                                                    = CategoryMapType defineix l'estructura per a mapear dues categories. Es proporciona una refer\u00e8ncia local tant a la categoria d'origen com a la de destinaci\u00f3.
api.doc.swagger.definitions.xml_ns5_CategorySchemeMapType.description                                              = CategorySchemeMapType defineix l'estructura d'un mapa que identifica les relacions entre categories en diferents esquemes de categories.
api.doc.swagger.definitions.xml_ns5_CategorySchemeType.description                                                 = CategorySchemeType descriu l'estructura d'un esquema de categories. Un esquema de categories \u00e9s la informaci\u00f3 descriptiva d'una ordenaci\u00f3 o divisi\u00f3 de categories en grups basats en caracter\u00edstiques, que els objectes tenen en com\u00fa. Aix\u00f2 proporciona una jerarquia simple i anivellada o categories.
api.doc.swagger.definitions.xml_ns5_CategoryType.description                                                       = CategoryType descriu els detalls d'una categoria. Una categoria es defineix com un element en qualsevol nivell d'una classificaci\u00f3. L'element Category representa un conjunt de categories niades que s\u00f3n categories filles.
api.doc.swagger.definitions.xml_ns5_CodededTextFormatType.description                                              = CodededTextFormatType \u00e9s una versi\u00f3 restringida de SimpleComponentTextFormatType que nom\u00e9s permet facetes i tipus de text aplicables a codis. Encara que les facetes d'hora permeten qualsevol valor, un identificador de codi real no admet els car\u00e0cters necessaris per a l'hora. Per tant, aquestes facetes no han de contenir l'hora en els seus valors.
api.doc.swagger.definitions.xml_ns5_CodelistMapType.description                                                    = CodelistMapType defineix l'estructura d'un mapa que identifica les relacions entre els codis de diferents llistats de codis.
api.doc.swagger.definitions.xml_ns5_CodelistType.description                                                       = CodelistType defineix l'estructura d'una llista de codis. Una llista de codis es defineix com una llista de la qual alguns conceptes estad\u00edstics (conceptes codificats) prenen els seus valors.
api.doc.swagger.definitions.xml_ns5_CodeMapType.description                                                        = CodeMapType defineix l'estructura per a mapear dos codis. Es proporciona una refer\u00e8ncia local tant al codi d'origen com al de destinaci\u00f3.
api.doc.swagger.definitions.xml_ns5_CodeType.description                                                           = CodeType descriu l'estructura d'un codi. Un codi es defineix com un conjunt independent del llenguatge de lletres, n\u00fameros o s\u00edmbols que representen un concepte el significat del qual es descriu en un llenguatge natural. La informaci\u00f3 de presentaci\u00f3 que no sigui present pot afegir-se mitjançant l'\u00fas d'anotacions.
api.doc.swagger.definitions.xml_ns5_CodingTextFormatType.description                                               =
api.doc.swagger.definitions.xml_ns5_ComponentBaseType.description                                                  = ComponentBaseType \u00e9s un tipus abstracte que nom\u00e9s serveix per a formar la base del ComponentType real. Nom\u00e9s restringeix el format de l'atribut aneu al NCNameIDType.
api.doc.swagger.definitions.xml_ns5_ComponentListType.description                                                  = ComponentListType \u00e9s un tipus base abstracte per a totes les llistes de components. Cont\u00e9 una col·lecci\u00f3 de components. Els tipus concrets han de restringir aix\u00f2 a components concrets espec\u00edfics.

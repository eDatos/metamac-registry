api.doc.swagger.definitions.xml_ns5_ConstraintContentTargetType.description                                        = ConstraintTargetType defineix l'estructura d'un objecte objectiu de restricci\u00f3. L'objecte de dest\u00ed de restricci\u00f3 t\u00e9 una representaci\u00f3 i un identificador fixos.
api.doc.swagger.definitions.xml_ns5_ConstraintRepresentationType.description                                       = ConstraintRepresentationType defineix les possibles representacions locals d'un objecte de dest\u00ed de refer\u00e8ncia de restricci\u00f3. La representaci\u00f3 es fixa perqu\u00e8 sigui sempre una refer\u00e8ncia de restricci\u00f3 adjunta.
api.doc.swagger.definitions.xml_ns5_ConstraintTextFormatType.description                                           = ConstraintTextFormatType \u00e9s una versi\u00f3 restringida de NonFacetedTextFormatType que especifica una representaci\u00f3 fixa de AttachmentConstraintReference.
api.doc.swagger.definitions.xml_ns5_ConstraintType.description                                                     = ConstraintType \u00e9s un tipus base abstracte que tipus espec\u00edfics de restriccions (contingut i adjunt) restringeixen i estenen per a descriure els seus detalls. La inclusi\u00f3 d'una clau o regi\u00f3 en una restricci\u00f3 es determina processant primer els conjunts de claus inclosos i eliminant despr\u00e9s les claus definides en els conjunts de claus exclosos. Si no es defineixen conjunts de claus inclosos, s'assumeix que totes les claus o regions possibles estan incloses, i qualsevol clau o regi\u00f3 exclosa s'elimina d'aquest conjunt complet.

api.doc.swagger.definitions.xml_ns4_ProcessStepRefType.description                                                 = ProcessStepRefType proporciona una refer\u00e8ncia a un pas de proc\u00e9s a trav\u00e9s del seu id. El suport per a referenciar passos de proc\u00e9s niats es proporciona a trav\u00e9s d'un identificador niat.

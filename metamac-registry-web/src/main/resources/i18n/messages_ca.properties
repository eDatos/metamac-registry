api.doc.swagger.definitions.xml_ns5_AgencySchemeType.description                                                   = AgencySchemeType defineix un tipus espec\u00edfic d'esquema d'organitzaci\u00f3 que cont\u00e9 \u00fanicament ag\u00e8ncies de manteniment. L'esquema d'ag\u00e8ncia mantingut per una ag\u00e8ncia de manteniment concreta sempre rep un identificador i una versi\u00f3 fixos, i mai \u00e9s definitiu. Per tant, es poden afegir o eliminar ag\u00e8ncies sense haver de versionar l'esquema. Els esquemes d'ag\u00e8ncies no tenen jerarquia, cosa que significa que cap ag\u00e8ncia pot definir una relaci\u00f3 amb una altra ag\u00e8ncia de l'esquema. De fet, l'agencia matriu real d'una ag\u00e8ncia d'un esquema \u00e9s l'ag\u00e8ncia que defineix l'esquema.
api.doc.swagger.definitions.xml_ns5_AgencyType.description                                                         = AgencyType defineix l'estructura de la descripci\u00f3 d'una ag\u00e8ncia. Els contactes definits per a l'organitzaci\u00f3 s\u00f3n espec\u00edfics de la funci\u00f3 d'ag\u00e8ncia que exerceix l'organitzaci\u00f3.
api.doc.swagger.definitions.xml_ns5_AttachmentConstraintAttachmentType.description                                 = AttachmentConstraintAttachmentType defineix l'estructura per a especificar l'objecte al qual s'aplica una restricci\u00f3 d'adjunt.
api.doc.swagger.definitions.xml_ns5_AttachmentConstraintType.description                                           = AttachmentConstraintType descriu els detalls d'una restricci\u00f3 de dades adjuntes definint els conjunts de claus de dades o metadades o les regions de components que poden adjuntar-se als atributs o metadades de refer\u00e8ncia en els objectes adjunts de la restricci\u00f3.
api.doc.swagger.definitions.xml_ns5_AttributeBaseType.description                                                  = AttributeBaseType \u00e9s un tipus base abstracte que serveix de base per a AttributeType. Restringeix la base de format de text a un format de text v\u00e0lid per a components de dades (que no permet la representaci\u00f3 XHTML). La representaci\u00f3 local es restringeix als valors definits en codelist. La funci\u00f3 de concepte es restringeix als valors v\u00e0lids per a un atribut de dades.
api.doc.swagger.definitions.xml_ns5_AttributeListBaseType.description                                              = AttributeListBaseType \u00e9s un tipus base abstracte que s'utilitza com a base per a AttributeListType.
api.doc.swagger.definitions.xml_ns5_AttributeListType.description                                                  = AttributeListType descriu el descriptor d'atributs per a la definici\u00f3 de l'estructura de dades.

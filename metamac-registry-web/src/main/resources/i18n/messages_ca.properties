api.doc.swagger.definitions.xml_ns5_ConceptBaseType.description                                                    = ConceptBaseType \u00e9s un tipus base abstracte que forma la base del ConceptType en requerir un nom i un id, i restringir el contingut de l'id.
api.doc.swagger.definitions.xml_ns5_ConceptMapType.description                                                     = ConceptMapType defineix l'estructura per a mapear dos conceptes. Es proporciona una refer\u00e8ncia local tant al concepte d'origen com al de destinaci\u00f3.
api.doc.swagger.definitions.xml_ns5_ConceptRepresentation.description                                              = ConceptRepresentation defineix el nucli de representaci\u00f3 que es permeten per a un concepte. El format de text perm\u00e8s per a un concepte \u00e9s el que es permet per a qualsevol component d'objecte no objectiu.
api.doc.swagger.definitions.xml_ns5_ConceptSchemeMapType.description                                               = ConceptSchemeMapType defineix l'estructura d'un mapa que identifica les relacions entre conceptes en diferents esquemes conceptuals.
api.doc.swagger.definitions.xml_ns5_ConceptSchemeType.description                                                  = ConceptSchemeType descriu l'estructura d'un esquema conceptual. Un esquema conceptual \u00e9s la informaci\u00f3 descriptiva d'una ordenaci\u00f3 o divisi\u00f3 de conceptes en grups basats en caracter\u00edstiques, que els objectes tenen en com\u00fa. Cont\u00e9 una col·lecci\u00f3 de definicions de conceptes, que poden organitzar-se en jerarquies simples.
api.doc.swagger.definitions.xml_ns5_ConceptType.description                                                        = ConceptType descriu els detalls d'un concepte. Un concepte es defineix com una unitat de coneixement creada per una combinaci\u00f3 \u00fanica de caracter\u00edstiques. Si un concepte no especifica un TextFormat o una representaci\u00f3 b\u00e0sica, se suposa que la representaci\u00f3 del concepte est\u00e0 representada per qualsevol conjunt de car\u00e0cters v\u00e0lids (corresponents al tipus de dades xs:string de W3C XML Schema).

api.doc.swagger.definitions.xml_ns5_TimeDimensionRepresentationType.description                                    = TimeDimensionRepresentationType defineix la representaci\u00f3 per a la dimensi\u00f3 temporal. No es permeten valors enumerats.
api.doc.swagger.definitions.xml_ns5_TimeDimensionType.description                                                  = TimeDimensionType descriu l'estructura d'una dimensi\u00f3 temporal. La dimensi\u00f3 temporal presa la seva sem\u00e0ntica de la identitat del seu concepte (normalment el concepte TIME_PERIOD), encara que sempre t\u00e9 un identificador fix (TIME_PERIOD). La dimensi\u00f3 temporal sempre t\u00e9 un format de text fix, que especifica que el seu format \u00e9s sempre el del conjunt de valors del per\u00edode de temps d'observaci\u00f3 (vegeu common:ObservationalTimePeriodType). \u00e9s possible que el format sigui un subconjunt del conjunt de valors del per\u00edode de temps d'observaci\u00f3. Per exemple, \u00e9s possible establir que la representaci\u00f3 sigui sempre un any natural. Vegin-se les enumeracions de l'atribut textType en LocalRepresentation/TextFormat per a m\u00e9s detalls sobre els possibles subconjunts. Tamb\u00e9 \u00e9s possible facetar aquesta representaci\u00f3 amb dates d'inici i fi. El prop\u00f2sit d'aquests fets \u00e9s restringir el valor de la dimensi\u00f3 temporal perqu\u00e8 ocorri dins del rang especificat. Si s'espera que la dimensi\u00f3 temporal permeti utilitzar els per\u00edodes d'informaci\u00f3 est\u00e0ndard (vegeu common:ReportingTimePeriodType), es recomana encaridament que l'atribut de dia d'inici de l'any d'informaci\u00f3 tamb\u00e9 s'inclogui en la definici\u00f3 de l'estructura de dades. Quan s'utilitzi l'atribut del dia d'inici de l'any de refer\u00e8ncia, s'assumir\u00e0 que els valors de qualsevol per\u00edode de refer\u00e8ncia est\u00e0ndard es basen en el dia d'inici contingut en aquest atribut. Si no s'inclou l'atribut de dia d'inici de l'any de refer\u00e8ncia i s'utilitzen per\u00edodes de refer\u00e8ncia est\u00e0ndard, s'assumir\u00e0 que aquests valors es basen en un any de refer\u00e8ncia que comença l'1 de gener.
api.doc.swagger.definitions.xml_ns5_TimeTextFormatType.description                                                 = TimeTextFormat \u00e9s una versi\u00f3 restringida de SimpleComponentTextFormatType que nom\u00e9s permet el format basat en el temps i especifica una representaci\u00f3 ObservationalTimePeriod predeterminada i facetes d'una hora d'inici i final.

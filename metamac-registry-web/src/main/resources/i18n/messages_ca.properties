api.doc.swagger.definitions.xml_ns3_StructureSpecificTimeSeriesDataType.description                                = StructureSpecificTimeSeriesDataType defineix l'estructura del missatge de dades de s\u00e8ries temporals espec\u00edfics de l'estructura.

api.doc.swagger.definitions.xml_ns3_ObsType.description                                                            = ObsType defineix l'estructura d'una observaci\u00f3 agrupada. S'ha de proporcionar a l'observaci\u00f3 un valor per a la dimensi\u00f3 que es declara en el nivell d'observaci\u00f3 per a aquest conjunt de dades.Aquest valor de dimensi\u00f3 ha de desambiguar l'observaci\u00f3 dins de la s\u00e8rie en la qual es defineix (\u00e9s a dir, no ha d'haver-hi una altra observaci\u00f3 amb el mateix valor de dimensi\u00f3). L'observaci\u00f3 pot contenir un valor observat i/o valors d'atribut.

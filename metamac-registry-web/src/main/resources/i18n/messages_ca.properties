api.doc.swagger.definitions.xml_ns5_ComponentType.description                                                      = ComponentType \u00e9s un tipus base abstracte per a tots els components. Cont\u00e9 informaci\u00f3 relativa a un component, inclosa una refer\u00e8ncia opcional a un concepte, una funci\u00f3 opcional exercida pel concepte, una descripci\u00f3 opcional en format de text i una representaci\u00f3 local opcional.

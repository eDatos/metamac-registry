api.doc.swagger.definitions.xml_ns4_URNReferenceType.description                                                   = URNReferenceType \u00e9s un tipus que fa refer\u00e8ncia a qualsevol objecte a trav\u00e9s del seu URN. No s'especifica el tipus exacte d'objecte, encara que pot determinar-se a partir del valor URN.
api.doc.swagger.definitions.xml_ns4_XHTMLType.description                                                          = XHTMLType permet un contingut mixt de text i etiquetes XHTML. Quan s'utilitza aquest tipus, un haur\u00e0 de proporcionar una refer\u00e8ncia a l'esquema XHTML, ja que el processament de les etiquetes dins d'aquest tipus \u00e9s estricte, cosa que significa que es validen contra l'esquema XHTML proporcionat.

api.doc.swagger.definitions.xml_ns4_LocalTargetObjectReferenceType.description                                     = LocalTargetObjectReferenceType \u00e9s un tipus per a fer refer\u00e8ncia a qualsevol tipus d'objecte de dest\u00ed dins d'un objectiu de metadades localment, on les refer\u00e8ncies a l'objectiu de metadades i la definici\u00f3 de l'estructura de metadades que defineix la refer\u00e8ncia de dest\u00ed es proporcionen en un altre context.
api.doc.swagger.definitions.xml_ns4_LocalTargetObjectRefType.description                                           = LocalTargetObjectRefType cont\u00e9 els camps de refer\u00e8ncia per a referenciar un objecte de dest\u00ed localment.
api.doc.swagger.definitions.xml_ns4_MaintainableRefBaseType.description                                            = MaintainableRefBaseType \u00e9s un tipus base abstracte per a referenciar un objecte mantenible.
api.doc.swagger.definitions.xml_ns4_MaintainableReferenceBaseType.description                                      = MaintainableReferenceBaseType \u00e9s un tipus base abstracte per a referenciar un objecte mantenible. Consisteix en un URN i/o un conjunt complet de camps de refer\u00e8ncia
api.doc.swagger.definitions.xml_ns4_MaintainableReferenceType.description                                          = MaintainableReferenceType \u00e9s un tipus per a referenciar qualsevol objecte mantenible. Consisteix en un URN i/o un conjunt complet de camps de refer\u00e8ncia
api.doc.swagger.definitions.xml_ns4_MaintainableRefType.description                                                = MaintainableRefType cont\u00e9 un conjunt complet de camps de refer\u00e8ncia per a referenciar qualsevol objecte mantenible.
api.doc.swagger.definitions.xml_ns4_MeasureDescriptorReferenceType.description                                     = MeasureDescriptorReferenceType \u00e9s un tipus per a referenciar un objecte descriptor de mesura. Consisteix en un URN i/o un conjunt complet de camps de refer\u00e8ncia.
api.doc.swagger.definitions.xml_ns4_MeasureDescriptorRefType.description                                           = MeasureDescriptorRefType cont\u00e9 una refer\u00e8ncia al descriptor de mesura dins d'una definici\u00f3 d'estructura de dades.
api.doc.swagger.definitions.xml_ns4_MeasureDimensionReferenceType.description                                      = MeasureDimensionReferenceType \u00e9s un tipus per a referenciar un objecte de dimensi\u00f3 de mesura. Consisteix en un URN i/o un conjunt complet de camps de refer\u00e8ncia.
api.doc.swagger.definitions.xml_ns4_MeasureDimensionRefType.description                                            = MeasureDimensionRefType cont\u00e9 una refer\u00e8ncia a la dimensi\u00f3 de mesura dins d'una definici\u00f3 d'estructura de dades. Tingui en compte que, com que nom\u00e9s hi ha un descriptor de clau, els camps de refer\u00e8ncia de contenidor estan prohibits.
api.doc.swagger.definitions.xml_ns4_MetadataAttributeReferenceType.description                                     = MetadataAttributeReferenceType \u00e9s un tipus per a fer refer\u00e8ncia a un objecte d'atribut de metadades. Consisteix en un URN i/o un conjunt complet de camps de refer\u00e8ncia.
api.doc.swagger.definitions.xml_ns4_MetadataAttributeRefType.description                                           = MetadataAttributeRefType cont\u00e9 una refer\u00e8ncia a un atribut de metadades dins d'una estructura d'informe en una definici\u00f3 d'estructura de metadades.
api.doc.swagger.definitions.xml_ns4_MetadataAttributeValueSetType.description                                      = MetadataAttributeValueSetType defineix l'estructura per a proporcionar valors a un atribut de metadades. Si no es proporcionen valors, l'atribut est\u00e0 impl\u00edcitament incl\u00f2s/excl\u00f2s de la regi\u00f3 en la qual est\u00e0 definit, sense tenir en compte el valor de l'atribut de metadades.
api.doc.swagger.definitions.xml_ns4_MetadataflowReferenceType.description                                          = MetadataflowReferenceType \u00e9s un tipus per a referenciar un objecte de flux de metadades. Consta d'un URN i/o un conjunt complet de camps de refer\u00e8ncia.
api.doc.swagger.definitions.xml_ns4_MetadataflowRefType.description                                                = MetadataflowRefType cont\u00e9 un conjunt de camps de refer\u00e8ncia per a un flux de metadades.
api.doc.swagger.definitions.xml_ns4_MetadataKeyType.description                                                    = MetadataKeyType \u00e9s una regi\u00f3 que defineix una clau de metadades completa o parcial distinta. La clau consisteix en un conjunt de valors, cadascun dels quals fa refer\u00e8ncia a un objecte de dest\u00ed per a l'objectiu de metadades al qual es fa refer\u00e8ncia en l'atribut metadataTarget, que ha de definir-se en l'estructura d'informe a la qual es fa refer\u00e8ncia en l'atribut report. A cada objecte de dest\u00ed se li pot assignar un \u00fanic valor. Si no s'inclou en aquesta clau un objecte de dest\u00ed de l'objectiu de metadades de refer\u00e8ncia, s'assumeix que el valor d'aquest \u00e9s tots els objectes coneguts per a un objecte de dest\u00ed de refer\u00e8ncia, totes les claus possibles per a un objecte de dest\u00ed de valors de descriptor de clau o totes les dates per a un objecte de dest\u00ed de per\u00edode d'informe. El prop\u00f2sit d'aquesta clau \u00e9s fer refer\u00e8ncia a metadades que s'ajustin a una estructura d'informe concreta per a un objecte o conjunt d'objectes determinat.
api.doc.swagger.definitions.xml_ns4_MetadataKeyValueType.description                                               = MetadataKeyValueType \u00e9s un tipus per a proporcionar un valor d'objecte de dest\u00ed amb la finalitat de definir una clau de metadades distinta. Nom\u00e9s es pot proporcionar un \u00fanic valor per a l'objecte de dest\u00ed.
api.doc.swagger.definitions.xml_ns4_MetadataStructureReferenceType.description                                     = MetadataStructureReferenceType \u00e9s un tipus per a referenciar un objecte de definici\u00f3 d'estructura de metadades. Consisteix en un URN i/o un conjunt complet de camps de refer\u00e8ncia.
api.doc.swagger.definitions.xml_ns4_MetadataStructureRefType.description                                           = MetadataStructureRefType cont\u00e9 un conjunt de camps de refer\u00e8ncia per a una definici\u00f3 d'estructura de metadades.
api.doc.swagger.definitions.xml_ns4_MetadataTargetReferenceType.description                                        = MetadataTargetReferenceType \u00e9s un tipus per a fer refer\u00e8ncia a un objecte de dest\u00ed de metadades. Consisteix en un URN i/o un conjunt complet de camps de refer\u00e8ncia.
api.doc.swagger.definitions.xml_ns4_MetadataTargetRefType.description                                              = MetadataTargetRefType cont\u00e9 una refer\u00e8ncia a un objectiu de metadades dins d'una definici\u00f3 d'estructura de metadades.
api.doc.swagger.definitions.xml_ns4_MetadataTargetRegionKeyType.description                                        = MetadataTargetRegionKeyType \u00e9s un tipus per a proporcionar un conjunt de valors per a un objecte de dest\u00ed en un objectiu de metadades d'un informe de metadades de re barra. Es pot proporcionar un conjunt de valors o un interval de temps per a un objecte de dest\u00ed d'un per\u00edode d'informe. Es pot proporcionar una col·lecci\u00f3 dels respectius tipus de refer\u00e8ncies per als objectes objectiu de refer\u00e8ncia de conjunt de dades i de refer\u00e8ncia d'objecte identificable. Per a un objecte de dest\u00ed de valors de descriptors de claus, es pot proporcionar una col·lecci\u00f3 de claus de dades.
api.doc.swagger.definitions.xml_ns4_MetadataTargetRegionType.description                                           = MetadataTargetRegionType defineix l'estructura d'una regi\u00f3 de destinaci\u00f3 de metadades. Una regi\u00f3 de destinaci\u00f3 de metadades ha de definir l'estructura de l'informe i la destinaci\u00f3 de metadades d'aquesta estructura en el qual es basa la regi\u00f3. Aquest tipus es basa en el tipus abstracte RegionType i simplement refina els valors de clau i atribut per a ajustar-se al que \u00e9s aplicable als objectes de dest\u00ed i als atributs de metadades, respectivament. Consulti la documentaci\u00f3 del tipus base per a obtenir m\u00e9s detalls sobre com es defineix una regi\u00f3.
api.doc.swagger.definitions.xml_ns4_ObjectReferenceType.description                                                = ObjectReferenceType \u00e9s una refer\u00e8ncia gen\u00e8rica que permet referenciar qualsevol objecte. El tipus d'objecte realment referenciat pot determinar-se a partir del URN o de l'atribut class del conjunt complet de camps de refer\u00e8ncia.
api.doc.swagger.definitions.xml_ns4_ObjectRefType.description                                                      = ObjectRefType cont\u00e9 un conjunt de camps de refer\u00e8ncia per a referenciar qualsevol objecte. No pot ser una refer\u00e8ncia local, per la qual cosa es requereix l'identificador d'ag\u00e8ncia. Tamb\u00e9 es requereix que es proporcioni la classe i el paquet de l'objecte referenciat, de manera que pugui construir-se una refer\u00e8ncia URN completa a partir dels valors proporcionats. Tingui en compte que aix\u00f2 no \u00e9s capaç de validar completament que se subministrin tots els camps necessaris per a una mena d'objecte donat.
api.doc.swagger.definitions.xml_ns4_ObjectTypeCodelistType.description                                             =
api.doc.swagger.definitions.xml_ns4_OrganisationRefBaseType.description                                            = OrganisationRefBaseType \u00e9s un tipus base abstracte que fa refer\u00e8ncia a una organitzaci\u00f3 des de dins d'un esquema d'organitzaci\u00f3. Els camps de refer\u00e8ncia s\u00f3n obligatoris tant per a l'esquema com per a l'organitzaci\u00f3.
api.doc.swagger.definitions.xml_ns4_OrganisationReferenceBaseType.description                                      = OrganisationReferenceBaseType \u00e9s un tipus per a referenciar qualsevol objecte d'organitzaci\u00f3, independentment del seu tipus. Consisteix en un URN i/o un conjunt complet de camps de refer\u00e8ncia.
api.doc.swagger.definitions.xml_ns4_OrganisationReferenceType.description                                          = OrganisationReferenceType fa refer\u00e8ncia a una organitzaci\u00f3 independentment del tipus espec\u00edfic. Consisteix en un URN i/o un conjunt complet de camps de refer\u00e8ncia.
api.doc.swagger.definitions.xml_ns4_OrganisationRefType.description                                                = OrganisationRefType proporciona una refer\u00e8ncia a qualsevol organitzaci\u00f3 a trav\u00e9s d'un conjunt complet de camps de refer\u00e8ncia. Es requereix que s'especifiqui la classe (\u00e9s a dir, el tipus) de l'organitzaci\u00f3 a la qual es fa refer\u00e8ncia.
api.doc.swagger.definitions.xml_ns4_OrganisationSchemeMapReferenceType.description                                 = OrganisationSchemeMapReferenceType \u00e9s un tipus per a referenciar un objecte de mapa d'esquema d'organitzaci\u00f3. Consisteix en un URN i/o un conjunt complet de camps de refer\u00e8ncia.

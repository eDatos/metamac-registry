api.doc.swagger.definitions.xml_ns5_TargetObject.description                                                       = TargetObject \u00e9s un tipus base abstracte del qual deriven tots els objectes objectiu d'un objectiu de metadades. Es basa en un component. Les implementacions d'aquest refinaran la representaci\u00f3 local perqu\u00e8 els valors permesos reflecteixin amb precisi\u00f3 la representaci\u00f3 de la refer\u00e8ncia de l'objecte de dest\u00ed.

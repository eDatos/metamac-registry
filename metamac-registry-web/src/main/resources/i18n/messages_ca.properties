api.doc.swagger.definitions.xml_ns5_ContentConstraintType.description                                              = ContentConstraintType descriu els detalls d'una restricci\u00f3 de contingut definint les regions de contingut, els conjunts de claus o la informaci\u00f3 d'alliberament dels objectes adjunts a la restricci\u00f3. Tingui en compte que si la restricci\u00f3 \u00e9s per a un proveïdor de dades, nom\u00e9s \u00e9s rellevant la informaci\u00f3 de calendari d'alliberament, ja que no hi ha forma fiable de determinar quina fam\u00edlia de claus s'est\u00e0 utilitzant per a emmarcar les restriccions en termes de regions de cub o conjunts de claus.

api.doc.swagger.definitions.xml_ns4_CodelistMapRefType.description                                                 = CodelistMapRefType cont\u00e9 un conjunt de camps de refer\u00e8ncia per a un mapa de llistats de codis.
api.doc.swagger.definitions.xml_ns4_CodelistReferenceType.description                                              = CodelistReferenceType \u00e9s un tipus per a referenciar un objecte codelist. Consisteix en un URN i/o un conjunt complet de camps de refer\u00e8ncia.
api.doc.swagger.definitions.xml_ns4_CodelistRefType.description                                                    = CodelistRefType proporciona una refer\u00e8ncia a una llista de codis a trav\u00e9s d'un conjunt complet de camps de refer\u00e8ncia.
api.doc.swagger.definitions.xml_ns4_CodeReferenceType.description                                                  = CodeReferenceType \u00e9s un tipus per a referenciar un objecte de codi. Consisteix en un URN i/o un conjunt complet de camps de refer\u00e8ncia.
api.doc.swagger.definitions.xml_ns4_CodeRefType.description                                                        = CodeRefType fa refer\u00e8ncia a un codi dins d'una llista de codis. Es requereixen camps de refer\u00e8ncia tant per a l'esquema com per a l'element.
api.doc.swagger.definitions.xml_ns4_ComponentListRefBaseType.description                                           = ComponentListRefBaseType \u00e9s un tipus base abstracte per a referenciar una llista de components dins d'una estructura.
api.doc.swagger.definitions.xml_ns4_ComponentListReferenceType.description                                         = ComponentListReferenceType \u00e9s un tipus base abstracte utilitzat per a referenciar llistes de components dins d'una estructura. Consisteix en un URN i/o un conjunt complet de camps de refer\u00e8ncia (ag\u00e8ncia d'estructura, id d'estructura, versi\u00f3 d'estructura i id de llista de components).
api.doc.swagger.definitions.xml_ns4_ComponentRefBaseType.description                                               = ComponentRefBaseType \u00e9s un tipus base abstracte per a referenciar un component contingut en una llista de components dins d'una estructura.
api.doc.swagger.definitions.xml_ns4_ComponentReferenceType.description                                             = ComponentReferenceType \u00e9s un tipus base abstracte utilitzat per a referenciar components dins d'una definici\u00f3 d'estructura. Consisteix en un URN i/o un conjunt complet de camps de refer\u00e8ncia (ag\u00e8ncia d'estructura, id d'estructura, versi\u00f3 d'estructura, id de llista de components i id de component).
api.doc.swagger.definitions.xml_ns4_ComponentValueSetType.description                                              = ComponentValueSetType \u00e9s un tipus base abstracte que s'utilitza per a proporcionar un conjunt de valor per a un component referenciat. Les implementacions d'aquest tipus es basaran en una mena de component concret i refinaran els valors permesos per a reflectir els tipus de valors que s\u00f3n possibles per a aquesta mena de component.

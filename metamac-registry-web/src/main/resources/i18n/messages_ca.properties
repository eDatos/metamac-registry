api.doc.swagger.definitions.xml_ns4_PrimaryMeasureRefType.description                                              = PrimaryMeasureRefType cont\u00e9 una refer\u00e8ncia a la mesura prim\u00e0ria dins d'una definici\u00f3 d'estructura de dades. Tingui en compte que, at\u00e8s que nom\u00e9s hi ha un descriptor de clau, els camps de refer\u00e8ncia del contenidor estan prohibits.

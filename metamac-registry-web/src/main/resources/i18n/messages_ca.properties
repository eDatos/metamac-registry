api.doc.swagger.definitions.xml_ns3_SeriesType.description                                                         = SeriesType defineix una estructura que s'utilitza per a agrupar una col·lecci\u00f3 d'observacions que tenen una clau en com\u00fa. La clau d'una s\u00e8rie \u00e9s cada dimensi\u00f3 definida en la definici\u00f3 de l'estructura de dades, excepte la dimensi\u00f3 declarada a nivell d'observaci\u00f3 per a aquest conjunt de dades. A m\u00e9s de les observacions, es poden proporcionar valors per als atributs que estan associats amb les dimensions que componen aquesta clau de s\u00e8rie (sempre que els atributs no especifiquin un annex de grup o tamb\u00e9 tinguin una relaci\u00f3 amb la dimensi\u00f3 d'observaci\u00f3). \u00e9s possible que la s\u00e8rie contingui nom\u00e9s observacions o nom\u00e9s valors d'atributs, o tots dos.

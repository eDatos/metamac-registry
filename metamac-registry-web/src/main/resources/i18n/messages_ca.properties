api.doc.swagger.definitions.xml_ns4_ContentConstraintReferenceType.description                                     = ContentConstraintReferenceType \u00e9s un tipus per a referenciar un objecte de restricci\u00f3 de contingut. Consisteix en un URN i/o un conjunt complet de camps de refer\u00e8ncia.

api.doc.swagger.definitions.xml_ns4_RefBaseType.description                                                        = RefBaseType \u00e9s un tipus base abstracte que defineix la base per a qualsevol conjunt de camps de refer\u00e8ncia complets. Ha de ser refinat per tipus derivats perqu\u00e8 nom\u00e9s els camps necessaris estiguin disponibles i es requereixin segons sigui necessari. Pot utilitzar-se tant per a refer\u00e8ncies completes com locals (quan alguns dels valors estan impl\u00edcits des d'un altre context). Una refer\u00e8ncia local s'indica amb l'atribut local. Els valors d'aquest tipus corresponen directament als components de l'estructura URN, per la qual cosa poden utilitzar-se per a compondre un URN quan el valor de l'atribut local \u00e9s fals. Com aquest \u00e9s el cas, qualsevol component de refer\u00e8ncia que no formi part de l'estructura URN no ha de ser present en els tipus derivats.

api.doc.swagger.definitions.xml_ns5_DataConsumerSchemeType.description                                             = DataConsumerSchemeType defineix un tipus d'esquema d'organitzaci\u00f3 que cont\u00e9 \u00fanicament consumidors de dades. L'esquema de consumidors de dades mantingut per una determinada ag\u00e8ncia de manteniment sempre rep un identificador i una versi\u00f3 fixos, i mai \u00e9s definitiu. Per tant, es poden afegir o eliminar consumidors sense haver de versionar l'esquema. Aquest esquema no t\u00e9 jerarquia, cosa que significa que cap organitzaci\u00f3 pot definir una relaci\u00f3 amb una altra organitzaci\u00f3 en l'esquema.
api.doc.swagger.definitions.xml_ns5_DataConsumerType.description                                                   = DataConsumerType defineix l'estructura de la descripci\u00f3 d'un consumidor de dades. Els contactes definits per a l'organitzaci\u00f3 s\u00f3n espec\u00edfics de la funci\u00f3 de consumidor de dades que exerceix l'organitzaci\u00f3.
api.doc.swagger.definitions.xml_ns5_DataflowType.description                                                       = DataflowType descriu l'estructura d'un flux de dades. Un flux de dades es defineix com l'estructura de dades que es proporcionar\u00e0 per a diferents per\u00edodes de refer\u00e8ncia. Si no es fa refer\u00e8ncia a aquest tipus externament, ha de proporcionar-se una refer\u00e8ncia a la definici\u00f3 d'una gamma de claus.
api.doc.swagger.definitions.xml_ns5_DataKeySetType.description                                                     = DataKeySetType defineix una col·lecci\u00f3 de claus de dades completes o parcials (valors de dimensi\u00f3).
api.doc.swagger.definitions.xml_ns5_DataProviderSchemeType.description                                             = DataProviderSchemeType defineix un tipus d'esquema d'organitzaci\u00f3 que cont\u00e9 \u00fanicament proveïdors de dades. L'esquema de proveïdors de dades mantingut per una determinada ag\u00e8ncia de manteniment sempre rep un identificador i una versi\u00f3 fixos, i mai \u00e9s definitiu. Per tant, es poden afegir o eliminar proveïdors sense haver de versionar l'esquema. Aquest esquema no t\u00e9 jerarquia, cosa que significa que cap organitzaci\u00f3 pot definir una relaci\u00f3 amb una altra organitzaci\u00f3 en l'esquema
api.doc.swagger.definitions.xml_ns5_DataProviderType.description                                                   = DataProviderType defineix l'estructura de la descripci\u00f3 d'un proveïdor de dades. Els contactes definits per a l'organitzaci\u00f3 s\u00f3n espec\u00edfics de la funci\u00f3 de proveïdor de dades que exerceix l'organitzaci\u00f3.
api.doc.swagger.definitions.xml_ns5_DataSetRepresentationType.description                                          = DataSetRepresentationType defineix les possibles representacions locals d'un objecte de dest\u00ed de refer\u00e8ncia de conjunt de dades. La representaci\u00f3 es fixa perqu\u00e8 sigui sempre una refer\u00e8ncia a un conjunt de dades.
api.doc.swagger.definitions.xml_ns5_DataSetTargetType.description                                                  = DataSetTargetType defineix l'estructura d'un objecte de dest\u00ed de conjunt de dades. L'objecte de dest\u00ed del conjunt de dades t\u00e9 una representaci\u00f3 i un identificador fixos.
api.doc.swagger.definitions.xml_ns5_DataSetTextFormatType.description                                              = DataSetTextFormatType \u00e9s una versi\u00f3 restringida de NonFacetedTextFormatType que especifica una representaci\u00f3 fixa de DataSetReference.
api.doc.swagger.definitions.xml_ns5_DataStructureRepresentationType.description                                    = DataStructureRepresentationType \u00e9s un tipus base abstracte que defineix les representacions permeses per a qualsevol component de definici\u00f3 d'estructura de dades. L'enumeraci\u00f3 ha de restringir-se al tipus adequat per a l'esquema d'elements d'un component determinat.
api.doc.swagger.definitions.xml_ns5_DataStructureType.description                                                  = DataStructureType descriu l'estructura d'una definici\u00f3 d'estructura de dades. Una definici\u00f3 d'estructura de dades es defineix com una col·lecci\u00f3 de conceptes de metadades, la seva estructura i el seu \u00fas quan s'utilitzen per a recopilar o difondre dades.
api.doc.swagger.definitions.xml_ns5_DimensionListBaseType.description                                              = DimensionListBaseType \u00e9s un tipus base abstracte utilitzat com a base per a DimensionListType.
api.doc.swagger.definitions.xml_ns5_DimensionListType.description                                                  = DimensionListType descriu el descriptor de clau d'una definici\u00f3 d'estructura de dades. L'ordre de la declaraci\u00f3 de les dimensions secund\u00e0ries \u00e9s significatiu: s'utilitza per a descriure l'ordre en qu\u00e8 apareixeran en els formats de dades per als quals se subministren valors clau de forma ordenada (exclosa la dimensi\u00f3 temporal, que no es representa com a membre de la clau ordenada). Tota definici\u00f3 d'estructura de dades que utilitzi la dimensi\u00f3 temps ha de declarar tamb\u00e9 una dimensi\u00f3 freqü\u00e8ncia, convencionalment la primera dimensi\u00f3 de la clau (el conjunt de dimensions no temporals ordenades). No \u00e9s necessari assignar una dimensi\u00f3 temporal, ja que les dades poden organitzar-se com es desitgi.
api.doc.swagger.definitions.xml_ns5_DimensionListType.properties.Dimension.description                             =
api.doc.swagger.definitions.xml_ns5_DimensionListType.properties.MeasureDimension.description                      =
api.doc.swagger.definitions.xml_ns5_DimensionListType.properties.TimeDimension.description                         =
api.doc.swagger.definitions.xml_ns5_DimensionType.description                                                      = DimensionType descriu l'estructura d'una dimensi\u00f3 ordin\u00e0ria, que es defineix com un concepte estad\u00edstic utilitzat (molt probablement juntament amb altres conceptes estad\u00edstics) per a identificar una s\u00e8rie estad\u00edstica, com una s\u00e8rie temporal, per exemple, un concepte estad\u00edstic que indica una determinada activitat econ\u00f2mica o una zona geogr\u00e0fica de refer\u00e8ncia. La dimensi\u00f3 pren la seva sem\u00e0ntica, i en alguns casos la seva representaci\u00f3, de la identitat del seu concepte. Una dimensi\u00f3 pot codificar-se fent refer\u00e8ncia a una llista de codis a partir de la seva representaci\u00f3 local codificada. Tamb\u00e9 pot especificar el seu format de text, que s'utilitza com a representaci\u00f3 de la dimensi\u00f3 si no es defineix una representaci\u00f3 codificada. Ni la representaci\u00f3 codificada ni la no codificada s\u00f3n necess\u00e0ries, ja que la dimensi\u00f3 pot prendre-les del concepte referenciat.
api.doc.swagger.definitions.xml_ns5_GroupBaseType.description                                                      = GroupBaseType \u00e9s un tipus base abstracte que constitueix la base de GroupType.
api.doc.swagger.definitions.xml_ns5_GroupDimensionBaseType.description                                             = GroupDimensionBaseType \u00e9s un tipus base abstracte que refina el ComponentType base per a formar la base del GroupDimensionType.
api.doc.swagger.definitions.xml_ns5_GroupDimensionType.description                                                 = GroupDimensionType defineix un component de dimensi\u00f3 amb una llista de components de descriptor de clau de grup. Encara que t\u00e8cnicament \u00e9s un component, es tracta essencialment d'una refer\u00e8ncia a una dimensi\u00f3 definida en el descriptor de clau. Per tant, les propietats d'identificaci\u00f3, nom i descripci\u00f3, identitat de concepte i representaci\u00f3 que solen estar disponibles per a un component no estan permeses aqu\u00ed, ja que totes s'hereten de la dimensi\u00f3 referenciada.
api.doc.swagger.definitions.xml_ns5_GroupType.description                                                          = GroupType descriu l'estructura d'un descriptor de grup en una definici\u00f3 d'estructura de dades. Un grup pot consistir en una clau parcial o una col·lecci\u00f3 de regions de cubs o conjunts de claus distints als que es poden adjuntar atributs. El prop\u00f2sit d'un grup \u00e9s especificar valors d'atributs que tenen el mateix valor basat en alguna dimensionalitat comuna. Tots els grups declarats en l'estructura de dades han de ser \u00fanics - \u00e9s a dir, no es poden tenir claus parcials duplicades. Tots els grups han de tenir identificadors \u00fanics.

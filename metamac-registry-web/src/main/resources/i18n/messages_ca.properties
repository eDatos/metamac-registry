api.doc.swagger.definitions.xml_ns5_HierarchicalCodeType.description                                               = HierarchicalCodeType descriu l'estructura d'un codi jer\u00e0rquic. Un codi jer\u00e0rquic proporciona una refer\u00e8ncia a un codi al qual es fa refer\u00e8ncia dins de la llista de codis jer\u00e0rquics mitjançant una refer\u00e8ncia completa a un codi a trav\u00e9s d'un URN o un conjunt complet de camps de refer\u00e8ncia, o una refer\u00e8ncia local que utilitza l'\u00e0lies de refer\u00e8ncia de la llista de codis inclosa i la identificaci\u00f3 d'un codi de la llista. Els codis s'ordenen jer\u00e0rquicament segons aquesta refer\u00e8ncia. Noti's que \u00e9s possible referenciar un \u00fanic codi de manera que tingui m\u00faltiples pares dins de la jerarquia. A m\u00e9s, la jerarquia pot o no estar anivellada.

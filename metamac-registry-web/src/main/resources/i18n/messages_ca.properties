api.doc.swagger.definitions.xml_ns8_TimeSeriesDataSetType.description                                              = TimeSeriesDataSetType \u00e9s el tipus abstracte que defineix l'estructura base per a qualsevol definici\u00f3 d'estructura de dades espec\u00edfica basada en s\u00e8ries temporals. Es crear\u00e0 un tipus de conjunt de dades derivat espec\u00edfic per a una definici\u00f3 d'estructura de dades. A difer\u00e8ncia del format base, nom\u00e9s es permet una variaci\u00f3 d'aquest per a una definici\u00f3 d'estructura de dades. Aquesta variaci\u00f3 \u00e9s la dimensi\u00f3 temporal com a dimensi\u00f3 d'observaci\u00f3. Les dades s'organitzen en una col·lecci\u00f3 de s\u00e8ries temporals. At\u00e8s que aquesta derivaci\u00f3 s'aconsegueix mitjançant restricci\u00f3, els conjunts de dades que s'ajustin a aquest tipus tamb\u00e9 s'ajustaran inherentment a l'estructura del conjunt de dades base. De fet, l'estructura de dades espec\u00edfica aqu\u00ed ser\u00e0 id\u00e8ntica a les dades del conjunt de dades base quan la dimensi\u00f3 temporal sigui la dimensi\u00f3 d'observaci\u00f3, fins i tot per als tipus de conjunts de dades derivades. Aix\u00f2 significa que les dades contingudes en aquesta estructura poden processar-se exactament de la mateixa manera que l'estructura base. A aquest conjunt de dades especialitzat se li apliquen les mateixes regles de derivaci\u00f3 que al tipus de conjunt de dades base.
api.doc.swagger.definitions.xml_ns8_TimeSeriesObsType.description                                                  = TimeSeriesObsType defineix l'estructura abstracta d'una observaci\u00f3 de s\u00e8ries temporals. S'ha de proporcionar a l'observaci\u00f3 un valor per a la dimensi\u00f3 temporal. Aquest valor temporal ha de desambiguar l'observaci\u00f3 dins de la s\u00e8rie en la qual es defineix (\u00e9s a dir, no ha d'haver-hi una altra observaci\u00f3 amb el mateix valor temporal). L'observaci\u00f3 pot contenir un valor observat i/o valors d'atribut. A aquesta observaci\u00f3 especialitzada se li apliquen les mateixes regles de derivaci\u00f3 que al tipus d'observaci\u00f3 basi.
api.doc.swagger.definitions.xml_ns8_TimeSeriesType.description                                                     = TimeSeriesType defineix una estructura abstracta que s'utilitza per a agrupar una col·lecci\u00f3 d'observacions que tenen una clau en com\u00fa, organitzades per temps. La clau d'una s\u00e8rie \u00e9s cadascuna de les dimensions definides en la definici\u00f3 de l'estructura de dades, excepte la dimensi\u00f3 temps. A m\u00e9s de les observacions, es poden proporcionar valors per als atributs associats a les dimensions que componen la clau de la s\u00e8rie (sempre que els atributs no especifiquin un annex de grup ni tinguin relaci\u00f3 amb la dimensi\u00f3 temporal). \u00e9s possible que la s\u00e8rie contingui nom\u00e9s observacions o nom\u00e9s valors d'atributs, o totes dues coses. A aquesta s\u00e8rie especialitzada se li apliquen les mateixes regles de derivaci\u00f3 que al tipus de s\u00e8rie base.
api.doc.swagger.definitions.xml_ns9_MetadataSetType.description                                                    = MetadataSetType \u00e9s un tipus base abstracte que forma la base per a un conjunt de metadades espec\u00edfic de l'estructura de metadades. Est\u00e0 restringit per l'esquema espec\u00edfic de definici\u00f3 de l'estructura de metadades per a satisfer les seves necessitats.

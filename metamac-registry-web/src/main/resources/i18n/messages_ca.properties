api.doc.swagger.definitions.xml_ns5_LevelType.description                                                          = LevelType descriu un nivell en una llista jer\u00e0rquica de codis. El nivell es defineix com un grup en el qual els codis poden caracteritzar-se per una codificaci\u00f3 homog\u00e8nia, i en el qual el pare de cada codi del grup es troba en el mateix nivell superior de la jerarquia.

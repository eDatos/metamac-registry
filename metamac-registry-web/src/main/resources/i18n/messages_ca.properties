api.doc.swagger.definitions.xml_ns5_StructureType.description                                                      = StructureType \u00e9s un tipus base abstracte per a tots els objectes d'estructura. Les inst\u00e0ncies concretes d'aquest han de restringir-se a una agrupaci\u00f3 concreta.

api.doc.swagger.definitions.xml_ns5_ReportingCategoryBaseType.description                                          = ReportingCategoryBaseType \u00e9s un tipus base abstracte que serveix de base per a ReportingCategoryType.
api.doc.swagger.definitions.xml_ns5_ReportingCategoryMapType.description                                           = ReportingCategoryMapType defineix l'estructura per a mapear dues categories d'informes. Es proporciona una refer\u00e8ncia local tant a la categoria d'origen com a la de destinaci\u00f3.
api.doc.swagger.definitions.xml_ns5_ReportingCategoryType.description                                              = ReportingCategoryType descriu l'estructura d'una categoria d'informes, que agrupa els usos de l'estructura en subpaquetes \u00fatils. Dins de la definici\u00f3 de la categoria es poden niar subcategories d'informes.
api.doc.swagger.definitions.xml_ns5_ReportingCategoryType.properties.ProvisioningMetadata.description              =
api.doc.swagger.definitions.xml_ns5_ReportingCategoryType.properties.StructuralMetadata.description                =
api.doc.swagger.definitions.xml_ns5_ReportingTaxonomyMapType.description                                           = ReportingTaxonomyMapType defineix l'estructura d'un mapa que identifica les relacions entre les categories d'informes en diferents taxonomies d'informes.
api.doc.swagger.definitions.xml_ns5_ReportingTaxonomyType.description                                              = ReportingTaxonomyType descriu l'estructura d'una taxonomia d'informes, que \u00e9s un esquema que defineix l'estructura de composici\u00f3 d'un informe de dades en el qual cada component pot descriure's mitjançant una estructura independent o una descripci\u00f3 d'\u00fas d'estructura.
api.doc.swagger.definitions.xml_ns5_ReportingYearStartDayRepresentationType.description                            = ReportingYearStartDayRepresentationType defineix la representaci\u00f3 de l'atribut del dia d'inici de l'any de l'informe. No es permeten valors enumerats i el format de text es fixa en un dia i un mes en el format ISO 8601 de '--MM-DD'.
api.doc.swagger.definitions.xml_ns5_ReportingYearStartDayTextFormatType.description                                = ReportingYearStartDayTextFormatType \u00e9s una versi\u00f3 restringida del NonFacetedTextFormatType que fixa el valor del tipus de text en DayMonth. Aquest tipus existeix \u00fanicament amb la finalitat de fixar la representaci\u00f3 de l'atribut del dia d'inici de l'any de l'informe.
api.doc.swagger.definitions.xml_ns5_ReportingYearStartDayType.description                                          = ReportingYearStartDayType defineix l'estructura de l'atribut de dia d'inici de l'any de refer\u00e8ncia. L'atribut de l'any d'inici del dia de l'informe presa la seva sem\u00e0ntica del seu concepte d'identitat (normalment el concepte REPORTING_YEAR_START_DAY), encara que sempre t\u00e9 un identificador fix (REPORTING_YEAR_START_DAY). L'atribut REPORTING_YEAR_START_DAY sempre t\u00e9 un format de text fix, que especifica que el format del seu valor \u00e9s sempre un dia i un mes en el format ISO 8601 de Â«--MM-DDÂ». Igual que amb qualsevol altre atribut, ha d'especificar-se una relaci\u00f3 d'atribut. Aquesta relaci\u00f3 ha de seleccionar-se acuradament, ja que determinar\u00e0 quin tipus de dades permetr\u00e0 la definici\u00f3 de l'estructura de dades. Per exemple, si no s'especifica cap relaci\u00f3 d'atribut, els conjunts de dades que s'ajustin a aquesta definici\u00f3 d'estructura de dades nom\u00e9s podran contenir dades amb per\u00edodes de refer\u00e8ncia est\u00e0ndard en els quals tots els per\u00edodes de refer\u00e8ncia tinguin el mateix dia d'inici. En aquest cas, les dades notificades com a per\u00edodes d'informaci\u00f3 est\u00e0ndard de dues entitats amb dies d'inici d'exercici diferents no podrien estar continguts en el mateix conjunt de dades.
api.doc.swagger.definitions.xml_ns5_ReportPeriodRepresentationType.description                                     = ReportPeriodRepresentationType defineix les possibles representacions locals d'un objecte objectiu de per\u00edode d'informe. La representaci\u00f3 ha de ser un per\u00edode de temps o un subconjunt d'aquesta representaci\u00f3.
api.doc.swagger.definitions.xml_ns5_ReportPeriodTargetType.description                                             = ReportPeriodTargetType defineix l'estructura d'un objecte objectiu de per\u00edode d'informe. L'objecte de dest\u00ed de per\u00edode d'informe t\u00e9 una representaci\u00f3 i un identificador fixos.
api.doc.swagger.definitions.xml_ns5_ReportStructureBaseType.description                                            = ReportStructureBaseType \u00e9s un tipus base abstracte que serveix de base per al tipus complex ReportStructureType.
api.doc.swagger.definitions.xml_ns5_ReportStructureType.description                                                = ReportStructureType descriu l'estructura d'una estructura d'informe. Compr\u00e8n un conjunt d'atributs de metadades que poden definir-se com una jerarquia, i identifica la possible vinculaci\u00f3 d'aquests atributs a un objecte mitjançant la refer\u00e8ncia a un identificador de dest\u00ed.
api.doc.swagger.definitions.xml_ns5_ReportStructureType.properties.MetadataTarget.description                      =
api.doc.swagger.definitions.xml_ns5_RepresentationMapType.description                                              = RepresentationMapType descriu l'estructura de l'assignaci\u00f3 del valor d'un component d'origen a un component de destinaci\u00f3. Ha de proporcionar-se una refer\u00e8ncia a un altre mapa definit dins del conjunt d'estructures que el cont\u00e9 o una descripci\u00f3 dels formats de text d'origen i destinaci\u00f3. Tingui en compte que, per als components de la gamma de claus, nom\u00e9s \u00e9s rellevant una refer\u00e8ncia a un mapa de llista de codis, ja que \u00e9s l'\u00fanic tipus de representaci\u00f3 codificada perm\u00e8s en una gamma de claus.

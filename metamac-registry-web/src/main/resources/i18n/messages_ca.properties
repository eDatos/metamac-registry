api.doc.swagger.definitions.xml_ns5_SimpleComponentTextFormatType.description                                      = SimpleComponentTextFormatType \u00e9s una versi\u00f3 restringida de BasicComponentTextFormatType que no permet valors multilingües.
api.doc.swagger.definitions.xml_ns5_SimpleDataStructureRepresentationType.description                              = SimpleDataStructureRepresentationType defineix la representaci\u00f3 per a qualsevol component de definici\u00f3 d'estructura de dades sense dimensi\u00f3 de mesura ni de temps.
api.doc.swagger.definitions.xml_ns5_StructureMapBaseType.description                                               = StructureMapBaseType \u00e9s un tipus base abstracte que constitueix la base de StructureMapType.
api.doc.swagger.definitions.xml_ns5_StructureMapType.description                                                   = StructureMapType defineix l'estructura per a assignar components d'una estructura a components d'una altra estructura. Una estructura pot ser referenciada directament, cosa que significa que el mapa s'aplica on es vulgui que s'utilitzi l'estructura, o pot ser una refer\u00e8ncia a trav\u00e9s de l'\u00fas d'una estructura, cosa que significa que el mapa nom\u00e9s s'aplica en el context d'aquest \u00fas. Utilitzant les estructures relacionades, es poden fer extrapolacions entre mapes. Per exemple, si les fam\u00edlies de claus A, B i C estan agrupades en un contenidor d'estructures relacionades, es pot utilitzar un mapa de la fam\u00edlia de claus A a la C i un mapa de la fam\u00edlia de claus B a la C per a inferir una relaci\u00f3 entre la fam\u00edlia de claus A i la C.

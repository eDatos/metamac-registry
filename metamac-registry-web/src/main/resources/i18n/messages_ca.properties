api.doc.swagger.definitions.xml_ns5_MetadataflowType.description                                                   = MetadataflowType descriu l'estructura d'un flux de metadades. Un flux de dades es defineix com l'estructura de metadades de refer\u00e8ncia que es proporcionar\u00e0 per a diferents per\u00edodes de refer\u00e8ncia. Si no es fa refer\u00e8ncia a aquest tipus externament, haur\u00e0 de proporcionar-se una refer\u00e8ncia a una definici\u00f3 d'estructura de metadades
api.doc.swagger.definitions.xml_ns5_MetadataKeySetType.description                                                 = MetadataKeySetType defineix una col·lecci\u00f3 de claus de metadades (valors de component identificador).
api.doc.swagger.definitions.xml_ns5_MetadataStructureType.description                                              = MetadataStructureType s'utilitza per a descriure una definici\u00f3 d'estructura de metadades, que es defineix com una col·lecci\u00f3 de conceptes de metadades, la seva estructura i \u00fas quan s'utilitza per a recopilar o difondre metadades de refer\u00e8ncia.
api.doc.swagger.definitions.xml_ns5_MetadataTargetBaseType.description                                             = MetadataTargetBaseType \u00e9s un tipus base abstracte que constitueix la base de MetadataTargetType.

api.doc.swagger.definitions.xml_ns5_HierarchicalCodelistBaseType.description                                       = HierarchicalCodelistBaseType \u00e9s una classe base abstracta que \u00e9s la base per a HierarchicalCodelistType. Requereix que es proporcioni un nom.
api.doc.swagger.definitions.xml_ns5_HierarchicalCodelistType.description                                           = HierarchicalCodelistType descriu l'estructura d'una llista jer\u00e0rquica de codis. Una llista jer\u00e0rquica de codis es defineix com una col·lecci\u00f3 organitzada de codis que poden participar en moltes relacions pare/fill amb altres codis de la llista, segons el definit per una o m\u00e9s jerarquies de la llista.

api.doc.swagger.definitions.xml_ns5_BaseDimensionBaseType.description                                              = BaseDimensionBaseType \u00e9s un tipus base abstracte que serveix de base per a qualsevol dimensi\u00f3. Restringeix la base de format de text a un format de text v\u00e0lid per a components de dades (que no permet la representaci\u00f3 XHTML).
api.doc.swagger.definitions.xml_ns5_BaseDimensionType.description                                                  = BaseDimensionType \u00e9s un tipus base abstracte que defineix l'estructura b\u00e0sica de totes les dimensions.

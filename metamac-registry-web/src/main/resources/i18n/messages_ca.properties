api.doc.swagger.definitions.xml_ns4_AnnotationsType.description                                                    = AnnotationsType proporciona una llista d'anotacions que s'adjuntaran als missatges de dades i estructures.
api.doc.swagger.definitions.xml_ns4_AnnotationsType.properties.Annotation.description                              =
api.doc.swagger.definitions.xml_ns4_AnnotationType.description                                                     = AnnotationType permet incrustar notes i anotacions no documentals en missatges de dades i estructures. Proporciona camps opcionals per a proporcionar un t\u00edtol, una descripci\u00f3 del tipus, un URI i el text de l'anotaci\u00f3.

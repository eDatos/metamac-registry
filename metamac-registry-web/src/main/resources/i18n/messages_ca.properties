api.doc.swagger.definitions.xml_ns5_BasicComponentTextFormatType.description                                       = BasicComponentTextFormatType \u00e9s una versi\u00f3 restringida de TextFormatType que restringeix el tipus de text a les representacions permeses per a tots els components excepte per als objectes de dest\u00ed.
api.doc.swagger.definitions.xml_ns5_CategorisationType.description                                                 = CategorisationType \u00e9s defineix l'estructura per a una categoritzaci\u00f3. Es fa refer\u00e8ncia a un objecte d'origen a trav\u00e9s d'una refer\u00e8ncia d'objecte i a la categoria de dest\u00ed a trav\u00e9s de la categoria de dest\u00ed.

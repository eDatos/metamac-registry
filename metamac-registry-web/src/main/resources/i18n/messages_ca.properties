api.doc.swagger.definitions.xml_ns3_GroupType.description                                                          = GroupType defineix una estructura que s'utilitza per a comunicar valors d'atributs per a un grup definit en una definici\u00f3 d'estructura de dades. El grup pot consistir en un subconjunt de les dimensions definides per la definici\u00f3 de l'estructura de dades, o en una associaci\u00f3 a una restricci\u00f3 d'adjunt, que al seu torn defineix conjunts de claus als quals es poden adjuntar atributs. En el cas que el grup es base en una restricci\u00f3 de vinculaci\u00f3, nom\u00e9s es proporciona la identificaci\u00f3 del grup. S'espera que un sistema que estigui processant aix\u00f2 relacioni aquest identificador amb els conjunts de claus definits en la restricci\u00f3 i aplicaci\u00f3 els valors proporcionats per als atributs de manera apropiada.

api.doc.swagger.definitions.xml_ns4_CubeRegionKeyType.description                                                  = CubeRegionKeyType \u00e9s un tipus per a proporcionar un conjunt de valors per a una dimensi\u00f3 amb la finalitat de definir una regi\u00f3 de cub de dades. Es pot proporcionar un conjunt de valors distints o, si aquesta dimensi\u00f3 es representa com a temps, es pot especificar un interval de temps.
api.doc.swagger.definitions.xml_ns4_CubeRegionType.description                                                     = CubeRegionType defineix l'estructura d'una regi\u00f3 de cub de dades. Es basa en el tipus abstracte RegionType i simplement refina els valors de clau i atribut per a ajustar-se al que \u00e9s aplicable per a dimensions i atributs, respectivament. Consulti la documentaci\u00f3 del tipus base per a m\u00e9s detalls sobre com es defineix una regi\u00f3.
api.doc.swagger.definitions.xml_ns4_DataConsumerReferenceType.description                                          = DataConsumerReferenceType \u00e9s un tipus per a referenciar un consumidor de dades. Consisteix en un URN i/o un conjunt complet de camps de refer\u00e8ncia.
api.doc.swagger.definitions.xml_ns4_DataConsumerRefType.description                                                = DataConsumerRefType cont\u00e9 un conjunt de camps de refer\u00e8ncia per a referenciar un consumidor de dades dins d'un esquema de consumidor de dades.
api.doc.swagger.definitions.xml_ns4_DataConsumerSchemeReferenceType.description                                    = DataConsumerSchemeReferenceType \u00e9s un tipus per a referenciar un objecte d'esquema de consumidor de dades. Consisteix en un URN i/o un conjunt complet de camps de refer\u00e8ncia.
api.doc.swagger.definitions.xml_ns4_DataConsumerSchemeRefType.description                                          = DataConsumerSchemeRefType cont\u00e9 un conjunt de camps de refer\u00e8ncia per a un esquema de consumidor de dades.
api.doc.swagger.definitions.xml_ns4_DataflowReferenceType.description                                              = DataflowReferenceType \u00e9s un tipus per a referenciar un objecte de flux de dades. Consisteix en un URN i/o un conjunt complet de camps de refer\u00e8ncia.
api.doc.swagger.definitions.xml_ns4_DataflowRefType.description                                                    = DataflowRefType cont\u00e9 un conjunt de camps de refer\u00e8ncia per a un flux de dades.
api.doc.swagger.definitions.xml_ns4_DataKeyType.description                                                        = DataKeyType \u00e9s una regi\u00f3 que defineix una clau de dades completa o parcial distinta. La clau consisteix en un conjunt de valors, cadascun dels quals fa refer\u00e8ncia a una dimensi\u00f3 i proporciona un \u00fanic valor per a aquesta dimensi\u00f3. El prop\u00f2sit de la clau \u00e9s definir un subconjunt d'un conjunt de dades (\u00e9s a dir, el valor observat i l'atribut de dades) que tenen els valors de dimensi\u00f3 proporcionats en aquesta definici\u00f3. Se suposa que qualsevol dimensi\u00f3 no indicada expl\u00edcitament en aquesta clau \u00e9s comod\u00ed, la qual cosa permet la definici\u00f3 de claus de dades parcials.
api.doc.swagger.definitions.xml_ns4_DataKeyValueType.description                                                   = DataKeyValueType \u00e9s un tipus per a proporcionar un valor de dimensi\u00f3 amb la finalitat de definir una clau de dades distinta. Nom\u00e9s es pot proporcionar un \u00fanic valor per a la dimensi\u00f3.
api.doc.swagger.definitions.xml_ns4_DataProviderReferenceType.description                                          = DataProviderReferenceType \u00e9s un tipus per a fer refer\u00e8ncia a un proveïdor de dades. Consisteix en un URN i/o un conjunt complet de camps de refer\u00e8ncia.
api.doc.swagger.definitions.xml_ns4_DataProviderRefType.description                                                = DataProviderRefType cont\u00e9 un conjunt de camps de refer\u00e8ncia per a fer refer\u00e8ncia a un proveïdor de dades dins d'un esquema de proveïdor de dades.
api.doc.swagger.definitions.xml_ns4_DataProviderSchemeReferenceType.description                                    = DataProviderSchemeReferenceType \u00e9s un tipus per a referenciar un objecte d'esquema de proveïdor de dades. Consisteix en un URN i/o un conjunt complet de camps de refer\u00e8ncia.
api.doc.swagger.definitions.xml_ns4_DataProviderSchemeRefType.description                                          = DataProviderSchemeRefType cont\u00e9 un conjunt de camps de refer\u00e8ncia per a un esquema de proveïdor de dades.
api.doc.swagger.definitions.xml_ns4_DataSetTargetReferenceType.description                                         = DataSetTargetReferenceType \u00e9s un tipus per a fer refer\u00e8ncia a un objecte de dest\u00ed de conjunt de dades. Consisteix en un URN i/o un conjunt complet de camps de refer\u00e8ncia.
api.doc.swagger.definitions.xml_ns4_DataSetTargetRefType.description                                               = DataSetTargetRefType cont\u00e9 una refer\u00e8ncia a un objectiu de conjunt de dades dins d'un objectiu de metadades d'una definici\u00f3 d'estructura de dades.
api.doc.swagger.definitions.xml_ns4_DataStructureEnumerationSchemeReferenceType.description                        = DataStructureEnumerationSchemeReferenceType \u00e9s un tipus per a referenciar qualsevol tipus d'esquema d'element que sigui admissible com a enumeraci\u00f3 de la representaci\u00f3 d'un component de definici\u00f3 d'estructura de dades. Consisteix en un URN i/o un conjunt complet de camps de refer\u00e8ncia.

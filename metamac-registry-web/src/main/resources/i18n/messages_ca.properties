api.doc.swagger.definitions.xml_ns3_StructureSpecificDataHeaderType.description                                    = StructureSpecificDataHeaderType defineix l'estructura de capçalera per a un missatge de dades d'estructura espec\u00edfica.
api.doc.swagger.definitions.xml_ns3_StructureSpecificDataType.description                                          = StructureSpecificDataType defineix l'estructura del missatge de dades espec\u00edfiques de l'estructura. Tingui en compte que el tipus de c\u00e0rrega \u00fatil del conjunt de dades \u00e9s abstracte, per la qual cosa haur\u00e0 d'assignar-se-li un tipus en una inst\u00e0ncia. Aquest tipus ha de derivar-se del tipus base referenciat. Aquest tipus base defineix una estructura general que pot seguir-se per a permetre el processament gen\u00e8ric de les dades encara que no es coneguin els detalls exactes del format espec\u00edfic de l'estructura de dades.
api.doc.swagger.definitions.xml_ns3_StructureSpecificMetadataHeaderType.description                                = StructureSpecificMetadataHeaderType defineix el format de capçalera per als missatges de metadades de refer\u00e8ncia espec\u00edfics de definici\u00f3 d'estructura de metadades.
api.doc.swagger.definitions.xml_ns3_StructureSpecificMetadataType.description                                      = StructureSpecificMetadataType defineix l'estructura d'un missatge de metadades espec\u00edfic de l'estructura. Tingui en compte que el tipus de c\u00e0rrega \u00fatil del conjunt de metadades \u00e9s abstracte, per la qual cosa haur\u00e0 d'assignar-se-li un tipus en una inst\u00e0ncia. Aquest tipus ha de derivar-se del tipus base referenciat. Aquest tipus base defineix una estructura general que pot seguir-se per a permetre el processament gen\u00e8ric de les dades encara que no es coneguin els detalls exactes del format espec\u00edfic de l'estructura de dades.

api.doc.swagger.definitions.xml_ns5_RepresentationType.description                                                 = RepresentationType \u00e9s un tipus abstracte que defineix una representaci\u00f3. Pel fet que el tipus d'esquemes d'elements que es permeten com una enumeraci\u00f3 varien en funci\u00f3 de l'objecte en el qual es defineix, aquest tipus \u00e9s abstracte per a obligar al fet que la refer\u00e8ncia d'enumeraci\u00f3 es restringeixi al tipus adequat de refer\u00e8ncia d'esquema d'elements.

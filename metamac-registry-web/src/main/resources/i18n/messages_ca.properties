api.doc.swagger.definitions.xml_ns5_StructureSetBaseType.description                                               = StructureSetBaseType \u00e9s un tipus base abstracte que constitueix la base de StructureSetType.
api.doc.swagger.definitions.xml_ns5_StructureSetType.description                                                   = StructureSetType descriu l'estructura d'un conjunt d'estructures. Permet que els components d'una estructura, una utilitzaci\u00f3 d'estructura o un esquema d'elements s'assignin a components d'un altre component estructural del mateix tipus.

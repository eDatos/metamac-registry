api.doc.swagger.definitions.xml_ns5_AttributeType.description                                                      = AttributeType descriu l'estructura d'un atribut de dades, que es defineix com una caracter\u00edstica d'un objecte o entitat. L'atribut pren la seva sem\u00e0ntica, i en alguns casos la seva representaci\u00f3, de la seva identitat conceptual. Un atribut pot codificar-se fent refer\u00e8ncia a una llista de codis de la seva representaci\u00f3 local codificada. Tamb\u00e9 pot especificar el seu format de text, que s'utilitza com a representaci\u00f3 de l'atribut si no es defineix una representaci\u00f3 codificada. Ni la representaci\u00f3 codificada ni la no codificada s\u00f3n necess\u00e0ries, ja que l'atribut pot prendre-les del concepte referenciat. Un atribut especifica la seva relaci\u00f3 amb altres components de l'estructura de dades i rep un estat d'assignaci\u00f3. Aquestes dues propietats dicten en quina part d'un missatge de dades s'adjuntar\u00e0 l'atribut, i si es requerir\u00e0 o no que se li doni un valor. A l'atribut se li pot assignar un conjunt de rols definits en l'esquema del concepte.

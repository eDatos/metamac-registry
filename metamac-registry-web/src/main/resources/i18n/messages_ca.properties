api.doc.swagger.definitions.xml_ns5_MeasureDimensionRepresentationType.description                                 = BaseDimensionRepresentationType \u00e9s una base abstracta que defineix la representaci\u00f3 per a una dimensi\u00f3 de mesura.
api.doc.swagger.definitions.xml_ns5_MeasureDimensionType.description                                               = MeasureDimensionType defineix l'estructura de la dimensi\u00f3 mesurada. Es deriva de l'estructura de dimensi\u00f3 base, per\u00f2 requereix que es proporcioni una representaci\u00f3 codificada presa d'un esquema de conceptes.
api.doc.swagger.definitions.xml_ns5_MeasureListType.description                                                    = MeasureListType descriu l'estructura del descriptor de mesura per a una definici\u00f3 d'estructura de dades. Nom\u00e9s pot definir-se un primari.
api.doc.swagger.definitions.xml_ns5_MetadataAttributeBaseType.description                                          = MetadataAttributeBaseType \u00e9s un tipus base abstracte que serveix de base per a MetadataAttributeType.
api.doc.swagger.definitions.xml_ns5_MetadataAttributeRepresentationType.description                                = MetadataAttributeRepresentationType defineix les possibles representacions locals d'un atribut de metadades.
api.doc.swagger.definitions.xml_ns5_MetadataAttributeType.description                                              = MetadataAttributeType descriu l'estructura d'un atribut de metadades. L'atribut de metadades pren la seva sem\u00e0ntica, i en alguns casos la seva representaci\u00f3, de la seva identitat conceptual. Un atribut de metadades pot estar codificat (mitjançant la representaci\u00f3 local), no codificat (mitjançant el format de text) o no tenir valor. A m\u00e9s d'aquest valor, l'atribut de metadades tamb\u00e9 pot especificar atributs de metadades subordinades. Si un atribut de metadades nom\u00e9s serveix per a contenir atributs de metadades subordinades, ha d'utilitzar-se l'atribut isPresentational. En cas contrari, s'assumeix que tamb\u00e9 pren un valor. Si l'atribut de metadades pren un valor i no es defineix una representaci\u00f3, s'heretar\u00e0 del concepte del qual presa la seva sem\u00e0ntica. L'aneu opcional de l'atribut de metadades l'identifica de manera \u00fanica dins de la definici\u00f3 estructurada de metadades. Si no es proporciona est aneu, s'assumeix que el seu valor \u00e9s el del concepte referenciat des de la identitat del concepte. Observi's que la definici\u00f3 d'un atribut de metadades (identificat per l'atribut aneu) ha de ser \u00fanica en tota la definici\u00f3 de l'estructura de metadades (inclosos l'identificador de dest\u00ed, el component identificador i els identificadors de l'estructura de l'informe). Un atribut de metadades pot utilitzar-se en diverses estructures d'informes i en diferents nivells, per\u00f2 el contingut (valor i/o atributs de metadades fills i la seva cardinalitat) de l'atribut de metadades no pot canviar.
api.doc.swagger.definitions.xml_ns5_MetadataAttributeType.properties.isPresentational.description                  =

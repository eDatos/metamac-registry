api.doc.swagger.definitions.xml_ns4_AnnotableType.description                                                      = AnnotableType \u00e9s un tipus base abstracte utilitzat per a tots els artefactes anotables. Qualsevol tipus que proporcioni anotacions ha d'estendre aquest tipus.

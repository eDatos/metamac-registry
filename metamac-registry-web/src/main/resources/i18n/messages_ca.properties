api.doc.swagger.definitions.xml_ns3_MessageType.description                                                        = MessageType \u00e9s un tipus abstracte que \u00e9s utilitzat per tots els missatges, per a permetre l'her\u00e8ncia de caracter\u00edstiques comunes. Cada missatge consta d'una capçalera obligat\u00f2ria, seguida d'una c\u00e0rrega \u00fatil opcional (que pot apar\u00e8ixer diverses vegades) i, finalment, una secci\u00f3 de peus de p\u00e0gina opcional per a transmetre missatges d'error, advertiment i informatius.

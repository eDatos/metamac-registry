api.doc.swagger.definitions.xml_ns5_MaintainableBaseType.description                                               = MaintainableBaseType \u00e9s un tipus abstracte que nom\u00e9s serveix per a formar la base del MaintainableType real. El prop\u00f2sit d'aquest tipus \u00e9s restringir el VersionableType per a requerir l'atribut id.
api.doc.swagger.definitions.xml_ns5_MaintainableType.description                                                   = MaintainableType \u00e9s un tipus base abstracte per a tots els objectes mantenibles.

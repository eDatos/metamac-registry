api.doc.swagger.definitions.xml_ns5_StructureUsageType.description                                                 = StructureUsageType \u00e9s un tipus base abstracte per a tots els usos d'estructures. Cont\u00e9 una refer\u00e8ncia a una estructura. Les inst\u00e0ncies concretes d'aquest tipus han de restringir el tipus d'estructura a la qual es fa refer\u00e8ncia.

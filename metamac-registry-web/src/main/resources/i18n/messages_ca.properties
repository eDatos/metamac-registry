api.doc.swagger.definitions.xml_ns4_AgencyReferenceType.description                                                = AgencyReferenceType \u00e9s un tipus per a referenciar una ag\u00e8ncia. Consisteix en un URN i/o un conjunt complet de camps de refer\u00e8ncia.
api.doc.swagger.definitions.xml_ns4_AgencyRefType.description                                                      = AgencyRefType cont\u00e9 un conjunt de camps de refer\u00e8ncia per a referenciar una ag\u00e8ncia dins d'un esquema d'ag\u00e8ncies.

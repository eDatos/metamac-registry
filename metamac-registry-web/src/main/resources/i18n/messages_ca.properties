api.doc.swagger.definitions.xml_ns3_SubmitSubscriptionsResponseType.description                                    = SubmitSubscriptionsResponseType defineix l'estructura d'un document de resposta de subscripci\u00f3 d'enviament de registre.
api.doc.swagger.definitions.xml_ns3_TimeSeriesDataSetType.description                                              = TimeSeriesDataSetType \u00e9s una derivaci\u00f3 del DataSetType base del format gen\u00e8ric que restringeix el conjunt de dades per a permetre \u00fanicament observacions agrupades en les quals la dimensi\u00f3 a nivell d'observaci\u00f3 \u00e9s la dimensi\u00f3 temporal de la definici\u00f3 de l'estructura de dades. Aix\u00f2 significa que, a difer\u00e8ncia de l'estructura del conjunt de dades base, no pot haver-hi observacions no agrupades. At\u00e8s que aquesta derivaci\u00f3 s'aconsegueix mitjançant restricci\u00f3, els conjunts de dades que s'ajustin a aquest tipus tamb\u00e9 s'ajustaran intr\u00ednsecament a l'estructura del conjunt de dades base. De fet, les dades estructurades aqu\u00ed seran id\u00e8ntics a les dades del conjunt de dades base quan la dimensi\u00f3 temporal sigui la dimensi\u00f3 d'observaci\u00f3. Aix\u00f2 significa que les dades contingudes en aquesta estructura poden processar-se exactament de la mateixa manera que l'estructura base.
api.doc.swagger.definitions.xml_ns3_TimeSeriesObsType.description                                                  = TimeSeriesObsType defineix l'estructura d'una observaci\u00f3 de s\u00e8ries temporals. S'ha de proporcionar a l'observaci\u00f3 un valor per a la dimensi\u00f3 temporal. Aquest valor temporal ha de desambiguar l'observaci\u00f3 dins de la s\u00e8rie en la qual es defineix (\u00e9s a dir, no ha d'haver-hi una altra observaci\u00f3 amb el mateix valor temporal). L'observaci\u00f3 pot contenir un valor observat i/o valors d'atribut.
api.doc.swagger.definitions.xml_ns3_TimeSeriesType.description                                                     = TimeSeriesType defineix una estructura que s'utilitza per a agrupar una col·lecci\u00f3 d'observacions que tenen una clau en com\u00fa, organitzades per temps. La clau d'una s\u00e8rie s\u00f3n totes les dimensions definides en la definici\u00f3 de l'estructura de dades, excepte la dimensi\u00f3 temporal. A m\u00e9s de les observacions, es poden proporcionar valors per als atributs associats a les dimensions que componen la clau de la s\u00e8rie (sempre que els atributs no especifiquin un annex de grup ni tinguin relaci\u00f3 amb la dimensi\u00f3 temporal). \u00e9s possible que la s\u00e8rie contingui nom\u00e9s observacions o nom\u00e9s valors d'atributs, o tots dos.
api.doc.swagger.definitions.xml_ns3_TimeValueType.description                                                      = TimeValueType \u00e9s una derivaci\u00f3 de BaseValueType que s'utilitza per a proporcionar un valor per a la dimensi\u00f3 temporal. At\u00e8s que l'identificador de la dimensi\u00f3 temporal \u00e9s fix, la refer\u00e8ncia del component d'aquesta estructura tamb\u00e9 ho \u00e9s. Tingui en compte que aix\u00f2 significa que no \u00e9s necessari proporcionar un valor en una inst\u00e0ncia, ja que el valor fix es proporcionar\u00e0 en el conjunt d'informaci\u00f3 posterior a la validaci\u00f3.
api.doc.swagger.definitions.xml_ns3_ValuesType.description                                                         = El valuesType \u00e9s una estructura general que cont\u00e9 una col·lecci\u00f3 de valors de components de definici\u00f3 d'estructures de dades. Aquest tipus s'utilitza per a proporcionar valors de col·lecci\u00f3 de claus i atributs.

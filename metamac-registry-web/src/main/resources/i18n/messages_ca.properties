api.doc.swagger.definitions.xml_ns5_NonFacetedTextFormatType.description                                           = NonFacetedTextFormatType \u00e9s una versi\u00f3 restringida de SimpleComponentTextFormatType que no permet cap faceta.
api.doc.swagger.definitions.xml_ns5_OrganisationMapType.description                                                = OrganisationMapType defineix l'estructura per a mapear dues organitzacions. Es proporciona una refer\u00e8ncia local tant a l'organitzaci\u00f3 d'origen com a la de destinaci\u00f3.
api.doc.swagger.definitions.xml_ns5_OrganisationSchemeBaseType.description                                         = OrganisationSchemeBaseType \u00e9s un tipus base abstracte per a qualsevol esquema d'organitzaci\u00f3.
api.doc.swagger.definitions.xml_ns5_OrganisationSchemeMapType.description                                          = OrganisationSchemeMapType defineix l'estructura d'un mapa que identifica les relacions entre organitzacions en diferents esquemes d'organitzaci\u00f3.
api.doc.swagger.definitions.xml_ns5_OrganisationSchemeType.description                                             = OrganisationSchemeType descriu l'estructura d'un esquema d'organitzaci\u00f3.
api.doc.swagger.definitions.xml_ns5_OrganisationSchemeType.properties.Organisation.description                     =
api.doc.swagger.definitions.xml_ns5_OrganisationType.description                                                   = OrganisationType en un tipus abstracte que descriu l'estructura dels detalls d'una organitzaci\u00f3. A m\u00e9s de la identificaci\u00f3 b\u00e0sica de l'organitzaci\u00f3, es poden proporcionar dades de contacte.
api.doc.swagger.definitions.xml_ns5_OrganisationType.properties.Contact.description                                =
api.doc.swagger.definitions.xml_ns5_OrganisationUnitSchemeType.description                                         = OrganisationUnitSchemeType defineix un tipus d'esquema d'organitzaci\u00f3 que simplement defineix les organitzacions i les seves relacions pare-fill. A les organitzacions d'aquest esquema no se'ls assigna cap funci\u00f3 en particular i, de fet, poden existir tamb\u00e9 dins dels altres tipus d'esquemes d'organitzaci\u00f3.
api.doc.swagger.definitions.xml_ns5_OrganisationUnitType.description                                               = OrganisationUnitType defineix l'estructura de la descripci\u00f3 d'una unitat d'organitzaci\u00f3. A m\u00e9s de la identificaci\u00f3 general i la informaci\u00f3 de contacte, una unitat d'organitzaci\u00f3 pot especificar una relaci\u00f3 amb una altra unitat d'organitzaci\u00f3 del mateix esquema que \u00e9s la seva organitzaci\u00f3 matriu.
api.doc.swagger.definitions.xml_ns5_PrimaryMeasureType.description                                                 = PrimaryMeasureType descriu l'estructura de la mesura prim\u00e0ria. Descriu els valors d'observaci\u00f3 per a totes les presentacions de les dades. La mesura prim\u00e0ria presa la seva sem\u00e0ntica, i en alguns casos la seva representaci\u00f3, de la seva identitat conceptual (convencionalment el concepte OBS_VALUE). La mesura prim\u00e0ria pot codificar-se fent refer\u00e8ncia a una llista de codis de la seva representaci\u00f3 local codificada. Tamb\u00e9 pot especificar el seu format de text, que s'utilitza com a representaci\u00f3 de la mesura prim\u00e0ria si no es defineix una representaci\u00f3 codificada. Ni la representaci\u00f3 codificada ni la no codificada s\u00f3n necess\u00e0ries, ja que la mesura prim\u00e0ria pot prendre-les del concepte referenciat. Observi's que si l'estructura de dades declara una dimensi\u00f3 de mesura, la representaci\u00f3 d'aquesta ha de ser un superconjunto de totes les possibles representacions del concepte de mesura.
api.doc.swagger.definitions.xml_ns5_ProcessStepBaseType.description                                                = ProcessStepBaseType \u00e9s un tipus base abstracte utilitzat com a base per al tipus ProcessStepType.
api.doc.swagger.definitions.xml_ns5_ProcessStepType.description                                                    = ProcessStepType descriu l'estructura d'una etapa de proc\u00e9s. Un pas de proc\u00e9s niat \u00e9s autom\u00e0ticament sub-ordinado, i seguit com el següent pas. Si el següent pas \u00e9s condicional, ha de ser referenciat en una transici\u00f3.
api.doc.swagger.definitions.xml_ns5_ProcessStepType.properties.Computation.description                             =
api.doc.swagger.definitions.xml_ns5_ProcessStepType.properties.Input.description                                   =
api.doc.swagger.definitions.xml_ns5_ProcessStepType.properties.Output.description                                  =
api.doc.swagger.definitions.xml_ns5_ProcessStepType.properties.ProcessStep.description                             =
api.doc.swagger.definitions.xml_ns5_ProcessStepType.properties.Transition.description                              =
api.doc.swagger.definitions.xml_ns5_ProcessType.description                                                        = ProcessType descriu l'estructura d'un proc\u00e9s, que \u00e9s un esquema que defineix o documenta les operacions realitzades en les dades amb la finalitat de validar les dades o derivar nova informaci\u00f3 d'acord amb un conjunt donat de regles. Els processos ocorren en ordre, i continuaran amb vista a menys que una transici\u00f3 dicti que ha d'oc\u00f3rrer un altre pas.
api.doc.swagger.definitions.xml_ns5_ProcessType.properties.ProcessStep.description                                 =
api.doc.swagger.definitions.xml_ns5_ProvisionAgreementType.description                                             = ProvisionAgreementType descriu l'estructura d'un acord de provisi\u00f3. Un acord de provisi\u00f3 defineix un acord perqu\u00e8 un proveïdor de dades informe dades o metadades de refer\u00e8ncia contra un flux. Se subministren atributs que descriuen com ha de comportar-se el registre quan es registren dades o metadades en relaci\u00f3 amb aquest acord de provisi\u00f3.
api.doc.swagger.definitions.xml_ns5_ProvisionAgreementType.properties.DataProvider.description                     =
api.doc.swagger.definitions.xml_ns5_ProvisionAgreementType.properties.StructureUsage.description                   =
api.doc.swagger.definitions.xml_ns5_ReleaseCalendarType.description                                                = ReleaseCalendarType descriu informaci\u00f3 sobre el calendari de publicaci\u00f3 de les dades limitades. Tots aquests valors utilitzen el format est\u00e0ndard d'estil Â«P7DÂ».

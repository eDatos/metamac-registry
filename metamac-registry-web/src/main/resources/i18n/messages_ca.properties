api.doc.swagger.definitions.xml_ns4_ReportPeriodTargetReferenceType.description                                    = ReportPeriodTargetReferenceType \u00e9s un tipus per a fer refer\u00e8ncia a un objecte de dest\u00ed de per\u00edode d'informe. Consisteix en un URN i/o un conjunt complet de camps de refer\u00e8ncia.

api.doc.swagger.definitions.xml_ns4_ReportCategoryRefType.description                                              = ReportCategoryRefType cont\u00e9 un conjunt de camps per a fer refer\u00e8ncia a una categoria d'informes dins d'una taxonomia d'informes.
api.doc.swagger.definitions.xml_ns4_ReportingCategoryReferenceType.description                                     = ReportingCategoryReferenceType \u00e9s un tipus per a fer refer\u00e8ncia a un objecte de categoria d'informes. Consisteix en un URN i/o un conjunt complet de camps de refer\u00e8ncia.

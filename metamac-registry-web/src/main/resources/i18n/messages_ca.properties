api.doc.swagger.definitions.xml_ns4_ReferenceType.description                                                      = ReferenceType \u00e9s un tipus base abstracte. S'utilitza com a base per a totes les refer\u00e8ncies, a totes per a una refer\u00e8ncia d'objecte gen\u00e8rica de nivell superior que pot substituir-se per una refer\u00e8ncia expl\u00edcita a qualsevol objecte. Qualsevol refer\u00e8ncia pot consistir en una Ref (que cont\u00e9 tots els camps de refer\u00e8ncia requerits per separat) i/o un URN. Aquests han de donar com a resultat la identificaci\u00f3 del mateix objecte. Noti's que els elements Ref i URN s\u00f3n locals i no qualificats per a permetre el refinament d'aquesta estructura fora de l'espai de noms. Aix\u00f2 permet que qualsevol refer\u00e8ncia pugui ser refinada per un espai de noms diferent. Per exemple, un conjunt de metadades espec\u00edfic per a la definici\u00f3 d'una estructura de metadades podria desitjar restringir el URN per a permetre \u00fanicament un valor d'una llista enumerada.
api.doc.swagger.definitions.xml_ns4_ReferenceType.properties.Ref.description                                       =
api.doc.swagger.definitions.xml_ns4_ReferenceType.properties.URN.description                                       =
api.doc.swagger.definitions.xml_ns4_RegionType.description                                                         = RegionType \u00e9s un tipus abstracte que defineix una regi\u00f3 de restricci\u00f3 gen\u00e8rica. Aquest tipus pot refinar-se per a definir regions per a conjunts de dades o metadades. Una regi\u00f3 es defineix mitjançant una col·lecci\u00f3 de valors clau, cadascun dels quals \u00e9s una col·lecci\u00f3 de valors per a un component que desambigua les dades o metadades (\u00e9s a dir, les dimensions o els objectes objectiu d'un objectiu de metadades). Per a cada regi\u00f3, pot proporcionar-se una col·lecci\u00f3 de valors d'atribut. En conjunt, els valors clau i els atributs serveixen per a identificar o descriure un subconjunt d'un conjunt de dades o metadades. Finalment, la regi\u00f3 pot marcar-se com inclosa o exclosa, encara que aquesta marca nom\u00e9s t\u00e9 sentit quan la regi\u00f3 s'utilitza en un context determinat.

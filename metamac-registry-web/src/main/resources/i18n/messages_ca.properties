api.doc.swagger.definitions.xml_ns4_ContainerChildObjectRefBaseType.description                                    = ContainerChildObjectRefBaseType \u00e9s un tipus base abstracte per a referenciar qualsevol objecte fill dins de contenidor definit en un objecte mantenible.

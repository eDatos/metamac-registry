api.doc.swagger.definitions.xml_ns3_ObsValueType.description                                                       = ObsValueType \u00e9s una derivaci\u00f3 de BaseValueType que s'utilitza per a proporcionar un valor d'observaci\u00f3. At\u00e8s que un valor d'observaci\u00f3 sempre est\u00e0 associat a la mesura prim\u00e0ria de la definici\u00f3 de l'estructura de dades, i que l'identificador de la mesura prim\u00e0ria \u00e9s fix, la refer\u00e8ncia del component per a aquesta estructura \u00e9s fixa.Tingui en compte que aix\u00f2 significa que no \u00e9s necessari proporcionar un valor en una inst\u00e0ncia, ja que el valor fix es proporcionar\u00e0 en el conjunt d'informaci\u00f3 posterior a la validaci\u00f3.

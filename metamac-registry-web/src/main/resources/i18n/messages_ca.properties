api.doc.swagger.definitions.xml_ns4_AnyCodelistReferenceType.description                                           = AnyCodelistReferenceType \u00e9s un tipus espec\u00edfic de refer\u00e8ncia per a referenciar una llista de codis o un \u00fas jer\u00e0rquic de llistes de codis. Consisteix en un URN i/o un conjunt complet de camps de refer\u00e8ncia; ag\u010Dncia, aneu i versi\u00f3. Si utilitzeu el conjunt complet de camps de referència, cal que proporcioneu una classe perquè quedi clar el tipus d'objecte a què es fa referència
api.doc.swagger.definitions.xml_ns4_AnyCodelistRefType.description                                                 = AnyCodelistRefType \u00e9s un tipus per a fer refer\u00e8ncia a qualsevol objecte de llista de codis (ja sigui una llista de codis o una llista de codis jer\u00e0rquica).
api.doc.swagger.definitions.xml_ns4_AnyLocalCodeReferenceType.description                                          = AnyLocalCodeReferenceType proporciona refer\u00e8ncies simples a qualsevol codi o codi jer\u00e0rquic quan la identificaci\u00f3 de la llista de codis o llista de codis jer\u00e0rquica que ho defineix est\u00e0 continguda en un altre context.
api.doc.swagger.definitions.xml_ns4_AnyLocalCodeRefType.description                                                = AnyLocalCodeRefType proporciona una refer\u00e8ncia local a qualsevol objecte de codi.
api.doc.swagger.definitions.xml_ns4_AttachmentConstraintReferenceType.description                                  = AttachmentConstraintReferenceType \u00e9s un tipus per a fer refer\u00e8ncia a un objecte de restricci\u00f3 d'adjunts. Consisteix en un URN i/o un conjunt complet de camps de refer\u00e8ncia.
api.doc.swagger.definitions.xml_ns4_AttributeDescriptorReferenceType.description                                   = AttributeDescriptorReferenceType \u00e9s un tipus per a referenciar un objecte descriptor d'atribut. Consisteix en un URN i/o un conjunt complet de camps de refer\u00e8ncia.
api.doc.swagger.definitions.xml_ns4_AttributeDescriptorRefType.description                                         = AttributeDescriptorRefType cont\u00e9 una refer\u00e8ncia al descriptor d'atribut dins d'una definici\u00f3 d'estructura de dades.
api.doc.swagger.definitions.xml_ns4_AttributeReferenceType.description                                             = AttributeReferenceType \u00e9s un tipus per a referenciar un objecte atribut. Consisteix en un URN i/o un conjunt complet de camps de refer\u00e8ncia.
api.doc.swagger.definitions.xml_ns4_AttributeRefType.description                                                   = AttributeRefType cont\u00e9 una refer\u00e8ncia a un atribut dins d'una definici\u00f3 d'estructura de dades. Tingui en compte que, com que nom\u00e9s hi ha un descriptor d'atribut, els camps de refer\u00e8ncia de contenidor estan prohibits.
api.doc.swagger.definitions.xml_ns4_AttributeValueSetType.description                                              = AttributeValueSetType defineix l'estructura per a proporcionar valors a un atribut de dades. Si no es proporcionen valors, l'atribut queda impl\u00edcitament incl\u00f2s/excl\u00f2s de la regi\u00f3 en la qual est\u00e0 definit, sense tenir en compte el valor de l'atribut de dades. Tingui en compte que per als atributs de metadades que apareixen dins d'altres atributs de metadades, es pot proporcionar un identificador niat. Per exemple, un valor de CONTACT.ADDRESS.STREET fa refer\u00e8ncia a l'atribut de metadades amb l'identificador STREET que existeix en l'atribut de metadades ADDRESS en l'atribut de metadades CONTACT, que est\u00e0 definit en l'arrel de l'estructura de l'informe.
api.doc.swagger.definitions.xml_ns4_CategorisationReferenceType.description                                        = CategorisationReferenceType \u00e9s un tipus per a referenciar un objecte de categoritzaci\u00f3. Consisteix en un URN i/o un conjunt complet de camps de refer\u00e8ncia.
api.doc.swagger.definitions.xml_ns4_CategorisationRefType.description                                              = CategorisationRefType proporciona una refer\u00e8ncia a una categoritzaci\u00f3 a trav\u00e9s d'un conjunt complet de camps de refer\u00e8ncia.
api.doc.swagger.definitions.xml_ns4_CategoryReferenceType.description                                              = CategoryReferenceType \u00e9s un tipus per a referenciar un objecte de categoria. Consisteix en un URN i/o un conjunt complet de camps de refer\u00e8ncia.
api.doc.swagger.definitions.xml_ns4_CategoryRefType.description                                                    = CategoryRefType fa refer\u00e8ncia a una categoria dins d'un esquema de categories. Es requereixen camps de refer\u00e8ncia tant per a l'esquema com per a l'element.
api.doc.swagger.definitions.xml_ns4_CategorySchemeMapReferenceType.description                                     = CategorySchemeMapReferenceType \u00e9s un tipus per a fer refer\u00e8ncia a un objecte de mapa d'esquema de categories. Consisteix en un URN i/o un conjunt complet de camps de refer\u00e8ncia.
api.doc.swagger.definitions.xml_ns4_CategorySchemeMapRefType.description                                           = CategorySchemeMapRefType cont\u00e9 un conjunt de camps de refer\u00e8ncia per a un mapa d'esquema de categories.
api.doc.swagger.definitions.xml_ns4_CategorySchemeReferenceType.description                                        = CategorySchemeReferenceType \u00e9s un tipus per a referenciar un objecte d'esquema de categoria. Consisteix en un URN i/o un conjunt complet de camps de refer\u00e8ncia.
api.doc.swagger.definitions.xml_ns4_CategorySchemeRefType.description                                              = CategorySchemeRefType proporciona una refer\u00e8ncia a un esquema de categoria a trav\u00e9s d'un conjunt complet de camps de refer\u00e8ncia.

api.doc.swagger.definitions.xml_ns4_LocalOrganisationReferenceBaseType.description                                 = LocalOrganisationReferenceBaseType es un tipo base abstracto que proporciona referencias sencillas a una organizaci\u00f3n, independientemente de su tipo, cuando la identificaci\u00f3n del esquema de organizaci\u00f3n que la define est\u00e1 contenida en otro contexto.
api.doc.swagger.definitions.xml_ns4_LocalOrganisationReferenceType.description                                     = LocalOrganisationReferenceType proporciona una referencia simple a una organizaci\u00f3n, independientemente de su tipo, cuando la identificaci\u00f3n del esquema de organizaci\u00f3n que la define est\u00e1 contenida en otro contexto.
api.doc.swagger.definitions.xml_ns4_LocalOrganisationUnitRefType.description                                       = LocalOrganisationUnitRefType hace referencia a una unidad de organizaci\u00f3n localmente cuando la referencia al esquema de unidad de organizaci\u00f3n que la define se proporciona en otro lugar.
api.doc.swagger.definitions.xml_ns4_LocalOrganisationUnitReferenceType.description                                 = LocalOrganisationUnitReferenceType proporciona una referencia simple a una unidad de organizaci\u00f3n, cuando la referencia al esquema de unidad de organizaci\u00f3n que la define se proporciona en otro contexto.

api.doc.swagger.definitions.xml_ns5_ConstraintBaseType.description                                                 = ConstraintBaseType es un tipo base abstracto que forma la base del tipo abstracto principal ConstraintType. Requiere que se proporcione un nombre.
api.doc.swagger.definitions.xml_ns5_ConstraintContentTargetType.description                                        = ConstraintTargetType define la estructura de un objeto objetivo de restricci\u00f3n. El objeto de destino de restricci\u00f3n tiene una representaci\u00f3n y un identificador fijos.
api.doc.swagger.definitions.xml_ns5_ConstraintRepresentationType.description                                       = ConstraintRepresentationType define las posibles representaciones locales de un objeto de destino de referencia de restricci\u00f3n. La representaci\u00f3n se fija para que sea siempre una referencia de restricci\u00f3n adjunta.
api.doc.swagger.definitions.xml_ns5_ConstraintTextFormatType.description                                           = ConstraintTextFormatType es una versi\u00f3n restringida de NonFacetedTextFormatType que especifica una representaci\u00f3n fija de AttachmentConstraintReference.
api.doc.swagger.definitions.xml_ns5_ConstraintType.description                                                     = ConstraintType es un tipo base abstracto que tipos espec\u00edficos de restricciones (contenido y adjunto) restringen y extienden para describir sus detalles. La inclusi\u00f3n de una clave o regi\u00f3n en una restricci\u00f3n se determina procesando primero los conjuntos de claves incluidos y eliminando despu\u00e9s las claves definidas en los conjuntos de claves excluidos. Si no se definen conjuntos de claves incluidos, se asume que todas las claves o regiones posibles est\u00e1n incluidas, y cualquier clave o regi\u00f3n excluida se elimina de este conjunto completo.

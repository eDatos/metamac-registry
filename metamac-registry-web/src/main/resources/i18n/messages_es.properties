api.doc.swagger.definitions.xml_ns4_HierarchicalCodeRefType.description                                            = HierarchicalCodeRefType hace referencia a un c\u00f3digo dentro de una lista jer\u00e1rquica de c\u00f3digos. Se requieren campos de referencia tanto para el c\u00f3digo como para la lista de c\u00f3digos.

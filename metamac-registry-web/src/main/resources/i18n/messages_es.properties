api.doc.swagger.definitions.xml_ns3_DataSetType.description                                                        = DataSetType define la estructura del conjunto de datos gen\u00e9rico. Los datos se organizan en una colecci\u00f3n de series (observaciones agrupadas) o en una colecci\u00f3n de observaciones no agrupadas. La organizaci\u00f3n utilizada depende de la especificaci\u00f3n de la estructura en la cabecera del mensaje de datos (a la que se hace referencia mediante el atributo structureRef). La especificaci\u00f3n de la estructura establece qu\u00e9 datos aparecen en el nivel de observaci\u00f3n. Si esta dimensi\u00f3n es «AllDimensions», el conjunto de datos debe consistir en una colecci\u00f3n de observaciones no agrupadas; de lo contrario, el conjunto de datos contendr\u00e1 una colecci\u00f3n de series con las observaciones de las series desambiguadas por la dimensi\u00f3n especificada en el nivel de observaci\u00f3n. Este conjunto de datos puede contener datos (valores observados) y/o documentaci\u00f3n (valores de atributos). Se supone que cada serie u observaci\u00f3n no agrupada ser\u00e1 distinta en su prop\u00f3sito. Por ejemplo, si las series contienen tanto datos como documentaci\u00f3n, se supone que cada serie tendr\u00e1 una clave \u00fanica. Si la serie s\u00f3lo contiene datos o s\u00f3lo documentaci\u00f3n, es posible que exista otra serie con la misma clave, pero que no tenga la misma finalidad (es decir, proporcionar datos o documentaci\u00f3n) que la primera serie.

api.doc.swagger.definitions.xml_ns3_ObsValueType.description                                                       = ObsValueType es una derivaci\u00f3n de BaseValueType que se utiliza para proporcionar un valor de observaci\u00f3n. Dado que un valor de observaci\u00f3n siempre est\u00e1 asociado a la medida primaria de la definici\u00f3n de la estructura de datos, y que el identificador de la medida primaria es fijo, la referencia del componente para esta estructura es fija.Tenga en cuenta que esto significa que no es necesario proporcionar un valor en una instancia, ya que el valor fijo se proporcionar\u00e1 en el conjunto de informaci\u00f3n posterior a la validaci\u00f3n.

api.doc.swagger.definitions.xml_ns4_DinstinctKeyValueType.description                                              = DinstinctKeyValueType es un tipo base abstracto que define un valor singular y obligatorio para un componente clave.
api.doc.swagger.definitions.xml_ns4_DistinctKeyType.description                                                    = DistinctKeyType es un tipo base abstracto que es un tipo especial de regi\u00f3n que s\u00f3lo define una regi\u00f3n distinta de datos o metadatos. Para cada componente definido en la regi\u00f3n, s\u00f3lo se proporciona un \u00fanico valor. Sin embargo, las mismas reglas que se aplican a la regi\u00f3n general sobre los componentes no declarados que se comod\u00edn se aplican aqu\u00ed tambi\u00e9n. Por lo tanto, este tipo puede definir una clave completa o parcial distinta para datos o metadatos.
api.doc.swagger.definitions.xml_ns4_EmptyType.description                                                          = EmptyType es un tipo complejo vac\u00edo para elementos en los que la presencia de la etiqueta indica todo lo necesario.

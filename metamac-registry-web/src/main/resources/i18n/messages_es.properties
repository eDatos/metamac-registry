api.doc.swagger.definitions.xml_ns6_MappedObjectRefType.description                                                = MappedObjectRefType define un conjunto de campos de referencia para cualquier tipo de objeto mapeable.
api.doc.swagger.definitions.xml_ns6_MappedObjectReferenceType.description                                          = MappedObjectReferenceType es un tipo para referenciar cualquier objeto mapeable. Consiste en un URN y/o un conjunto completo de campos de referencia; agencia, id y versi\u00f3n.
api.doc.swagger.definitions.xml_ns6_MappedObjectType.description                                                   = MappedObjectType define una estructura para referenciar un objeto e indicar si es el origen, el destino o cualquiera de los dos a efectos de consulta del conjunto de estructuras que contiene el objeto referenciado en uno de los mapas que define.

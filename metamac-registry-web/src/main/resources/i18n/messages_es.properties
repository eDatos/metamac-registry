api.doc.swagger.definitions.xml_ns4_RegionType.properties.KeyValue.description                                     = .
api.doc.swagger.definitions.xml_ns4_RegionType.properties.include.description                                      = .
api.doc.swagger.definitions.xml_ns4_ReportCategoryRefType.description                                              = ReportCategoryRefType contiene un conjunto de campos para hacer referencia a una categor\u00eda de informes dentro de una taxonom\u00eda de informes.
api.doc.swagger.definitions.xml_ns4_ReportPeriodTargetRefType.description                                          = ReportPeriodTargetRefType contiene una referencia a un objetivo de per\u00edodo de informe dentro de un objetivo de metadatos de una definici\u00f3n de estructura de datos.
api.doc.swagger.definitions.xml_ns4_ReportPeriodTargetReferenceType.description                                    = ReportPeriodTargetReferenceType es un tipo para hacer referencia a un objeto de destino de per\u00edodo de informe. Consiste en un URN y/o un conjunto completo de campos de referencia.
api.doc.swagger.definitions.xml_ns4_ReportStructureRefType.description                                             = ReportStructureRefType contiene una referencia a una estructura de informe dentro de una definici\u00f3n de estructura de metadatos.
api.doc.swagger.definitions.xml_ns4_ReportStructureReferenceType.description                                       = ReportStructureReferenceType es un tipo para referenciar un objeto de estructura de informe. Consiste en un URN y/o un conjunto completo de campos de referencia.
api.doc.swagger.definitions.xml_ns4_ReportingCategoryReferenceType.description                                     = ReportingCategoryReferenceType es un tipo para hacer referencia a un objeto de categor\u00eda de informes. Consiste en un URN y/o un conjunto completo de campos de referencia.
api.doc.swagger.definitions.xml_ns4_ReportingTaxonomyRefType.description                                           = ReportingTaxonomyRefType proporciona una referencia a una taxonom\u00eda de informes a trav\u00e9s de un conjunto completo de campos de referencia.
api.doc.swagger.definitions.xml_ns4_ReportingTaxonomyReferenceType.description                                     = ReportingTaxonomyReferenceType es un tipo para hacer referencia a un objeto de taxonom\u00eda de informes. Consiste en un URN y/o un conjunto completo de campos de referencia.
api.doc.swagger.definitions.xml_ns4_SetReferenceType.description                                                   = SetReferenceType define la estructura de una referencia a un conjunto de datos/metadatos. Se debe proporcionar una referencia completa a un proveedor de datos y el identificador del conjunto de datos. Obs\u00e9rvese que no se deriva de la estructura de referencia base, ya que los conjuntos de datos/metadatos no son t\u00e9cnicamente identificables.
api.doc.swagger.definitions.xml_ns4_SetReferenceType.properties.DataProvider.description                           = .
api.doc.swagger.definitions.xml_ns4_SetReferenceType.properties.ID.description                                     = .
api.doc.swagger.definitions.xml_ns4_SimpleKeyValueType.description                                                 = SimpleKeyValueType deriva de SimpleValueType, pero no permite el valor en cascada en la jerarqu\u00eda, ya que las claves est\u00e1n pensadas para describir una clave completa o parcial distinta.
api.doc.swagger.definitions.xml_ns4_SimpleValueType.description                                                    = SimpleValueType contiene un valor simple para un componente, y si ese valor es de una lista de c\u00f3digos, la capacidad de indicar que los c\u00f3digos hijos en una jerarqu\u00eda simple forman parte del conjunto de valores del componente para la regi\u00f3n.

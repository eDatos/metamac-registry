api.doc.swagger.definitions.xml_ns5_ContentConstraintAttachmentType.description                                    = ContentConstraintAttachmentType define la estructura para especificar el objeto u objetos de destino de una restricci\u00f3n de contenido.
api.doc.swagger.definitions.xml_ns5_ContentConstraintBaseType.description                                          = ContentConstraintBaseType es un tipo base abstracto que constituye la base de ContentConstraintType.
api.doc.swagger.definitions.xml_ns5_ContentConstraintType.description                                              = ContentConstraintType describe los detalles de una restricci\u00f3n de contenido definiendo las regiones de contenido, los conjuntos de claves o la informaci\u00f3n de liberaci\u00f3n de los objetos adjuntos a la restricci\u00f3n. Tenga en cuenta que si la restricci\u00f3n es para un proveedor de datos, s\u00f3lo es relevante la informaci\u00f3n de calendario de liberaci\u00f3n, ya que no hay forma fiable de determinar qu\u00e9 familia de claves se est\u00e1 utilizando para enmarcar las restricciones en t\u00e9rminos de regiones de cubo o conjuntos de claves.
api.doc.swagger.definitions.xml_ns5_ContentConstraintType.properties.ReferencePeriod.description                   = .
api.doc.swagger.definitions.xml_ns5_ContentConstraintType.properties.ReleaseCalendar.description                   = .
api.doc.swagger.definitions.xml_ns5_ContentConstraintType.properties.type.description                              = .
api.doc.swagger.definitions.xml_ns5_DataConsumerSchemeType.description                                             = DataConsumerSchemeType define un tipo de esquema de organizaci\u00f3n que contiene \u00fanicamente consumidores de datos. El esquema de consumidores de datos mantenido por una determinada agencia de mantenimiento siempre recibe un identificador y una versi\u00f3n fijos, y nunca es definitivo. Por lo tanto, se pueden a\u00f1adir o eliminar consumidores sin tener que versionar el esquema. Este esquema no tiene jerarqu\u00eda, lo que significa que ninguna organizaci\u00f3n puede definir una relaci\u00f3n con otra organizaci\u00f3n en el esquema.
api.doc.swagger.definitions.xml_ns5_DataConsumerType.description                                                   = DataConsumerType define la estructura de la descripci\u00f3n de un consumidor de datos. Los contactos definidos para la organizaci\u00f3n son espec\u00edficos de la funci\u00f3n de consumidor de datos que desempe\u00f1a la organizaci\u00f3n.
api.doc.swagger.definitions.xml_ns5_DataKeySetType.description                                                     = DataKeySetType define una colecci\u00f3n de claves de datos completas o parciales (valores de dimensi\u00f3n).
api.doc.swagger.definitions.xml_ns5_DataProviderSchemeType.description                                             = DataProviderSchemeType define un tipo de esquema de organizaci\u00f3n que contiene \u00fanicamente proveedores de datos. El esquema de proveedores de datos mantenido por una determinada agencia de mantenimiento siempre recibe un identificador y una versi\u00f3n fijos, y nunca es definitivo. Por lo tanto, se pueden a\u00f1adir o eliminar proveedores sin tener que versionar el esquema. Este esquema no tiene jerarqu\u00eda, lo que significa que ninguna organizaci\u00f3n puede definir una relaci\u00f3n con otra organizaci\u00f3n en el esquema
api.doc.swagger.definitions.xml_ns5_DataProviderType.description                                                   = DataProviderType define la estructura de la descripci\u00f3n de un proveedor de datos. Los contactos definidos para la organizaci\u00f3n son espec\u00edficos de la funci\u00f3n de proveedor de datos que desempe\u00f1a la organizaci\u00f3n.
api.doc.swagger.definitions.xml_ns5_DataSetRepresentationType.description                                          = DataSetRepresentationType define las posibles representaciones locales de un objeto de destino de referencia de conjunto de datos. La representaci\u00f3n se fija para que sea siempre una referencia a un conjunto de datos.
api.doc.swagger.definitions.xml_ns5_DataSetTargetType.description                                                  = DataSetTargetType define la estructura de un objeto de destino de conjunto de datos. El objeto de destino del conjunto de datos tiene una representaci\u00f3n y un identificador fijos.
api.doc.swagger.definitions.xml_ns5_DataSetTextFormatType.description                                              = DataSetTextFormatType es una versi\u00f3n restringida de NonFacetedTextFormatType que especifica una representaci\u00f3n fija de DataSetReference.
api.doc.swagger.definitions.xml_ns5_DataStructureRepresentationType.description                                    = DataStructureRepresentationType es un tipo base abstracto que define las representaciones permitidas para cualquier componente de definici\u00f3n de estructura de datos. La enumeraci\u00f3n debe restringirse al tipo adecuado para el esquema de elementos de un componente determinado.
api.doc.swagger.definitions.xml_ns5_DataStructureType.description                                                  = DataStructureType describe la estructura de una definici\u00f3n de estructura de datos. Una definici\u00f3n de estructura de datos se define como una colecci\u00f3n de conceptos de metadatos, su estructura y su uso cuando se utilizan para recopilar o difundir datos.
api.doc.swagger.definitions.xml_ns5_DataflowType.description                                                       = DataflowType describe la estructura de un flujo de datos. Un flujo de datos se define como la estructura de datos que se proporcionar\u00e1 para diferentes per\u00edodos de referencia. Si no se hace referencia a este tipo externamente, debe proporcionarse una referencia a la definici\u00f3n de una gama de claves.
api.doc.swagger.definitions.xml_ns5_DimensionListBaseType.description                                              = DimensionListBaseType es un tipo base abstracto utilizado como base para DimensionListType.
api.doc.swagger.definitions.xml_ns5_DimensionListType.description                                                  = DimensionListType describe el descriptor de clave de una definici\u00f3n de estructura de datos. El orden de la declaraci\u00f3n de las dimensiones secundarias es significativo: se utiliza para describir el orden en que aparecer\u00e1n en los formatos de datos para los que se suministran valores clave de forma ordenada (excluida la dimensi\u00f3n temporal, que no se representa como miembro de la clave ordenada). Toda definici\u00f3n de estructura de datos que utilice la dimensi\u00f3n tiempo debe declarar tambi\u00e9n una dimensi\u00f3n frecuencia, convencionalmente la primera dimensi\u00f3n de la clave (el conjunto de dimensiones no temporales ordenadas). No es necesario asignar una dimensi\u00f3n temporal, ya que los datos pueden organizarse como se desee.
api.doc.swagger.definitions.xml_ns5_DimensionListType.properties.Dimension.description                             = .
api.doc.swagger.definitions.xml_ns5_DimensionListType.properties.MeasureDimension.description                      = .
api.doc.swagger.definitions.xml_ns5_DimensionListType.properties.TimeDimension.description                         = .
api.doc.swagger.definitions.xml_ns5_DimensionType.description                                                      = DimensionType describe la estructura de una dimensi\u00f3n ordinaria, que se define como un concepto estad\u00edstico utilizado (muy probablemente junto con otros conceptos estad\u00edsticos) para identificar una serie estad\u00edstica, como una serie temporal, por ejemplo, un concepto estad\u00edstico que indica una determinada actividad econ\u00f3mica o una zona geogr\u00e1fica de referencia. La dimensi\u00f3n toma su sem\u00e1ntica, y en algunos casos su representaci\u00f3n, de la identidad de su concepto. Una dimensi\u00f3n puede codificarse haciendo referencia a una lista de c\u00f3digos a partir de su representaci\u00f3n local codificada. Tambi\u00e9n puede especificar su formato de texto, que se utiliza como representaci\u00f3n de la dimensi\u00f3n si no se define una representaci\u00f3n codificada. Ni la representaci\u00f3n codificada ni la no codificada son necesarias, ya que la dimensi\u00f3n puede tomarlas del concepto referenciado.
api.doc.swagger.definitions.xml_ns5_GroupBaseType.description                                                      = GroupBaseType es un tipo base abstracto que constituye la base de GroupType.
api.doc.swagger.definitions.xml_ns5_GroupDimensionBaseType.description                                             = GroupDimensionBaseType es un tipo base abstracto que refina el ComponentType base para formar la base del GroupDimensionType.
api.doc.swagger.definitions.xml_ns5_GroupDimensionType.description                                                 = GroupDimensionType define un componente de dimensi\u00f3n con una lista de componentes de descriptor de clave de grupo. Aunque t\u00e9cnicamente es un componente, se trata esencialmente de una referencia a una dimensi\u00f3n definida en el descriptor de clave. Por lo tanto, las propiedades de identificaci\u00f3n, nombre y descripci\u00f3n, identidad de concepto y representaci\u00f3n que suelen estar disponibles para un componente no est\u00e1n permitidas aqu\u00ed, ya que todas se heredan de la dimensi\u00f3n referenciada.
api.doc.swagger.definitions.xml_ns5_GroupDimensionType.properties.DimensionReference.description                   = .
api.doc.swagger.definitions.xml_ns5_GroupType.description                                                          = GroupType describe la estructura de un descriptor de grupo en una definici\u00f3n de estructura de datos. Un grupo puede consistir en una clave parcial o una colecci\u00f3n de regiones de cubos o conjuntos de claves distintos a los que se pueden adjuntar atributos. El prop\u00f3sito de un grupo es especificar valores de atributos que tienen el mismo valor basado en alguna dimensionalidad com\u00fan. Todos los grupos declarados en la estructura de datos deben ser \u00fanicos - es decir, no se pueden tener claves parciales duplicadas. Todos los grupos deben tener identificadores \u00fanicos.
api.doc.swagger.definitions.xml_ns5_GroupType.properties.AttachmentConstraint.description                          = .
api.doc.swagger.definitions.xml_ns5_GroupType.properties.GroupDimension.description                                = .
api.doc.swagger.definitions.xml_ns5_HierarchicalCodeBaseType.description                                           = HierarchicalCodeBaseType es un tipo base abstracto que crea la base para HierarchicalCodeType. Elimina la urna y la uri.
api.doc.swagger.definitions.xml_ns5_HierarchicalCodeType.description                                               = HierarchicalCodeType describe la estructura de un c\u00f3digo jer\u00e1rquico. Un c\u00f3digo jer\u00e1rquico proporciona una referencia a un c\u00f3digo al que se hace referencia dentro de la lista de c\u00f3digos jer\u00e1rquicos mediante una referencia completa a un c\u00f3digo a trav\u00e9s de un URN o un conjunto completo de campos de referencia, o una referencia local que utiliza el alias de referencia de la lista de c\u00f3digos incluida y la identificaci\u00f3n de un c\u00f3digo de la lista. Los c\u00f3digos se ordenan jer\u00e1rquicamente seg\u00fan esta referencia. N\u00f3tese que es posible referenciar un \u00fanico c\u00f3digo de forma que tenga m\u00faltiples padres dentro de la jerarqu\u00eda. Adem\u00e1s, la jerarqu\u00eda puede o no estar nivelada.
api.doc.swagger.definitions.xml_ns5_HierarchicalCodeType.properties.Code.description                               = .
api.doc.swagger.definitions.xml_ns5_HierarchicalCodeType.properties.CodeID.description                             = .
api.doc.swagger.definitions.xml_ns5_HierarchicalCodeType.properties.CodelistAliasRef.description                   = .
api.doc.swagger.definitions.xml_ns5_HierarchicalCodeType.properties.HierarchicalCode.description                   = .
api.doc.swagger.definitions.xml_ns5_HierarchicalCodeType.properties.Level.description                              = .
api.doc.swagger.definitions.xml_ns5_HierarchicalCodeType.properties.validFrom.description                          = .
api.doc.swagger.definitions.xml_ns5_HierarchicalCodeType.properties.validTo.description                            = .
api.doc.swagger.definitions.xml_ns5_HierarchicalCodeType.properties.version.description                            = .
api.doc.swagger.definitions.xml_ns5_HierarchicalCodelistBaseType.description                                       = HierarchicalCodelistBaseType es una clase base abstracta que es la base para HierarchicalCodelistType. Requiere que se proporcione un nombre.
api.doc.swagger.definitions.xml_ns5_HierarchicalCodelistType.description                                           = HierarchicalCodelistType describe la estructura de una lista jer\u00e1rquica de c\u00f3digos. Una lista jer\u00e1rquica de c\u00f3digos se define como una colecci\u00f3n organizada de c\u00f3digos que pueden participar en muchas relaciones padre/hijo con otros c\u00f3digos de la lista, seg\u00fan lo definido por una o m\u00e1s jerarqu\u00edas de la lista.
api.doc.swagger.definitions.xml_ns5_HierarchicalCodelistType.properties.Hierarchy.description                      = .
api.doc.swagger.definitions.xml_ns5_HierarchicalCodelistType.properties.IncludedCodelist.description               = .
api.doc.swagger.definitions.xml_ns5_HierarchyBaseType.description                                                  = HierarchyBaseType es un tipo base abstracto que sirve como base para el HierarchyType. Requiere que se proporcione un nombre y un id.
api.doc.swagger.definitions.xml_ns5_HierarchyType.description                                                      = La Jerarqu\u00eda es un tipo abstracto que proporciona una estructura de clasificaci\u00f3n de c\u00f3digos referenciados dispuestos en niveles de detalle desde el nivel m\u00e1s amplio hasta el m\u00e1s detallado. Los niveles en los que existen los c\u00f3digos pueden ser formales o informales.
api.doc.swagger.definitions.xml_ns5_HierarchyType.properties.HierarchicalCode.description                          = .
api.doc.swagger.definitions.xml_ns5_HierarchyType.properties.Level.description                                     = .
api.doc.swagger.definitions.xml_ns5_HierarchyType.properties.leveled.description                                   = .
api.doc.swagger.definitions.xml_ns5_HybridCodeMapType.description                                                  = CodeMapType define la estructura para asociar un c\u00f3digo de una lista de c\u00f3digos de origen a un c\u00f3digo de una lista de c\u00f3digos de destino. Tenga en cuenta que cualquiera de ellos puede proceder de una lista de c\u00f3digos jer\u00e1rquica.
api.doc.swagger.definitions.xml_ns5_HybridCodeMapType.properties.Source.description                                = .
api.doc.swagger.definitions.xml_ns5_HybridCodeMapType.properties.Target.description                                = .
api.doc.swagger.definitions.xml_ns5_HybridCodelistMapBaseType.description                                          = HybridCodelistMapBaseType es un tipo base abstracto que constituye la base de HybridCodelistMapType.
api.doc.swagger.definitions.xml_ns5_HybridCodelistMapType.description                                              = HybridCodelistMapType define la estructura de un mapa que relaciona c\u00f3digos (posiblemente jer\u00e1rquicos) de diferentes listas de c\u00f3digos.
api.doc.swagger.definitions.xml_ns5_HybridCodelistMapType.properties.HybridCodeMap.description                     = .
api.doc.swagger.definitions.xml_ns5_HybridCodelistMapType.properties.Source.description                            = .
api.doc.swagger.definitions.xml_ns5_HybridCodelistMapType.properties.Target.description                            = .
api.doc.swagger.definitions.xml_ns5_ISOConceptReferenceType.description                                            = ISOConceptReferenceType proporciona una referencia a un concepto ISO 11179.
api.doc.swagger.definitions.xml_ns5_ISOConceptReferenceType.properties.ConceptAgency.description                   = .
api.doc.swagger.definitions.xml_ns5_ISOConceptReferenceType.properties.ConceptID.description                       = .
api.doc.swagger.definitions.xml_ns5_ISOConceptReferenceType.properties.ConceptSchemeID.description                 = .
api.doc.swagger.definitions.xml_ns5_IdentifiableObjectRepresentationType.description                               = IdentifiableObjectRepresentationType define las posibles representaciones locales de un objeto de destino objeto identificable.
api.doc.swagger.definitions.xml_ns5_IdentifiableObjectTargetBaseType.description                                   = IdentifiableObjectTargetBaseType es un tipo base abstracto que constituye la base del tipo complejo IdentifiableObjectTargetType.
api.doc.swagger.definitions.xml_ns5_IdentifiableObjectTargetType.description                                       = IdentifiableObjectTargetType define la estructura de un objeto de destino identificable. El objeto de destino identificable tiene una representaci\u00f3n fija de una referencia y puede especificar una representaci\u00f3n local de cualquier esquema de elementos con el fin de restringir a qu\u00e9 elementos se puede hacer referencia. El objeto de destino identificable debe especificar el tipo de objeto al que el objeto de destino debe hacer referencia.
api.doc.swagger.definitions.xml_ns5_IdentifiableObjectTargetType.properties.objectType.description                 = .
api.doc.swagger.definitions.xml_ns5_IdentifiableObjectTextFormatType.description                                   = IdentifiableObjectTextFormatType es una versi\u00f3n restringida de NonFacetedTextFormatType que especifica una representaci\u00f3n fija IdentifiableReference.
api.doc.swagger.definitions.xml_ns5_IdentifiableType.description                                                   = IdentifiableType es un tipo base abstracto para todos los objetos identificables.
api.doc.swagger.definitions.xml_ns5_IdentifiableType.properties.id.description                                     = .
api.doc.swagger.definitions.xml_ns5_IdentifiableType.properties.uri.description                                    = .
api.doc.swagger.definitions.xml_ns5_IdentifiableType.properties.urn.description                                    = .
api.doc.swagger.definitions.xml_ns5_IncludedCodelistReferenceType.description                                      = IncludedCodelistReferenceType proporciona la estructura para una referencia a una lista de c\u00f3digos y, opcionalmente, proporciona una identificaci\u00f3n de alias local para esta referencia.
api.doc.swagger.definitions.xml_ns5_IncludedCodelistReferenceType.properties.alias.description                     = .
api.doc.swagger.definitions.xml_ns5_InputOutputType.description                                                    = InputOutputType describe la estructura de una entrada o salida a un paso del proceso. Proporciona una referencia al objeto que es la entrada o la salida.
api.doc.swagger.definitions.xml_ns5_InputOutputType.properties.ObjectReference.description                         = .
api.doc.swagger.definitions.xml_ns5_InputOutputType.properties.localID.description                                 = .
api.doc.swagger.definitions.xml_ns5_ItemAssociationType.description                                                = ItemAssociationType es un tipo abstracto que define la relaci\u00f3n entre dos elementos de los esquemas de elementos de origen y destino de un mapa de esquemas de elementos.
api.doc.swagger.definitions.xml_ns5_ItemAssociationType.properties.Source.description                              = .
api.doc.swagger.definitions.xml_ns5_ItemAssociationType.properties.Target.description                              = .
api.doc.swagger.definitions.xml_ns5_ItemBaseType.description                                                       = ItemBaseType es un tipo base abstracto que constituye la base de ItemType. Requiere que se proporcione al menos un id para un elemento.
api.doc.swagger.definitions.xml_ns5_ItemSchemeMapBaseType.description                                              = ItemSchemeMapBaseType es un tipo base abstracto que constituye la base de ItemSchemeMapType.
api.doc.swagger.definitions.xml_ns5_ItemSchemeMapType.description                                                  = ItemSchemeMapType es un tipo base abstracto que constituye la base para el mapeo de elementos entre esquemas de elementos del mismo tipo.
api.doc.swagger.definitions.xml_ns5_ItemSchemeMapType.properties.ItemAssociation.description                       = .
api.doc.swagger.definitions.xml_ns5_ItemSchemeMapType.properties.Source.description                                = .
api.doc.swagger.definitions.xml_ns5_ItemSchemeMapType.properties.Target.description                                = .
api.doc.swagger.definitions.xml_ns5_ItemSchemeType.description                                                     = ItemSchemeType es un tipo base abstracto para todos los objetos de esquema de elementos. Contiene una colecci\u00f3n de elementos. Las instancias concretas de este tipo deben restringir los tipos reales de elementos permitidos dentro del esquema.
api.doc.swagger.definitions.xml_ns5_ItemSchemeType.properties.Item.description                                     = .
api.doc.swagger.definitions.xml_ns5_ItemSchemeType.properties.isPartial.description                                = .
api.doc.swagger.definitions.xml_ns5_ItemType.description                                                           = ItemType es un tipo base abstracto para todos los \u00edtems con en un esquema de \u00edtems. Las instancias concretas de este tipo pueden o no utilizar el elemento anidado, pero si es as\u00ed deben restringir los tipos reales de elemento permitidos.
api.doc.swagger.definitions.xml_ns5_ItemType.properties.Item.description                                           = .

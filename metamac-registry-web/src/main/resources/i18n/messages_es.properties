api.doc.swagger.definitions.xml_ns5_MetadataflowType.description                                                   = MetadataflowType describe la estructura de un flujo de metadatos. Un flujo de datos se define como la estructura de metadatos de referencia que se proporcionar\u00e1 para diferentes per\u00edodos de referencia. Si no se hace referencia a este tipo externamente, deber\u00e1 proporcionarse una referencia a una definici\u00f3n de estructura de metadatos
api.doc.swagger.definitions.xml_ns5_NameableType.description                                                       = NameableType es un tipo base abstracto para todos los objetos con nombre.

api.doc.swagger.definitions.xml_ns9_ReferenceValueType.description                                                 = ReferenceValueType es un tipo base abstracto que constituye la base de un valor de referencia objetivo. Un valor de referencia objetivo ser\u00e1 una referencia a un objeto identificable, una clave de datos, una referencia a un conjunto de datos o un per\u00edodo de informe. La elecci\u00f3n de estas opciones se limitar\u00e1 a una sola en funci\u00f3n de la definici\u00f3n del objetivo en la definici\u00f3n de la estructura de metadatos.

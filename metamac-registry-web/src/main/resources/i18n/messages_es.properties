api.doc.swagger.definitions.xml_ns4_MeasureDescriptorRefType.description                                           = MeasureDescriptorRefType contiene una referencia al descriptor de medida dentro de una definici\u00f3n de estructura de datos.
api.doc.swagger.definitions.xml_ns4_MeasureDescriptorReferenceType.description                                     = MeasureDescriptorReferenceType es un tipo para referenciar un objeto descriptor de medida. Consiste en un URN y/o un conjunto completo de campos de referencia.
api.doc.swagger.definitions.xml_ns4_MeasureDimensionRefType.description                                            = MeasureDimensionRefType contiene una referencia a la dimensi\u00f3n de medida dentro de una definici\u00f3n de estructura de datos. Tenga en cuenta que, puesto que s\u00f3lo hay un descriptor de clave, los campos de referencia de contenedor est\u00e1n prohibidos.
api.doc.swagger.definitions.xml_ns4_MeasureDimensionReferenceType.description                                      = MeasureDimensionReferenceType es un tipo para referenciar un objeto de dimensi\u00f3n de medida. Consiste en un URN y/o un conjunto completo de campos de referencia.
api.doc.swagger.definitions.xml_ns4_MetadataAttributeRefType.description                                           = MetadataAttributeRefType contiene una referencia a un atributo de metadatos dentro de una estructura de informe en una definici\u00f3n de estructura de metadatos.
api.doc.swagger.definitions.xml_ns4_MetadataAttributeReferenceType.description                                     = MetadataAttributeReferenceType es un tipo para hacer referencia a un objeto de atributo de metadatos. Consiste en un URN y/o un conjunto completo de campos de referencia.
api.doc.swagger.definitions.xml_ns4_MetadataAttributeValueSetType.description                                      = MetadataAttributeValueSetType define la estructura para proporcionar valores a un atributo de metadatos. Si no se proporcionan valores, el atributo est\u00e1 impl\u00edcitamente incluido/excluido de la regi\u00f3n en la que est\u00e1 definido, sin tener en cuenta el valor del atributo de metadatos.
api.doc.swagger.definitions.xml_ns4_MetadataKeyType.description                                                    = MetadataKeyType es una regi\u00f3n que define una clave de metadatos completa o parcial distinta. La clave consiste en un conjunto de valores, cada uno de los cuales hace referencia a un objeto de destino para el objetivo de metadatos al que se hace referencia en el atributo metadataTarget, que debe definirse en la estructura de informe a la que se hace referencia en el atributo report. A cada objeto de destino se le puede asignar un \u00fanico valor. Si no se incluye en esta clave un objeto de destino del objetivo de metadatos de referencia, se asume que el valor de \u00e9ste es todos los objetos conocidos para un objeto de destino de referencia, todas las claves posibles para un objeto de destino de valores de descriptor de clave o todas las fechas para un objeto de destino de per\u00edodo de informe. El prop\u00f3sito de esta clave es hacer referencia a metadatos que se ajusten a una estructura de informe concreta para un objeto o conjunto de objetos determinado.
api.doc.swagger.definitions.xml_ns4_MetadataKeyValueType.description                                               = MetadataKeyValueType es un tipo para proporcionar un valor de objeto de destino con el fin de definir una clave de metadatos distinta. S\u00f3lo se puede proporcionar un \u00fanico valor para el objeto de destino.
api.doc.swagger.definitions.xml_ns4_MetadataStructureRefType.description                                           = MetadataStructureRefType contiene un conjunto de campos de referencia para una definici\u00f3n de estructura de metadatos.
api.doc.swagger.definitions.xml_ns4_MetadataStructureReferenceType.description                                     = MetadataStructureReferenceType es un tipo para referenciar un objeto de definici\u00f3n de estructura de metadatos. Consiste en un URN y/o un conjunto completo de campos de referencia.
api.doc.swagger.definitions.xml_ns4_MetadataTargetRefType.description                                              = MetadataTargetRefType contiene una referencia a un objetivo de metadatos dentro de una definici\u00f3n de estructura de metadatos.
api.doc.swagger.definitions.xml_ns4_MetadataTargetReferenceType.description                                        = MetadataTargetReferenceType es un tipo para hacer referencia a un objeto de destino de metadatos. Consiste en un URN y/o un conjunto completo de campos de referencia.
api.doc.swagger.definitions.xml_ns4_MetadataTargetRegionKeyType.description                                        = MetadataTargetRegionKeyType es un tipo para proporcionar un conjunto de valores para un objeto de destino en un objetivo de metadatos de un informe de metadatos de re valla. Se puede proporcionar un conjunto de valores o un intervalo de tiempo para un objeto de destino de un per\u00edodo de informe. Se puede proporcionar una colecci\u00f3n de los respectivos tipos de referencias para los objetos objetivo de referencia de conjunto de datos y de referencia de objeto identificable. Para un objeto de destino de valores de descriptores de claves, se puede proporcionar una colecci\u00f3n de claves de datos.
api.doc.swagger.definitions.xml_ns4_MetadataTargetRegionType.description                                           = MetadataTargetRegionType define la estructura de una regi\u00f3n de destino de metadatos. Una regi\u00f3n de destino de metadatos debe definir la estructura del informe y el destino de metadatos de dicha estructura en el que se basa la regi\u00f3n. Este tipo se basa en el tipo abstracto RegionType y simplemente refina los valores de clave y atributo para ajustarse a lo que es aplicable a los objetos de destino y a los atributos de metadatos, respectivamente. Consulte la documentaci\u00f3n del tipo base para obtener m\u00e1s detalles sobre c\u00f3mo se define una regi\u00f3n.
api.doc.swagger.definitions.xml_ns4_MetadataflowRefType.description                                                = MetadataflowRefType contiene un conjunto de campos de referencia para un flujo de metadatos.
api.doc.swagger.definitions.xml_ns4_MetadataflowReferenceType.description                                          = MetadataflowReferenceType es un tipo para referenciar un objeto de flujo de metadatos. Consta de un URN y/o un conjunto completo de campos de referencia.
api.doc.swagger.definitions.xml_ns4_ObjectRefType.description                                                      = ObjectRefType contiene un conjunto de campos de referencia para referenciar cualquier objeto. No puede ser una referencia local, por lo que se requiere el identificador de agencia. Tambi\u00e9n se requiere que se proporcione la clase y el paquete del objeto referenciado, de forma que pueda construirse una referencia URN completa a partir de los valores proporcionados. Tenga en cuenta que esto no es capaz de validar completamente que se suministren todos los campos necesarios para un tipo de objeto dado.
api.doc.swagger.definitions.xml_ns4_ObjectReferenceType.description                                                = ObjectReferenceType es una referencia gen\u00e9rica que permite referenciar cualquier objeto. El tipo de objeto realmente referenciado puede determinarse a partir del URN o del atributo class del conjunto completo de campos de referencia.
api.doc.swagger.definitions.xml_ns4_ObjectTypeCodelistType.description                                             = 
api.doc.swagger.definitions.xml_ns4_OrganisationRefBaseType.description                                            = OrganisationRefBaseType es un tipo base abstracto que hace referencia a una organizaci\u00f3n desde dentro de un esquema de organizaci\u00f3n. Los campos de referencia son obligatorios tanto para el esquema como para la organizaci\u00f3n.
api.doc.swagger.definitions.xml_ns4_OrganisationRefType.description                                                = OrganisationRefType proporciona una referencia a cualquier organizaci\u00f3n a trav\u00e9s de un conjunto completo de campos de referencia. Se requiere que se especifique la clase (es decir, el tipo) de la organizaci\u00f3n a la que se hace referencia.
api.doc.swagger.definitions.xml_ns4_OrganisationReferenceBaseType.description                                      = OrganisationReferenceBaseType es un tipo para referenciar cualquier objeto de organizaci\u00f3n, independientemente de su tipo. Consiste en un URN y/o un conjunto completo de campos de referencia.
api.doc.swagger.definitions.xml_ns4_OrganisationReferenceType.description                                          = OrganisationReferenceType hace referencia a una organizaci\u00f3n independientemente del tipo espec\u00edfico. Consiste en un URN y/o un conjunto completo de campos de referencia.
api.doc.swagger.definitions.xml_ns4_OrganisationSchemeMapRefType.description                                       = OrganisationSchemeMapRefType contiene un conjunto de campos de referencia para un mapa de esquema de organizaci\u00f3n.
api.doc.swagger.definitions.xml_ns4_OrganisationSchemeMapReferenceType.description                                 = OrganisationSchemeMapReferenceType es un tipo para referenciar un objeto de mapa de esquema de organizaci\u00f3n. Consiste en un URN y/o un conjunto completo de campos de referencia.
api.doc.swagger.definitions.xml_ns4_OrganisationSchemeRefBaseType.description                                      = OrganisationSchemeRefBaseType contiene un conjunto de campos de referencia para un esquema de organizaci\u00f3n.
api.doc.swagger.definitions.xml_ns4_OrganisationSchemeRefType.description                                          = OrganisationSchemeRefType proporciona una referencia a un esquema de organizaci\u00f3n a trav\u00e9s de un conjunto completo de campos de referencia. Se requiere que se especifique la clase (es decir, el tipo) del esquema de organizaci\u00f3n al que se hace referencia.
api.doc.swagger.definitions.xml_ns4_OrganisationSchemeReferenceBaseType.description                                = OrganisationSchemeReferenceBaseType es un tipo para referenciar un objeto de esquema de organizaci\u00f3n. Consiste en un URN y/o un conjunto completo de campos de referencia.
api.doc.swagger.definitions.xml_ns4_OrganisationSchemeReferenceType.description                                    = OrganisationSchemeReferenceType hace referencia a un esquema de organizaci\u00f3n independientemente del tipo espec\u00edfico. Consiste en un URN y/o un conjunto completo de campos de referencia.
api.doc.swagger.definitions.xml_ns4_OrganisationUnitRefType.description                                            = OrganisationUnitRefType contiene un conjunto de campos de referencia para referenciar una unidad de organizaci\u00f3n dentro de un esquema de unidades de organizaci\u00f3n.
api.doc.swagger.definitions.xml_ns4_OrganisationUnitReferenceType.description                                      = OrganisationUnitReferenceType es un tipo para referenciar una unidad de organizaci\u00f3n. Consiste en un URN y/o un conjunto completo de campos de referencia.
api.doc.swagger.definitions.xml_ns4_OrganisationUnitSchemeRefType.description                                      = OrganisationUnitSchemeRefType contiene un conjunto de campos de referencia para un esquema de unidad de organizaci\u00f3n.
api.doc.swagger.definitions.xml_ns4_OrganisationUnitSchemeReferenceType.description                                = OrganisationUnitSchemeReferenceType es un tipo para referenciar un objeto de esquema de unidad organizativa. Consiste en un URN y/o un conjunto completo de campos de referencia.

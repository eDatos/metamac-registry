api.doc.swagger.definitions.xml_ns3_ObsType.description                                                            = ObsType define la estructura de una observaci\u00f3n agrupada.Se debe proporcionar a la observaci\u00f3n un valor para la dimensi\u00f3n que se declara en el nivel de observaci\u00f3n para este conjunto de datos.Este valor de dimensi\u00f3n debe desambiguar la observaci\u00f3n dentro de la serie en la que se define (es decir, no debe haber otra observaci\u00f3n con el mismo valor de dimensi\u00f3n). La observaci\u00f3n puede contener un valor observado y/o valores de atributo.

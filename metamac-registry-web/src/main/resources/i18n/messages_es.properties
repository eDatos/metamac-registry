api.doc.swagger.definitions.xml_ns5_ValueMapType.description                                                       = ValueMapType contiene una colecci\u00f3n de mapeos de valores, que dan un valor de origen y un valor de destino.
api.doc.swagger.definitions.xml_ns5_ValueMapType.properties.ValueMapping.description                               = .
api.doc.swagger.definitions.xml_ns5_ValueMappingType.description                                                   = ValueMappingType especifica la relaci\u00f3n entre dos valores como origen y destino.
api.doc.swagger.definitions.xml_ns5_ValueMappingType.properties.source.description                                 = .
api.doc.swagger.definitions.xml_ns5_ValueMappingType.properties.target.description                                 = .
api.doc.swagger.definitions.xml_ns5_VersionableType.description                                                    = VersionableType es un tipo base abstracto para todos los objetos versionables.

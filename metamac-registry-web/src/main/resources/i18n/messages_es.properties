api.doc.swagger.definitions.xml_ns3_StructureSetQueryType.description                                              = StructureSetQueryType define la estructura de un mensaje de consulta de conjunto de estructuras.
api.doc.swagger.definitions.xml_ns3_StructureSpecificDataHeaderType.description                                    = StructureSpecificDataHeaderType define la estructura de cabecera para un mensaje de datos de estructura espec\u00edfica.
api.doc.swagger.definitions.xml_ns3_StructureSpecificDataType.description                                          = StructureSpecificDataType define la estructura del mensaje de datos espec\u00edficos de la estructura. Tenga en cuenta que el tipo de carga \u00fatil del conjunto de datos es abstracto, por lo que deber\u00e1 asign\u00e1rsele un tipo en una instancia. Este tipo debe derivarse del tipo base referenciado. Este tipo base define una estructura general que puede seguirse para permitir el procesamiento gen\u00e9rico de los datos aunque no se conozcan los detalles exactos del formato espec\u00edfico de la estructura de datos.
api.doc.swagger.definitions.xml_ns3_StructureSpecificMetadataHeaderType.description                                = StructureSpecificMetadataHeaderType define el formato de cabecera para los mensajes de metadatos de referencia espec\u00edficos de definici\u00f3n de estructura de metadatos.
api.doc.swagger.definitions.xml_ns3_StructureSpecificMetadataType.description                                      = StructureSpecificMetadataType define la estructura de un mensaje de metadatos espec\u00edfico de la estructura. Tenga en cuenta que el tipo de carga \u00fatil del conjunto de metadatos es abstracto, por lo que deber\u00e1 asign\u00e1rsele un tipo en una instancia. Este tipo debe derivarse del tipo base referenciado. Este tipo base define una estructura general que puede seguirse para permitir el procesamiento gen\u00e9rico de los datos aunque no se conozcan los detalles exactos del formato espec\u00edfico de la estructura de datos.
api.doc.swagger.definitions.xml_ns3_StructureSpecificTimeSeriesDataHeaderType.description                          = StructureSpecificTimeSeriesDataHeaderType define la estructura de cabecera para un mensaje de datos espec\u00edficos de la estructura de una serie temporal.
api.doc.swagger.definitions.xml_ns3_StructureSpecificTimeSeriesDataQueryType.description                           = StructureSpecificTimeSeriesDataQueryType define la estructura de un mensaje de consulta de datos gen\u00e9ricos de series temporales.
api.doc.swagger.definitions.xml_ns3_StructureSpecificTimeSeriesDataType.description                                = StructureSpecificTimeSeriesDataType define la estructura del mensaje de datos de series temporales espec\u00edficos de la estructura.
api.doc.swagger.definitions.xml_ns3_StructureType.description                                                      = StructureType define el contenido de un mensaje de estructura. La carga \u00fatil es opcional, ya que este mensaje puede ser devuelto desde un servicio web con s\u00f3lo informaci\u00f3n en el pie de p\u00e1gina.
api.doc.swagger.definitions.xml_ns3_StructuresQueryType.description                                                = StructuresQueryType define la estructura de un mensaje de consulta de estructuras.
api.doc.swagger.definitions.xml_ns3_SubmitRegistrationsRequestType.description                                     = SubmitRegistrationsRequestType define la estructura de un documento de solicitud de registro.
api.doc.swagger.definitions.xml_ns3_SubmitRegistrationsResponseType.description                                    = SubmitRegistrationsResponseType define la estructura de un documento de respuesta de env\u00edo de registro.
api.doc.swagger.definitions.xml_ns3_SubmitStructureRequestType.description                                         = SubmitStructureRequestType define la estructura de un documento de solicitud de estructura de env\u00edo de registro.
api.doc.swagger.definitions.xml_ns3_SubmitStructureResponseType.description                                        = SubmitStructureResponseType define la estructura de un documento de respuesta de env\u00edo de registro.
api.doc.swagger.definitions.xml_ns3_SubmitSubscriptionsRequestType.description                                     = SubmitSubscriptionsRequestType define la estructura de un documento de solicitud de suscripci\u00f3n de env\u00edo de registro.
api.doc.swagger.definitions.xml_ns3_SubmitSubscriptionsResponseType.description                                    = SubmitSubscriptionsResponseType define la estructura de un documento de respuesta de suscripci\u00f3n de env\u00edo de registro.
api.doc.swagger.definitions.xml_ns3_TimeSeriesDataSetType.description                                              = TimeSeriesDataSetType es una derivaci\u00f3n del DataSetType base del formato gen\u00e9rico que restringe el conjunto de datos para permitir \u00fanicamente observaciones agrupadas en las que la dimensi\u00f3n a nivel de observaci\u00f3n es la dimensi\u00f3n temporal de la definici\u00f3n de la estructura de datos. Esto significa que, a diferencia de la estructura del conjunto de datos base, no puede haber observaciones no agrupadas. Dado que esta derivaci\u00f3n se consigue mediante restricci\u00f3n, los conjuntos de datos que se ajusten a este tipo tambi\u00e9n se ajustar\u00e1n intr\u00ednsecamente a la estructura del conjunto de datos base. De hecho, los datos estructurados aqu\u00ed ser\u00e1n id\u00e9nticos a los datos del conjunto de datos base cuando la dimensi\u00f3n temporal sea la dimensi\u00f3n de observaci\u00f3n. Esto significa que los datos contenidos en esta estructura pueden procesarse exactamente de la misma manera que la estructura base.
api.doc.swagger.definitions.xml_ns3_TimeSeriesObsType.description                                                  = TimeSeriesObsType define la estructura de una observaci\u00f3n de series temporales. Se debe proporcionar a la observaci\u00f3n un valor para la dimensi\u00f3n temporal. Este valor temporal debe desambiguar la observaci\u00f3n dentro de la serie en la que se define (es decir, no debe haber otra observaci\u00f3n con el mismo valor temporal). La observaci\u00f3n puede contener un valor observado y/o valores de atributo.
api.doc.swagger.definitions.xml_ns3_TimeSeriesType.description                                                     = TimeSeriesType define una estructura que se utiliza para agrupar una colecci\u00f3n de observaciones que tienen una clave en com\u00fan, organizadas por tiempo. La clave de una serie son todas las dimensiones definidas en la definici\u00f3n de la estructura de datos, salvo la dimensi\u00f3n temporal. Adem\u00e1s de las observaciones, se pueden proporcionar valores para los atributos asociados a las dimensiones que componen la clave de la serie (siempre que los atributos no especifiquen un anexo de grupo ni tengan relaci\u00f3n con la dimensi\u00f3n temporal). Es posible que la serie contenga s\u00f3lo observaciones o s\u00f3lo valores de atributos, o ambos.
api.doc.swagger.definitions.xml_ns3_TimeValueType.description                                                      = TimeValueType es una derivaci\u00f3n de BaseValueType que se utiliza para proporcionar un valor para la dimensi\u00f3n temporal. Dado que el identificador de la dimensi\u00f3n temporal es fijo, la referencia del componente de esta estructura tambi\u00e9n lo es. Tenga en cuenta que esto significa que no es necesario proporcionar un valor en una instancia, ya que el valor fijo se proporcionar\u00e1 en el conjunto de informaci\u00f3n posterior a la validaci\u00f3n.
api.doc.swagger.definitions.xml_ns3_ValuesType.description                                                         = El valuesType es una estructura general que contiene una colecci\u00f3n de valores de componentes de definici\u00f3n de estructuras de datos. Este tipo se utiliza para proporcionar valores de colecci\u00f3n de claves y atributos.
api.doc.swagger.definitions.xml_ns3_ValuesType.properties.Value.description                                        = .
api.doc.swagger.definitions.xml_ns4_ActionType.description                                                         = 
api.doc.swagger.definitions.xml_ns4_AgencyRefType.description                                                      = AgencyRefType contiene un conjunto de campos de referencia para referenciar una agencia dentro de un esquema de agencias.
api.doc.swagger.definitions.xml_ns4_AgencyReferenceType.description                                                = AgencyReferenceType es un tipo para referenciar una agencia. Consiste en un URN y/o un conjunto completo de campos de referencia.
api.doc.swagger.definitions.xml_ns4_AgencySchemeRefType.description                                                = AgencySchemeRefType contiene un conjunto de campos de referencia para un esquema de agencia.
api.doc.swagger.definitions.xml_ns4_AgencySchemeReferenceType.description                                          = AgencySchemeReferenceType es un tipo para referenciar un objeto de esquema de agencia. Consiste en un URN y/o un conjunto completo de campos de referencia.
api.doc.swagger.definitions.xml_ns4_AnnotableType.description                                                      = AnnotableType es un tipo base abstracto utilizado para todos los artefactos anotables. Cualquier tipo que proporcione anotaciones debe extender este tipo.
api.doc.swagger.definitions.xml_ns4_AnnotableType.properties.Annotations.description                               = .
api.doc.swagger.definitions.xml_ns4_AnnotationType.description                                                     = AnnotationType permite incrustar notas y anotaciones no documentales en mensajes de datos y estructuras. Proporciona campos opcionales para proporcionar un t\u00edtulo, una descripci\u00f3n del tipo, un URI y el texto de la anotaci\u00f3n.
api.doc.swagger.definitions.xml_ns4_AnnotationType.properties.AnnotationText.description                           = .
api.doc.swagger.definitions.xml_ns4_AnnotationType.properties.AnnotationTitle.description                          = .
api.doc.swagger.definitions.xml_ns4_AnnotationType.properties.AnnotationType.description                           = .
api.doc.swagger.definitions.xml_ns4_AnnotationType.properties.AnnotationURL.description                            = .
api.doc.swagger.definitions.xml_ns4_AnnotationType.properties.id.description                                       = .
api.doc.swagger.definitions.xml_ns4_AnnotationsType.description                                                    = AnnotationsType proporciona una lista de anotaciones que se adjuntar\u00e1n a los mensajes de datos y estructuras.
api.doc.swagger.definitions.xml_ns4_AnnotationsType.properties.Annotation.description                              = .
api.doc.swagger.definitions.xml_ns4_AnyCodelistRefType.description                                                 = AnyCodelistRefType es un tipo para hacer referencia a cualquier objeto de lista de c\u00f3digos (ya sea una lista de c\u00f3digos o una lista de c\u00f3digos jer\u00e1rquica).
api.doc.swagger.definitions.xml_ns4_AnyCodelistReferenceType.description                                           = AnyCodelistReferenceType es un tipo espec\u00edfico de referencia para referenciar una lista de c\u00f3digos o un uso jer\u00e1rquico de listas de c\u00f3digos. Consiste en un URN y/o un conjunto completo de campos de referencia; agencia, id y versi\u00f3n. Si se utiliza el conjunto completo de campos de referencia, se requiere que se proporcione una clase para que quede claro el tipo de objeto al que se hace referencia.
api.doc.swagger.definitions.xml_ns4_AnyLocalCodeRefType.description                                                = AnyLocalCodeRefType proporciona una referencia local a cualquier objeto de c\u00f3digo.
api.doc.swagger.definitions.xml_ns4_AnyLocalCodeReferenceType.description                                          = AnyLocalCodeReferenceType proporciona referencias simples a cualquier c\u00f3digo o c\u00f3digo jer\u00e1rquico cuando la identificaci\u00f3n de la lista de c\u00f3digos o lista de c\u00f3digos jer\u00e1rquica que lo define est\u00e1 contenida en otro contexto.
api.doc.swagger.definitions.xml_ns4_AttachmentConstraintReferenceType.description                                  = AttachmentConstraintReferenceType es un tipo para hacer referencia a un objeto de restricci\u00f3n de adjuntos. Consiste en un URN y/o un conjunto completo de campos de referencia.
api.doc.swagger.definitions.xml_ns4_AttributeDescriptorRefType.description                                         = AttributeDescriptorRefType contiene una referencia al descriptor de atributo dentro de una definici\u00f3n de estructura de datos.
api.doc.swagger.definitions.xml_ns4_AttributeDescriptorReferenceType.description                                   = AttributeDescriptorReferenceType es un tipo para referenciar un objeto descriptor de atributo. Consiste en un URN y/o un conjunto completo de campos de referencia.
api.doc.swagger.definitions.xml_ns4_AttributeRefType.description                                                   = AttributeRefType contiene una referencia a un atributo dentro de una definici\u00f3n de estructura de datos. Tenga en cuenta que, puesto que s\u00f3lo hay un descriptor de atributo, los campos de referencia de contenedor est\u00e1n prohibidos.
api.doc.swagger.definitions.xml_ns4_AttributeReferenceType.description                                             = AttributeReferenceType es un tipo para referenciar un objeto atributo. Consiste en un URN y/o un conjunto completo de campos de referencia.
api.doc.swagger.definitions.xml_ns4_AttributeValueSetType.description                                              = AttributeValueSetType define la estructura para proporcionar valores a un atributo de datos. Si no se proporcionan valores, el atributo queda impl\u00edcitamente incluido/excluido de la regi\u00f3n en la que est\u00e1 definido, sin tener en cuenta el valor del atributo de datos. Tenga en cuenta que para los atributos de metadatos que aparecen dentro de otros atributos de metadatos, se puede proporcionar un identificador anidado. Por ejemplo, un valor de CONTACT.ADDRESS.STREET hace referencia al atributo de metadatos con el identificador STREET que existe en el atributo de metadatos ADDRESS en el atributo de metadatos CONTACT, que est\u00e1 definido en la ra\u00edz de la estructura del informe.
api.doc.swagger.definitions.xml_ns4_CategorisationRefType.description                                              = CategorisationRefType proporciona una referencia a una categorizaci\u00f3n a trav\u00e9s de un conjunto completo de campos de referencia.
api.doc.swagger.definitions.xml_ns4_CategorisationReferenceType.description                                        = CategorisationReferenceType es un tipo para referenciar un objeto de categorizaci\u00f3n. Consiste en un URN y/o un conjunto completo de campos de referencia.
api.doc.swagger.definitions.xml_ns4_CategoryRefType.description                                                    = CategoryRefType hace referencia a una categor\u00eda dentro de un esquema de categor\u00edas. Se requieren campos de referencia tanto para el esquema como para el elemento.
api.doc.swagger.definitions.xml_ns4_CategoryReferenceType.description                                              = CategoryReferenceType es un tipo para referenciar un objeto de categor\u00eda. Consiste en un URN y/o un conjunto completo de campos de referencia.
api.doc.swagger.definitions.xml_ns4_CategorySchemeMapRefType.description                                           = CategorySchemeMapRefType contiene un conjunto de campos de referencia para un mapa de esquema de categor\u00edas.
api.doc.swagger.definitions.xml_ns4_CategorySchemeMapReferenceType.description                                     = CategorySchemeMapReferenceType es un tipo para hacer referencia a un objeto de mapa de esquema de categor\u00edas. Consiste en un URN y/o un conjunto completo de campos de referencia.
api.doc.swagger.definitions.xml_ns4_CategorySchemeRefType.description                                              = CategorySchemeRefType proporciona una referencia a un esquema de categor\u00eda a trav\u00e9s de un conjunto completo de campos de referencia.
api.doc.swagger.definitions.xml_ns4_CategorySchemeReferenceType.description                                        = CategorySchemeReferenceType es un tipo para referenciar un objeto de esquema de categor\u00eda. Consiste en un URN y/o un conjunto completo de campos de referencia.
api.doc.swagger.definitions.xml_ns4_ChildObjectRefBaseType.description                                             = ChildObjectRefBaseType es un tipo base abstracto para referenciar cualquier objeto hijo definido directamente dentro de un objeto mantenible.
api.doc.swagger.definitions.xml_ns4_ChildObjectReferenceType.description                                           = ChildObjectReferenceType es un tipo base abstracto utilizado para referenciar un objeto concreto definido directamente dentro de un objeto mantenible. Consiste en un URN y/o un conjunto completo de campos de referencia; organismo, id mantenible (maintainableParentID), versi\u00f3n mantenible (maintainableParentVersion), el id del objeto (que puede estar anidado) y, opcionalmente, la versi\u00f3n del objeto (si procede).
api.doc.swagger.definitions.xml_ns4_CodeRefType.description                                                        = CodeRefType hace referencia a un c\u00f3digo dentro de una lista de c\u00f3digos. Se requieren campos de referencia tanto para el esquema como para el elemento.
api.doc.swagger.definitions.xml_ns4_CodeReferenceType.description                                                  = CodeReferenceType es un tipo para referenciar un objeto de c\u00f3digo. Consiste en un URN y/o un conjunto completo de campos de referencia.
api.doc.swagger.definitions.xml_ns4_CodelistMapRefType.description                                                 = CodelistMapRefType contiene un conjunto de campos de referencia para un mapa de listas de c\u00f3digos.
api.doc.swagger.definitions.xml_ns4_CodelistMapReferenceType.description                                           = CodelistMapReferenceType es un tipo para referenciar un objeto de mapa de lista de c\u00f3digos. Consiste en un URN y/o un conjunto completo de campos de referencia.
api.doc.swagger.definitions.xml_ns4_CodelistRefType.description                                                    = CodelistRefType proporciona una referencia a una lista de c\u00f3digos a trav\u00e9s de un conjunto completo de campos de referencia.
api.doc.swagger.definitions.xml_ns4_CodelistReferenceType.description                                              = CodelistReferenceType es un tipo para referenciar un objeto codelist. Consiste en un URN y/o un conjunto completo de campos de referencia.
api.doc.swagger.definitions.xml_ns4_ComponentListRefBaseType.description                                           = ComponentListRefBaseType es un tipo base abstracto para referenciar una lista de componentes dentro de una estructura.
api.doc.swagger.definitions.xml_ns4_ComponentListReferenceType.description                                         = ComponentListReferenceType es un tipo base abstracto utilizado para referenciar listas de componentes dentro de una estructura. Consiste en un URN y/o un conjunto completo de campos de referencia (agencia de estructura, id de estructura, versi\u00f3n de estructura e id de lista de componentes).
api.doc.swagger.definitions.xml_ns4_ComponentRefBaseType.description                                               = ComponentRefBaseType es un tipo base abstracto para referenciar un componente contenido en una lista de componentes dentro de una estructura.
api.doc.swagger.definitions.xml_ns4_ComponentReferenceType.description                                             = ComponentReferenceType es un tipo base abstracto utilizado para referenciar componentes dentro de una definici\u00f3n de estructura. Consiste en un URN y/o un conjunto completo de campos de referencia (agencia de estructura, id de estructura, versi\u00f3n de estructura, id de lista de componentes e id de componente).
api.doc.swagger.definitions.xml_ns4_ComponentValueSetType.description                                              = ComponentValueSetType es un tipo base abstracto que se utiliza para proporcionar un conjunto de valor para un componente referenciado. Las implementaciones de este tipo se basar\u00e1n en un tipo de componente concreto y refinar\u00e1n los valores permitidos para reflejar los tipos de valores que son posibles para ese tipo de componente.

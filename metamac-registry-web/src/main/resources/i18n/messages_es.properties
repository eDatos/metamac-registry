api.doc.swagger.definitions.xml_ns4_TimeDimensionRefType.description                                               = TimeDimensionRefType contiene una referencia a la dimensi\u00f3n temporal dentro de una definici\u00f3n de estructura de datos. Tenga en cuenta que, dado que s\u00f3lo hay un descriptor de clave, los campos de referencia del contenedor est\u00e1n prohibidos.
api.doc.swagger.definitions.xml_ns4_TimeDimensionReferenceType.description                                         = TimeDimensionReferenceType es un tipo para referenciar un objeto de dimensi\u00f3n temporal. Consiste en un URN y/o un conjunto completo de campos de referencia.
api.doc.swagger.definitions.xml_ns4_TimePeriodRangeType.description                                                = TimePeriodRangeType define un per\u00edodo de tiempo e indica si est\u00e1 incluido en un rango.
api.doc.swagger.definitions.xml_ns4_TimePeriodRangeType.properties.isInclusive.description                         = .
api.doc.swagger.definitions.xml_ns4_TimePeriodRangeType.properties.value.description                               = .
api.doc.swagger.definitions.xml_ns4_TimeRangeValueType.description                                                 = TimeRangeValueType permite expresar un valor de periodo de tiempo como un rango. Puede expresarse como el periodo antes de un periodo, despu\u00e9s de un periodo o entre dos periodos. Cada una de estas propiedades puede especificar su inclusi\u00f3n con respecto al rango.
api.doc.swagger.definitions.xml_ns4_TimeRangeValueType.properties.AfterPeriod.description                          = .
api.doc.swagger.definitions.xml_ns4_TimeRangeValueType.properties.BeforePeriod.description                         = .
api.doc.swagger.definitions.xml_ns4_TimeRangeValueType.properties.EndPeriod.description                            = .
api.doc.swagger.definitions.xml_ns4_TimeRangeValueType.properties.StartPeriod.description                          = .
api.doc.swagger.definitions.xml_ns4_TransitionRefType.description                                                  = TransitionRefType proporciona una referencia a una definici\u00f3n de transici\u00f3n en el paso de proceso a trav\u00e9s de su id.
api.doc.swagger.definitions.xml_ns4_TransitionReferenceType.description                                            = TransiationReferenceType es un tipo para referenciar un objeto de paso de proceso. Consiste en un URN y/o un conjunto completo de campos de referencia.
api.doc.swagger.definitions.xml_ns4_URNReferenceType.description                                                   = URNReferenceType es un tipo que hace referencia a cualquier objeto a trav\u00e9s de su URN. No se especifica el tipo exacto de objeto, aunque puede determinarse a partir del valor URN.
api.doc.swagger.definitions.xml_ns4_XHTMLType.description                                                          = XHTMLType permite un contenido mixto de texto y etiquetas XHTML. Cuando se utiliza este tipo, uno tendr\u00e1 que proporcionar una referencia al esquema XHTML, ya que el procesamiento de las etiquetas dentro de este tipo es estricto, lo que significa que se validan contra el esquema XHTML proporcionado.
api.doc.swagger.definitions.xml_ns4_XHTMLType.properties.lang.description                                          = .
api.doc.swagger.definitions.xml_ns5_AgencySchemeType.description                                                   = AgencySchemeType define un tipo espec\u00edfico de esquema de organizaci\u00f3n que contiene \u00fanicamente agencias de mantenimiento. El esquema de agencia mantenido por una agencia de mantenimiento concreta siempre recibe un identificador y una versi\u00f3n fijos, y nunca es definitivo. Por lo tanto, se pueden a\u00f1adir o eliminar agencias sin tener que versionar el esquema. Los esquemas de agencias no tienen jerarqu\u00eda, lo que significa que ninguna agencia puede definir una relaci\u00f3n con otra agencia del esquema. De hecho, la agencia matriz real de una agencia de un esquema es la agencia que define el esquema.
api.doc.swagger.definitions.xml_ns5_AgencyType.description                                                         = AgencyType define la estructura de la descripci\u00f3n de una agencia. Los contactos definidos para la organizaci\u00f3n son espec\u00edficos de la funci\u00f3n de agencia que desempe\u00f1a la organizaci\u00f3n.
api.doc.swagger.definitions.xml_ns5_AttachmentConstraintAttachmentType.description                                 = AttachmentConstraintAttachmentType define la estructura para especificar el objeto al que se aplica una restricci\u00f3n de adjunto.
api.doc.swagger.definitions.xml_ns5_AttachmentConstraintType.description                                           = AttachmentConstraintType describe los detalles de una restricci\u00f3n de datos adjuntos definiendo los conjuntos de claves de datos o metadatos o las regiones de componentes que pueden adjuntarse a los atributos o metadatos de referencia en los objetos adjuntos de la restricci\u00f3n.
api.doc.swagger.definitions.xml_ns5_AttributeBaseType.description                                                  = AttributeBaseType es un tipo base abstracto que sirve de base para AttributeType. Restringe la base de formato de texto a un formato de texto v\u00e1lido para componentes de datos (que no permite la representaci\u00f3n XHTML). La representaci\u00f3n local se restringe a los valores definidos en codelist. La funci\u00f3n de concepto se restringe a los valores v\u00e1lidos para un atributo de datos.
api.doc.swagger.definitions.xml_ns5_AttributeListBaseType.description                                              = AttributeListBaseType es un tipo base abstracto que se utiliza como base para AttributeListType.
api.doc.swagger.definitions.xml_ns5_AttributeListType.description                                                  = AttributeListType describe el descriptor de atributos para la definici\u00f3n de la estructura de datos.
api.doc.swagger.definitions.xml_ns5_AttributeListType.properties.ReportingYearStartDay.description                 = .
api.doc.swagger.definitions.xml_ns5_AttributeRelationshipType.description                                          = AttributeRelationshipType define la estructura para establecer la relaci\u00f3n entre un atributo y otros componentes de definici\u00f3n de estructura de datos.
api.doc.swagger.definitions.xml_ns5_AttributeRelationshipType.properties.AttachmentGroup.description               = .
api.doc.swagger.definitions.xml_ns5_AttributeRelationshipType.properties.Dimension.description                     = .
api.doc.swagger.definitions.xml_ns5_AttributeRelationshipType.properties.Group.description                         = .
api.doc.swagger.definitions.xml_ns5_AttributeRelationshipType.properties.None.description                          = .
api.doc.swagger.definitions.xml_ns5_AttributeRelationshipType.properties.PrimaryMeasure.description                = .
api.doc.swagger.definitions.xml_ns5_AttributeType.description                                                      = AttributeType describe la estructura de un atributo de datos, que se define como una caracter\u00edstica de un objeto o entidad. El atributo toma su sem\u00e1ntica, y en algunos casos su representaci\u00f3n, de su identidad conceptual. Un atributo puede codificarse haciendo referencia a una lista de c\u00f3digos de su representaci\u00f3n local codificada. Tambi\u00e9n puede especificar su formato de texto, que se utiliza como representaci\u00f3n del atributo si no se define una representaci\u00f3n codificada. Ni la representaci\u00f3n codificada ni la no codificada son necesarias, ya que el atributo puede tomarlas del concepto referenciado. Un atributo especifica su relaci\u00f3n con otros componentes de la estructura de datos y recibe un estado de asignaci\u00f3n. Estas dos propiedades dictan en qu\u00e9 parte de un mensaje de datos se adjuntar\u00e1 el atributo, y si se requerir\u00e1 o no que se le d\u00e9 un valor. Al atributo se le puede asignar un conjunto de roles definidos en el esquema del concepto.
api.doc.swagger.definitions.xml_ns5_AttributeType.properties.AttributeRelationship.description                     = .
api.doc.swagger.definitions.xml_ns5_AttributeType.properties.ConceptRole.description                               = .
api.doc.swagger.definitions.xml_ns5_AttributeType.properties.assignmentStatus.description                          = .
api.doc.swagger.definitions.xml_ns5_BaseDimensionBaseType.description                                              = BaseDimensionBaseType es un tipo base abstracto que sirve de base para cualquier dimensi\u00f3n. Restringe la base de formato de texto a un formato de texto v\u00e1lido para componentes de datos (que no permite la representaci\u00f3n XHTML).
api.doc.swagger.definitions.xml_ns5_BaseDimensionType.description                                                  = BaseDimensionType es un tipo base abstracto que define la estructura b\u00e1sica de todas las dimensiones.
api.doc.swagger.definitions.xml_ns5_BaseDimensionType.properties.ConceptRole.description                           = .
api.doc.swagger.definitions.xml_ns5_BaseDimensionType.properties.position.description                              = .
api.doc.swagger.definitions.xml_ns5_BaseDimensionType.properties.type.description                                  = .
api.doc.swagger.definitions.xml_ns5_BaseOrganisationType.description                                               = BaseOrganisationType es un tipo base abstracto que constituye la base de OrganisationType.
api.doc.swagger.definitions.xml_ns5_BasicComponentTextFormatType.description                                       = BasicComponentTextFormatType es una versi\u00f3n restringida de TextFormatType que restringe el tipo de texto a las representaciones permitidas para todos los componentes excepto para los objetos de destino.
api.doc.swagger.definitions.xml_ns5_CategorisationType.description                                                 = CategorisationType es define la estructura para una categorizaci\u00f3n. Se hace referencia a un objeto de origen a trav\u00e9s de una referencia de objeto y a la categor\u00eda de destino a trav\u00e9s de la categor\u00eda de destino.
api.doc.swagger.definitions.xml_ns5_CategorisationType.properties.Source.description                               = .
api.doc.swagger.definitions.xml_ns5_CategorisationType.properties.Target.description                               = .
api.doc.swagger.definitions.xml_ns5_CategoryMapType.description                                                    = CategoryMapType define la estructura para mapear dos categor\u00edas. Se proporciona una referencia local tanto a la categor\u00eda de origen como a la de destino.
api.doc.swagger.definitions.xml_ns5_CategorySchemeMapType.description                                              = CategorySchemeMapType define la estructura de un mapa que identifica las relaciones entre categor\u00edas en diferentes esquemas de categor\u00edas.
api.doc.swagger.definitions.xml_ns5_CategorySchemeType.description                                                 = CategorySchemeType describe la estructura de un esquema de categor\u00edas. Un esquema de categor\u00edas es la informaci\u00f3n descriptiva de una ordenaci\u00f3n o divisi\u00f3n de categor\u00edas en grupos basados en caracter\u00edsticas, que los objetos tienen en com\u00fan. Esto proporciona una jerarqu\u00eda simple y nivelada o categor\u00edas.
api.doc.swagger.definitions.xml_ns5_CategoryType.description                                                       = CategoryType describe los detalles de una categor\u00eda. Una categor\u00eda se define como un elemento en cualquier nivel de una clasificaci\u00f3n. El elemento Category representa un conjunto de categor\u00edas anidadas que son categor\u00edas hijas.
api.doc.swagger.definitions.xml_ns5_CodeMapType.description                                                        = CodeMapType define la estructura para mapear dos c\u00f3digos. Se proporciona una referencia local tanto al c\u00f3digo de origen como al de destino.
api.doc.swagger.definitions.xml_ns5_CodeType.description                                                           = CodeType describe la estructura de un c\u00f3digo. Un c\u00f3digo se define como un conjunto independiente del lenguaje de letras, n\u00fameros o s\u00edmbolos que representan un concepto cuyo significado se describe en un lenguaje natural. La informaci\u00f3n de presentaci\u00f3n que no est\u00e9 presente puede a\u00f1adirse mediante el uso de anotaciones.
api.doc.swagger.definitions.xml_ns5_CodededTextFormatType.description                                              = CodededTextFormatType es una versi\u00f3n restringida de SimpleComponentTextFormatType que s\u00f3lo permite facetas y tipos de texto aplicables a c\u00f3digos. Aunque las facetas de hora permiten cualquier valor, un identificador de c\u00f3digo real no admite los caracteres necesarios para la hora. Por lo tanto, estas facetas no deben contener la hora en sus valores.
api.doc.swagger.definitions.xml_ns5_CodelistMapType.description                                                    = CodelistMapType define la estructura de un mapa que identifica las relaciones entre los c\u00f3digos de diferentes listas de c\u00f3digos.
api.doc.swagger.definitions.xml_ns5_CodelistType.description                                                       = CodelistType define la estructura de una lista de c\u00f3digos. Una lista de c\u00f3digos se define como una lista de la que algunos conceptos estad\u00edsticos (conceptos codificados) toman sus valores.
api.doc.swagger.definitions.xml_ns5_CodingTextFormatType.description                                               = 
api.doc.swagger.definitions.xml_ns5_ComponentBaseType.description                                                  = ComponentBaseType es un tipo abstracto que s\u00f3lo sirve para formar la base del ComponentType real. S\u00f3lo restringe el formato del atributo id al NCNameIDType.
api.doc.swagger.definitions.xml_ns5_ComponentListType.description                                                  = ComponentListType es un tipo base abstracto para todas las listas de componentes. Contiene una colecci\u00f3n de componentes. Los tipos concretos deben restringir esto a componentes concretos espec\u00edficos.
api.doc.swagger.definitions.xml_ns5_ComponentListType.properties.Component.description                             = .
api.doc.swagger.definitions.xml_ns5_ComponentMapType.description                                                   = ComponentMapType define la estructura para relacionar un componente en una estructura de origen con un componente en una estructura de destino.
api.doc.swagger.definitions.xml_ns5_ComponentMapType.properties.RepresentationMapping.description                  = .
api.doc.swagger.definitions.xml_ns5_ComponentMapType.properties.Source.description                                 = .
api.doc.swagger.definitions.xml_ns5_ComponentMapType.properties.Target.description                                 = .
api.doc.swagger.definitions.xml_ns5_ComponentType.description                                                      = ComponentType es un tipo base abstracto para todos los componentes. Contiene informaci\u00f3n relativa a un componente, incluida una referencia opcional a un concepto, una funci\u00f3n opcional desempe\u00f1ada por el concepto, una descripci\u00f3n opcional en formato de texto y una representaci\u00f3n local opcional.
api.doc.swagger.definitions.xml_ns5_ComponentType.properties.ConceptIdentity.description                           = .
api.doc.swagger.definitions.xml_ns5_ComponentType.properties.LocalRepresentation.description                       = .
api.doc.swagger.definitions.xml_ns5_ComputationType.description                                                    = ComputationType describe una computaci\u00f3n en un proceso.
api.doc.swagger.definitions.xml_ns5_ComputationType.properties.Description.description                             = .
api.doc.swagger.definitions.xml_ns5_ComputationType.properties.localID.description                                 = .
api.doc.swagger.definitions.xml_ns5_ComputationType.properties.softwareLanguage.description                        = .
api.doc.swagger.definitions.xml_ns5_ComputationType.properties.softwarePackage.description                         = .
api.doc.swagger.definitions.xml_ns5_ComputationType.properties.softwareVersion.description                         = .
api.doc.swagger.definitions.xml_ns5_ConceptBaseType.description                                                    = ConceptBaseType es un tipo base abstracto que forma la base del ConceptType al requerir un nombre y un id, y restringir el contenido del id.
api.doc.swagger.definitions.xml_ns5_ConceptMapType.description                                                     = ConceptMapType define la estructura para mapear dos conceptos. Se proporciona una referencia local tanto al concepto de origen como al de destino.
api.doc.swagger.definitions.xml_ns5_ConceptRepresentation.description                                              = ConceptRepresentation define el n\u00facleo de representaci\u00f3n que se permiten para un concepto. El formato de texto permitido para un concepto es el que se permite para cualquier componente de objeto no objetivo.
api.doc.swagger.definitions.xml_ns5_ConceptSchemeMapType.description                                               = ConceptSchemeMapType define la estructura de un mapa que identifica las relaciones entre conceptos en diferentes esquemas conceptuales.
api.doc.swagger.definitions.xml_ns5_ConceptSchemeType.description                                                  = ConceptSchemeType describe la estructura de un esquema conceptual. Un esquema conceptual es la informaci\u00f3n descriptiva de una ordenaci\u00f3n o divisi\u00f3n de conceptos en grupos basados en caracter\u00edsticas, que los objetos tienen en com\u00fan. Contiene una colecci\u00f3n de definiciones de conceptos, que pueden organizarse en jerarqu\u00edas simples.
api.doc.swagger.definitions.xml_ns5_ConceptType.description                                                        = ConceptType describe los detalles de un concepto. Un concepto se define como una unidad de conocimiento creada por una combinaci\u00f3n \u00fanica de caracter\u00edsticas. Si un concepto no especifica un TextFormat o una representaci\u00f3n b\u00e1sica, se supone que la representaci\u00f3n del concepto est\u00e1 representada por cualquier conjunto de caracteres v\u00e1lidos (correspondientes al tipo de datos xs:string de W3C XML Schema).
api.doc.swagger.definitions.xml_ns5_ConceptType.properties.CoreRepresentation.description                          = .
api.doc.swagger.definitions.xml_ns5_ConceptType.properties.ISOConceptReference.description                         = .
api.doc.swagger.definitions.xml_ns5_ConstraintAttachmentType.description                                           = ConstraintAttachmentType describe una colecci\u00f3n de referencias a artefactos limitables.
api.doc.swagger.definitions.xml_ns5_ConstraintAttachmentType.properties.DataProvider.description                   = .

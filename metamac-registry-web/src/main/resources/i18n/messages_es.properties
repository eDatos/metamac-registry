api.doc.swagger.definitions.xml_ns4_LocalMetadataTargetReferenceType.description                                   = LocalMetadataTargetReferenceType is a type for referencing a metadata target locally, where the reference to the defining metadata structure definition is provided in another context (e.g., the metadata structure definition in which the reference occurs).<p>Java class for the complex type LocalMetadataTargetReferenceType.<p>The following schema fragment specifies the expected content included in this class.
api.doc.swagger.definitions.xml_ns4_LocalOrganisationRefBaseType.description                                       = LocalOrganisationRefBaseType es un tipo base abstracto que hace referencia a una organizaci\u00f3n localmente cuando la referencia al esquema de organizaci\u00f3n que la define se proporciona en otro lugar.

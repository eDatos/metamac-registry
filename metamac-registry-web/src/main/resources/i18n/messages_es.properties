api.doc.swagger.definitions.xml_ns4_ReferenceType.description                                                      = ReferenceType es un tipo base abstracto. Se utiliza como base para todas las referencias, a todas para una referencia de objeto gen\u00e9rica de nivel superior que puede sustituirse por una referencia expl\u00edcita a cualquier objeto. Cualquier referencia puede consistir en una Ref (que contiene todos los campos de referencia requeridos por separado) y/o un URN. \u00c9stos deben dar como resultado la identificaci\u00f3n del mismo objeto. N\u00f3tese que los elementos Ref y URN son locales y no cualificados para permitir el refinamiento de esta estructura fuera del espacio de nombres. Esto permite que cualquier referencia pueda ser refinada por un espacio de nombres diferente. Por ejemplo, un conjunto de metadatos espec\u00edfico para la definici\u00f3n de una estructura de metadatos podr\u00eda desear restringir el URN para permitir \u00fanicamente un valor de una lista enumerada. 
api.doc.swagger.definitions.xml_ns4_ReferenceType.properties.Ref.description                                       = .
api.doc.swagger.definitions.xml_ns4_ReferenceType.properties.URN.description                                       = .
api.doc.swagger.definitions.xml_ns4_RegionType.description                                                         = RegionType es un tipo abstracto que define una regi\u00f3n de restricci\u00f3n gen\u00e9rica. Este tipo puede refinarse para definir regiones para conjuntos de datos o metadatos. Una regi\u00f3n se define mediante una colecci\u00f3n de valores clave, cada uno de los cuales es una colecci\u00f3n de valores para un componente que desambigua los datos o metadatos (es decir, las dimensiones o los objetos objetivo de un objetivo de metadatos). Para cada regi\u00f3n, puede proporcionarse una colecci\u00f3n de valores de atributo. En conjunto, los valores clave y los atributos sirven para identificar o describir un subconjunto de un conjunto de datos o metadatos. Por \u00faltimo, la regi\u00f3n puede marcarse como incluida o excluida, aunque esta marca s\u00f3lo tiene sentido cuando la regi\u00f3n se utiliza en un contexto determinado.

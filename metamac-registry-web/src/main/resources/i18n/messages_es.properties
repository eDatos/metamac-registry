api.doc.swagger.definitions.xml_ns4_ProvisionAgreementReferenceType.description                                    = ProvisionAgreementReferenceType es un tipo para referenciar un acuerdo de provisi\u00f3n. Consiste en un URN y/o un conjunto completo de campos de referencia.
api.doc.swagger.definitions.xml_ns4_QueryableDataSourceType.description                                            = QueryableDataSourceType describe una fuente de datos que acepta un mensaje de consulta SDMX est\u00e1ndar y responde adecuadamente.

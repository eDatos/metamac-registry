api.doc.swagger.definitions.xml_ns5_TimeDimensionRepresentationType.description                                    = TimeDimensionRepresentationType define la representaci\u00f3n para la dimensi\u00f3n temporal. No se permiten valores enumerados.
api.doc.swagger.definitions.xml_ns5_TimeDimensionType.description                                                  = TimeDimensionType describe la estructura de una dimensi\u00f3n temporal. La dimensi\u00f3n temporal toma su sem\u00e1ntica de la identidad de su concepto (normalmente el concepto TIME_PERIOD), aunque siempre tiene un identificador fijo (TIME_PERIOD). La dimensi\u00f3n temporal siempre tiene un formato de texto fijo, que especifica que su formato es siempre el del conjunto de valores del per\u00edodo de tiempo de observaci\u00f3n (v\u00e9ase common:ObservationalTimePeriodType). Es posible que el formato sea un subconjunto del conjunto de valores del per\u00edodo de tiempo de observaci\u00f3n. Por ejemplo, es posible establecer que la representaci\u00f3n sea siempre un a\u00f1o natural. V\u00e9anse las enumeraciones del atributo textType en LocalRepresentation/TextFormat para m\u00e1s detalles sobre los posibles subconjuntos. Tambi\u00e9n es posible facetar esta representaci\u00f3n con fechas de inicio y fin. El prop\u00f3sito de estos hechos es restringir el valor de la dimensi\u00f3n temporal para que ocurra dentro del rango especificado. Si se espera que la dimensi\u00f3n temporal permita utilizar los per\u00edodos de informaci\u00f3n est\u00e1ndar (v\u00e9ase common:ReportingTimePeriodType), se recomienda encarecidamente que el atributo de d\u00eda de inicio del a\u00f1o de informaci\u00f3n tambi\u00e9n se incluya en la definici\u00f3n de la estructura de datos. Cuando se utilice el atributo del d\u00eda de inicio del a\u00f1o de referencia, se asumir\u00e1 que los valores de cualquier per\u00edodo de referencia est\u00e1ndar se basan en el d\u00eda de inicio contenido en este atributo. Si no se incluye el atributo de d\u00eda de inicio del a\u00f1o de referencia y se utilizan per\u00edodos de referencia est\u00e1ndar, se asumir\u00e1 que estos valores se basan en un a\u00f1o de referencia que comienza el 1 de enero.
api.doc.swagger.definitions.xml_ns5_TimeTextFormatType.description                                                 = TimeTextFormat es una versi\u00f3n restringida de SimpleComponentTextFormatType que s\u00f3lo permite el formato basado en el tiempo y especifica una representaci\u00f3n ObservationalTimePeriod predeterminada y facetas de una hora de inicio y final.
api.doc.swagger.definitions.xml_ns5_ToValueTypeType.description                                                    = 
api.doc.swagger.definitions.xml_ns5_TransitionType.description                                                     = TransitionType describe los detalles de una transici\u00f3n, que es una expresi\u00f3n de forma textual o formalizada de la transformaci\u00f3n de datos entre dos operaciones espec\u00edficas realizadas sobre los datos.

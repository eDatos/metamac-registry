api.doc.swagger.definitions.xml_ns5_NonFacetedTextFormatType.description                                           = NonFacetedTextFormatType es una versi\u00f3n restringida de SimpleComponentTextFormatType que no permite ninguna faceta.
api.doc.swagger.definitions.xml_ns5_OrganisationMapType.description                                                = OrganisationMapType define la estructura para mapear dos organizaciones. Se proporciona una referencia local tanto a la organizaci\u00f3n de origen como a la de destino.
api.doc.swagger.definitions.xml_ns5_OrganisationSchemeBaseType.description                                         = OrganisationSchemeBaseType es un tipo base abstracto para cualquier esquema de organizaci\u00f3n.
api.doc.swagger.definitions.xml_ns5_OrganisationSchemeMapType.description                                          = OrganisationSchemeMapType define la estructura de un mapa que identifica las relaciones entre organizaciones en diferentes esquemas de organizaci\u00f3n.
api.doc.swagger.definitions.xml_ns5_OrganisationSchemeType.description                                             = OrganisationSchemeType describe la estructura de un esquema de organizaci\u00f3n.
api.doc.swagger.definitions.xml_ns5_OrganisationSchemeType.properties.Organisation.description                     = .
api.doc.swagger.definitions.xml_ns5_OrganisationType.description                                                   = OrganisationType en un tipo abstracto que describe la estructura de los detalles de una organizaci\u00f3n. Adem\u00e1s de la identificaci\u00f3n b\u00e1sica de la organizaci\u00f3n, se pueden proporcionar datos de contacto.
api.doc.swagger.definitions.xml_ns5_OrganisationType.properties.Contact.description                                = .
api.doc.swagger.definitions.xml_ns5_OrganisationUnitSchemeType.description                                         = OrganisationUnitSchemeType define un tipo de esquema de organizaci\u00f3n que simplemente define las organizaciones y sus relaciones padre-hijo. A las organizaciones de este esquema no se les asigna ninguna funci\u00f3n en particular y, de hecho, pueden existir tambi\u00e9n dentro de los otros tipos de esquemas de organizaci\u00f3n.
api.doc.swagger.definitions.xml_ns5_OrganisationUnitType.description                                               = OrganisationUnitType define la estructura de la descripci\u00f3n de una unidad de organizaci\u00f3n. Adem\u00e1s de la identificaci\u00f3n general y la informaci\u00f3n de contacto, una unidad de organizaci\u00f3n puede especificar una relaci\u00f3n con otra unidad de organizaci\u00f3n del mismo esquema que es su organizaci\u00f3n matriz.
api.doc.swagger.definitions.xml_ns5_PrimaryMeasureType.description                                                 = PrimaryMeasureType describe la estructura de la medida primaria. Describe los valores de observaci\u00f3n para todas las presentaciones de los datos. La medida primaria toma su sem\u00e1ntica, y en algunos casos su representaci\u00f3n, de su identidad conceptual (convencionalmente el concepto OBS_VALUE). La medida primaria puede codificarse haciendo referencia a una lista de c\u00f3digos de su representaci\u00f3n local codificada. Tambi\u00e9n puede especificar su formato de texto, que se utiliza como representaci\u00f3n de la medida primaria si no se define una representaci\u00f3n codificada. Ni la representaci\u00f3n codificada ni la no codificada son necesarias, ya que la medida primaria puede tomarlas del concepto referenciado. Obs\u00e9rvese que si la estructura de datos declara una dimensi\u00f3n de medida, la representaci\u00f3n de \u00e9sta debe ser un superconjunto de todas las posibles representaciones del concepto de medida.
api.doc.swagger.definitions.xml_ns5_ProcessStepBaseType.description                                                = ProcessStepBaseType es un tipo base abstracto utilizado como base para el tipo ProcessStepType.
api.doc.swagger.definitions.xml_ns5_ProcessStepType.description                                                    = ProcessStepType describe la estructura de una etapa de proceso. Un paso de proceso anidado es autom\u00e1ticamente sub-ordinado, y seguido como el siguiente paso. Si el siguiente paso es condicional, debe ser referenciado en una transici\u00f3n.
api.doc.swagger.definitions.xml_ns5_ProcessStepType.properties.Computation.description                             = .
api.doc.swagger.definitions.xml_ns5_ProcessStepType.properties.Input.description                                   = .
api.doc.swagger.definitions.xml_ns5_ProcessStepType.properties.Output.description                                  = .
api.doc.swagger.definitions.xml_ns5_ProcessStepType.properties.ProcessStep.description                             = .
api.doc.swagger.definitions.xml_ns5_ProcessStepType.properties.Transition.description                              = .
api.doc.swagger.definitions.xml_ns5_ProcessType.description                                                        = ProcessType describe la estructura de un proceso, que es un esquema que define o documenta las operaciones realizadas en los datos con el fin de validar los datos o derivar nueva informaci\u00f3n de acuerdo con un conjunto dado de reglas. Los procesos ocurren en orden, y continuar\u00e1n en orden a menos que una transici\u00f3n dicte que debe ocurrir otro paso.
api.doc.swagger.definitions.xml_ns5_ProcessType.properties.ProcessStep.description                                 = .
api.doc.swagger.definitions.xml_ns5_ProvisionAgreementType.description                                             = ProvisionAgreementType describe la estructura de un acuerdo de provisi\u00f3n. Un acuerdo de provisi\u00f3n define un acuerdo para que un proveedor de datos informe datos o metadatos de referencia contra un flujo. Se suministran atributos que describen c\u00f3mo debe comportarse el registro cuando se registran datos o metadatos en relaci\u00f3n con este acuerdo de provisi\u00f3n.
api.doc.swagger.definitions.xml_ns5_ProvisionAgreementType.properties.DataProvider.description                     = .
api.doc.swagger.definitions.xml_ns5_ProvisionAgreementType.properties.StructureUsage.description                   = .
api.doc.swagger.definitions.xml_ns5_ReleaseCalendarType.description                                                = ReleaseCalendarType describe informaci\u00f3n sobre el calendario de publicaci\u00f3n de los datos limitados. Todos estos valores utilizan el formato est\u00e1ndar de estilo «P7D».
api.doc.swagger.definitions.xml_ns5_ReleaseCalendarType.properties.Offset.description                              = .
api.doc.swagger.definitions.xml_ns5_ReleaseCalendarType.properties.Periodicity.description                         = .
api.doc.swagger.definitions.xml_ns5_ReleaseCalendarType.properties.Tolerance.description                           = .
api.doc.swagger.definitions.xml_ns5_ReportPeriodRepresentationType.description                                     = ReportPeriodRepresentationType define las posibles representaciones locales de un objeto objetivo de per\u00edodo de informe. La representaci\u00f3n debe ser un per\u00edodo de tiempo o un subconjunto de esta representaci\u00f3n.
api.doc.swagger.definitions.xml_ns5_ReportPeriodTargetType.description                                             = ReportPeriodTargetType define la estructura de un objeto objetivo de per\u00edodo de informe. El objeto de destino de per\u00edodo de informe tiene una representaci\u00f3n y un identificador fijos.
api.doc.swagger.definitions.xml_ns5_ReportStructureBaseType.description                                            = ReportStructureBaseType es un tipo base abstracto que sirve de base para el tipo complejo ReportStructureType.
api.doc.swagger.definitions.xml_ns5_ReportStructureType.description                                                = ReportStructureType describe la estructura de una estructura de informe. Comprende un conjunto de atributos de metadatos que pueden definirse como una jerarqu\u00eda, e identifica la posible vinculaci\u00f3n de estos atributos a un objeto mediante la referencia a un identificador de destino.
api.doc.swagger.definitions.xml_ns5_ReportStructureType.properties.MetadataTarget.description                      = .
api.doc.swagger.definitions.xml_ns5_ReportingCategoryBaseType.description                                          = ReportingCategoryBaseType es un tipo base abstracto que sirve de base para ReportingCategoryType.
api.doc.swagger.definitions.xml_ns5_ReportingCategoryMapType.description                                           = ReportingCategoryMapType define la estructura para mapear dos categor\u00edas de informes. Se proporciona una referencia local tanto a la categor\u00eda de origen como a la de destino.
api.doc.swagger.definitions.xml_ns5_ReportingCategoryType.description                                              = ReportingCategoryType describe la estructura de una categor\u00eda de informes, que agrupa los usos de la estructura en subpaquetes \u00fatiles. Dentro de la definici\u00f3n de la categor\u00eda se pueden anidar subcategor\u00edas de informes.
api.doc.swagger.definitions.xml_ns5_ReportingCategoryType.properties.ProvisioningMetadata.description              = .
api.doc.swagger.definitions.xml_ns5_ReportingCategoryType.properties.StructuralMetadata.description                = .
api.doc.swagger.definitions.xml_ns5_ReportingTaxonomyMapType.description                                           = ReportingTaxonomyMapType define la estructura de un mapa que identifica las relaciones entre las categor\u00edas de informes en diferentes taxonom\u00edas de informes.
api.doc.swagger.definitions.xml_ns5_ReportingTaxonomyType.description                                              = ReportingTaxonomyType describe la estructura de una taxonom\u00eda de informes, que es un esquema que define la estructura de composici\u00f3n de un informe de datos en el que cada componente puede describirse mediante una estructura independiente o una descripci\u00f3n de uso de estructura.
api.doc.swagger.definitions.xml_ns5_ReportingYearStartDayRepresentationType.description                            = ReportingYearStartDayRepresentationType define la representaci\u00f3n del atributo del d\u00eda de inicio del a\u00f1o del informe. No se permiten valores enumerados y el formato de texto se fija en un d\u00eda y un mes en el formato ISO 8601 de '--MM-DD'.
api.doc.swagger.definitions.xml_ns5_ReportingYearStartDayTextFormatType.description                                = ReportingYearStartDayTextFormatType es una versi\u00f3n restringida del NonFacetedTextFormatType que fija el valor del tipo de texto en DayMonth. Este tipo existe \u00fanicamente con el fin de fijar la representaci\u00f3n del atributo del d\u00eda de inicio del a\u00f1o del informe.
api.doc.swagger.definitions.xml_ns5_ReportingYearStartDayType.description                                          = ReportingYearStartDayType define la estructura del atributo de d\u00eda de inicio del a\u00f1o de referencia. El atributo del a\u00f1o de inicio del d\u00eda del informe toma su sem\u00e1ntica de su concepto de identidad (normalmente el concepto REPORTING_YEAR_START_DAY), aunque siempre tiene un identificador fijo (REPORTING_YEAR_START_DAY). El atributo REPORTING_YEAR_START_DAY siempre tiene un formato de texto fijo, que especifica que el formato de su valor es siempre un d\u00eda y un mes en el formato ISO 8601 de «--MM-DD». Al igual que con cualquier otro atributo, debe especificarse una relaci\u00f3n de atributo. Esta relaci\u00f3n debe seleccionarse cuidadosamente, ya que determinar\u00e1 qu\u00e9 tipo de datos permitir\u00e1 la definici\u00f3n de la estructura de datos. Por ejemplo, si no se especifica ninguna relaci\u00f3n de atributo, los conjuntos de datos que se ajusten a esta definici\u00f3n de estructura de datos s\u00f3lo podr\u00e1n contener datos con periodos de referencia est\u00e1ndar en los que todos los periodos de referencia tengan el mismo d\u00eda de inicio. En este caso, los datos notificados como per\u00edodos de informaci\u00f3n est\u00e1ndar de dos entidades con d\u00edas de inicio de ejercicio diferentes no podr\u00edan estar contenidos en el mismo conjunto de datos.
api.doc.swagger.definitions.xml_ns5_RepresentationMapType.description                                              = RepresentationMapType describe la estructura de la asignaci\u00f3n del valor de un componente de origen a un componente de destino. Debe proporcionarse una referencia a otro mapa definido dentro del conjunto de estructuras que lo contiene o una descripci\u00f3n de los formatos de texto de origen y destino. Tenga en cuenta que, para los componentes de la gama de claves, s\u00f3lo es relevante una referencia a un mapa de lista de c\u00f3digos, ya que es el \u00fanico tipo de representaci\u00f3n codificada permitido en una gama de claves.
api.doc.swagger.definitions.xml_ns5_RepresentationMapType.properties.CodelistMap.description                       = .
api.doc.swagger.definitions.xml_ns5_RepresentationMapType.properties.ToTextFormat.description                      = .
api.doc.swagger.definitions.xml_ns5_RepresentationMapType.properties.ToValueType.description                       = .
api.doc.swagger.definitions.xml_ns5_RepresentationMapType.properties.ValueMap.description                          = .
api.doc.swagger.definitions.xml_ns5_RepresentationType.description                                                 = RepresentationType es un tipo abstracto que define una representaci\u00f3n. Debido a que el tipo de esquemas de elementos que se permiten como una enumeraci\u00f3n var\u00edan en funci\u00f3n del objeto en el que se define, este tipo es abstracto para obligar a que la referencia de enumeraci\u00f3n se restrinja al tipo adecuado de referencia de esquema de elementos.
api.doc.swagger.definitions.xml_ns5_RepresentationType.properties.Enumeration.description                          = .
api.doc.swagger.definitions.xml_ns5_RepresentationType.properties.EnumerationFormat.description                    = .
api.doc.swagger.definitions.xml_ns5_RepresentationType.properties.TextFormat.description                           = .
api.doc.swagger.definitions.xml_ns5_SimpleComponentTextFormatType.description                                      = SimpleComponentTextFormatType es una versi\u00f3n restringida de BasicComponentTextFormatType que no permite valores multilingües.
api.doc.swagger.definitions.xml_ns5_SimpleDataStructureRepresentationType.description                              = SimpleDataStructureRepresentationType define la representaci\u00f3n para cualquier componente de definici\u00f3n de estructura de datos sin dimensi\u00f3n de medida ni de tiempo.
api.doc.swagger.definitions.xml_ns5_StructureMapBaseType.description                                               = StructureMapBaseType es un tipo base abstracto que constituye la base de StructureMapType.
api.doc.swagger.definitions.xml_ns5_StructureMapType.description                                                   = StructureMapType define la estructura para asignar componentes de una estructura a componentes de otra estructura. Una estructura puede ser referenciada directamente, lo que significa que el mapa se aplica dondequiera que se utilice la estructura, o puede ser una referencia a trav\u00e9s del uso de una estructura, lo que significa que el mapa s\u00f3lo se aplica en el contexto de ese uso. Utilizando las estructuras relacionadas, se pueden hacer extrapolaciones entre mapas. Por ejemplo, si las familias de claves A, B y C est\u00e1n agrupadas en un contenedor de estructuras relacionadas, se puede utilizar un mapa de la familia de claves A a la C y un mapa de la familia de claves B a la C para inferir una relaci\u00f3n entre la familia de claves A y la C.
api.doc.swagger.definitions.xml_ns5_StructureMapType.properties.ComponentMap.description                           = .
api.doc.swagger.definitions.xml_ns5_StructureMapType.properties.Source.description                                 = .
api.doc.swagger.definitions.xml_ns5_StructureMapType.properties.Target.description                                 = .
api.doc.swagger.definitions.xml_ns5_StructureMapType.properties.isExtension.description                            = .
api.doc.swagger.definitions.xml_ns5_StructureSetBaseType.description                                               = StructureSetBaseType es un tipo base abstracto que constituye la base de StructureSetType.
api.doc.swagger.definitions.xml_ns5_StructureSetType.description                                                   = StructureSetType describe la estructura de un conjunto de estructuras. Permite que los componentes de una estructura, una utilizaci\u00f3n de estructura o un esquema de elementos se asignen a componentes de otro componente estructural del mismo tipo.
api.doc.swagger.definitions.xml_ns5_StructureSetType.properties.CategorySchemeMap.description                      = .
api.doc.swagger.definitions.xml_ns5_StructureSetType.properties.CodelistMap.description                            = .
api.doc.swagger.definitions.xml_ns5_StructureSetType.properties.ConceptSchemeMap.description                       = .
api.doc.swagger.definitions.xml_ns5_StructureSetType.properties.HybridCodelistMap.description                      = .
api.doc.swagger.definitions.xml_ns5_StructureSetType.properties.OrganisationSchemeMap.description                  = .
api.doc.swagger.definitions.xml_ns5_StructureSetType.properties.RelatedStructure.description                       = .
api.doc.swagger.definitions.xml_ns5_StructureSetType.properties.ReportingTaxonomyMap.description                   = .
api.doc.swagger.definitions.xml_ns5_StructureSetType.properties.StructureMap.description                           = .
api.doc.swagger.definitions.xml_ns5_StructureType.description                                                      = StructureType es un tipo base abstracto para todos los objetos de estructura. Las instancias concretas de este deben restringirse a una agrupaci\u00f3n concreta.
api.doc.swagger.definitions.xml_ns5_StructureType.properties.Grouping.description                                  = .
api.doc.swagger.definitions.xml_ns5_StructureUsageType.description                                                 = StructureUsageType es un tipo base abstracto para todos los usos de estructuras. Contiene una referencia a una estructura. Las instancias concretas de este tipo deben restringir el tipo de estructura a la que se hace referencia.
api.doc.swagger.definitions.xml_ns5_StructureUsageType.properties.Structure.description                            = .
api.doc.swagger.definitions.xml_ns5_TargetObject.description                                                       = TargetObject es un tipo base abstracto del que derivan todos los objetos objetivo de un objetivo de metadatos. Se basa en un componente. Las implementaciones de este refinar\u00e1n la representaci\u00f3n local para que los valores permitidos reflejen con precisi\u00f3n la representaci\u00f3n de la referencia del objeto de destino.
api.doc.swagger.definitions.xml_ns5_TargetObjectTextFormatType.description                                         = TargetObjectTextFormatType es una versi\u00f3n restringida de TextFormatType que no permite ninguna faceta y s\u00f3lo permite los tipos de texto de los objetos de destino.
api.doc.swagger.definitions.xml_ns5_TextFormatType.description                                                     = TextFormatType define la informaci\u00f3n para describir una gama completa de formatos de texto y puede imponer restricciones a los valores de los dem\u00e1s atributos, denominados «facets».
api.doc.swagger.definitions.xml_ns5_TextFormatType.properties.decimals.description                                 = .
api.doc.swagger.definitions.xml_ns5_TextFormatType.properties.endTime.description                                  = .
api.doc.swagger.definitions.xml_ns5_TextFormatType.properties.endValue.description                                 = .

api.doc.swagger.definitions.xml_ns7_FooterMessageType.description                                                  = FooterMessageType define la estructura de un mensaje que est\u00e1 contenido en el pie de p\u00e1gina de un mensaje. Se trata de un mensaje de estado al que se a\u00f1ade un c\u00f3digo de gravedad de Error, Informaci\u00f3n o Advertencia.
api.doc.swagger.definitions.xml_ns7_FooterMessageType.properties.severity.description                              = .
api.doc.swagger.definitions.xml_ns7_FooterType.description                                                         = FooterType describe la estructura del pie de un mensaje. El pie de p\u00e1gina se utiliza para transmitir cualquier mensaje de error, informaci\u00f3n o advertencia. Se debe utilizar cuando el mensaje tiene carga \u00fatil, pero tambi\u00e9n necesita comunicar informaci\u00f3n adicional. Si se produce un error y no se genera ninguna carga \u00fatil, debe devolverse un mensaje Error.
api.doc.swagger.definitions.xml_ns7_FooterType.properties.Message.description                                      = .
api.doc.swagger.definitions.xml_ns7_QueryableDataSourceType.description                                            = QueryableDataSourceType describe una fuente de datos consultable y a\u00f1ade un atributo fijo para garantizar que s\u00f3lo se puede proporcionar una fuente consultable.
api.doc.swagger.definitions.xml_ns7_QueryableDataSourceType.properties.TYPE.description                            = .

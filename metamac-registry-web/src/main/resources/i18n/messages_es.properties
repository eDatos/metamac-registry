api.doc.swagger.definitions.xml_ns4_StructureOrUsageRefBaseType.description                                        = StructureOrUsageRefBaseType es un tipo base abstracto para referenciar una estructura o un uso de estructura.
api.doc.swagger.definitions.xml_ns4_StructureOrUsageRefType.description                                            = StructureOrUsageRefType es un tipo para referenciar una estructura o el uso de una estructura.
api.doc.swagger.definitions.xml_ns4_StructureOrUsageReferenceType.description                                      = StructureOrUsageReferenceType es un tipo espec\u00edfico de referencia para referenciar una estructura o un uso de una estructura. Consiste en un URN y/o un conjunto completo de campos de referencia; agencia, id y versi\u00f3n. Si se utiliza el conjunto completo de campos de referencia, se requiere que se proporcione una clase y un paquete para que quede claro el tipo de objeto al que se hace referencia.

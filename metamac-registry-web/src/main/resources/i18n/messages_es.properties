api.doc.swagger.definitions.xml_ns9_TargetType.description                                                         = TargetType es un tipo base abstracto que forma la base de un valor objetivo de metadatos del informe de metadatos. Este tipo est\u00e1 restringido en el esquema espec\u00edfico de definici\u00f3n de estructura de metadatos para que los elementos ReferenceValue se ajusten a los objetivos especificados en el objetivo de metadatos definido en la definici\u00f3n de estructura de metadatos.

api.doc.swagger.definitions.xml_ns3_MessageType.description                                                        = MessageType es un tipo abstracto que es utilizado por todos los mensajes, para permitir la herencia de caracter\u00edsticas comunes. Cada mensaje consta de una cabecera obligatoria, seguida de una carga \u00fatil opcional (que puede aparecer varias veces) y, por \u00faltimo, una secci\u00f3n de pie de p\u00e1gina opcional para transmitir mensajes de error, advertencia e informativos.

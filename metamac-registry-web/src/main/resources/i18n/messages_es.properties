api.doc.swagger.definitions.xml_ns5_MaintainableType.properties.structureURL.description                           = .
api.doc.swagger.definitions.xml_ns5_MeasureDimensionRepresentationType.description                                 = BaseDimensionRepresentationType es una base abstracta que define la representaci\u00f3n para una dimensi\u00f3n de medida.
api.doc.swagger.definitions.xml_ns5_MeasureDimensionType.description                                               = MeasureDimensionType define la estructura de la dimensi\u00f3n medida. Se deriva de la estructura de dimensi\u00f3n base, pero requiere que se proporcione una representaci\u00f3n codificada tomada de un esquema de conceptos.
api.doc.swagger.definitions.xml_ns5_MeasureListType.description                                                    = MeasureListType describe la estructura del descriptor de medida para una definici\u00f3n de estructura de datos. S\u00f3lo puede definirse un primario.
api.doc.swagger.definitions.xml_ns5_MetadataAttributeBaseType.description                                          = MetadataAttributeBaseType es un tipo base abstracto que sirve de base para MetadataAttributeType.
api.doc.swagger.definitions.xml_ns5_MetadataAttributeRepresentationType.description                                = MetadataAttributeRepresentationType define las posibles representaciones locales de un atributo de metadatos.
api.doc.swagger.definitions.xml_ns5_MetadataAttributeType.description                                              = MetadataAttributeType describe la estructura de un atributo de metadatos. El atributo de metadatos toma su sem\u00e1ntica, y en algunos casos su representaci\u00f3n, de su identidad conceptual. Un atributo de metadatos puede estar codificado (mediante la representaci\u00f3n local), no codificado (mediante el formato de texto) o no tener valor. Adem\u00e1s de este valor, el atributo de metadatos tambi\u00e9n puede especificar atributos de metadatos subordinados. Si un atributo de metadatos s\u00f3lo sirve para contener atributos de metadatos subordinados, debe utilizarse el atributo isPresentational. En caso contrario, se asume que tambi\u00e9n toma un valor. Si el atributo de metadatos toma un valor y no se define una representaci\u00f3n, se heredar\u00e1 del concepto del que toma su sem\u00e1ntica. El id opcional del atributo de metadatos lo identifica de forma \u00fanica dentro de la definici\u00f3n estructurada de metadatos. Si no se proporciona este id, se asume que su valor es el del concepto referenciado desde la identidad del concepto. Obs\u00e9rvese que la definici\u00f3n de un atributo de metadatos (identificado por el atributo id) debe ser \u00fanica en toda la definici\u00f3n de la estructura de metadatos (incluidos el identificador de destino, el componente identificador y los identificadores de la estructura del informe). Un atributo de metadatos puede utilizarse en varias estructuras de informes y en distintos niveles, pero el contenido (valor y/o atributos de metadatos hijos y su cardinalidad) del atributo de metadatos no puede cambiar.
api.doc.swagger.definitions.xml_ns5_MetadataAttributeType.properties.MetadataAttribute.description                 = .
api.doc.swagger.definitions.xml_ns5_MetadataAttributeType.properties.isPresentational.description                  = .

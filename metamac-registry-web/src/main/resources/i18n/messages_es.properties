api.doc.swagger.definitions.xml_ns4_RefBaseType.description                                                        = RefBaseType es un tipo base abstracto que define la base para cualquier conjunto de campos de referencia completos. Debe ser refinado por tipos derivados para que s\u00f3lo los campos necesarios est\u00e9n disponibles y se requieran seg\u00fan sea necesario. Puede utilizarse tanto para referencias completas como locales (cuando algunos de los valores est\u00e1n impl\u00edcitos desde otro contexto). Una referencia local se indica con el atributo local. Los valores de este tipo corresponden directamente a los componentes de la estructura URN, por lo que pueden utilizarse para componer un URN cuando el valor del atributo local es falso. Como este es el caso, cualquier componente de referencia que no forme parte de la estructura URN no debe estar presente en los tipos derivados.

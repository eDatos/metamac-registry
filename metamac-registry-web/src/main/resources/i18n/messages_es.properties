api.doc.swagger.definitions.xml_ns4_HierarchyRefType.description                                                   = HierarchyRefType es un tipo que hace referencia a una jerarqu\u00eda desde una lista de c\u00f3digos jer\u00e1rquica. Se requieren campos de referencia tanto para la jerarqu\u00eda como para la lista de c\u00f3digos.

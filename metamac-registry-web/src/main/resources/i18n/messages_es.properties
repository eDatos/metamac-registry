api.doc.swagger.definitions.xml_ns4_ProcessStepRefType.description                                                 = ProcessStepRefType proporciona una referencia a un paso de proceso a trav\u00e9s de su id. El soporte para referenciar pasos de proceso anidados se proporciona a trav\u00e9s de un identificador anidado.

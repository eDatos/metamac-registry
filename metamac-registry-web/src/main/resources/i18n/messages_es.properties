api.doc.swagger.definitions.xml_ns4_LocalLevelRefType.description                                                  = LocalLevelRefType hace referencia a un objeto de nivel en el que la referencia a la jerarqu\u00eda en la que se encuentra y la lista de c\u00f3digos jer\u00e1rquicos que lo definen se proporcionan en otro contexto.

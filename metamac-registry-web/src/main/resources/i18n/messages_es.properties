api.doc.swagger.definitions.xml_ns6_QueryTextType.description                                                      = QueryTextType describe la estructura de un valor de consulta textual. Debe especificarse un idioma si se dispone de valores multilingües paralelos; de lo contrario, se ignora.
api.doc.swagger.definitions.xml_ns6_QueryTextType.properties.operator.description                                  = .

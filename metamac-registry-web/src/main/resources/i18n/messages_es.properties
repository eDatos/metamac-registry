api.doc.swagger.definitions.xml_ns3_GroupType.description                                                          = GroupType define una estructura que se utiliza para comunicar valores de atributos para un grupo definido en una definici\u00f3n de estructura de datos. El grupo puede consistir en un subconjunto de las dimensiones definidas por la definici\u00f3n de la estructura de datos, o en una asociaci\u00f3n a una restricci\u00f3n de adjunto, que a su vez define conjuntos de claves a los que se pueden adjuntar atributos. En el caso de que el grupo se base en una restricci\u00f3n de vinculaci\u00f3n, s\u00f3lo se proporciona la identificaci\u00f3n del grupo. Se espera que un sistema que est\u00e9 procesando esto relacione ese identificador con los conjuntos de claves definidos en la restricci\u00f3n y aplique los valores proporcionados para los atributos de forma apropiada.

api.doc.swagger.definitions.xml_ns4_ComponentValueSetType.properties.Value.description                             = .
api.doc.swagger.definitions.xml_ns4_ComponentValueSetType.properties.id.description                                = .
api.doc.swagger.definitions.xml_ns4_ComponentValueSetType.properties.include.description                           = .
api.doc.swagger.definitions.xml_ns4_ConceptRefType.description                                                     = ConceptRefType hace referencia a un concepto desde dentro de un esquema de conceptos. Se requieren campos de referencia tanto para el esquema como para el elemento.
api.doc.swagger.definitions.xml_ns4_ConceptReferenceType.description                                               = ConceptReferenceType es un tipo para referenciar un objeto concepto. Consiste en un URN y/o un conjunto completo de campos de referencia.
api.doc.swagger.definitions.xml_ns4_ConceptSchemeMapRefType.description                                            = ConceptSchemeMapRefType contiene un conjunto de campos de referencia para un mapa de esquema conceptual.
api.doc.swagger.definitions.xml_ns4_ConceptSchemeMapReferenceType.description                                      = ConceptSchemeMapReferenceType es un tipo para referenciar un objeto de mapa de esquema conceptual. Consiste en un URN y/o un conjunto completo de campos de referencia.
api.doc.swagger.definitions.xml_ns4_ConceptSchemeReferenceType.description                                         = ConceptSchemeReferenceType es un tipo para referenciar un objeto de esquema conceptual. Consiste en un URN y/o un conjunto completo de campos de referencia.
api.doc.swagger.definitions.xml_ns4_ConstraintRefType.description                                                  = ConstraintRefType contiene un conjunto de campos de referencia para una restricci\u00f3n.
api.doc.swagger.definitions.xml_ns4_ConstraintReferenceType.description                                            = ConstraintReferenceType es un tipo para hacer referencia a un objeto de restricci\u00f3n. Consiste en un URN y/o un conjunto completo de campos de referencia.
api.doc.swagger.definitions.xml_ns4_ConstraintTargetRefType.description                                            = ConstraintTargetRefType contiene una referencia a un objetivo de restricci\u00f3n dentro de un objetivo de metadatos de una definici\u00f3n de estructura de datos.
api.doc.swagger.definitions.xml_ns4_ConstraintTargetReferenceType.description                                      = ConstraintTargetReferenceType es un tipo para referenciar un objeto objetivo de restricci\u00f3n. Consiste en un URN y/o un conjunto completo de campos de referencia.
api.doc.swagger.definitions.xml_ns4_ContainerChildObjectRefBaseType.description                                    = ContainerChildObjectRefBaseType es un tipo base abstracto para referenciar cualquier objeto hijo dentro de contenedor definido en un objeto mantenible.
api.doc.swagger.definitions.xml_ns4_ContainerChildObjectReferenceType.description                                  = ContainerChildObjectReferenceType es un tipo base abstracto utilizado para referenciar un objeto concreto definido en un objeto contenedor dentro de un objeto mantenible. Consiste en un URN y/o un conjunto completo de campos de referencia; organismo, id mantenible (maintainableParentID), versi\u00f3n mantenible (maintainableParentVersion), id de contenedor (que es opcional para permitir que se omitan los contenedores con valores fijos), versi\u00f3n de contenedor (si procede), id de objeto (que puede anidarse) y, opcionalmente, versi\u00f3n de objeto (si procede).
api.doc.swagger.definitions.xml_ns4_ContentConstraintRefType.description                                           = ContentConstraintRefType contiene un conjunto de campos de referencia para una restricci\u00f3n de contenido.
api.doc.swagger.definitions.xml_ns4_ContentConstraintReferenceType.description                                     = ContentConstraintReferenceType es un tipo para referenciar un objeto de restricci\u00f3n de contenido. Consiste en un URN y/o un conjunto completo de campos de referencia.
api.doc.swagger.definitions.xml_ns4_ContentConstraintTypeCodeType.description                                      = 
api.doc.swagger.definitions.xml_ns4_CubeRegionKeyType.description                                                  = CubeRegionKeyType es un tipo para proporcionar un conjunto de valores para una dimensi\u00f3n con el fin de definir una regi\u00f3n de cubo de datos. Se puede proporcionar un conjunto de valores distintos o, si esta dimensi\u00f3n se representa como tiempo, se puede especificar un intervalo de tiempo.
api.doc.swagger.definitions.xml_ns4_CubeRegionType.description                                                     = CubeRegionType define la estructura de una regi\u00f3n de cubo de datos. Se basa en el tipo abstracto RegionType y simplemente refina los valores de clave y atributo para ajustarse a lo que es aplicable para dimensiones y atributos, respectivamente. Consulte la documentaci\u00f3n del tipo base para m\u00e1s detalles sobre c\u00f3mo se define una regi\u00f3n.
api.doc.swagger.definitions.xml_ns4_DataConsumerRefType.description                                                = DataConsumerRefType contiene un conjunto de campos de referencia para referenciar un consumidor de datos dentro de un esquema de consumidor de datos.
api.doc.swagger.definitions.xml_ns4_DataConsumerReferenceType.description                                          = DataConsumerReferenceType es un tipo para referenciar un consumidor de datos. Consiste en un URN y/o un conjunto completo de campos de referencia.
api.doc.swagger.definitions.xml_ns4_DataConsumerSchemeRefType.description                                          = DataConsumerSchemeRefType contiene un conjunto de campos de referencia para un esquema de consumidor de datos.
api.doc.swagger.definitions.xml_ns4_DataConsumerSchemeReferenceType.description                                    = DataConsumerSchemeReferenceType es un tipo para referenciar un objeto de esquema de consumidor de datos. Consiste en un URN y/o un conjunto completo de campos de referencia.
api.doc.swagger.definitions.xml_ns4_DataKeyType.description                                                        = DataKeyType es una regi\u00f3n que define una clave de datos completa o parcial distinta. La clave consiste en un conjunto de valores, cada uno de los cuales hace referencia a una dimensi\u00f3n y proporciona un \u00fanico valor para esa dimensi\u00f3n. El prop\u00f3sito de la clave es definir un subconjunto de un conjunto de datos (es decir, el valor observado y el atributo de datos) que tienen los valores de dimensi\u00f3n proporcionados en esta definici\u00f3n. Se supone que cualquier dimensi\u00f3n no indicada expl\u00edcitamente en esta clave es comod\u00edn, lo que permite la definici\u00f3n de claves de datos parciales.
api.doc.swagger.definitions.xml_ns4_DataKeyValueType.description                                                   = DataKeyValueType es un tipo para proporcionar un valor de dimensi\u00f3n con el fin de definir una clave de datos distinta. S\u00f3lo se puede proporcionar un \u00fanico valor para la dimensi\u00f3n.
api.doc.swagger.definitions.xml_ns4_DataProviderRefType.description                                                = DataProviderRefType contiene un conjunto de campos de referencia para hacer referencia a un proveedor de datos dentro de un esquema de proveedor de datos.
api.doc.swagger.definitions.xml_ns4_DataProviderReferenceType.description                                          = DataProviderReferenceType es un tipo para hacer referencia a un proveedor de datos. Consiste en un URN y/o un conjunto completo de campos de referencia.
api.doc.swagger.definitions.xml_ns4_DataProviderSchemeRefType.description                                          = DataProviderSchemeRefType contiene un conjunto de campos de referencia para un esquema de proveedor de datos.
api.doc.swagger.definitions.xml_ns4_DataProviderSchemeReferenceType.description                                    = DataProviderSchemeReferenceType es un tipo para referenciar un objeto de esquema de proveedor de datos. Consiste en un URN y/o un conjunto completo de campos de referencia.
api.doc.swagger.definitions.xml_ns4_DataSetTargetRefType.description                                               = DataSetTargetRefType contiene una referencia a un objetivo de conjunto de datos dentro de un objetivo de metadatos de una definici\u00f3n de estructura de datos.

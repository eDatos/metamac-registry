api.doc.swagger.definitions.xml_ns3_SeriesType.description                                                         = SeriesType define una estructura que se utiliza para agrupar una colecci\u00f3n de observaciones que tienen una clave en com\u00fan. La clave de una serie es cada dimensi\u00f3n definida en la definici\u00f3n de la estructura de datos, salvo la dimensi\u00f3n declarada a nivel de observaci\u00f3n para este conjunto de datos. Adem\u00e1s de las observaciones, se pueden proporcionar valores para los atributos que est\u00e1n asociados con las dimensiones que componen esta clave de serie (siempre que los atributos no especifiquen un anexo de grupo o tambi\u00e9n tengan una relaci\u00f3n con la dimensi\u00f3n de observaci\u00f3n). Es posible que la serie contenga s\u00f3lo observaciones o s\u00f3lo valores de atributos, o ambos.

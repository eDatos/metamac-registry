api.doc.swagger.definitions.xml_ns4_LocalDimensionReferenceType.description                                        = LocalDimensionReferenceType es un tipo para referenciar cualquier tipo de dimensi\u00f3n localmente, donde la referencia a la definici\u00f3n de la estructura de datos que define la dimensi\u00f3n se proporciona en otro contexto (por ejemplo, la definici\u00f3n de la estructura de datos en la que se produce la referencia).

api.doc.swagger.definitions.xml_ns9_ReportType.description                                                         = ReportType es un tipo base abstracto que constituye la base de un informe espec\u00edfico de definici\u00f3n de estructura de metadatos, basado en las estructuras de informe definidas. Este tipo est\u00e1 restringido en el esquema espec\u00edfico de definici\u00f3n de la estructura de metadatos para que el Target y el AttributeSet se ajusten a la estructura de informe prescrita.

api.doc.swagger.definitions.xml_ns5_MetadataKeySetType.description                                                 = MetadataKeySetType define una colecci\u00f3n de claves de metadatos (valores de componente identificador).
api.doc.swagger.definitions.xml_ns5_MetadataStructureType.description                                              = MetadataStructureType se utiliza para describir una definici\u00f3n de estructura de metadatos, que se define como una colecci\u00f3n de conceptos de metadatos, su estructura y uso cuando se utiliza para recopilar o difundir metadatos de referencia.

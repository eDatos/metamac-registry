api.doc.swagger.definitions.xml_ns9_ReportedAttributeType.description                                              = ReportedAttributeType es un tipo base abstracto que constituye la base de un atributo de metadatos espec\u00edfico de una estructura de metadatos. El valor del atributo puede ser un valor \u00fanico o valores de texto multilingües (estructurados o no estructurados). Si la definici\u00f3n del atributo de metadatos define atributos de metadatos anidados, tambi\u00e9n se dispone de un conjunto opcional de atributos de metadatos hijos. El esquema espec\u00edfico de la definici\u00f3n de la estructura de metadatos refinar\u00e1 este tipo para cada atributo de metadatos de forma que el contenido pueda validarse con respecto a lo definido en la definici\u00f3n de la estructura de metadatos.

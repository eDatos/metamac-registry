api.doc.swagger.definitions.xml_ns4_ItemRefBaseType.description                                                    = ItemRefBaseType es un tipo base abstracto para referenciar un elemento dentro de un esquema de elementos.
api.doc.swagger.definitions.xml_ns4_ItemReferenceType.description                                                  = ItemReferenceType es un tipo base abstracto utilizado para hacer referencia a un elemento concreto dentro de un esquema de elementos. Tenga en cuenta que esta referencia tambi\u00e9n puede hacer referencia a elementos contenidos en otros elementos dentro del esquema de elementos. Consiste en un URN y/o un conjunto completo de campos de referencia; agencia, id de esquema (maintainableParentID), versi\u00f3n de esquema (maintainableParentVersion), e id de \u00edtem (que puede estar anidado).
api.doc.swagger.definitions.xml_ns4_ItemSchemeRefBaseType.description                                              = ItemSchemeRefBaseType es un tipo base abstracto para hacer referencia a un esquema de elementos.
api.doc.swagger.definitions.xml_ns4_ItemSchemeRefType.description                                                  = ItemSchemeRefType contiene un conjunto completo de campos de referencia para referenciar cualquier esquema de elemento. La clase y el paquete son necesarios para que la referencia sea expl\u00edcita en cuanto al objeto exacto al que se hace referencia.

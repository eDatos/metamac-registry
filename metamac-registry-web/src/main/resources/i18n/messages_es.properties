api.doc.swagger.definitions.xml_ns4_ItemSchemeReferenceType.description                                            = ItemSchemeReferenceType es una referencia que se utiliza para referenciar cualquier tipo de esquema de art\u00edculo. Consiste en un URN y/o un conjunto completo de campos de referencia; agencia, id y versi\u00f3n.

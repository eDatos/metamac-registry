api.doc.swagger.definitions.xml_ns4_LocalReportStructureReferenceType.description                                  = LocalReportStructureReferenceType es un tipo para referenciar una estructura de informe localmente, donde la referencia a la definici\u00f3n de la estructura de metadatos que la define se proporciona en otro contexto (por ejemplo, la definici\u00f3n de la estructura de metadatos en la que se produce la referencia).

api.doc.swagger.definitions.xml_ns8_TimeSeriesDataSetType.description                                              = TimeSeriesDataSetType es el tipo abstracto que define la estructura base para cualquier definici\u00f3n de estructura de datos espec\u00edfica basada en series temporales. Se crear\u00e1 un tipo de conjunto de datos derivado espec\u00edfico para una definici\u00f3n de estructura de datos. A diferencia del formato base, s\u00f3lo se permite una variaci\u00f3n de \u00e9ste para una definici\u00f3n de estructura de datos. Esta variaci\u00f3n es la dimensi\u00f3n temporal como dimensi\u00f3n de observaci\u00f3n. Los datos se organizan en una colecci\u00f3n de series temporales. Dado que esta derivaci\u00f3n se consigue mediante restricci\u00f3n, los conjuntos de datos que se ajusten a este tipo tambi\u00e9n se ajustar\u00e1n inherentemente a la estructura del conjunto de datos base. De hecho, la estructura de datos espec\u00edfica aqu\u00ed ser\u00e1 id\u00e9ntica a los datos del conjunto de datos base cuando la dimensi\u00f3n temporal sea la dimensi\u00f3n de observaci\u00f3n, incluso para los tipos de conjuntos de datos derivados. Esto significa que los datos contenidos en esta estructura pueden procesarse exactamente de la misma manera que la estructura base. A este conjunto de datos especializado se le aplican las mismas reglas de derivaci\u00f3n que al tipo de conjunto de datos base.
api.doc.swagger.definitions.xml_ns8_TimeSeriesObsType.description                                                  = TimeSeriesObsType define la estructura abstracta de una observaci\u00f3n de series temporales. Se debe proporcionar a la observaci\u00f3n un valor para la dimensi\u00f3n temporal. Este valor temporal debe desambiguar la observaci\u00f3n dentro de la serie en la que se define (es decir, no debe haber otra observaci\u00f3n con el mismo valor temporal). La observaci\u00f3n puede contener un valor observado y/o valores de atributo. A esta observaci\u00f3n especializada se le aplican las mismas reglas de derivaci\u00f3n que al tipo de observaci\u00f3n base.
api.doc.swagger.definitions.xml_ns8_TimeSeriesType.description                                                     = TimeSeriesType define una estructura abstracta que se utiliza para agrupar una colecci\u00f3n de observaciones que tienen una clave en com\u00fan, organizadas por tiempo. La clave de una serie es cada una de las dimensiones definidas en la definici\u00f3n de la estructura de datos, salvo la dimensi\u00f3n tiempo. Adem\u00e1s de las observaciones, se pueden proporcionar valores para los atributos asociados a las dimensiones que componen la clave de la serie (siempre que los atributos no especifiquen un anexo de grupo ni tengan relaci\u00f3n con la dimensi\u00f3n temporal). Es posible que la serie contenga s\u00f3lo observaciones o s\u00f3lo valores de atributos, o ambas cosas. A esta serie especializada se le aplican las mismas reglas de derivaci\u00f3n que al tipo de serie base.
api.doc.swagger.definitions.xml_ns9_MetadataSetType.description                                                    = MetadataSetType es un tipo base abstracto que forma la base para un conjunto de metadatos espec\u00edfico de la estructura de metadatos. Est\u00e1 restringido por el esquema espec\u00edfico de definici\u00f3n de la estructura de metadatos para satisfacer sus necesidades.

api.doc.swagger.definitions.xml_ns5_KeyDescriptorValuesRepresentationType.description                              = KeyDescriptorValuesRepresentationType define las posibles representaciones locales de un objeto de destino de valores de descriptor de clave. La representaci\u00f3n est\u00e1 fijada para ser siempre una clave de datos (KeyValues).
api.doc.swagger.definitions.xml_ns5_KeyDescriptorValuesTargetType.description                                      = KeyDescriptorValuesTargetType define la estructura de un objeto de destino de valores de descriptor de clave. El objeto de destino de valores de descriptor de clave tiene una representaci\u00f3n y un identificador fijos.
api.doc.swagger.definitions.xml_ns5_KeyDescriptorValuesTextFormatType.description                                  = KeyDescriptorValuesTextFormatType es una versi\u00f3n restringida de NonFacetedTextFormatType que especifica una representaci\u00f3n fija de KeyValues.
api.doc.swagger.definitions.xml_ns5_KeySetType.description                                                         = KeySetType es un tipo base abstracto para definir una colecci\u00f3n de claves.
api.doc.swagger.definitions.xml_ns5_KeySetType.properties.Key.description                                          = .
api.doc.swagger.definitions.xml_ns5_KeySetType.properties.isIncluded.description                                   = .
api.doc.swagger.definitions.xml_ns5_LevelBaseType.description                                                      = LevelBaseType es un tipo base abstracto que constituye la base del LevelType. Requiere un nombre y un id.
api.doc.swagger.definitions.xml_ns5_LevelType.description                                                          = LevelType describe un nivel en una lista jer\u00e1rquica de c\u00f3digos. El nivel se define como un grupo en el que los c\u00f3digos pueden caracterizarse por una codificaci\u00f3n homog\u00e9nea, y en el que el padre de cada c\u00f3digo del grupo se encuentra en el mismo nivel superior de la jerarqu\u00eda.
api.doc.swagger.definitions.xml_ns5_LevelType.properties.CodingFormat.description                                  = .
api.doc.swagger.definitions.xml_ns5_LevelType.properties.Level.description                                         = .
api.doc.swagger.definitions.xml_ns5_MaintainableBaseType.description                                               = MaintainableBaseType es un tipo abstracto que s\u00f3lo sirve para formar la base del MaintainableType real. El prop\u00f3sito de este tipo es restringir el VersionableType para requerir el atributo id.
api.doc.swagger.definitions.xml_ns5_MaintainableType.description                                                   = MaintainableType es un tipo base abstracto para todos los objetos mantenibles.
api.doc.swagger.definitions.xml_ns5_MaintainableType.properties.agencyID.description                               = .

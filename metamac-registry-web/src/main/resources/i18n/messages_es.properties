api.doc.swagger.definitions.xml_ns4_LocalGroupKeyDescriptorReferenceType.description                               = LocalGroupKeyDescriptorReferenceType es un tipo para hacer referencia a un descriptor de clave de grupo localmente, donde la referencia a la definici\u00f3n de estructura de datos que lo define se proporciona en otro contexto (por ejemplo, la definici\u00f3n de estructura de datos en la que se produce la referencia).
